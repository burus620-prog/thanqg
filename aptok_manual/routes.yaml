# 아파트ok 캡처 경로 정의
#
# 화면 이동은 URL이 아니라 클릭으로만 가능하므로(링크가 javascript:;),
# 어디를 어떤 순서로 누르는지를 여기에 적는다.
#
# 규칙 하나: shot 과 shot 사이에는 반드시 화면을 바꾸는 동작이 있어야 한다.
# 동작 없이 연달아 찍으면 같은 이미지가 나올 뿐이다.
#
# 동작
#   top / side / tab / text : 클릭
#   nth_row                 : 목록 n번째 행 열기
#   wait                    : 밀리초 대기
#   shot                    : 화면 저장
#   expect                  : 이 글자가 화면에 보여야 촬영을 인정한다
#
# mask: 촬영 전에 흐리게 처리할 영역의 CSS 선택자

login:
  url: https://aptok.co.kr/login
  env_id: APTOK_ID
  env_pw: APTOK_PW
  id_field: "input[type=text]"
  pw_field: "input[type=password]"
  submit: "로그인"
  ready: "관리업무"
  complex: 성공금천아파트   # 로그인 후 단지 선택 화면이 뜨면 고를 단지

# 자료 가리기. 아래 적은 열만 가린다.
mask_data: true
mask_columns:
  - 성명:1
  - 이름:1
  - 담당자:1
  - 접수자:1
  - 연락처:2
  - 세대:2
  - 동호:2
  - 거래처:3
mask_keep_chars: 3
mask_id_numbers: true

# 모든 화면에 공통 적용할 마스킹. 화면별 mask 로 보완한다.
mask_global:
  - ".userName"
  - ".gnb-user"

