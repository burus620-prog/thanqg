      - shot: cs-call-hist-05.png

  - screen_id: guide-callpopup
    # 공통 문서 「통화매니저 알림창과 최근 기록」 — 알림창 → 최근 기록 → 대화 화면 흐름 (2026-10-19)
    # 같은 대표번호에 실제 고객 기록이 섞여 있다. 최근 기록은 테스트 휴대폰(6393·6118) 기록만 남긴다.
    steps:
      - url: https://aptok.co.kr/service/main
      - wait: 3000
      - mark: {n: 1, css: ".scrp-pill"}
      - shot: cp-01.png
      - selector: ".scrp-pill"
      - wait: 1000
      - mark: {n: 2, css: ".scrp-panel .scrp-head a:first-of-type"}
      - shot: cp-02.png
      - js: |
          const v = document.getElementById('screenPopWidget').__vue__;
          v.openRecent();
          for (let i = 0; i < 30 && (!v.recent.rows.length || v.recent.loading); i++) await new Promise(r => setTimeout(r, 200));
          const keep = v.recent.rows.filter(x => /(6393|6118)$/.test(String(x.peer || '')) && !/토큰|문제점/.test(String(x.desc || '')));
          v.recent.rows = keep;
          v.recent.totalPage = v.recent.page;
          await new Promise(r => setTimeout(r, 500));
          return keep.length ? 'ok' : 'X 테스트 기록 없음';
      - wait: 800
      - mark: {n: 3, css: ".scrp-rc-row"}
      - shot: cp-03.png
      - js: |
          ScreenPop.openChat(10071, null, '');
          await new Promise(r => setTimeout(r, 2500));
          return 'ok';
      - wait: 800
      - mark: {n: 4, css: ".scrp-chat-who"}
      - mark: {n: 5, css: ".scrp-turn-hit .scrp-bubble"}
      - shot: cp-04.png
      - js: "document.getElementById('screenPopWidget').__vue__.closeChat(); return 'ok';"

