      # ※ 이 통화(12:14 누수)를 실제로 등록하고 나면 [민원으로 등록] 버튼이 사라져 03·04는 다시 찍을 수 없다.
      - text: 민원으로 등록
      - expect_modal: 세대업무 등록 화면
      - wait: 1500
      - shot: cs-call-hist-03.png
