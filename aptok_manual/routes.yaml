# 아파트ok 캡처 경로 정의
#
# 화면 이동은 URL이 아니라 클릭으로만 가능하므로(링크가 javascript:;),
# 어디를 어떤 순서로 누르는지를 여기에 적는다.
#
# 규칙 하나: shot 과 shot 사이에는 반드시 화면을 바꾸는 동작이 있어야 한다.
# 동작 없이 연달아 찍으면 같은 이미지가 나올 뿐이다.
#
# 동작
#   top / side / tab / text : 클릭
#   nth_row                 : 목록 n번째 행 열기
#   wait                    : 밀리초 대기
#   shot                    : 화면 저장
#   expect                  : 이 글자가 화면에 보여야 촬영을 인정한다
#
# mask: 촬영 전에 흐리게 처리할 영역의 CSS 선택자

login:
  url: https://aptok.co.kr/login
  env_id: APTOK_ID
  env_pw: APTOK_PW
  id_field: "input[type=text]"
  pw_field: "input[type=password]"
  submit: "로그인"
  ready: "관리업무"
  complex: 디엑스삼성아파트   # 테스트 단지(가상 데이터). 실단지로 바꾸지 말 것

# 자료 가리기. 아래 적은 열만 가린다.
# 브라우저 시계. 목록의 기본 조회 기간이 이 날짜 기준이라 자료가 있는 최근 날짜로 둔다.
fixed_time: "2026-10-19T09:00:00"

# 쓰기 차단 중에도 통과시킬 POST 요청(주소 조각). 읽기만 하는 요청만 넣는다.
#   import/preview : 장기수선 개통 — 엑셀을 읽어 확인 화면만 만든다. DB 저장(/import/save)은 계속 막힌다.
allow_post:
  - /api/ltrpnew/import/preview

# 마스킹 정책 (2026-10-18): 디엑스삼성아파트는 가상 데이터라 자료는 그대로 보여 준다.
#   세대주·전화번호 칸만 가린다. 사업자번호·로그인 사용자 이름은 가리지 않는다.
mask_data: true
mask_columns:
  - 세대주:1
  - 성명:1        # 세대관리·입대의 명단의 입주민 이름
  - 소유자:1      # 차량관리
  - 입주자명:1
  - 연락처:2
  - 전화번호:2
  - 휴대폰:2
  - 핸드폰:2
  - 요청 IP:4     # 보안(엑셀 다운로드 기록)의 실제 접속 IP
mask_keep_chars: 3
mask_id_numbers: false

# 2배 해상도(WebP 저장). 매뉴얼에서 눌러 확대할 때 선명하게
scale: 2

