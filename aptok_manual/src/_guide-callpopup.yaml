# 아파트ok 사용자 매뉴얼 원본 — 안내 문서
# 통화매니저 알림창과 최근 기록 사용법.
# 민원관리 > 통화매니저 화면들이 참조한다.

- doc_id: guide-callpopup
  doc_name: 통화매니저 알림창과 최근 기록
  applies_count: null
  purpose: >
    통화매니저를 켜 두면 화면 오른쪽 아래에 작은 알림창이 늘 떠 있다.
    전화가 오거나 문자가 오면 이 창이 바뀌면서 상대가 누구인지, 무슨 일로 연락했는지 보여준다.
    거기서 최근 기록을 열면 주고받은 내용을 대화 형태로 볼 수 있고,
    통화 녹취와 요약까지 이어진다.

  key_concept: >
    이 기능의 목적은 **전화를 받기 전에 상대를 아는 것**이다.
    번호만 뜨는 일반 전화와 달리, 어느 동 몇 호의 누구인지와
    그 세대가 최근에 어떤 민원을 넣었는지가 함께 나온다.
    받기 전에 상황을 알면 "누구시죠"부터 시작하지 않아도 된다.

  four_layers: >
    화면이 네 단계로 깊어진다. 지금 어디에 있는지 알면 헤매지 않는다.
    ① **알림창** — 오른쪽 아래에 늘 떠 있는 작은 창. "통화매니저 대기 중"
    ② **최근 기록** — 알림창을 눌러 여는 목록. 오늘 오간 통화와 문자가 한 줄씩
    ③ **대화 화면** — 목록에서 한 사람을 눌러 여는 화면. 주고받은 내용이 대화 형태로
    ④ **상세 화면** — 통화 하나를 눌러 여는 화면. 녹취 재생과 전문, 요약

  layer1_popup:
    - state: 기본 (대기 중)
      desc: >
        "통화매니저 대기 중"으로 떠 있습니다. 진행 중인 전화가 없다는 뜻입니다.
        평소에는 이 상태로 작게 접혀 있습니다.
    - state: 수신 중
      desc: 전화가 걸려오는 중입니다. 동·호수와 이름, 번호, 시각이 뜹니다.
    - state: 수신 종료
      desc: 통화가 끝났습니다. 통화 시각과 통화 시간이 표시됩니다.
    - state: 부재중
      desc: >
        못 받은 전화입니다. **몇 번째 부재중인지 함께 표시됩니다.**
        "부재중 · 3회째"처럼 나오므로 같은 사람이 계속 걸고 있다는 걸 알 수 있습니다.
    - state: 문자 수신
      desc: 문자가 왔습니다. 내용이 함께 보이고, 사진이 있으면 개수가 표시됩니다.

  layer2_recent: >
    알림창의 **[최근 기록]**을 누르면 목록이 열린다.
    · 위쪽에 [전체]와 [부재중] 버튼이 있어 못 받은 전화만 골라 볼 수 있다.
    · 오른쪽 위 [새 문자]로 문자를 새로 보낼 수 있다.
    · 날짜별로 묶여 시간 역순으로 나온다.
    · 한 줄에 동·호수와 이름, 통화 내용 요약, 시각이 보인다.
    · 등록되지 않은 번호는 번호만 나온다. 괄호 안 숫자는 그 번호와 오간 횟수다.
    · 붉은 글씨는 부재중이나 확인이 필요한 건이다.
    · 왼쪽 아이콘의 화살표 방향으로 발신인지 수신인지 구분한다.

  layer2_buttons: >
    각 줄 오른쪽에 아이콘 세 개가 있다.
    · **말풍선** — 그 번호와 문자를 주고받습니다.
    · **수화기** — 그 번호로 전화를 겁니다.
    · **문서** — 통화 상세 화면으로 갑니다. 녹취와 요약을 봅니다.

  layer3_conversation: >
    목록에서 이름이나 번호를 누르면 **대화 화면**이 열린다.
    메신저처럼 생겨서 언제 무슨 일이 있었는지 시간순으로 읽힌다.
    · 맨 위에 동·호수, 이름, 번호가 나오고 [차단]과 [전화] 버튼이 있다.
    · 그 아래 "최근 30일 통화 2회 · 부재중 2회"처럼 요약이 나온다.
    · 부재중은 왼쪽에 회색으로, 우리가 건 통화는 오른쪽에 노란 말풍선으로 표시된다.
    · 말풍선에는 통화 시간과 요약, 그리고 [관리비] 같은 분류 꼬리표가 붙는다.
    · 맨 아래 입력칸에서 **바로 문자로 답장**할 수 있다. Enter로 보내고 Shift+Enter로 줄바꿈한다.
      90자까지 쓸 수 있다.

  layer4_detail: >
    대화 화면에서 통화 말풍선을 누르면 **통화 상세 화면**으로 간다.
    여기가 이 기능의 핵심이다.
    · **기본 정보** — 일시, 발신·수신 구분, 통화시간, 연락처, 세대, 이름, 민원 등록 여부
    · **녹취** — 보관 기한이 표시되고 [다운로드]와 [보관]을 할 수 있다.
    · **스크립트** — 녹취를 재생하면서 대화 전문을 시간과 함께 읽는다.
      누가 말했는지(관리사무소 / 입주민)까지 구분되어 있다.
    · **요약** — 분류, 긴급도, 생성일시, 언급된 동·호가 자동으로 정리된다.
    · 오른쪽 위 [삭제] [민원으로 등록] [인쇄] 버튼이 있다.
    · [다시 요약]과 [스크립트 수정]으로 요약을 다시 만들거나 전문을 고칠 수 있다.

  register_as_complaint: >
    상세 화면의 **[민원으로 등록]**을 누르면 작은 창이 열린다.
    통화 내용이 **이미 민원 형식으로 정리되어** 들어가 있다.
    · 세대 — 동·호수와 이름이 자동으로 채워진다
    · 접수일시 — 통화한 시각이 그대로 들어간다
    · 분류 — 요약에서 잡은 분류(관리비 등)가 붙는다
    · 민원 내용 — "[통화매니저 전화 접수]" 머리말과 함께
      발신·수신 구분, 시각, 상대 번호, 세대가 적히고
      그 아래 통화 요약이 번호를 매겨 정리된다

    아래 버튼 두 개 중 하나를 고른다.
    · **[세대업무 등록 화면]** — 특정 세대의 일이면 이쪽
    · **[공용업무 등록 화면]** — 단지 공용부의 일이면 이쪽
    누르면 해당 등록 화면으로 넘어가고, 정리된 내용이 그대로 들어간다.
    담당자는 어느 쪽 업무인지만 판단하면 된다.

  why_it_matters: >
    전화 응대는 기록이 남지 않는 것이 문제였다.
    누가 무슨 말을 했는지 기억에 의존하고, 담당자가 바뀌면 그마저 사라진다.
    이 기능은 통화를 녹취하고 전문으로 옮기고 요약까지 만들어 남긴다.
    "그때 그렇게 말했잖아요"라는 다툼이 생겼을 때 확인할 근거가 된다.
    그리고 [민원으로 등록]으로 통화를 그대로 민원으로 접수할 수 있다.
    통화 요약이 민원 내용으로 옮겨지므로, 들은 것을 다시 적을 필요가 없다.

  common_cautions:
    - "알림창은 브라우저를 닫으면 사라집니다. 전화를 받는 컴퓨터에서는 아파트ok를 열어 두세요."
    - "등록되지 않은 번호는 동·호수와 이름이 안 나옵니다. 세대관리에 연락처가 있어야 표시됩니다."
    - "스크린팝 설정은 컴퓨터마다 따로입니다. 자리를 옮기면 다시 설정해야 합니다."
    - "녹취에는 보관 기한이 있습니다. 오래 두어야 할 통화는 [보관]하거나 [다운로드]하세요."
    - "요약과 전문은 자동으로 만들어진 것이라 틀릴 수 있습니다. 중요한 건은 녹취를 직접 들어보세요."
    - "통화 내용은 민감한 정보입니다. 열람 권한을 꼭 필요한 사람에게만 주세요."

  common_faq:
    - q: 전화가 왔는데 이름이 안 나옵니다.
      a: >
        그 번호가 등록되어 있지 않은 것입니다.
        [입주자관리] > [세대관리]에 연락처를 넣으면 다음부터 표시됩니다.
    - q: 알림창이 안 뜹니다.
      a: >
        [설정] > [스크린팝]에서 사용 여부가 켜져 있는지 확인하세요.
        이 설정은 브라우저마다 따로이므로, 지금 쓰는 컴퓨터에서 켜야 합니다.
    - q: 지난 통화 내용을 확인하고 싶습니다.
      a: >
        알림창의 [최근 기록]을 열고 그 사람을 누르면 대화 화면이 나옵니다.
        통화를 누르면 녹취와 전문, 요약까지 볼 수 있습니다.
    - q: 통화하면서 나눈 이야기를 민원으로 남기려면?
      a: >
        통화 상세 화면 오른쪽 위 [민원으로 등록]을 누르세요.
        통화 내용이 이미 정리되어 들어가 있으니,
        세대업무인지 공용업무인지만 고르면 됩니다.
    - q: 세대업무와 공용업무 중 뭘 골라야 하나요?
      a: >
        특정 세대의 일이면 세대업무, 단지 공용부의 일이면 공용업무입니다.
        예를 들어 한 집의 누수는 세대업무, 복도 조명 고장은 공용업무입니다.
    - q: 민원으로 등록하면 통화 내용을 다시 적어야 하나요?
      a: >
        아닙니다. 통화 요약이 민원 내용에 그대로 들어갑니다.
        발신·수신 구분, 시각, 상대 번호, 세대까지 함께 기록됩니다.
    - q: 문자로 답장하려면 어디로 가야 하나요?
      a: >
        대화 화면 맨 아래 입력칸에서 바로 보낼 수 있습니다.
        목록에서 말풍선 아이콘을 눌러도 됩니다.
    - q: 녹취를 오래 보관하고 싶습니다.
      a: 통화 상세 화면의 [보관]을 누르거나 [다운로드]로 파일을 내려받으세요.
    - q: 요약 내용이 틀렸습니다.
      a: "[다시 요약]으로 새로 만들거나 [스크립트 수정]으로 전문을 고칠 수 있습니다."
