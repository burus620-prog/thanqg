# 아파트ok 사용자 매뉴얼 원본 — 안내 문서
# 민원관리와 전자결재를 잇는 기능 설명.
# 전체민원 · 공용업무 · 세대업무 · 일일일지가 함께 참조한다.

- doc_id: guide-dailyreport
  doc_name: 민원을 일일일지로 바로 올리기
  applies_count: null
  purpose: >
    하루 동안 처리한 민원을 일일일지에 옮겨 적는 일은 번거롭다.
    아파트ok에는 **민원 목록에서 고른 건을 일일일지 작성 화면으로 그대로 넘기는 기능**이 있다.
    옮겨 적을 필요가 없어진다.

  key_concept: >
    민원 목록에서 처리한 건을 체크하고 오른쪽 위 **[일일업무보고]**를 누르면,
    전자결재의 일일일지 작성 화면이 열리면서 **고른 민원이 이미 표에 들어가 있다.**
    남은 일은 결재선을 고르고 제목을 적어 [등록]하는 것뿐이다.

  where_it_works: >
    세 화면에서 똑같이 쓸 수 있다.
    · [민원관리] > [전체민원]
    · [민원관리] > [공용업무]
    · [민원관리] > [세대업무]
    어느 화면에서 시작하든 결과는 같다. 일일일지 작성 화면으로 넘어간다.

  how_to:
    - step: ① 민원 고르기
      desc: >
        목록 왼쪽 체크칸에 오늘 보고할 민원을 표시합니다.
        여러 건을 함께 고를 수 있습니다.
    - step: ② 일일업무보고 클릭
      desc: 오른쪽 위 [일일업무보고] 버튼을 누릅니다.
    - step: ③ 자동으로 넘어감
      desc: >
        전자결재 > 일일보고 > 일일일지 작성 화면이 열립니다.
        고른 민원이 아래 표에 구분·세대·접수일시·분류·민원내용·처리내용·
        접수자·처리일시·담당자·상태·첨부까지 그대로 들어가 있습니다.
    - step: ④ 나머지 채우기
      desc: >
        결재선을 고르고, 분류와 업무일자와 제목을 적습니다.
        필요하면 [공용업무 추가]나 [세대민원 추가]로 빠뜨린 건을 더 넣습니다.
    - step: ⑤ 등록
      desc: "[등록]을 눌러 결재를 올립니다."

  in_the_write_screen:
    - item: 공용업무 추가 / 세대민원 추가
      desc: >
        작성 화면에서도 민원을 더 넣을 수 있습니다.
        민원 목록으로 되돌아가지 않아도 됩니다.
    - item: 선택 삭제
      desc: 잘못 들어온 건을 표에서 뺍니다. 민원 자체가 지워지는 것은 아닙니다.
    - item: 본문 편집기
      desc: >
        표 아래에 글을 쓰는 편집기가 있습니다.
        민원 목록만으로 부족한 설명이나 그날의 특이사항을 적습니다.
    - item: 사진함 · 첨부파일
      desc: >
        오른쪽 위 [사진함]으로 사진을 붙이고, [첨부파일]로 문서를 올립니다.
        파일 하나당 100MB 이하만 가능합니다.

  why_it_matters: >
    일일일지는 매일 써야 하는 문서다.
    민원을 손으로 옮겨 적으면 시간도 걸리고 빠뜨리기도 쉽다.
    이 기능을 쓰면 목록에서 체크만 하면 되고, 접수 시각과 처리 내용이 그대로 넘어가므로
    적으면서 생기는 오류가 없다.

  common_cautions:
    - "체크하지 않고 [일일업무보고]를 누르면 빈 일지가 열립니다. 먼저 고르세요."
    - "작성 화면에서 [선택 삭제]로 뺀 것은 일지에서만 빠집니다. 민원 자체는 그대로 남습니다."
    - "[임시저장]과 [등록]은 다릅니다. 등록해야 결재가 올라갑니다."
    - "이미 다른 일지에 넣은 민원을 또 넣지 않도록 확인하세요."   # 확인필요: 중복 표시 여부

  common_faq:
    - q: 오늘 처리한 민원을 일지에 옮겨 적어야 하나요?
      a: >
        아닙니다. 민원 목록에서 체크하고 [일일업무보고]를 누르면
        일일일지 작성 화면에 그대로 들어갑니다.
    - q: 공용업무와 세대업무를 함께 넣고 싶습니다.
      a: >
        [전체민원]에서 두 가지를 함께 고르거나,
        작성 화면에서 [공용업무 추가]와 [세대민원 추가]로 더 넣으면 됩니다.
    - q: 일지에 들어간 민원을 빼고 싶습니다.
      a: 표에서 체크하고 [선택 삭제]를 누르세요. 민원 자체는 지워지지 않습니다.
    - q: 민원 말고 다른 내용도 적고 싶습니다.
      a: 표 아래 편집기에 자유롭게 쓰면 됩니다.
