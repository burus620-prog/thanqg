# 아파트ok 사용자 매뉴얼 원본 — 안내 문서
# 장기수선계획(2026-10 신설 대분류) 전체 흐름. 장기수선계획 화면들이 참조한다.
# 근거: aptok-admin/docs 설계안(9/15~9/18), 실제 화면(디엑스삼성아파트 회차 121, 2026-10-19 확인)

- doc_id: guide-ltrp
  doc_name: 장기수선계획 한눈에 보기
  applies_count: null
  purpose: >
    장기수선계획 메뉴는 종이·엑셀로 갖고 있던 장기수선계획서를 시스템에 옮기고,
    3년마다 하는 정기조정과 장기수선충당금 지출까지 한 곳에서 이어서 처리하는 메뉴다.
    화면이 많지만 순서는 하나다. 처음이라면 이 문서를 먼저 읽자.

  key_concept: >
    모든 것은 **계획 회차** 하나에서 시작한다. 처음 한 번 **전기 계획 개통**으로 지금 쓰는 계획서를 옮겨 담으면,
    그 뒤로는 그 회차를 고쳐 새 조정안을 만들고(**조정안 작성**), 입주자대표회의 의결 뒤 **마감**해서 확정한다.
    확정된 계획은 **시설보수 지출품의**의 근거가 되고, 결재가 끝난 지출은 **적립·사용현황**에 자동으로 쌓인다.

  order:
    - step: ① 전기 계획 개통 (처음 한 번)
      desc: 지금 쓰는 장기수선계획서(엑셀의 「검토서」 시트)를 올려 계획 회차를 만듭니다. [조정 이력 › 전기 계획 개통]
    - step: ② 조정안 작성 6단계
      desc: 단지 기본정보 → 총론(긴급·소액지출 등) → 검토서 → 총괄표 → 3년 이내 공사 → 마감. 앞 단계를 끝내야 다음 단계가 열립니다.
    - step: ③ 입주자대표회의 의결 → 마감
      desc: 의결일·찬성 수를 넣고 마감하면 그 조정안이 확정본이 되고 조정 이력에 남습니다. 다음 정기조정 기한(3년 뒤 같은 달)이 정해집니다.
    - step: ④ 시설보수 지출품의
      desc: 장기수선충당금을 쓸 때 [전자결재 › 시설보수 지출품의]로 품의를 올립니다. 수선 예정 연도가 된 항목은 '계획집행', 그 밖에는 총론에 정해 둔 '예외지출'입니다.
    - step: ⑤ 적립·사용현황
      desc: 결재가 끝난 지출이 ③ 사용내역에 자동으로 들어갑니다. ② 적립내역만 직접 적고 인쇄해서 게시·보고합니다.

  screens:
    - menu: 조정 이력
      desc: 출발점. 지금 계획의 요약(총수선금액·연간 적립예정액·㎡당 월 적립금·3년 이내 공사)과 회차 목록. 개통·수시조정·대비표·정기조정안 작성 버튼이 여기 있습니다.
    - menu: 조정안 작성
      desc: 단지 기본정보 · 총론 · 검토서 · 총괄표 · 3년 이내 공사. 화면 위 6칸 진행표에서 어디까지 했는지 보입니다.
    - menu: 시설 관리
      desc: 공사종별 설정(주기·수선율 기준값), 장기수선계획 시설대장(공사종별 단위), 세부 시설대장(시설 하나하나와 수선이력).
    - menu: 적립·사용현황
      desc: 공동주택관리규약 준칙 서식(별지 제20호)대로 만든 장기수선충당금 적립·사용 현황.
    - menu: 전자결재 › 시설보수 지출품의
      desc: 장기수선충당금 등 시설 공사 비용의 품의. 결재가 끝나면 적립·사용현황과 시설 수선이력에 반영됩니다.

  regular_vs_adhoc:
    - kind: 정기조정
      desc: 3년마다(조정한 달 기준). 입주자대표회의 의결만으로 가능. 검토서 전체를 다시 보고 세대 부과액이 바뀔 수 있습니다. [정기조정안 작성]
    - kind: 수시조정
      desc: 3년 주기 사이에 특정 항목만. 전체 입주자 과반수 서면동의가 필요합니다. 검토서·세대 부과액은 바뀌지 않고, 돈을 쓸 근거만 남습니다. [수시조정 등록]

  three_values: |
    공사종별의 수선주기·수선율은 세 층으로 관리된다.
    ① **시행규칙[별표1] 기준** — 법정 69개 항목, 아파트OK가 개정 때 갱신(고칠 수 없음)
    ② **이 단지가 쓰는 값** — [공사종별 설정]에서 관리. 개통·마감 때 확정값으로 맞춰짐
    ③ **검토서 확정값** — 입주자대표회의 의결로 정해진 값(참조만)

  why_it_matters: >
    수선 예정 연도를 벗어나 장기수선충당금을 쓰면(앞당기든 늦추든) 1천만원 이하의 과태료 대상이 될 수 있다(공동주택관리법 제102조 제2항).
    그래서 예외로 쓸 수 있는 경우(긴급공사·소액지출·부대비용·기타)를 **총론**에 미리 정해 두고,
    지출품의는 그 근거를 골라야 올라가도록 되어 있다.

  legal_refs:
    - 공동주택관리법 제29조(장기수선계획), 제102조 제2항(과태료)
    - 공동주택관리법 시행규칙 [별표1] 장기수선계획의 수립기준 (2026-07-30 개정판 반영)
    - 공동주택관리법 시행령 제31조 제3항(장기수선충당금 적립)
    - 공동주택관리규약 준칙 제69조 제1항, [별지 제20호 서식]
    - 2025 장기수선계획 실무 가이드라인

  common_cautions:
    - "판단이 필요한 부분(수선주기 조정, 예외지출 요건 등)은 이 매뉴얼이 정하지 않습니다. 장기수선계획 검토 업체나 관할 지자체 기준을 확인하세요."
    - "마감은 관리소장만 해제할 수 있고, 해제할 때 본인 비밀번호를 다시 확인합니다. 의결 기록은 해제해도 지워지지 않습니다."

  # 공통 문서 그림 (2026-10-19) — 다른 화면의 캡처를 다시 쓴다. after = 이 그림을 넣을 항목
