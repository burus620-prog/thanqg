# 아파트ok 사용자 매뉴얼 원본 — 안내 문서
# 메시지 채널 세 가지와 요금. 2026-10-14 업데이트 반영.
# 메시지 발송·발송 내역·템플릿 관리·이용요금·결제 화면이 참조한다.

- doc_id: guide-messaging
  doc_name: 메시지 채널과 요금
  applies_count: null
  purpose: >
    입주민에게 보내는 메시지는 세 가지 길로 나간다. 알림톡(카카오톡), 문자(아파트OK), 문자(통화매니저).
    받는 조건, 요금, 요금 내는 곳이 서로 다르다. 보내기 전에 어느 길이 맞는지 고르는 기준을 정리했다.

  key_concept: >
    **알림톡과 문자(아파트OK)는 충전금에서 빠진다.** 미리 충전해 두어야 보낼 수 있다.
    **문자(통화매니저)는 충전금과 상관없다.** KT가 관리사무소 통신요금으로 따로 청구하고, 대신 한 달·하루 보낼 수 있는 건수가 정해져 있다.

  channels:
    - channel: 알림톡(카카오톡)
      desc: >
        건당 12원(부가세 별도), 글자 수와 무관. 카카오톡을 쓰는 세대만 받고, 못 받아도 문자로 대신 보내지 않음.
        카카오가 승인한 문안(템플릿)만 보낼 수 있음. 발신은 @아파트오케이 채널.
    - channel: 문자(아파트OK)
      desc: >
        단문 12원 · 장문 35원 · 그림 85원(부가세 별도). 충전금에서 빠짐.
        단문은 90byte(한글 약 45자)까지, 넘으면 장문(2,000byte까지), 사진을 붙이면 그림 문자.
    - channel: 문자(통화매니저)
      desc: >
        단문 16.5원 · 장문 33원 · 그림 110원(부가세 포함, 후불). KT가 관리사무소 통신요금으로 청구.
        통화매니저 회선이 있는 단지만. 단문은 80byte(한글 약 40자)까지. 한 달·하루 보낼 수 있는 건수가 정해져 있음.

  how_to_choose:
    - case: 모든 세대가 꼭 받아야 하는 안내 (단수·정전 등)
      desc: 문자. 알림톡은 카카오톡이 없는 세대가 못 받습니다.
    - case: 정기적인 공지, 비용을 아끼고 싶을 때
      desc: 알림톡. 승인된 템플릿이 있어야 합니다.
    - case: 충전금 없이 보내야 할 때, 관리사무소 번호로 보내고 싶을 때
      desc: 문자(통화매니저). 회선 문자 한도 안에서 보낼 수 있습니다.

  money_flow: >
    충전은 [이용요금·결제]에서 1만·3만·5만원 단위로 신청하고 입금합니다(부가세를 더한 11,000·33,000·55,000원).
    입금이 확인되면 그날 충전금이 들어가고 세금계산서가 발급됩니다.
    잔액이 모자라면 보내지 않습니다. 단, **긴급 문자**는 잔액 −10,000원까지 보낼 수 있고 다음 충전 때 먼저 채워집니다.
    [이용요금·결제 › 설정]에서 월 사용 한도를 정해 두면, 한도에 닿은 달에는 더 보내지 않습니다.

  where_numbers_come_from: >
    보낸 결과와 건수는 [발송 내역]에서, 실제로 빠진 금액은 [이용요금·결제 › 사용 내역]에서 봅니다.
    발송 내역의 '예상 요금'은 성공·전송 중인 건만 센 값이라 실제 사용 내역과 조금 다를 수 있습니다.

  # 공통 문서 그림 (2026-10-19) — 다른 화면의 캡처를 다시 쓴다. after = 이 그림을 넣을 항목
