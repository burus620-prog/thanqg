# 아파트ok 사용자 매뉴얼 원본 — 공통 패턴 A: 목록 화면 
# 이 문서는 목록 형태 화면 약 35개가 공통으로 상속한다. 
# 개별 화면 문서에는 이 내용을 다시 쓰지 않고 "패턴 A 공통 사용법 참조"로 연결한다. 

- doc_id: pattern-a
  doc_name: 목록 화면 공통 사용법
  applies_to_pattern: A
  purpose: >
    아파트ok의 목록 화면은 생김새가 거의 같다.
    검색 조건을 걸어 찾고, 표에서 확인하고, 새로 등록하는 흐름이 반복된다.
    이 문서를 한 번 익히면 공용업무·세대업무·문서수불·저장품 등 대부분의 화면을 같은 방식으로 쓸 수 있다.

  layout:                      # 화면을 위에서 아래로 4칸으로 나눠 설명
    - zone: 검색바
      desc: 화면 맨 위. 조건을 걸어 원하는 건을 찾는다.
    - zone: 툴바
      desc: 표 바로 위. 건수 확인, 내려받기, 새로 만들기 버튼이 모여 있다.
    - zone: 표
      desc: 실제 목록. 한 줄이 한 건이다.
    - zone: 페이지
      desc: 표 아래 숫자. 다음 장으로 넘어간다.

  common_actions:
    - id: search
      name: 조건을 걸어 찾기
      steps:
        - 드롭다운에서 분류·상태·접수자·담당자를 고릅니다.
        - 검색어 칸에 찾을 내용을 입력합니다.
        - 오른쪽 [검색]을 클릭합니다.
      note: 조건을 더 세밀하게 걸려면 [상세검색]을 사용합니다.

    - id: period
      name: 기간 빠르게 지정하기
      steps:
        - 날짜 칸에 직접 입력하거나, 옆의 [당일] [어제] [일주일] [당월] [3개월] [6개월] 버튼을 클릭합니다.
      note: 버튼을 누르면 날짜 칸이 자동으로 채워집니다.

    - id: status_filter
      name: 처리 상태별로 골라보기
      steps:
        - 툴바의 [미처리] [처리중] [유보] 버튼을 클릭합니다.
      note: 버튼 괄호 안 숫자가 각 상태의 건수입니다. 미처리 건수가 곧 오늘 해야 할 일의 개수입니다.

    - id: page_size
      name: 한 번에 볼 개수 바꾸기
      steps:
        - 툴바 왼쪽 [10건 보기] 드롭다운에서 개수를 고릅니다.

    - id: excel_down
      name: 엑셀로 내려받기 / 인쇄하기
      steps:
        - 툴바의 엑셀 아이콘 또는 인쇄 아이콘을 클릭합니다.
      note: 화면에 보이는 목록이 그대로 저장됩니다. 먼저 검색으로 범위를 좁힌 뒤 내려받으세요.

    - id: excel_up
      name: 엑셀로 한꺼번에 등록하기
      steps:
        - 툴바의 [엑셀 등록]을 클릭합니다.
      note: null   # 확인필요: 양식 내려받기 위치, 오류 시 처리 방식

    - id: create
      name: 새로 만들기
      steps:
        - 툴바 오른쪽 끝 [등록]을 클릭하면 입력 화면으로 넘어갑니다.
      caution: >
        입력 화면에도 [등록] 버튼이 있습니다. 목록의 [등록]은 "새로 만들기",
        입력 화면의 [등록]은 "저장하기"입니다. 이름은 같지만 하는 일이 다릅니다.

    - id: attach_count
      name: 첨부파일 확인하기
      steps:
        - 표 맨 오른쪽 숫자가 그 건에 붙은 첨부파일 개수입니다.

    - id: back_to_list
      name: 목록으로 돌아가기
      steps:
        - 입력·상세 화면 왼쪽 위 [목록]을 클릭합니다.
      caution: 저장하지 않고 [목록]을 누르면 입력한 내용이 사라집니다.

  common_cautions:
    - "검색 조건을 걸어둔 상태에서 내려받기를 하면 조건에 맞는 건만 저장됩니다. 전체가 필요하면 조건을 먼저 비우세요."
    - "화면마다 툴바에 있는 버튼이 조금씩 다릅니다. 없는 버튼은 그 화면에 해당 기능이 없다는 뜻이거나, 권한이 없다는 뜻입니다."

  common_faq:
    - q: 버튼이 안 보입니다.
      a: 인사관리 > 권한관리에서 해당 메뉴의 권한이 켜져 있는지 확인합니다.
    - q: 등록한 건이 목록에 안 보입니다.
      a: 검색 조건이나 기간이 걸려 있는지 확인하고, 조건을 비운 뒤 다시 검색합니다.
