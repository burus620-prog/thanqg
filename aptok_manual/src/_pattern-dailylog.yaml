# 아파트ok 사용자 매뉴얼 원본 — 공통 문서
# 전자결재 > 일일보고 6종이 이 문서를 상속한다.
# 수변전일지 · 발전기 운전일지 · 난방일지 · 소방일지 · 경비일지 · 일일일지

- doc_id: pattern-dailylog
  doc_name: 일일보고 작성 공통 사용법
  applies_to_pattern: 일지
  applies_count: 6
  purpose: >
    일일보고는 매일 설비와 근무 상황을 기록해 결재를 올리는 곳이다.
    수변전일지, 발전기 운전일지, 난방일지, 소방일지, 경비일지, 일일일지 여섯 가지가 있고
    적는 내용만 다를 뿐 쓰는 방법은 같다.

  key_concept: >
    화면이 둘로 나뉜다.
    **목록 화면**에서 지금까지 쓴 일지를 보고, 오른쪽 위 [일지작성]을 누르면 **작성 화면**이 열린다.
    작성 화면은 결재선 지정과 일지 내용 입력이 한 장에 붙어 있다.

  before_you_start: >
    일지를 처음 열면 안내창이 뜰 수 있다.
    "단지정보 > 기본정보의 전기, 난방, 수도 검침일이 선택되지 않았습니다"처럼 나오면
    **단지 기본정보를 먼저 채워야 한다.**
    검침일이 없으면 월 누계가 계산되지 않는다.

  list_screen:
    - item: 조회 조건
      desc: 상태와 문서선택으로 걸러 보고, 제목이나 내용으로 검색합니다. 기간도 지정할 수 있습니다.
    - item: 상태 버튼
      desc: 상신 · 미결 · 진행중 · 반려 · 회수함 · 승인함으로 나눠 봅니다.
    - item: 목록 항목
      desc: 번호, 제목, 작성자, 작성일시, 결재현황
    - item: 결재현황
      desc: >
        "1 / 4"처럼 몇 명이 결재했는지 나옵니다. 돋보기를 누르면 누가 결재했는지 봅니다.
    - item: 엑셀 · 인쇄
      desc: 목록을 내려받거나 출력합니다.
    - item: 일지작성
      desc: 오른쪽 위 버튼입니다. 새 일지를 씁니다.

  write_screen:
    - item: 결재란
      desc: >
        화면 오른쪽 위에 소장·과장·동대표 등 결재자가 이름과 함께 표시됩니다.
        누가 결재할지 한눈에 보입니다.
    - item: 점검단지
      desc: >
        공통과 1~20단지 중에 고릅니다.
        다른 일지에서 복사할 때 **선택한 단지의 자료만 넘어옵니다.**
    - item: 결재여부 · 결재선
      desc: >
        미리 만들어 둔 결재선을 고릅니다.
        [결재자 지정]으로 직접 정할 수도 있고, [결재순서설정]으로 순서를 바꿉니다.
        [결재자만 보기]와 [결재라인 보기]로 표시를 바꿉니다.
    - item: 점검일 · 날씨
      desc: 날짜를 정하고 날씨를 맑음·흐림·비·눈·기타 중에 고릅니다.
    - item: 최근 일지 복사
      desc: >
        지난번 일지를 그대로 불러옵니다. 매일 비슷한 값을 적는 일지라면 이게 가장 빠릅니다.
    - item: 초기화
      desc: 입력한 내용을 모두 지웁니다.
    - item: 데이터 불러오기
      desc: 기존에 등록한 자료에서 전일지침과 배율을 가져옵니다.
    - item: 임시저장 · 등록
      desc: >
        [임시저장]은 결재를 올리지 않고 저장만 합니다.
        [등록]을 눌러야 결재가 올라갑니다.
    - item: 목록
      desc: 왼쪽 위 버튼으로 목록으로 돌아갑니다. 저장하지 않고 나가면 입력이 사라집니다.

  auto_calc: |
    수치를 적는 일지는 계산이 자동이다. 화면 안내에 규칙이 적혀 있다.
    · 전일지침과 금일지침을 넣으면 **지침차**가 자동으로 나온다.
    · 전일지침, 금일지침, 배율을 넣으면 **사용량과 월 누계**가 자동으로 나온다.
    · 지침차, 사용량, 월누계는 **직접 입력할 수 없다.** 계산 결과만 표시된다.
    · 월 누계액은 [단지 기본정보]에 등록된 검침일을 기준으로 기간을 잡아 산출한다.

  common_actions:
    - id: open
      name: 작성 화면 열기
      steps:
        - 목록 화면 오른쪽 위 [일지작성]을 클릭합니다.
      note: 안내창이 뜨면 내용을 확인하세요. 선행 설정이 빠졌다는 뜻일 수 있습니다.

    - id: copy
      name: 지난 일지 불러오기
      steps:
        - "[최근 일지 복사]를 클릭합니다."
      note: >
        매일 비슷한 값을 적는 일지라면 이걸로 시작해 바뀐 부분만 고치는 편이 빠릅니다.
        점검단지를 먼저 고르세요. 고른 단지의 자료만 넘어옵니다.

    - id: approval
      name: 결재선 정하기
      steps:
        - 미리 만들어 둔 결재선을 고릅니다.
        - 직접 정하려면 [결재자 지정]을 클릭합니다.
        - 순서를 바꾸려면 [결재순서설정]을 사용합니다.
      note: null

    - id: save
      name: 저장하거나 올리기
      steps:
        - 아직 덜 썼으면 [임시저장]을 클릭합니다.
        - 결재를 올리려면 [등록]을 클릭합니다.
      note: 임시저장만 하면 결재가 올라가지 않습니다.

  common_cautions:
    - "[임시저장]과 [등록]은 다릅니다. 등록해야 결재가 올라갑니다."
    - "왼쪽 위 [목록]을 누르면 저장하지 않고 나갑니다. 쓰던 내용이 사라집니다."
    - "지침차·사용량·월누계는 직접 못 고칩니다. 값이 이상하면 전일지침이나 배율을 확인하세요."
    - "월 누계가 안 맞으면 [단지 기본정보]의 검침일 설정을 확인하세요."
    - "점검단지를 고르지 않고 복사하면 원하는 자료가 안 넘어올 수 있습니다."

  common_faq:
    - q: 일지를 쓰려는데 검침일이 없다는 안내가 뜹니다.
      a: >
        [단지정보] > [기본정보]에서 전기·난방·수도 검침일을 먼저 지정하세요.
        검침일이 없으면 월 누계가 계산되지 않습니다.
    - q: 매일 같은 값을 적는데 더 빠른 방법이 없나요?
      a: "[최근 일지 복사]로 지난 일지를 불러온 뒤 바뀐 부분만 고치면 됩니다."
    - q: 사용량이 계산되지 않습니다.
      a: 전일지침, 금일지침, 배율 세 가지가 모두 들어가야 계산됩니다.
    - q: 지침차를 직접 고치고 싶습니다.
      a: >
        고칠 수 없습니다. 전일지침과 금일지침으로 자동 계산되는 값입니다.
        잘못됐다면 지침 값을 바로잡으세요.
    - q: 임시저장했는데 결재가 안 올라갔습니다.
      a: 임시저장은 저장만 하는 기능입니다. [등록]을 눌러야 결재가 올라갑니다.

