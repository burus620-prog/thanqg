- screen_id: appr-order
  screen_name: 지시사항
  path: 전자결재 > 지시사항
  pattern: A
  inherits: pattern-a
  permission: 전자결재 > 열람
  purpose: 소장·관리자가 직원에게 업무를 지시하고, 지시받은 직원이 확인했는지 본다

  columns: [번호, 분야, 제목, 작성자, 지시일시, 확인 명단, 첨부]

  screen_specific:
    - name: 분야
      desc: 업무지시·행정 등 지시의 성격입니다. [분야설정]에서 바꿉니다.
    - name: 확인 명단
      desc: 지시를 받은 직원입니다. 직원이 글을 열어 확인하면 확인한 것으로 표시됩니다.

  steps:
    - no: 1
      action: 상단 [전자결재]를 클릭한 뒤 왼쪽 목록에서 [지시사항]을 클릭합니다.
      target: nav:전자결재 > side:지시사항
      image: appr-order-01.png
      note: 최근 지시부터 나옵니다.
    - no: 2
      action: '[작성]을 눌러 분야·제목·내용을 적고, 확인할 직원을 골라 등록합니다.'
      target: button:작성
      image: null
      note: 지시받은 직원의 메인 화면 결재 목록에 「지시사항」으로 나타납니다.

  cautions: []

  faq: []

