- screen_id: appr-log-daily
  screen_name: 일일일지
  path: 전자결재 > 일일보고 > 일일일지
  pattern: C
  inherits: pattern-dailylog
  permission: 전자결재 > 열람
  purpose: 그날 처리한 민원과 업무를 모아 하루치 보고로 올린다

  key_concept: >
    다른 일지가 설비 수치를 적는 것과 달리, 일일일지는 **그날의 업무를 모으는 일지**다.
    민원 목록에서 [일일업무보고]로 넘어오면 처리한 민원이 이미 표에 들어가 있다.
    표 아래 편집기에 특이사항을 덧붙여 마무리한다.

  faster_way: >
    이 화면을 직접 열어 처음부터 쓰는 것보다,
    **[민원관리]에서 민원을 체크하고 [일일업무보고]를 누르는 편이 훨씬 빠르다.**
    자세한 방법은 [민원을 일일일지로 바로 올리기] 문서를 참고한다.

  screen_specific:
    - name: 분류
      desc: 통합업무보고 등 일지의 성격을 고릅니다.
    - name: 공용업무 추가 / 세대민원 추가
      desc: 표에 민원을 더 넣습니다. 민원 목록으로 되돌아가지 않아도 됩니다.
    - name: 선택 삭제
      desc: 표에서 뺍니다. 민원 자체는 지워지지 않습니다.
    - name: 본문 편집기
      desc: 표 아래에 그날의 특이사항이나 설명을 적습니다.
    - name: 사진함 · 첨부파일
      desc: 사진과 문서를 붙입니다. 파일 하나당 100MB 이하입니다.

  steps:
    - no: 1
      action: 상단 [전자결재]를 클릭한 뒤 왼쪽 목록에서 [일일보고]를 클릭하고 [일일일지]를 클릭합니다.
      target: nav:전자결재 > side:일일보고 > side:일일일지
      image: appr-log-daily-01.png
      note: 목록 화면입니다. 지금까지 쓴 일지가 나옵니다.
    - no: 2
      action: 새로 쓰려면 오른쪽 위 [일지작성]을 클릭합니다.
      target: button:일지작성
      image: appr-log-daily-02.png
      note: >
        작성 화면이 열립니다. 결재선 지정과 일지 내용 입력이 한 장에 있습니다.
        선행 설정이 빠졌으면 안내창이 먼저 뜹니다.
    - no: 3
      action: 이후 절차는 [일일보고 작성 공통 사용법]을 따릅니다.
      target: null
      image: null
      note: null

  cautions:
    []   # 확인필요: 되돌릴 수 없는 동작이 있는지

  faq: []

