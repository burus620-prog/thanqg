- screen_id: appr-log-power
  screen_name: 수변전일지
  path: 전자결재 > 일일보고 > 수변전일지
  pattern: C
  inherits: pattern-dailylog
  permission: 전자결재 > 열람
  purpose: 수변전설비 점검 결과를 기록해 결재를 올린다

  key_concept: 정해진 시각(08:00·11:00 등)마다 특고압 VCB·변압기(TR)·저압 ACB의 전압·전류와 변압기 온도를 적고, 아래 표에 유효·무효전력의 금일지침을 넣어 사용량을 남긴다. 목록에서 [일지작성]을 눌러 작성 화면을 열고, 점검일을 고른 뒤 표를 채워 결재선을 정해 올린다. 자세한 방법은 [일일보고 작성 공통 사용법]을 참고한다.
  screen_specific:
  - name: 전력량 표
    desc: 금일지침을 넣으면 지침차·사용량·월 누계가 계산됩니다. 전일지침과 배율은 미리 들어가 있습니다.
  - name: 날씨
    desc: 점검일의 날씨를 고릅니다.

  steps:
    - no: 1
      action: 상단 [전자결재]를 클릭한 뒤 왼쪽 목록에서 [일일보고]를 클릭하고 [수변전일지]를 클릭합니다.
      target: nav:전자결재 > side:일일보고 > side:수변전일지
      image: appr-log-power-01.png
      note: 목록 화면입니다. 지금까지 쓴 일지가 나옵니다.
    - no: 2
      action: 새로 쓰려면 오른쪽 위 [일지작성]을 클릭합니다.
      target: button:일지작성
      image: appr-log-power-02.png
      note: >
        작성 화면이 열립니다. 결재선 지정과 일지 내용 입력이 한 장에 있습니다.
        선행 설정이 빠졌으면 안내창이 먼저 뜹니다.
    - no: 3
      action: 이후 절차는 [일일보고 작성 공통 사용법]을 따릅니다.
      target: null
      image: null
      note: null

  cautions:
  - '[임시저장]과 [등록]은 다릅니다. 등록해야 결재가 올라갑니다.'

  faq: []

