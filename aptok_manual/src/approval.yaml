- screen_id: appr-log-security
  screen_name: 경비일지
  path: 전자결재 > 일일보고 > 경비일지
  pattern: C
  inherits: pattern-dailylog
  permission: 전자결재 > 열람
  purpose: 경비 근무조의 하루 근무·순찰·인수인계 내용을 기록해 결재를 올린다

  key_concept: >
    점검표 형식이다. 인계인수품·인수인계사항·당일근무자·기본사항·확인점검사항·전출입은 칸을 채우고
    상태를 양호·불량으로 고른다. 불량이면 오른쪽 결과 칸에 내용을 적는다.
    금일주요업무·민원·택배·방문·지시사항·특기사항은 한 줄씩 적는다.

  screen_specific:
    - name: 구분 ＋
      desc: 그 구분에 줄을 더 넣습니다. 근무자가 많거나 특기사항이 여러 건일 때 씁니다.
    - name: 최근 일지 복사
      desc: 전날 일지를 가져와 근무조와 바뀐 내용만 고칩니다.

  steps:
