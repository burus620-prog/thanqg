# 아파트ok 사용자 매뉴얼 원본 — 전자결재
# 화면 12개. draft: true 인 항목은 화면 확인 전 뼈대이며,
# 캡처를 본 뒤 purpose·steps·cautions·faq 를 채운다.

- screen_id: appr-draft
  screen_name: 기안품의
  path: 전자결재 > 기안품의
  pattern: B
  permission: 전자결재 > 열람
  purpose: 지출이나 업무 처리 전에 기안을 올려 결재를 받는다

  key_concept: 지출과목(일반관리비·수선유지비·대표회의 운영비 등)을 고르고 금액·업체를 적어 올린다. 결재가 끝난 뒤에는 목록의 [결재 후 상태]에서 진행·완료·폐기를 골라 집행 상황을 관리한다.
  columns:
  - 지출과목
  - 제목
  - 금액
  - 업체명
  - 작성자
  - 기안일시
  - 결재현황
  - 결재 후 상태
  - 첨부
  screen_specific:
  - name: 조회 조건
    desc: 지출과목과 문서 구분(기안문서·결재대기·결재완료·감사문서·회람문서·반려문서)으로 걸러 봅니다.
  - name: 결재현황
    desc: 「1 / 2」는 결재자 2명 중 1명까지 끝났다는 뜻입니다. 끝나면 「승인완료」, 돌려받으면 「반려」로 바뀝니다.
  - name: 결재 후 상태
    desc: 승인된 기안의 집행이 진행 중인지, 끝났는지, 취소(폐기)됐는지 고릅니다.
  - name: 엑셀 등록 · 분야설정
    desc: 기안을 엑셀로 한 번에 올리거나, 분야(지출과목) 목록을 정리합니다.

  steps:
    - no: 1
      action: 상단 [전자결재]를 클릭한 뒤 왼쪽 목록에서 [기안품의]를 클릭합니다.
      target: nav:전자결재 > side:기안품의
      image: appr-draft-01.png
      note: 최근 기안부터 나옵니다. 돋보기를 누르면 결재선과 진행 상황이 보입니다.
    - 'no': 2
      action: '[작성]을 눌러 지출과목·제목·금액·업체를 적고 결재선을 정한 뒤 [등록]합니다.'
      target: button:작성
      image: null
      note: 등록하면 첫 결재자의 메인 화면 [미결]에 나타납니다.
    - 'no': 3
      action: 결재가 끝나면 목록의 [결재 후 상태]를 진행 또는 완료로 바꿔 둡니다.
      target: null
      image: null
      note: null

  cautions:
  - '[임시저장]과 [등록]은 다릅니다. 등록해야 결재가 올라갑니다.'

  faq:
  - q: 반려된 기안은 어떻게 다시 올리나요?
    a: 반려된 기안을 열어 [활용하기]로 내용을 복사해 고친 뒤 새로 등록합니다.

---

- screen_id: appr-report
  screen_name: 업무보고
  path: 전자결재 > 업무보고
  pattern: A
  inherits: pattern-a
  permission: 전자결재
  purpose: 정기적으로 올리는 보고 문서를 관리한다

  key_concept: >
    기안품의가 승인을 받는 문서라면, 업무보고는 **알리는 문서**다.
    부과명세서나 재무제표처럼 정해진 형식으로 올리는 보고가 여기 모인다.

  report_types: >
    기안유형이 나뉘어 있다.
    업무보고 · 부과명세서 · 재무제표 · 중요업무 · 전력사용내역 · 미분류.
    올릴 때 어느 유형인지 고르면 나중에 찾기 쉽다.

  columns: [번호, 기안유형, 제목, 금액, 업체명, 작성자, 기안일시, 결재현황, 결재 후 상태, 첨부]

  screen_specific:
    - name: 기안유형 필터
      desc: 유형별로 걸러 봅니다. 부과명세서만 모아 보는 식으로 씁니다.
    - name: 결재현황 · 결재 후 상태
      desc: 기안품의와 같은 방식입니다.
    - name: 작성
      desc: 오른쪽 위 버튼으로 새 보고를 올립니다.

  steps:
    - no: 1
      action: 상단 [전자결재]를 클릭한 뒤 왼쪽에서 [업무보고]를 클릭합니다.
      target: nav:전자결재 > side:업무보고
      image: appr-report-01.png
      note: null
    - no: 2
      action: 기안유형이나 기간으로 찾습니다.
      target: null
      image: null
      note: null

  cautions:
    - "기안유형을 [미분류]로 두면 나중에 찾기 어렵습니다. 올릴 때 맞는 유형을 고르세요."

  faq:
    - q: 기안품의와 업무보고는 뭐가 다른가요?
      a: >
        기안품의는 승인을 받는 문서이고, 업무보고는 알리는 문서입니다.
        부과명세서나 재무제표처럼 정기적으로 올리는 것이 업무보고입니다.

