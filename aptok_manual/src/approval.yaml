      image: appr-log-security-01.png
      note: 목록 화면입니다. 날짜별 일지와 결재현황이 나옵니다.
    - no: 2
      action: 새로 쓰려면 오른쪽 위 [일지작성]을 클릭합니다.
      target: button:일지작성
      image: appr-log-security-02.png
      note: 점검일을 고르고 표를 채웁니다.
    - no: 3
      action: 이후 절차는 [일일보고 작성 공통 사용법]을 따릅니다.
