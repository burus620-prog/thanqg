- screen_id: appr-log-generator
  screen_name: 발전기 운전일지
  path: 전자결재 > 일일보고 > 발전기 운전일지
  pattern: C
  inherits: pattern-dailylog
  permission: 전자결재 > 열람
  purpose: 비상발전기 시운전 결과를 수치와 점검표로 기록해 결재를 올린다

  key_concept: >
    보통 **한 달에 한 번 무부하 시운전**을 한 날 쓴다.
    위쪽 [발전기 운전 현황]에 전압·전류·주파수·가동시간·유류잔고율을 넣고,
    아래 점검사항 18개를 양호·불량으로 고른 뒤 특이사항을 적는다.

  screen_specific:
    - name: 점검일
      desc: 시운전한 날짜입니다. 제목이 「발전기 운전일지(날짜)」로 자동으로 바뀝니다.
    - name: 최근 일지 복사
      desc: 지난번 일지의 수치와 점검 결과를 그대로 가져옵니다. 바뀐 값만 고치면 됩니다.
    - name: 점검사항 ＋
      desc: 단지에서 따로 보는 점검 항목을 추가합니다.

  steps:
    - no: 1
      action: 상단 [전자결재]를 클릭한 뒤 왼쪽 목록에서 [일일보고]를 클릭하고 [발전기 운전일지]를 클릭합니다.
      target: nav:전자결재 > side:일일보고 > side:발전기 운전일지
      image: appr-log-generator-01.png
      note: 목록 화면입니다. 결재현황에서 승인 여부를 봅니다.
    - no: 2
      action: 새로 쓰려면 오른쪽 위 [일지작성]을 클릭합니다.
      target: button:일지작성
      image: appr-log-generator-02.png
      note: 점검일을 고르고 운전 현황 수치와 점검사항을 채웁니다.
    - no: 3
      action: 이후 절차는 [일일보고 작성 공통 사용법]을 따릅니다.
      target: null
      image: null
      note: null

  cautions:
    - "[임시저장]과 [등록]은 다릅니다. 등록해야 결재가 올라갑니다."

  faq: []

