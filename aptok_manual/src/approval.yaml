  key_concept: 외기온도와 함께 난방(저층부·고층부)과 급탕의 공급·환수 온도와 압력을 적고, 열량계·유량계의 금일지침을 넣어 사용량과 누계를 남긴다. 목록에서 [일지작성]을 눌러 작성 화면을 열고, 점검일을 고른 뒤 표를 채워 결재선을 정해 올린다. 자세한 방법은 [일일보고 작성 공통 사용법]을 참고한다.
