# 아파트ok 사용자 매뉴얼 원본 — 자산관리
# 화면 4개. draft: true 인 항목은 화면 확인 전 뼈대이며,
# 캡처를 본 뒤 purpose·steps·cautions·faq 를 채운다.

- screen_id: asset-stock-private
  screen_name: 저장품(전용)
  path: 자산관리 > 저장품(전용)
  pattern: A
  inherits: pattern-a
  permission: 자산관리 > 열람
  purpose: 관리사무소 저장품(전용)의 입고·출고와 재고를 관리한다

  key_concept: 소모성 자재(전구·필터·패킹·제설제 등)를 품목별로 등록하고, 들어오고 나갈 때마다 입고·출고를 기록한다. 목록의 재고는 입고에서 출고를 뺀 값이다. 입출고는 결재를 거친다.
  columns:
  - 품목명
  - 입고
  - 출고
  - 재고
  - 관리자[정]
  - 관리자[부]
  - 결재현황
  screen_specific:
  - name: 검색 기준
    desc: 품목명·모델명·구입처명·관리자명·보관장소로 찾습니다. [상세검색]으로 조건을 더 넣습니다.
  - name: 저장품목등록
    desc: 새 품목을 만들고 첫 입고 수량을 넣습니다.
  - name: 엑셀 등록
    desc: 여러 품목을 엑셀로 한 번에 올립니다.

  steps:
    - no: 1
      action: 상단 [자산관리]를 클릭한 뒤 왼쪽 목록에서 [저장품(전용)]를 클릭합니다.
      target: nav:자산관리 > side:저장품(전용)
      image: asset-stock-private-01.png
      note: 품목별 입고·출고·재고가 나옵니다. 재고 머리글을 누르면 재고순으로 정렬됩니다.
    - no: 2
      action: 검색·기간·내려받기 등 기본 조작은 [목록 화면 공통 사용법]을 따릅니다.
      target: null
      image: null
      note: null
    - 'no': 3
      action: '[저장품목등록]을 눌러 품목명·규격·보관장소·관리자를 넣고 입고 수량을 적어 등록합니다.'
      target: button:저장품목등록
      image: null
      note: null
    - 'no': 4
      action: 품목을 눌러 입고·출고를 추가합니다.
      target: null
      image: null
      note: 출고할 때 사용처를 적어 두면 일지나 보고서의 근거가 됩니다.

  cautions: []

  faq: []

