- screen_id: asset-tools
  screen_name: 공기구
  path: 자산관리 > 공기구
  pattern: A
  inherits: pattern-a
  permission: 자산관리 > 열람
  purpose: 공기구(휴대용 발전기·토크렌치·절연저항계 등)를 관리번호로 등록하고 감가상각과 폐기를 관리한다

  key_concept: 물품마다 관리번호가 붙는다. 구매단가·수량·구매일을 넣으면 감가상각비가 계산되고, 쓰지 않게 되면 폐기일을 넣어 목록에서 정리한다.
  columns:
  - 관리번호
  - 품목명
  - 규격
  - 구매단가
  - 수량
  - 구매일
  - 감가상각(게시일·만료일·감가상각비)
  - 폐기일
  screen_specific:
  - name: 폐기품목 포함
    desc: 켜면 폐기한 물품도 함께 봅니다.
  - name: 분류설정
    desc: 물품 분류를 만들고 정리합니다.
  - name: 엑셀 등록
    desc: 여러 물품을 엑셀로 한 번에 올립니다.

  steps:
    - no: 1
      action: 상단 [자산관리]를 클릭한 뒤 왼쪽 목록에서 [공기구]를 클릭합니다.
      target: nav:자산관리 > side:공기구
      image: asset-tools-01.png
      note: 물품 목록입니다. 품목명을 누르면 상세 정보가 열립니다.
    - no: 2
      action: 검색·기간·내려받기 등 기본 조작은 [목록 화면 공통 사용법]을 따릅니다.
      target: null
      image: null
      note: null
    - 'no': 3
      action: '[등록]을 눌러 품목명·규격·구매단가·수량·구매일과 보관장소를 넣고 저장합니다.'
      target: button:등록
      image: null
      note: null

  cautions: []

  faq: []

