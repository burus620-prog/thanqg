# 아파트ok 사용자 매뉴얼 원본 — 입찰계약
# 화면 1개. draft: true 인 항목은 화면 확인 전 뼈대이며,
# 캡처를 본 뒤 purpose·steps·cautions·faq 를 채운다.

- screen_id: bid-contract
  screen_name: 계약현황
  path: 입찰계약 > 계약현황
  pattern: A
  inherits: pattern-a
  permission: 입찰계약 > 열람
  purpose: 단지가 맺은 공사·용역·임대·보험 계약을 한곳에 모아 기간과 집행 상황을 관리한다

  key_concept: 계약마다 업체·계약기간·계약금액이 나오고, 남은 기간이 D-일수로 표시된다. 위쪽 상태 단추(진행 중 · 만료 예정 90일 · 만료됨 · 전체)와 종류 단추(공사·용역·임대·보험·S/W사용·기타·미분류)로 걸러 본다.
  columns:
  - 계약명
  - 업체
  - 계약기간
  - 계약금액
  - 집행 · 수납
  - 상태
  screen_specific:
  - name: 만료 예정 90일
    desc: 90일 안에 끝나는 계약만 봅니다. 재계약·입찰 준비를 이 목록으로 챙깁니다.
  - name: 집행 · 수납
    desc: 계약금액 가운데 집행한 비율입니다. 「지출품의에서 등록」 표시가 있는 계약은 시설보수 지출품의와 연결돼 있습니다.
  - name: 더보기
    desc: 엑셀 받기·인쇄 같은 나머지 기능입니다.

  steps:
    - no: 1
      action: 상단 [입찰계약]을 클릭한 뒤 왼쪽 목록에서 [계약현황]을 클릭합니다.
      target: nav:입찰계약 > side:계약현황
      image: bid-contract-01.png
      note: 진행 중인 계약이 계약기간 순으로 나옵니다.
    - no: 2
      action: 검색·기간·내려받기 등 기본 조작은 [목록 화면 공통 사용법]을 따릅니다.
      target: null
      image: null
      note: null
    - 'no': 3
      action: '[등록]을 눌러 계약명·업체·종류·계약기간·금액을 넣고 계약서 파일을 붙여 저장합니다.'
      target: button:등록
      image: null
      note: null

  cautions: []

  faq:
  - q: 미분류가 많습니다.
    a: 계약을 열어 종류(공사·용역 등)를 지정하면 종류 단추로 걸러 볼 수 있습니다.
