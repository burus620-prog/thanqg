# 아파트ok 사용자 매뉴얼 원본 — 이용요금·결제
# 2026-10-14 업데이트로 생긴 화면. 상단 메뉴에는 없고,
# 메인 화면 왼쪽의 [서비스·결제] 영역(전체보기 ›)에서 들어간다.
#   주소 /billing/APLA000001?tab=use|charge|cloud|ai|bill|price|set

- screen_id: bill-main
  screen_name: 이용요금·결제
  path: 이용요금·결제 > 이용요금·결제
  pattern: D
  permission: 관리소장, 경리(관리사무회계직)
  # 2026-10-17: BILLING 권한이 아직 권한관리에 없음(누구나 열림). 정식 등록되면 '이용요금·결제 › 열람·관리'로 바꾼다.
  #   개발 요청서: aptok-admin/docs/2026-10-17_이용요금결제_권한등록_작업요청.md
  purpose: 충전 잔액과 이번 달 사용 금액을 확인하고, 충전·용량·AI 크레딧을 관리한다

  key_concept: >
    문자·알림톡·AI·클라우드 추가 용량은 모두 **충전금**에서 빠진다(부가세 별도).
    월말에 몰아서 청구하지 않고, **미리 충전하고 쓰는 방식**이다. 충전은 계좌 입금으로 하고,
    아파트OK가 입금을 확인한 날 충전금이 들어가며 세금계산서가 발급된다.

  how_to_open: >
    메인 화면 왼쪽 [서비스·결제] 영역의 [전체보기 ›]를 누릅니다.
    이 영역에서도 충전 잔액, 이번 달 사용, 월 한도, 클라우드 용량을 바로 볼 수 있고 [충전하기]·[청구서]로 바로 갈 수 있습니다.

  top_summary:
    - card: 충전 잔액
      desc: 지금 남은 충전금. 충전 전이면 '충전 전'으로 보입니다. [충전하기]가 여기 있습니다.
    - card: 이번 달 사용
      desc: 이달 문자·AI 사용 금액과 월 한도 대비 사용량.
    - card: AI 크레딧
      desc: 이번 달 무료 크레딧(매달 1일 500 지급)과 유료 크레딧 잔량. [크레딧 구매]가 여기 있습니다.
    - card: 입금 대기
      desc: 충전을 신청하고 아직 입금 확인 전인 금액.

  tabs:
    - tab: 사용 내역
      desc: 기간·구분·사용자별로 서비스별 사용량과 금액, 사용자별 금액, 날짜별 사용 내역을 봅니다. 통화매니저 회선 문자 건수도 여기 나옵니다. [엑셀]로 내려받을 수 있습니다.
    - tab: 충전 내역
      desc: 충전 신청 목록(신청일·금액·입금자명·상태)과 잔액이 바뀐 기록.
    - tab: 클라우드 용량
      desc: 기본 15GB. 50GB씩 추가할 수 있고 월 10,000원(부가세 별도)이 매달 1일 빠집니다. 신청한 달은 남은 날짜만큼만 빠집니다.
    - tab: AI 크레딧
      desc: AI(통화 요약, 관리정보 검색 AI 등)를 쓰면 크레딧이 줄어듭니다. 무료 크레딧을 먼저 쓰고, 다 쓰면 유료 크레딧을 씁니다. 1크레딧 = 1원, 1천·3천·5천 단위로 구매합니다.
    - tab: 청구서·세금계산서
      desc: 입금이 확인된 날마다 발급된 청구서와 세금계산서. 정책 시행 전의 월 정산 청구서도 아래에 남아 있습니다.
    - tab: 요금표
      desc: 알림톡·문자·AI 크레딧·용량 증설 단가와 충전 기준.
    - tab: 설정
      desc: 월 사용 한도, 요금 알림을 받을 사람(기본 소장), 세금계산서 받는 곳(상호·고유번호·대표자·주소·이메일).

  sub_flows:
    - name: 충전하기
      steps:
        - no: 1
          action: 위쪽 [충전 잔액] 카드의 [충전하기]를 클릭합니다.
          image: bill-main-02.png
        - no: 2
          action: 충전 금액(1만·3만·5만원)을 고르고 입금자명을 확인합니다.
          note: 입금할 금액은 부가세 10%를 더한 금액입니다. 예) 3만원 → 33,000원.
        - no: 3
          action: 창에 나온 계좌로 입금할 금액을 보내고 [충전 신청]을 클릭합니다.
          note: 입금자명이 다르면 확인이 늦어집니다. (이 단계는 실제 신청이므로 매뉴얼 캡처가 없습니다)
        - no: 4
          action: 아파트OK가 입금을 확인하면 충전금이 들어오고, 그날 세금계산서가 발급됩니다.
          note: 확인 전에는 위쪽 [입금 대기]에 금액이 보입니다.

  steps:
    - no: 1
      action: 메인 화면 왼쪽 [서비스·결제]의 [전체보기 ›]를 클릭합니다.
      target: url:/billing/APLA000001?tab=use
      image: bill-main-01.png
      note: 위쪽에 잔액·사용·AI 크레딧·입금 대기 카드, 아래에 탭 7개가 보입니다.
    - no: 2
      action: 처음이라면 [설정] 탭에서 월 사용 한도와 요금 알림 받을 사람, 세금계산서 받는 곳을 먼저 정하고 [저장]을 클릭합니다.
      target: null
      image: bill-main-03.png
      note: 세금계산서 받는 곳이 비어 있으면 발급이 늦어질 수 있습니다.

  cautions:
    - "충전 잔액이 0원 아래로 내려가면 문자·알림톡은 보내지지 않습니다(긴급 문자 제외). 요금 알림 받을 사람에게 무료 문자로 알립니다."
    - "충전 잔액이 0원 아래인 채로 1개월이 지나면 다음 1일에 클라우드 추가 용량이 자동으로 해지됩니다. 파일은 지우지 않습니다."
    - "충전 잔액이 0원 아래이고 전체 용량을 넘으면 새 파일을 올릴 수 없고, 14일째부터는 여러 파일 한꺼번에 받기도 막힙니다."

  faq:
    - q: 충전했는데 잔액이 그대로입니다.
      a: 아파트OK가 입금을 확인해야 들어옵니다. 위쪽 [입금 대기]에 금액이 있으면 확인 중인 것입니다. 입금자명이 신청한 이름과 같은지 확인하세요.
    - q: AI 크레딧을 다 쓰면 어떻게 되나요?
      a: 무료·유료 크레딧이 모두 없으면 AI 기능(통화 요약 등)이 멈춥니다. [AI 크레딧] 탭에서 구매하세요. 크레딧은 충전금에서 빠지므로 먼저 충전되어 있어야 합니다.
    - q: 통화매니저 문자 요금도 여기서 빠지나요?
      a: 아닙니다. 문자(통화매니저)는 KT가 관리사무소 통신요금으로 따로 청구합니다. 이 화면에서는 건수만 확인합니다.
