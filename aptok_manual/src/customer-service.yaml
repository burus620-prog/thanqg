- screen_id: cs-sms-hist
  screen_name: 문자 이력
  path: 민원관리 > 통화매니저 > 문자 이력
  pattern: A
  inherits: pattern-a
  permission: 민원관리
  purpose: 주고받은 문자를 조회한다

  key_concept: >
    [전화·문자]에서 문자만 걸러 본 것과 같다.
    문자로 오간 내용만 확인할 때 쓴다.

  columns: [시각, 구분, 세대, 이름, 연락처, 내용, 연락, 민원]

  screen_specific:
    - name: 사진
      desc: >
        위쪽 [사진] 버튼에 개수가 표시됩니다.
        입주민이 사진을 보낸 경우 여기서 모아 볼 수 있습니다.
    - name: 연락 버튼
      desc: 각 줄에 [지난 대화] [전화] [문자]가 있습니다.
    - name: 민원 등록
      desc: 오른쪽 [등록]으로 그 문자를 민원으로 접수합니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [통화매니저]에서 [문자 이력]을 클릭합니다.
      target: nav:민원관리 > 통화매니저 > 문자 이력
      image: cs-sms-hist-01.png
      note: null

  cautions:
    - "문자로 받은 사진도 개인정보입니다. 다룰 때 주의하세요."

  faq:
    - q: 입주민이 보낸 사진은 어디서 보나요?
      a: 위쪽 [사진] 버튼을 누르면 모아 볼 수 있습니다.

