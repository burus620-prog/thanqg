# 아파트ok 사용자 매뉴얼 원본 — 민원관리
# 2026년 8월 31일 메뉴 개편으로 새로 생긴 대분류.
# 관리업무에 있던 공용업무·세대업무가 이곳으로 옮겨졌고, 통화매니저 등이 새로 붙었다.
# 공용업무·세대업무는 mgmt-common-work.yaml, mgmt-work.yaml 에 있다.
#
# 실제 주소 (브라우저에서 확인)
#   전체민원        /minwon/total/APKE000001
#   공용업무        /administration/commonWork/APAA000001
#   세대업무        /administration/unitwork/APAB000001
#   전화·문자       /callmgr/call/APKB000201
#   통화 이력       /callmgr/call/APKB000001
#   문자 이력       /callmgr/msg/APKC000001
#   서비스 신청·현황 /callmgr/apply/APKA000005
#   설정            /callmgr/setting/APKH000001
#   발송 내역       /minwon/message/APKG000101
#   설문 관리       /administration/survey/APAO000001
#   민원통계        /minwon/stat/APKF000001   (준비 중)
#   민원평가현황     /administration/unitwork/APAM000101
#
# 2026년 9월 추가 — 메시지 관리와 민원통계 사이에 [설문 관리]가 붙었다.

- screen_id: cs-all
  screen_name: 전체민원
  path: 민원관리 > 전체민원
  pattern: A
  inherits: pattern-a
  permission: 민원관리
  purpose: 공용업무와 세대업무를 한곳에서 보고 일일일지로 넘긴다

  key_concept: >
    공용업무와 세대업무가 따로 있지만, 이 화면에서는 **둘을 한꺼번에** 본다.
    오늘 무슨 민원이 있었는지 전체를 훑을 때 쓴다.
    고른 민원을 일일일지로 바로 넘길 수 있어서, 하루 마무리에 쓰는 화면이기도 하다.

  columns:
    - 구분
    - 세대
    - 등록구분
    - 접수일시
    - 분류
    - 민원내용
    - 처리내용
    - 접수자
    - 처리일시
    - 담당자
    - 상태
    - 첨부

  screen_specific:
    - name: 상태별 건수 버튼
      desc: >
        [미처리] [처리중] [유보] 버튼에 괄호로 건수가 나옵니다.
        미처리 건수가 곧 오늘 해야 할 일의 개수입니다.
    - name: 상태 표시
      desc: >
        접수 · 안내종결 · 완료 · 완료(외주) 등으로 표시됩니다.
        붉은 [접수]는 아직 손대지 않은 건입니다.
    - name: 일일업무보고
      desc: >
        오른쪽 위 버튼입니다. 체크한 민원을 일일일지 작성 화면으로 그대로 넘깁니다.
        자세한 방법은 [민원을 일일일지로 바로 올리기] 문서를 참고하세요.
    - name: 엑셀 · 인쇄
      desc: 조회된 목록을 내려받거나 출력합니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [전체민원]을 클릭합니다.
      target: nav:민원관리 > 전체민원
      image: cs-all-01.png
      note: null
    - no: 2
      action: 구분·상태·기간으로 원하는 민원을 찾습니다.
      target: null
      image: null
      note: 기간은 [당일] [어제] [일주일] [당월] [3개월] [6개월] 버튼으로 빠르게 지정합니다.
    - no: 3
      action: 일일일지에 올릴 민원을 체크하고 오른쪽 위 [일일업무보고]를 클릭합니다.
      target: button:일일업무보고
      image: cs-all-02.png
      note: 일일일지 작성 화면이 열리면서 고른 민원이 이미 들어가 있습니다.

  cautions:
    - "체크하지 않고 [일일업무보고]를 누르면 빈 일지가 열립니다."
    - "삭제한 민원은 복구되지 않습니다."   # 확인필요

  faq:
    - q: 공용업무와 세대업무를 따로 봐야 하나요?
      a: 이 화면에서 함께 볼 수 있습니다. 구분 열로 어느 쪽인지 알 수 있습니다.
    - q: 오늘 처리한 민원을 일지에 어떻게 넣나요?
      a: >
        체크하고 [일일업무보고]를 누르면 일일일지 작성 화면으로 그대로 넘어갑니다.
        옮겨 적을 필요가 없습니다.

---

- screen_id: cs-phone
  screen_name: 전화·문자
  path: 민원관리 > 통화매니저 > 전화·문자
  pattern: A
  inherits: pattern-a
  permission: 민원관리
  purpose: 걸고 받은 전화와 주고받은 문자를 한 목록에서 본다

  key_concept: >
    통화와 문자가 **한 목록에 섞여** 시간순으로 나온다.
    누구와 언제 어떤 방식으로 연락했는지 한눈에 보인다.
    통화만 보려면 [통화 이력], 문자만 보려면 [문자 이력]으로 간다.

  columns: [시각, 구분, 세대, 이름, 연락처, 내용, 연락, 민원]

  screen_specific:
    - name: 구분 아이콘
      desc: >
        수화기는 통화, 말풍선은 문자입니다.
        화살표 방향으로 발신인지 수신인지 알 수 있고, 못 받은 전화는 [부재중]으로 표시됩니다.
    - name: 조회 조건
      desc: 수신·발신, 전화·문자, 민원 여부, 연락처로 좁혀 볼 수 있습니다.
    - name: 연락 버튼
      desc: >
        각 줄에 [지난 대화] [전화] [문자] 세 버튼이 있습니다.
        [지난 대화]는 그 번호와 주고받은 내용을 대화 형태로 보여줍니다.
    - name: 민원 등록
      desc: 오른쪽 [등록] 버튼으로 그 연락을 민원으로 접수합니다.
    - name: 내용 앞의 대괄호
      desc: >
        [관리비] [보안] [기타]처럼 자동 분류된 꼬리표가 붙습니다.
        통화 요약에서 잡은 분류입니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [통화매니저]에서 [전화·문자]를 클릭합니다.
      target: nav:민원관리 > 통화매니저 > 전화·문자
      image: cs-phone-01.png
      note: null
    - no: 2
      action: 기간과 조건을 정하고 [검색]을 클릭합니다.
      target: null
      image: null
      note: 기본으로 최근 한 달이 잡혀 있습니다.
    - no: 3
      action: 지난 내용을 보려면 [지난 대화], 연락하려면 [전화]나 [문자]를 클릭합니다.
      target: null
      image: null
      note: null

  cautions:
    - "등록되지 않은 번호는 세대와 이름이 비어 있습니다. 세대관리에 연락처를 넣으면 표시됩니다."
    - "통화 내용은 민감한 정보입니다. 열람 권한을 꼭 필요한 사람에게만 주세요."

  faq:
    - q: 부재중 전화만 보고 싶습니다.
      a: 조회 조건에서 걸러 보거나, 알림창의 [최근 기록]에서 [부재중] 버튼을 쓰세요.
    - q: 이 연락을 민원으로 남기려면?
      a: 그 줄 오른쪽 [등록] 버튼을 누르면 민원으로 접수하는 창이 열립니다.

---

- screen_id: cs-call-hist
  screen_name: 통화 이력
  path: 민원관리 > 통화매니저 > 통화 이력
  pattern: A
  inherits: pattern-a
  permission: 민원관리
  purpose: 주고받은 통화를 조회하고 녹취와 요약을 확인한다

  key_concept: >
    알림창의 [최근 기록]이 최근 것만 보여준다면, 이 화면은 **지난 통화 전체**를 찾는 곳이다.
    통화 하나를 열면 녹취 재생, 대화 전문, 자동 요약을 볼 수 있다.

  detail_screen: >
    통화를 열면 상세 화면이 나온다.
    · **기본 정보** — 일시, 발신·수신, 통화시간, 연락처, 세대, 이름, 민원 등록 여부
    · **녹취** — 보관 기한과 [다운로드] [보관]
    · **스크립트** — 재생하면서 대화 전문을 읽습니다. 관리사무소와 입주민이 구분됩니다.
    · **요약** — 분류, 긴급도, 생성일시, 언급된 동·호
    · 오른쪽 위 [삭제] [민원으로 등록] [인쇄]
    · [다시 요약] [스크립트 수정]으로 다시 만들거나 고칠 수 있습니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [통화매니저]에서 [통화 이력]을 클릭합니다.
      target: nav:민원관리 > 통화매니저 > 통화 이력
      image: cs-call-hist-01.png
      note: null
    - no: 2
      action: 목록에서 통화를 눌러 상세 화면을 엽니다.
      target: null
      image: cs-call-hist-02.png
      note: 녹취를 재생하면서 전문을 읽을 수 있습니다.
    - no: 3
      action: 민원으로 남기려면 오른쪽 위 [민원으로 등록]을 클릭합니다.
      target: button:민원으로 등록
      image: cs-call-hist-03.png
      note: >
        통화 내용이 이미 민원 형식으로 정리된 창이 열립니다.
        세대, 접수일시, 분류, 민원 내용이 자동으로 채워져 있습니다.
    - no: 4
      action: "[세대업무 등록 화면] 또는 [공용업무 등록 화면]을 골라 클릭합니다."
      target: null
      image: null
      note: >
        특정 세대의 일이면 세대업무, 단지 공용부의 일이면 공용업무입니다.
        고른 쪽의 등록 화면으로 넘어가고 내용이 그대로 들어갑니다.

  cautions:
    - "녹취에는 보관 기한이 있습니다. 오래 두어야 할 통화는 [보관]하거나 내려받으세요."
    - "요약과 전문은 자동으로 만들어진 것이라 틀릴 수 있습니다. 중요한 건은 녹취를 직접 들어보세요."
    - "통화 내용은 민감한 정보입니다. 열람 권한을 꼭 필요한 사람에게만 주세요."

  faq:
    - q: 통화 내용을 문서로 남기고 싶습니다.
      a: 상세 화면 오른쪽 위 [인쇄]를 쓰거나, [민원으로 등록]으로 민원에 남기세요.
    - q: 요약이 틀렸습니다.
      a: "[다시 요약]으로 새로 만들거나 [스크립트 수정]으로 전문을 고칠 수 있습니다."
    - q: 민원으로 등록할 때 내용을 다시 적어야 하나요?
      a: >
        아닙니다. 통화 요약이 민원 내용에 그대로 들어갑니다.
        세대업무인지 공용업무인지만 고르면 됩니다.

