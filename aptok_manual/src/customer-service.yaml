# 아파트ok 사용자 매뉴얼 원본 — 민원관리
# 2026년 8월 31일 메뉴 개편으로 새로 생긴 대분류.
# 관리업무에 있던 공용업무·세대업무가 이곳으로 옮겨졌고, 통화매니저 등이 새로 붙었다.
# 공용업무·세대업무는 mgmt-common-work.yaml, mgmt-work.yaml 에 있다.
#
# 실제 주소 (브라우저에서 확인)
#   전체민원        /minwon/total/APKE000001
#   공용업무        /administration/commonWork/APAA000001
#   세대업무        /administration/unitwork/APAB000001
#   전화·문자       /callmgr/call/APKB000201
#   통화 이력       /callmgr/call/APKB000001
#   문자 이력       /callmgr/msg/APKC000001
#   서비스 신청·현황 /callmgr/apply/APKA000005
#   설정            /callmgr/setting/APKH000001
#   발송 내역       /minwon/message/APKG000101
#   메시지 발송     /minwon/message/APKG000105   (2026-10 추가)
#   템플릿 관리     /minwon/message/APKG000201   (2026-10 추가)
#   설문 관리       /administration/survey/APAO000001
#   민원통계        /minwon/stat/APKF000001   (준비 중)
#   민원평가현황     /administration/unitwork/APAM000101
#
# 2026년 9월 추가 — 메시지 관리와 민원통계 사이에 [설문 관리]가 붙었다.

- screen_id: cs-all
  screen_name: 전체민원
  path: 민원관리 > 전체민원
  pattern: A
  inherits: pattern-a
  permission: 민원관리
  purpose: 공용업무와 세대업무를 한곳에서 보고 일일일지로 넘긴다

  key_concept: >
    공용업무와 세대업무가 따로 있지만, 이 화면에서는 **둘을 한꺼번에** 본다.
    오늘 무슨 민원이 있었는지 전체를 훑을 때 쓴다.
    고른 민원을 일일일지로 바로 넘길 수 있어서, 하루 마무리에 쓰는 화면이기도 하다.

  columns:
    - 구분
    - 세대
    - 등록구분
    - 접수일시
    - 분류
    - 민원내용
    - 처리내용
    - 접수자
    - 처리일시
    - 담당자
    - 상태
    - 첨부

  screen_specific:
    - name: 상태별 건수 버튼
      desc: >
        [미처리] [처리중] [유보] 버튼에 괄호로 건수가 나옵니다.
        미처리 건수가 곧 오늘 해야 할 일의 개수입니다.
    - name: 상태 표시
      desc: >
        접수 · 안내종결 · 완료 · 완료(외주) 등으로 표시됩니다.
        붉은 [접수]는 아직 손대지 않은 건입니다.
    - name: 일일업무보고
      desc: >
        오른쪽 위 버튼입니다. 체크한 민원을 일일일지 작성 화면으로 그대로 넘깁니다.
        자세한 방법은 [민원을 일일일지로 바로 올리기] 문서를 참고하세요.
    - name: 엑셀 · 인쇄
      desc: 조회된 목록을 내려받거나 출력합니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [전체민원]을 클릭합니다.
      target: nav:민원관리 > 전체민원
      image: cs-all-01.png
      note: null
    - no: 2
      action: 구분·상태·기간으로 원하는 민원을 찾습니다.
      target: null
      image: null
      note: 기간은 [당일] [어제] [일주일] [당월] [3개월] [6개월] 버튼으로 빠르게 지정합니다.
    - no: 3
      action: 일일일지에 올릴 민원을 체크하고 오른쪽 위 [일일업무보고]를 클릭합니다.
      target: button:일일업무보고
      image: cs-all-02.png
      note: 일일일지 작성 화면이 열리면서 고른 민원이 이미 들어가 있습니다.

  cautions:
    - "체크하지 않고 [일일업무보고]를 누르면 빈 일지가 열립니다."
    - "삭제한 민원은 복구되지 않습니다."   # 확인필요

  faq:
    - q: 공용업무와 세대업무를 따로 봐야 하나요?
      a: 이 화면에서 함께 볼 수 있습니다. 구분 열로 어느 쪽인지 알 수 있습니다.
    - q: 오늘 처리한 민원을 일지에 어떻게 넣나요?
      a: >
        체크하고 [일일업무보고]를 누르면 일일일지 작성 화면으로 그대로 넘어갑니다.
        옮겨 적을 필요가 없습니다.

---

- screen_id: cs-phone
  screen_name: 전화·문자
  path: 민원관리 > 통화매니저 > 전화·문자
  pattern: A
  inherits: pattern-a
  permission: 민원관리
  purpose: 걸고 받은 전화와 주고받은 문자를 한 목록에서 본다

  key_concept: >
    통화와 문자가 **한 목록에 섞여** 시간순으로 나온다.
    누구와 언제 어떤 방식으로 연락했는지 한눈에 보인다.
    통화만 보려면 [통화 이력], 문자만 보려면 [문자 이력]으로 간다.

  columns: [시각, 구분, 세대, 이름, 연락처, 내용, 연락, 민원]

  screen_specific:
    - name: 구분 아이콘
      desc: >
        수화기는 통화, 말풍선은 문자입니다.
        화살표 방향으로 발신인지 수신인지 알 수 있고, 못 받은 전화는 [부재중]으로 표시됩니다.
    - name: 조회 조건
      desc: 수신·발신, 전화·문자, 민원 여부, 연락처로 좁혀 볼 수 있습니다.
    - name: 연락 버튼
      desc: >
        각 줄에 [지난 대화] [전화] [문자] 세 버튼이 있습니다.
        [지난 대화]는 그 번호와 주고받은 내용을 대화 형태로 보여줍니다.
    - name: 민원 등록
      desc: 오른쪽 [등록] 버튼으로 그 연락을 민원으로 접수합니다.
    - name: "[+ 번호 등록]"
      desc: >
        등록되지 않은 번호는 이름 칸에 [+ 번호 등록]이 보입니다. 눌러서 그 번호를 입주민(세대)·거래처에 붙이거나
        이름만 메모해 둘 수 있습니다. 등록하면 그 번호의 지난 통화·문자에도 이름이 함께 붙습니다.
    - name: 메모
      desc: 이름만 메모해 둔 번호는 이름 자리에 메모로 보입니다. 누르면 입주민·거래처로 다시 등록할 수 있습니다.
    - name: 내용 앞의 대괄호
      desc: >
        [관리비] [보안] [기타]처럼 자동 분류된 꼬리표가 붙습니다.
        통화 요약에서 잡은 분류입니다.

  sub_flows:
    - name: 모르는 번호 등록하기 (번호부)
      steps:
        - no: 1
          action: 이름 칸의 [+ 번호 등록]을 클릭합니다.
          image: cs-phone-02.png
          note: 알림창의 대화 화면, 통화 이력·문자 이력, 통화 상세에서도 같은 창이 열립니다.
        - no: 2
          action: "[입주민으로] [거래처로] [이름만 메모] 중 하나를 고릅니다."
        - no: 3
          action: "입주민 — 동·호를 고르고 세대주나 가족을 고릅니다. 목록에 없으면 [목록에 없음 — 이름 적기]로 이름을 씁니다."
          note: 통화 요약에 동·호가 나왔으면 미리 골라져 있습니다.
        - no: 4
          action: "거래처 — 거래처를 [찾기]로 고릅니다. 없으면 [새 거래처로 만들기]를 누릅니다."
          note: 새 거래처는 거래처 관리에도 같이 생기고, 이 번호가 담당자 휴대폰이 됩니다.
        - no: 5
          action: "이름만 메모 — 장부에 올릴 정도는 아닌 번호(택배·배달 등)에 씁니다. 이름을 적고 [등록]을 클릭합니다."
          note: 대화창 위에 메모로 보이고, 이 이름으로도 검색됩니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [통화매니저]에서 [전화·문자]를 클릭합니다.
      target: nav:민원관리 > 통화매니저 > 전화·문자
      image: cs-phone-01.png
      note: null
    - no: 2
      action: 기간과 조건을 정하고 [검색]을 클릭합니다.
      target: null
      image: null
      note: 기본으로 최근 한 달이 잡혀 있습니다.
    - no: 3
      action: 지난 내용을 보려면 [지난 대화], 연락하려면 [전화]나 [문자]를 클릭합니다.
      target: text:지난 대화
      image: null
      note: null

  cautions:
    - "번호 등록에서 입주민으로 붙여도 입주민 계정의 휴대폰 번호는 바뀌지 않습니다. 가족·다른 휴대폰 번호도 세대에 붙일 수 있습니다."
    - "통화 내용은 민감한 정보입니다. 열람 권한을 꼭 필요한 사람에게만 주세요."

  faq:
    - q: 부재중 전화만 보고 싶습니다.
      a: 조회 조건에서 걸러 보거나, 알림창의 [최근 기록]에서 [부재중] 버튼을 쓰세요.
    - q: 이 연락을 민원으로 남기려면?
      a: 그 줄 오른쪽 [등록] 버튼을 누르면 민원으로 접수하는 창이 열립니다.
    - q: 모르는 번호로 자주 전화가 옵니다. 누구인지 표시하려면?
      a: 이름 칸의 [+ 번호 등록]으로 입주민·거래처에 붙이거나 이름만 메모해 두세요. 다음부터 알림창에 그 이름이 뜹니다.

---

- screen_id: cs-call-hist
  screen_name: 통화 이력
  path: 민원관리 > 통화매니저 > 통화 이력
  pattern: A
  inherits: pattern-a
  permission: 민원관리
  purpose: 주고받은 통화를 조회하고 녹취와 요약을 확인한다

  key_concept: >
    알림창의 [최근 기록]이 최근 것만 보여준다면, 이 화면은 **지난 통화 전체**를 찾는 곳이다.
    통화 하나를 열면 녹취 재생, 대화 전문, 자동 요약을 볼 수 있다.
    그리고 **통화가 끝나면 민원 접수도 거의 끝나 있다.**
    [민원으로 등록]을 누르면 세대·접수일시·분류·민원 내용이 통화 요약으로 채워진 등록 화면이 열리고,
    직원은 확인하고 [저장]만 누르면 된다. 받아 적고 다시 입력하던 일이 없어진다.

  detail_screen: |
    통화를 열면 상세 화면이 나온다.
    · **기본 정보** — 일시, 발신·수신, 통화시간, 연락처, 세대, 이름, 민원 등록 여부
    · **녹취** — 보관 기한과 [다운로드] [보관]
    · **스크립트** — 재생하면서 대화 전문을 읽습니다. 관리사무소와 입주민이 구분됩니다.
    · **요약** — 분류, 긴급도, 생성일시, 언급된 동·호
    · 오른쪽 위 [삭제] [민원으로 등록] [인쇄]
    · [다시 요약] [스크립트 수정]으로 다시 만들거나 고칠 수 있습니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [통화매니저]에서 [통화 이력]을 클릭합니다.
      target: nav:민원관리 > 통화매니저 > 통화 이력
      image: cs-call-hist-01.png
      note: null
    - no: 2
      action: 목록에서 통화를 눌러 상세 화면을 엽니다.
      target: null
      image: cs-call-hist-02.png
      note: 녹취를 재생하면서 전문을 읽을 수 있습니다.
    - no: 3
      action: 민원으로 남기려면 오른쪽 위 [민원으로 등록]을 클릭합니다.
      target: button:민원으로 등록
      image: null
      note: >
        통화 내용이 이미 민원 형식으로 정리된 창이 열립니다.
        세대, 접수일시, 분류(통화 요약에서 잡은 것), 민원 내용이 자동으로 채워져 있습니다.
        아래 두 버튼에 마우스를 올리면 세대업무로 올릴 때와 공용업무로 올릴 때의 모습이 바뀌어 보입니다.
    - no: 4
      action: "특정 세대의 일이면 [세대업무 등록 화면], 단지 공용부의 일이면 [공용업무 등록 화면]을 클릭합니다."
      target: text:세대업무 등록 화면
      image: cs-call-hist-03.png
      note: >
        등록 화면이 열리면서 동/호, 분류, 민원 내용, 접수자, 접수 일시가 이미 들어가 있습니다.
        민원 내용 첫 줄에는 「[통화매니저 전화 접수]」와 수신 시각이 붙어 어디서 온 민원인지 알 수 있습니다.
        등록되지 않은 번호는 세대를 알 수 없어서 [세대업무 등록 화면]이 흐리게 나옵니다. 창 안내대로 [번호 등록]을 먼저 하세요.
    - no: 5
      action: 내용을 확인하고 필요하면 담당자를 지정한 뒤 오른쪽 위 [저장]을 클릭합니다.
      target: button:저장
      image: cs-call-hist-04.png
      note: >
        담당자를 지정하고 [담당자 알림발송 여부]를 켜 두면 담당자에게 업무 배정 알림이 갑니다.
        저장하면 그 통화에 민원이 연결되어, 통화 이력 목록의 [민원] 칸과 통화 상세의 [민원 등록]에 표시됩니다.
    - no: 6
      action: 다시 통화 상세를 열면 [민원 등록] 칸에 [민원글 보기]와 등록 시각이 나옵니다. 눌러서 등록한 민원으로 바로 갑니다.
      target: text:민원 등록
      image: cs-call-hist-05.png
      note: 같은 통화를 두 번 등록하지 않도록 [민원으로 등록] 버튼이 사라집니다. 민원이 연결된 통화는 [삭제]할 수 없습니다.

  cautions:
    - "녹취에는 보관 기한이 있습니다. 오래 두어야 할 통화는 [보관]하거나 내려받으세요."
    - "요약과 전문은 자동으로 만들어진 것이라 틀릴 수 있습니다. 중요한 건은 녹취를 직접 들어보세요."
    - "통화 내용은 민감한 정보입니다. 열람 권한을 꼭 필요한 사람에게만 주세요."

  faq:
    - q: 통화 내용을 문서로 남기고 싶습니다.
      a: 상세 화면 오른쪽 위 [인쇄]를 쓰거나, [민원으로 등록]으로 민원에 남기세요.
    - q: 요약이 틀렸습니다.
      a: "[다시 요약]으로 새로 만들거나 [스크립트 수정]으로 전문을 고칠 수 있습니다."
    - q: 민원으로 등록할 때 내용을 다시 적어야 하나요?
      a: >
        아닙니다. 통화 요약이 민원 내용에 그대로 들어갑니다.
        세대업무인지 공용업무인지만 고르면 됩니다.
    - q: 통화로 받은 민원을 세대업무에 따로 다시 입력해야 하나요?
      a: >
        아닙니다. 통화 상세에서 [민원으로 등록] → [세대업무 등록 화면]을 누르면
        동·호와 분류, 민원 내용, 접수 일시까지 채워진 화면이 열립니다. 확인하고 [저장]만 누르세요.
    - q: 문자로 받은 민원도 같은 방법으로 올릴 수 있나요?
      a: "네. [문자 이력]이나 [전화·문자] 목록의 [등록] 버튼에서 같은 창이 열립니다."

---

- screen_id: cs-sms-hist
  screen_name: 문자 이력
  path: 민원관리 > 통화매니저 > 문자 이력
  pattern: A
  inherits: pattern-a
  permission: 민원관리
  purpose: 주고받은 문자를 조회한다

  key_concept: >
    [전화·문자]에서 문자만 걸러 본 것과 같다.
    문자로 오간 내용만 확인할 때 쓴다.

  columns: [시각, 구분, 세대, 이름, 연락처, 내용, 연락, 민원]

  screen_specific:
    - name: 사진
      desc: >
        위쪽 [사진] 버튼에 개수가 표시됩니다.
        입주민이 사진을 보낸 경우 여기서 모아 볼 수 있습니다.
    - name: 연락 버튼
      desc: 각 줄에 [지난 대화] [전화] [문자]가 있습니다.
    - name: 민원 등록
      desc: 오른쪽 [등록]으로 그 문자를 민원으로 접수합니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [통화매니저]에서 [문자 이력]을 클릭합니다.
      target: nav:민원관리 > 통화매니저 > 문자 이력
      image: cs-sms-hist-01.png
      note: null

  cautions:
    - "문자로 받은 사진도 개인정보입니다. 다룰 때 주의하세요."

  faq:
    - q: 입주민이 보낸 사진은 어디서 보나요?
      a: 위쪽 [사진] 버튼을 누르면 모아 볼 수 있습니다.

---

- screen_id: cs-svc-req
  screen_name: 서비스 신청·현황
  path: 민원관리 > 통화매니저 > 서비스 신청·현황
  pattern: A
  permission: 민원관리
  purpose: 통화매니저 회선을 신청하고, 회선마다 어디까지 진행됐는지 확인한다

  key_concept: >
    이 단지에 신청한 **회선이 카드 한 장씩** 보인다. 명의가 달라도 이 단지 회선이면 모두 여기에 모인다.
    카드마다 **신청 → KT 서류·신청 → 연결 → 사용 시작** 네 칸 진행 표시가 있어서,
    지금 막혀 있는 곳이 어디인지 바로 알 수 있다. 사람이 승인하는 단계는 없고, KT 처리가 끝나면 자동으로 연결된다.

  top_summary: >
    위쪽 [전체] [사용 중] [진행 중] [확인 필요] 버튼에 회선 수가 표시됩니다.
    누르면 그 상태의 회선만 걸러 봅니다. [확인 필요]가 0이 아니면 먼저 확인하세요.

  screen_specific:
    - name: 회선 카드
      desc: >
        대표번호, 명의, 진행 표시, 연결된 날짜가 보입니다.
        사용 중인 회선은 녹취 사용 여부와 **사용 중인 서비스**(시간대별 설정·녹취·AI 통화 요약·땡큐문자·회선 문자 한도 등)가 함께 나옵니다.
    - name: "[자세히 ▾]"
      desc: 회선에서 쓸 수 있는 서비스 목록을 펼쳐 봅니다.
    - name: "[설정]"
      desc: 그 회선의 인사말·녹음 안내·착신전환을 바꾸는 [설정] 화면으로 갑니다.
    - name: "[KT 안내 보기]"
      desc: 아직 KT 처리 중인 회선에 나옵니다. KT에 무엇을 말하고 어떤 서류를 내야 하는지 다시 보여 줍니다.
    - name: "[점검 순서]"
      desc: 신청 뒤 며칠이 지나도 KT 처리가 확인되지 않으면 나옵니다. 확인할 것을 순서대로 안내합니다.
    - name: "[+ 회선 신청]"
      desc: 새 회선을 신청합니다. [회선 신청] 안내를 보세요.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [통화매니저]에서 [서비스 신청·현황]을 클릭합니다.
      target: nav:민원관리 > 통화매니저 > 서비스 신청·현황
      image: cs-svc-req-01.png
      note: 회선이 카드로 하나씩 보입니다.
    - no: 2
      action: 카드의 진행 표시에서 지금 어느 단계인지 확인합니다.
      target: null
      image: null
      note: 신청 → KT 서류·신청 → 연결 → 사용 시작. 사용 중이면 네 칸이 모두 채워져 있습니다.
    - no: 3
      action: KT 처리 중인 회선이면 [KT 안내 보기]를 눌러 남은 일을 확인합니다.
      target: null
      image: null
      note: 대부분 KT 문자 링크로 서류 사진을 아직 올리지 않은 경우입니다.

  cautions:
    - "KT 문자로 온 링크에 서류(고유번호증 또는 사업자등록증, 신청인 신분증 사본)를 올려야 KT 처리가 시작됩니다. 서류를 올리지 않으면 계속 '진행 중'으로 남습니다."
    - "KT에 '통화매니저 API B2B'가 아닌 다른 상품으로 가입하면 연결되지 않습니다. 이때는 KT에 다시 요청해야 합니다."

  faq:
    - q: 신청한 지 며칠이 지났는데 계속 'KT 신청 확인 중'입니다.
      a: >
        카드의 [점검 순서]를 누르세요. ① KT 문자 링크로 서류를 올렸는지, ② KT 상담원에게
        '통화매니저 API B2B · CP코드 70334 · 솔루션코드 54'로 신청했는지 확인합니다.
        잘못 신청했다면 KT 지능망 고객센터(080-001-1588)에 다시 요청합니다. 그래도 안 되면 아파트OK 고객센터로 문의하세요.
    - q: 연결은 끝났다는데 메뉴에 [전화·문자]가 안 보입니다.
      a: 화면 위 안내의 [메뉴 새로고침]을 누르세요.
    - q: 카드에 'KT 신청은 끝났지만 아파트OK 연결이 되지 않고 있습니다'라고 나옵니다.
      a: >
        사유에 '담당자'가 있으면 아파트OK 고객센터에 담당자 휴대폰·이메일을 알려 주세요.
        그 밖의 사유는 시스템이 자동으로 다시 시도합니다. 하루가 지나도 그대로면 고객센터로 알려 주세요.

---

- screen_id: cs-line-apply
  screen_name: 회선 신청
  path: 민원관리 > 통화매니저 > 서비스 신청·현황 > [+ 회선 신청]
  pattern: B
  permission: 민원관리
  purpose: 단지 전화번호를 통화매니저에 연결하도록 신청한다

  key_concept: |
    신청은 **3단계**이고, 사람이 승인하는 단계는 없다.
    ① 번호 확인 → ② 신청 정보 입력 → ③ KT에 전화하기.
    마지막에 **관리사무소가 KT에 직접 전화(약 5분)하고 서류를 KT에 내야** 연결이 시작된다.
    아파트OK는 신분증을 받거나 보관하지 않는다.

  before_you_start:
    - item: 단지 KT 유선 번호
      desc: 1단계에서 입력합니다. KT 유선 번호만 신청할 수 있습니다.
    - item: 담당자 휴대폰·이메일
      desc: 2단계에서 입력합니다. 진행 안내 문자를 이 휴대폰으로 보냅니다.
    - item: 고유번호증(또는 사업자등록증), 신청인 신분증 사본 사진
      desc: KT와 통화한 뒤 KT에 냅니다. 휴대폰으로 찍은 사진이면 됩니다. 신분증은 주민등록번호 뒷자리를 가리고 준비하세요.

  cost:
    - item: 아파트OK 연결비
      desc: 0원
    - item: 프로그램 사용료
      desc: 0원
    - item: 통화매니저 요금
      desc: KT 정책을 따릅니다.
    - item: 알림톡·문자
      desc: 보낸 건수만큼 냅니다. [메시지 채널과 요금]을 보세요.

  steps:
    - no: 1
      action: "[서비스 신청·현황] 화면 오른쪽 위 [+ 회선 신청]을 클릭합니다."
      target: text:+ 회선 신청
      image: cs-line-apply-01.png
      note: 위쪽에 3단계 진행 표시가, 오른쪽에 준비물과 비용이 보입니다.
    - no: 2
      action: "1단계 — 단지 전화번호를 입력하고 [가입 상태 확인]을 클릭합니다."
      target: null
      image: null
      note: 숫자만 넣으면 하이픈은 자동으로 붙습니다. 결과는 '미가입 번호', '다른 업체 연결', '연결 준비됨' 중 하나로 나옵니다.
    - no: 3
      action: "[다음: 신청 정보]를 클릭합니다."
      target: null
      image: null
      note: null
    - no: 4
      action: "2단계 — 용도, 회선 명의(선택), 담당자 이름·휴대폰·이메일을 입력하고 동의 항목에 체크한 뒤 [저장하고 다음]을 클릭합니다."
      target: null
      image: null
      note: 용도는 현황 목록과 전화가 올 때 보이는 이름입니다. 저장하면 신청이 접수되고, 나중에 이어서 할 수 있습니다.
    - no: 5
      action: "3단계 — 화면에 나온 KT 지능망 고객센터 번호로 전화해, 화면의 문장을 상담원에게 그대로 읽어 줍니다."
      target: null
      image: null
      note: "'통화매니저 API B2B 가입을 요청합니다. CP코드 70334, 솔루션코드 54입니다.' [휴대폰 문자로 받기]를 누르면 이 내용을 문자로 받을 수 있습니다."
    - no: 6
      action: 통화가 끝나면 KT가 보낸 문자의 링크로 서류 사진을 올리고 [통화를 마쳤어요]를 클릭합니다.
      target: null
      image: null
      note: 팩스나 KT 매장 방문으로 내도 됩니다. 나중에 하려면 [나중에 할게요]를 누르세요.

  cautions:
    - "KT 상담원에게 '일반 통화매니저'가 아니라 반드시 '통화매니저 API B2B'로, CP코드·솔루션코드를 함께 말해야 합니다. 다른 코드로 가입되면 연결되지 않습니다."
    - "다른 업체에서 쓰던 번호도 똑같이 신청합니다."

  faq:
    - q: 신청한 뒤에는 무엇을 기다리면 되나요?
      a: >
        KT가 서류를 확인하고 처리하면 자동으로 연결됩니다. 연결되면 담당자 휴대폰으로 알려 드립니다.
        서류를 아직 안 올렸다면 1일·3일·7일째에 다시 안내 문자를 보냅니다.
    - q: 회선을 여러 개 쓸 수 있나요?
      a: 네. [서비스 신청·현황] 아래쪽 [+ 회선 하나 더 신청]으로 추가합니다.

---

- screen_id: cs-setting
  screen_name: 설정
  path: 민원관리 > 통화매니저 > 설정
  pattern: E
  inherits: pattern-a
  permission: 민원관리
  purpose: 통화매니저의 전화 수신, ARS, 문자 발송, 화면 알림을 설정한다

  key_concept: >
    통화매니저의 모든 동작이 여기서 정해진다.
    탭이 네 개이고 각각 다루는 것이 다르다.
    **[스크린팝]만은 이 브라우저에만 적용된다.** 다른 컴퓨터에서는 따로 설정해야 한다.

  line_status: >
    화면 맨 위에 회선 상태가 나온다.
    대표번호와 연결 여부, ARS 상품 가입 여부, 현재 통화설정 상태, 조회 시각이 보인다.
    통화가 안 걸리거나 이상하면 여기부터 확인한다.

  four_tabs:
    - name: 통화설정
      desc: 전화가 왔을 때 어떻게 받을지, 안내멘트를 어떻게 들려줄지 정합니다.
    - name: ARS 관리
      desc: 자동응답 시나리오와 업무시간을 설정합니다. ARS 상품에 가입해야 씁니다.
    - name: 땡큐문자
      desc: 통화가 끝난 뒤나 부재중일 때 자동으로 보낼 문자를 정합니다.
    - name: 스크린팝
      desc: 전화가 오면 화면에 뜨는 알림창의 모양과 내용을 정합니다.

  tab_call:
    - item: 기본 통화설정
      desc: >
        수신 방식을 [정상연결] [즉시 착신전환] [부재중 안내] 중에 고릅니다.
        무응답이거나 통화중일 때 착신전환할지 각각 정하고, 착신전환번호를 넣습니다.
        착신전환을 쓰려면 번호가 반드시 있어야 합니다.
    - item: 산업안전보건멘트
      desc: 전화받는 사람 보호를 위한 안내멘트를 켜고 끕니다.
    - item: 인사말
      desc: 회선에 따라 지원하지 않을 수 있습니다. 지원 안 되면 회색으로 표시됩니다.
    - item: 시간대별 안내멘트
      desc: >
        시간대를 나눠 다르게 동작시킵니다.
        예를 들어 18:00~09:00에는 부재중 멘트가 나가도록 할 수 있습니다.
    - item: 기간별 안내멘트
      desc: 휴가처럼 특정 기간에만 다른 멘트를 내보낼 때 씁니다.
    - item: 안내멘트
      desc: 1번부터 5번까지 멘트를 미리 만들어 두고 시간대·기간별 설정에서 골라 씁니다.
    - item: 통화차단번호
      desc: 특정 번호나 국번을 막습니다. 차단 횟수와 등록자가 기록됩니다.

  tab_ars:
    - item: ARS 사용
      desc: >
        자동응답을 켜고 끕니다.
        **ARS 상품에 가입한 회선에서만 쓸 수 있습니다.** 미가입이면 설정해도 동작하지 않습니다.
    - item: ARS 시나리오
      desc: 번호를 눌렀을 때 어디로 연결할지 정합니다.
    - item: 업무시간
      desc: >
        업무시간과 요일을 정합니다. 공휴일 처리와 점심시간도 따로 설정할 수 있습니다.

  tab_thanks:
    - item: 자동 발송 · 발송 제한
      desc: 하루에 같은 번호로 보낼 최대 횟수를 정합니다.
    - item: 통화 완료 후
      desc: 통화가 끝난 뒤 자동으로 보낼 문구를 정합니다.
    - item: 부재중일 때
      desc: 전화를 못 받았을 때 자동으로 보낼 문구입니다.

  tab_screenpop:
    - item: 적용 범위
      desc: "**이 설정은 지금 쓰는 브라우저에만 적용됩니다.**"
    - item: 사용 여부 · 알림 · 알림 효과
      desc: 알림창을 띄울지, 소리와 효과를 쓸지 정합니다. [알림 테스트]로 확인합니다.
    - item: 표시 항목
      desc: 민원, 직전 통화, 메모, 문자 내용 중에 무엇을 보여줄지 고릅니다.
    - item: 글자 크기 · 투명도 · 카드 최대 개수 · 자동 정리
      desc: 보기 편하게 조절하고, 몇 분 뒤 자동으로 치울지 정합니다.
    - item: 미리보기
      desc: 설정한 대로 어떻게 보이는지 상황별로 보여줍니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [통화매니저]에서 [설정]을 클릭합니다.
      target: nav:민원관리 > 통화매니저 > 설정
      image: cs-setting-01.png
      note: 처음 열면 [통화설정] 탭이 보입니다.
    - no: 2
      action: 자동응답을 쓰려면 [ARS 관리] 탭을 클릭합니다.
      target: tab:ARS 관리
      image: cs-setting-02.png
      note: ARS 상품에 가입해야 실제로 동작합니다.
    - no: 3
      action: 통화 후 자동 문자를 보내려면 [땡큐문자] 탭을 클릭합니다.
      target: tab:땡큐문자
      image: cs-setting-03.png
      note: 통화 완료 후와 부재중일 때를 각각 설정합니다.
    - no: 4
      action: 화면 알림창을 조절하려면 [스크린팝] 탭을 클릭합니다.
      target: tab:스크린팝
      image: cs-setting-04.png
      note: 이 설정은 지금 쓰는 브라우저에만 적용됩니다.

  cautions:
    - "[스크린팝] 설정은 브라우저마다 따로입니다. 컴퓨터를 바꾸면 다시 설정해야 합니다."
    - "ARS는 상품에 가입해야 동작합니다. 미가입 상태에서 설정만 해두면 아무 일도 일어나지 않습니다."
    - "착신전환을 켰는데 번호를 안 넣으면 전화가 어디로도 가지 않습니다."
    - "땡큐문자는 실제로 발송됩니다. 문구를 확인하고 켜세요."

  faq:
    - q: 전화가 안 걸립니다.
      a: 화면 맨 위 회선 상태에서 대표번호가 [연결됨]인지, 통화설정 상태가 무엇인지 확인하세요.
    - q: 다른 컴퓨터에서는 알림창이 안 뜹니다.
      a: 스크린팝은 브라우저마다 따로 설정합니다. 그 컴퓨터에서 다시 켜 주세요.
    - q: 퇴근 후에는 전화를 안 받고 싶습니다.
      a: "[통화설정] 탭의 [시간대별 안내멘트]에서 시간대를 추가하고 부재중 멘트를 지정하세요."
    - q: ARS 설정이 안 먹습니다.
      a: ARS 상품 가입 여부를 확인하세요. 회선 상태에 [미가입]으로 나오면 동작하지 않습니다.

---

- screen_id: cs-msg-sent
  screen_name: 발송 내역
  path: 민원관리 > 메시지 관리 > 발송 내역
  pattern: A
  inherits: pattern-a
  permission: 민원관리
  purpose: 입주민에게 보낸 알림톡·문자가 실제로 갔는지, 요금이 얼마나 나왔는지 확인한다

  key_concept: >
    보낸 메시지는 **세 가지 채널** 중 하나로 나간다 — 알림톡(카카오톡), 문자(아파트OK), 문자(통화매니저).
    이 화면 위쪽에 채널별 건수와 **예상 요금**이 카드로 나오고, 아래 표에서 한 건씩 결과를 본다.
    통화매니저가 자동으로 보낸 땡큐문자도 여기에 남는다. 채널마다 요금 내는 곳이 다르니 [메시지 채널과 요금]을 함께 보자.

  top_summary:
    - card: 알림톡(카카오톡)
      desc: 아파트OK 요금(부가세 별도). 기간 안에 보낸 건수와 예상 요금.
    - card: 문자(아파트OK)
      desc: 아파트OK 요금(부가세 별도). 단문·장문·그림 건수가 나뉘어 보입니다.
    - card: 문자(통화매니저)
      desc: KT 통신요금(부가세 포함). 이달 남은 건수와 오늘 보낸 건수가 함께 보입니다. [월별 보기 ▾]로 달마다 건수를 봅니다.
    - card: 기간 합계
      desc: 조회 기간의 전체 건수와 아파트OK 요금 예상액.

  columns: [발송 시각, 구분, 종류, 제목·내용, 세대, 이름, 연락처, 발송 횟수, 결과, 보낸 사람, 보기]

  screen_specific:
    - name: 조회 조건
      desc: 구분(메시지 발송·통화매니저·민원평가·공지·설문 등), 발송 채널, 제목·내용, 수신번호, 기간으로 좁혀 봅니다.
    - name: "[실패 있음]"
      desc: 체크하면 실패가 섞인 발송만 봅니다. 안 간 메시지를 찾을 때 씁니다.
    - name: 종류
      desc: 단문·장문·그림과 채널(아파트OK·통화매니저)이 함께 표시됩니다.
    - name: 보낸 사람
      desc: 직원 이름 또는 '자동'. 자동은 예약·자동 발송처럼 사람이 직접 누르지 않은 발송입니다.
    - name: "[상세]"
      desc: 받는 사람별 결과를 봅니다. 여러 명에게 한 번에 보낸 건은 여기서 누가 실패했는지 확인합니다.
    - name: "[메시지 발송]"
      desc: 새 메시지를 보내는 [메시지 발송] 화면으로 갑니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [메시지 관리]에서 [발송 내역]을 클릭합니다.
      target: nav:민원관리 > 메시지 관리 > 발송 내역
      image: cs-msg-sent-01.png
      note: 위쪽에 채널별 카드, 아래에 발송 목록이 보입니다.
    - no: 2
      action: "[실패 있음]에 체크해 안 간 메시지가 있는지 확인합니다."
      target: null
      image: null
      note: null
    - no: 3
      action: 궁금한 건의 [상세]를 눌러 받는 사람별 결과를 봅니다.
      target: null
      image: cs-msg-sent-02.png
      note: null

  cautions:
    - "예상 요금은 성공했거나 전송 중인 건만 건당 요금으로 셈한 값입니다(실패 제외). 실제 청구는 [이용요금·결제]에서 확인하세요."
    - "문자(통화매니저)는 아파트OK 요금이 아니라 KT가 관리사무소 통신요금으로 따로 청구합니다."

  faq:
    - q: 문자를 보냈는데 안 갔다고 합니다.
      a: 이 화면에서 그 건의 결과를 확인하세요. 실패로 나오면 번호를 확인한 뒤 다시 보내거나 전화로 알리세요.
    - q: 알림톡을 보냈는데 받지 못했다는 세대가 있습니다.
      a: 알림톡은 카카오톡을 쓰는 세대만 받고, 못 받아도 문자로 대신 보내지 않습니다. 그 세대에는 문자로 다시 보내세요.

---

- screen_id: cs-msg-template
  screen_name: 템플릿 관리
  path: 민원관리 > 메시지 관리 > 템플릿 관리
  pattern: E
  permission: 민원관리
  purpose: 자주 보내는 안내문을 템플릿으로 만들어 두고, 알림톡 문안을 카카오에 신청한다

  key_concept: >
    템플릿은 두 종류다. **문자 템플릿**은 단지가 자유롭게 만들고 고친다.
    **알림톡(카카오톡) 템플릿**은 카카오가 승인한 문안 그대로만 나가므로, 새 문안이 필요하면 신청해서 심사를 받아야 한다.
    아파트OK가 미리 만들어 둔 **공통 템플릿**은 고칠 수 없고, [우리 단지로 복사]한 뒤 고쳐 쓴다.

  concepts:
    - term: 자동으로 채워지는 값
      desc: "{동} {호} {이름}은 받는 세대마다, {단지명} {관리사무소번호}는 우리 단지 값으로 바뀌어 나갑니다. 알림톡은 #{값 이름} 모양입니다."
    - term: 직접 채울 값
      desc: 날짜·시간처럼 보낼 때마다 바뀌는 값입니다. 메시지 발송 화면에서 입력합니다.
    - term: 분류
      desc: 주차, 공사·점검, 단수·정전, 관리비, 행사·모임, 소독·방역, 안전·재난, 기타.

  sub_flows:
    - name: 문자 템플릿 만들기
      steps:
        - no: 1
          action: 위쪽 [문자 템플릿] 카드를 고른 상태에서 [+ 새 문자 템플릿]을 클릭합니다.
          image: cs-msg-template-02.png
        - no: 2
          action: 분류, 제목(장문·그림 문자일 때), 내용을 입력하고 [저장]을 클릭합니다.
          note: 오른쪽 휴대폰 미리보기에 받는 분 화면이 보입니다. 90byte를 넘으면 장문(LMS)으로 바뀝니다.
    - name: 공통 템플릿 고쳐 쓰기
      steps:
        - no: 1
          action: 공통 템플릿을 하나 클릭한 뒤 [우리 단지로 복사]를 클릭합니다.
        - no: 2
          action: "'우리 단지 템플릿'에 생긴 사본을 열어 고친 뒤 [저장]을 클릭합니다."
    - name: 우리 단지 알림톡 신청
      steps:
        - no: 1
          action: 위쪽 [알림톡(카카오톡) 템플릿] 카드를 클릭한 뒤 [+ 우리 단지 알림톡 신청]을 클릭합니다.
          image: cs-msg-template-03.png
        - no: 2
          action: 유형, 템플릿 이름, 보내는 상황, 본문을 입력합니다. 보낼 때마다 바뀌는 값은 #{값 이름}으로 비웁니다.
          note: 오른쪽 '카카오 심사 점검'에 빨간 항목이 없어야 신청할 수 있습니다. [임시 저장]은 언제든 됩니다.
        - no: 3
          action: "[신청하기]를 클릭합니다."
          note: 아파트OK 검토 → 카카오 심사(보통 4~5일)를 거칩니다. 승인되면 '보낼 수 있는 템플릿'과 메시지 발송 화면에 바로 나타납니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [메시지 관리]에서 [템플릿 관리]를 클릭합니다.
      target: nav:민원관리 > 메시지 관리 > 템플릿 관리
      image: cs-msg-template-01.png
      note: 왼쪽에 템플릿 목록, 오른쪽에 고른 템플릿의 휴대폰 미리보기가 보입니다.
    - no: 2
      action: 템플릿을 고른 뒤 [이 템플릿으로 보내기]를 클릭하면 그 내용으로 메시지 발송 화면이 열립니다.
      target: null
      image: null
      note: null

  cautions:
    - "알림톡 신청 상태가 '보완 요청'이나 '카카오 반려'면 문안을 고친 뒤 다시 [신청하기]를 눌러야 합니다."
    - "알림톡 심사 중에 문안을 고치려면 먼저 [신청 취소]를 누른 뒤 고치세요."

  faq:
    - q: 공통 템플릿 내용을 바로 고칠 수 없나요?
      a: 공통 템플릿은 아파트OK가 관리합니다. [우리 단지로 복사]한 뒤 사본을 고쳐 쓰세요.
    - q: 알림톡 문구를 조금만 바꾸고 싶습니다.
      a: 알림톡은 승인된 문안 그대로만 나갑니다. 노란 자리(값)만 보낼 때 바꿀 수 있고, 문장을 바꾸려면 새로 신청해야 합니다.

---

- screen_id: cs-msg-send
  screen_name: 메시지 발송
  path: 민원관리 > 메시지 관리 > 발송 내역 > [메시지 발송]
  pattern: B
  permission: 민원관리
  purpose: 세대나 번호를 골라 알림톡·문자를 보낸다

  key_concept: >
    화면은 위에서 아래로 **수신자 → 발송 설정 → 메시지 → 확인** 순서다.
    맨 아래 '점검'에 빠진 것이 없어야 보낼 수 있다. 채널마다 요금과 받는 조건이 다르니
    처음이라면 [메시지 채널과 요금]을 먼저 읽자.

  fields:
    - name: 수신자
      desc: "[세대에서 선택]으로 동·호를 고르거나 [번호로 추가]로 번호를 직접 넣습니다. 표에서 한 줄씩 뺄 수 있습니다."
    - name: 발송 채널
      desc: 알림톡(카카오톡), 문자(아파트OK), 문자(통화매니저) 중 하나. [요금·기준 보기 ▾]로 건당 요금과 글자 수 기준을 봅니다.
    - name: 템플릿 / 직접 작성
      desc: 알림톡은 승인된 템플릿만 고를 수 있습니다. 문자는 템플릿을 고르거나 직접 씁니다.
    - name: 값
      desc: 템플릿의 '직접 채울 값'을 넣습니다. 예) 시행일시. 빈 칸이 있으면 보낼 수 없습니다.
    - name: 문자 종류 (문자만)
      desc: 자동 — 기준을 넘으면 장문, 사진이 있으면 그림 문자. 단문만 — 길면 단문 여러 건으로 나눠 보냅니다.
    - name: 사진 (문자만)
      desc: jpg·png·gif 최대 3장, 장당 300KB 이하. 붙이면 그림 문자(MMS) 요금입니다.
    - name: 긴급 문자
      desc: 단수·정전·화재 같은 급한 안내에만 씁니다. 잔액이 모자라거나 월 한도를 넘어도 보낼 수 있습니다(잔액 −10,000원까지).
    - name: 예상 · 점검
      desc: 수신자 수, 예상 요금, 보낸 뒤 남는 잔액이 보입니다. 점검 항목이 모두 초록이어야 [발송]이 됩니다.

  steps:
    - no: 1
      action: "[발송 내역] 화면에서 [메시지 발송]을 클릭합니다. [템플릿 관리]에서 [이 템플릿으로 보내기]를 눌러도 됩니다."
      target: text:메시지 발송
      image: cs-msg-send-01.png
      note: null
    - no: 2
      action: "[세대에서 선택] 또는 [번호로 추가]로 받는 사람을 넣습니다."
      target: null
      image: null
      note: null
    - no: 3
      action: 발송 채널을 고르고, 템플릿을 고르거나 내용을 씁니다.
      target: null
      image: cs-msg-send-02.png
      note: 미리보기에 받는 분 화면이 보입니다.
    - no: 4
      action: 템플릿에 '값'이 있으면 채웁니다.
      target: null
      image: null
      note: null
    - no: 5
      action: 맨 아래 '예상'과 '점검'을 확인한 뒤 [테스트 발송]으로 내 휴대폰에 먼저 보내 봅니다.
      target: null
      image: null
      note: 처음 보내는 문안이면 꼭 테스트 발송으로 확인하세요. (화면 아래쪽은 1번 그림에 함께 보입니다)
    - no: 6
      action: "[발송]을 클릭합니다."
      target: null
      image: null
      note: 결과는 [발송 내역]에서 확인합니다. (이 단계는 실제로 발송되므로 매뉴얼 캡처가 없습니다)

  cautions:
    - "[발송]을 누르면 실제로 입주민에게 나갑니다. 되돌릴 수 없습니다."
    - "알림톡은 카카오톡을 쓰는 세대만 받습니다. 못 받아도 문자로 대신 보내지 않습니다."
    - "충전 잔액이 모자라거나 이달 사용 한도에 닿으면 문자(아파트OK)·알림톡은 보내지지 않습니다. [이용요금·결제]에서 충전하거나 한도를 바꾸세요."

  faq:
    - q: 알림톡과 문자 중 무엇으로 보내야 하나요?
      a: >
        공지처럼 정해진 안내는 알림톡이 저렴합니다(건당 12원). 다만 카카오톡이 없는 세대는 못 받으니,
        모두에게 꼭 가야 하는 안내는 문자로 보내세요. [메시지 채널과 요금]에 비교표가 있습니다.
    - q: 문자(통화매니저)는 언제 쓰나요?
      a: 통화매니저 회선이 있는 단지만 쓸 수 있습니다. 관리사무소 번호로 나가고, 요금은 KT가 통신요금으로 따로 청구합니다. 한 달·하루 보낼 수 있는 건수가 정해져 있습니다.

---

- screen_id: cs-survey
  screen_name: 설문 관리
  path: 민원관리 > 설문 관리
  pattern: A
  inherits: pattern-a
  permission: 민원관리
  purpose: 입주민에게 설문이나 투표를 돌리고 응답을 모아 본다

  key_concept: >
    종이로 돌리던 만족도 조사나 찬반 투표를 **앱으로 대신하는 화면**이다.
    관리사무소가 문항을 만들어 올리면 입주민이 앱에서 답하고, 결과가 이 화면에 실시간으로 쌓인다.
    설문 하나가 목록의 한 줄이고, 줄을 누르면 지금까지의 응답 집계를 바로 볼 수 있다.
    설문과 투표는 같은 화면에서 만들며, 등록할 때 [설문유형]으로 구분한다.

  columns:
    - 번호
    - 분야
    - 제목
    - 응답단위
    - 시작일
    - 종료일
    - 참여현황
    - 작성자
    - 기안일시
    - 결재현황
    - 진행상태

  screen_specific:
    - name: 진행상태
      desc: >
        [예정] [진행중] [종료]로 나뉩니다.
        시작일이 아직 안 온 것이 예정, 기간 안이면 진행중, 종료일이 지났으면 종료입니다.
        목록 맨 오른쪽에 색깔 표시로 나옵니다.
    - name: 응답단위
      desc: >
        [입주민별]과 [세대당] 두 가지입니다.
        입주민별은 사람 한 명이 한 번, 세대당은 한 세대가 한 번만 답합니다.
        만족도 조사는 보통 입주민별, 동의 여부를 묻는 투표는 세대당으로 씁니다.
    - name: 참여현황
      desc: >
        "1 / 12 (8.3%)"처럼 나옵니다. 답한 수 / 대상 수 (참여율)입니다.
        참여율이 낮으면 [참여자 알림발송]으로 독려할 수 있습니다.
    - name: 분야
      desc: >
        설문을 묶는 꼬리표입니다. 처음에는 아무것도 없어서 [-]로 표시됩니다.
        [분야설정]에서 먼저 만들어야 등록할 때 고를 수 있습니다.
    - name: 결재현황
      desc: >
        결재선을 걸고 올린 설문만 표시됩니다.
        결재 없이 바로 올린 설문은 비어 있습니다.
    - name: 조회 조건
      desc: >
        진행상태·응답단위·분야로 좁히고, 설문 제목으로도 찾습니다.
        날짜는 [시작일] [종료일] [등록일] 중에 무엇을 기준으로 볼지 먼저 고릅니다.
    - name: 분야설정
      desc: 오른쪽 위 버튼입니다. 설문을 묶을 분야 이름을 만들고 지웁니다.
    - name: 설문 등록
      desc: 오른쪽 위 초록색 버튼입니다. 새 설문 만들기 화면으로 넘어갑니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 왼쪽에서 [설문 관리]를 클릭합니다.
      target: nav:민원관리 > 설문 관리
      image: cs-survey-01.png
      note: 메시지 관리 아래, 민원통계 위에 있습니다.
    - no: 2
      action: 진행상태·응답단위·기간을 정하고 [검색]을 클릭합니다.
      target: null
      image: null
      note: 진행 중인 설문만 보려면 [진행상태]에서 [진행중]을 고릅니다.
    - no: 3
      action: 결과를 보려면 목록에서 설문 제목을 클릭합니다.
      target: null
      image: null
      note: 상세 화면에서 문항별 응답 집계를 봅니다.
    - no: 4
      action: 새 설문을 만들려면 오른쪽 위 [설문 등록]을 클릭합니다.
      target: button:설문 등록
      image: null
      note: null

  cautions:
    - "분야를 쓰려면 [분야설정]에서 먼저 만들어야 합니다. 만들지 않으면 등록할 때 [미분류]밖에 고를 수 없습니다."
    - "응답단위는 등록할 때 정합니다. 시작한 뒤에는 바꾸지 마세요. 이미 받은 응답과 계산 기준이 어긋납니다."   # 확인필요: 진행 중 수정 가능 범위

  faq:
    - q: 설문과 투표는 무엇이 다른가요?
      a: >
        만드는 화면은 같고, 등록할 때 [설문유형]에서 고릅니다.
        여러 문항을 물어보면 설문, 한 가지를 찬반으로 묻는 자리면 투표로 쓰면 됩니다.
    - q: 참여율이 너무 낮습니다.
      a: 상세 화면 오른쪽 위 [참여자 알림발송]을 누르면 아직 안 한 사람에게 알림이 갑니다.
    - q: 분야가 [-]로만 나옵니다.
      a: 분야를 하나도 만들지 않아서입니다. [분야설정]에서 추가하세요.

---

- screen_id: cs-survey-form
  screen_name: 설문 등록
  path: 민원관리 > 설문 관리 > 설문 등록
  pattern: B
  permission: 민원관리
  purpose: 설문이나 투표의 문항을 만들고 대상과 기간을 정해 올린다

  key_concept: >
    화면이 위아래 두 덩어리다.
    **위쪽은 설문의 조건**(결재, 분야, 제목, 기간, 응답 단위, 공개 정책, 발송 채널)이고,
    **아래쪽 [문항 구성]은 실제로 물어볼 내용**이다.
    위를 채우고 아래에 질문을 하나씩 붙인 뒤 오른쪽 위 [등록]을 누르면 입주민에게 나갑니다.

  top_fields:
    - item: 결재여부
      desc: >
        결재를 받고 내보낼 설문이면 결재선을 고릅니다.
        [결재선 사용안함]을 고르면 결재 없이 바로 올라갑니다.
        결재자를 직접 짜려면 [결재자 지정]을 씁니다.
    - item: 분야
      desc: >
        목록에서 설문을 묶는 꼬리표입니다.
        목록 화면의 [분야설정]에서 만들어 둔 것만 나옵니다. 없으면 [미분류]입니다.
    - item: 설문유형
      desc: "[설문]과 [투표] 중에 고릅니다."
    - item: 제목
      desc: 입주민 앱에 그대로 보이는 이름입니다. 기간이 드러나게 적으면 나중에 찾기 쉽습니다.
    - item: 시작일 · 종료일
      desc: >
        시작일이 되면 자동으로 시작합니다.
        **종료일을 비워 두면 기간이 "수동 종료"로 표시되고, 직접 [종료]를 눌러야 끝납니다.**
    - item: 응답 단위
      desc: >
        [입주민별(개인별 응답)]과 [세대당 1응답] 중에 고릅니다.
        고르는 순간 오른쪽 [대상 인원/세대수]가 자동으로 채워집니다.
    - item: 익명 여부
      desc: >
        체크하면 동·호수와 답변자 이름이 결과에 표시되지 않습니다.
        민감한 내용을 물을 때 켭니다.
    - item: 결과 공개 정책
      desc: >
        입주민에게 결과를 언제 보여줄지 정합니다.
        [진행 중 결과 공개] · [진행 중 참여수만] · [종료 후 공개] 세 가지입니다.
        투표는 보통 [진행 중 참여수만]이나 [종료 후 공개]로 둡니다.
    - item: 발송 채널
      desc: "[선택안함]과 [앱 푸시] 중에 고릅니다. 앱 푸시를 고르면 등록과 동시에 알림이 나갑니다."
    - item: 참고 첨부파일 · 첨부사진
      desc: 설문을 이해하는 데 필요한 자료를 붙입니다. 파일 하나에 100MB까지입니다.
    - item: 본문 입력
      desc: "[+ 본문 입력]을 누르면 설문 취지를 적는 칸이 펼쳐집니다. 안 써도 됩니다."

  question_builder:
    - item: 새 질문 추가
      desc: >
        아래쪽 [+새 질문 추가]를 누를 때마다 질문 카드가 하나씩 늘어납니다.
        위에 [총 N개 문항]으로 개수가 나옵니다.
    - item: 문항 유형
      desc: >
        카드마다 [주관식] [단일선택] [다중선택] 중에 고릅니다.
        선택형을 고르면 보기 입력칸이 나오고, [보기 추가]로 항목을 늘립니다.
    - item: 필수 항목
      desc: 체크하면 답하지 않고는 설문을 제출할 수 없습니다.
    - item: 개인정보
      desc: >
        답변에 개인정보가 들어가는 문항에 체크합니다.
        주관식으로 연락처나 이름을 받을 때 씁니다.
    - item: 순서 바꾸기
      desc: 카드 왼쪽 점 여섯 개(⠿)를 끌어 문항과 보기의 순서를 바꿉니다.
    - item: 참고 정보 추가
      desc: >
        질문이 아니라 **읽어보라고 끼워 넣는 자료**입니다.
        [참고 이미지](JPG·PNG·GIF·WEBP)와 [참고 파일] 두 가지가 있습니다.
        도면이나 견적서를 보여주고 의견을 묻는 투표에 씁니다.

  buttons:
    - item: 목록
      desc: 저장하지 않고 나갑니다. 확인 창이 뜨고, 확인을 누르면 쓰던 내용이 사라집니다.
    - item: 사진함
      desc: 단지 사진함에 있는 사진을 골라 붙입니다.
    - item: 임시저장
      desc: 아직 내보내지 않고 저장만 합니다. 문항을 나눠서 만들 때 씁니다.
    - item: 등록
      desc: >
        **실제로 올라갑니다.**
        결재선을 걸었으면 결재가 올라가고, 안 걸었으면 바로 입주민에게 공개됩니다.
        발송 채널을 [앱 푸시]로 두었으면 이때 알림도 나갑니다.

  steps:
    - no: 1
      action: 설문 관리 목록에서 오른쪽 위 [설문 등록]을 클릭합니다.
      target: button:설문 등록
      image: cs-survey-form-01.png
      note: null
    - no: 2
      action: 결재여부·분야·설문유형·제목을 채웁니다.
      target: null
      image: null
      note: 결재 없이 바로 낼 설문이면 [결재선 사용안함]으로 둡니다.
    - no: 3
      action: 시작일과 종료일을 넣고 [응답 단위]를 고릅니다.
      target: null
      image: null
      note: 응답 단위를 고르면 대상 인원·세대수가 자동으로 채워집니다.
    - no: 4
      action: 익명 여부, 결과 공개 정책, 발송 채널을 정합니다.
      target: null
      image: cs-survey-form-02.png
      note: 앱 푸시를 고르면 등록과 동시에 입주민에게 알림이 갑니다.
    - no: 5
      action: 아래 [문항 구성]에서 [+새 질문 추가]를 클릭하고 질문을 적습니다.
      target: button:새 질문 추가
      image: cs-survey-form-03.png
      note: >
        [주관식] [단일선택] [다중선택] 중에 고릅니다.
        선택형이면 [보기 추가]로 항목을 늘립니다.
    - no: 6
      action: 꼭 답해야 하는 문항은 [필수 항목]에 체크합니다.
      target: null
      image: null
      note: 개인정보를 받는 문항이면 [개인정보]에도 체크합니다.
    - no: 7
      action: 도면이나 안내문을 보여주려면 [+참고 정보 추가]를 클릭합니다.
      target: button:참고 정보 추가
      image: cs-survey-form-04.png
      note: 질문이 아니라 읽을거리로 들어갑니다.
    - no: 8
      action: 다 되었으면 오른쪽 위 [등록]을 클릭합니다.
      target: button:등록
      image: null
      note: 나중에 이어서 만들 것이면 [임시저장]을 누릅니다.

  cautions:
    - "[등록]을 누르면 실제로 입주민에게 나갑니다. 연습으로 누르지 마세요."
    - "발송 채널을 [앱 푸시]로 두면 등록하는 순간 알림이 갑니다. 밤늦게 등록하지 마세요."
    - "종료일을 비워 두면 기간이 \"수동 종료\"로 표시되고 자동으로 끝나지 않습니다. 상세 화면에서 직접 [종료]를 눌러야 합니다."
    - "저장하지 않고 [목록]을 누르면 만들던 문항이 모두 사라집니다."
    - "익명 여부는 등록 뒤에 바꾸지 마세요. 익명으로 답한 사람의 신뢰를 깨는 일입니다."
    - "개인정보를 받는 문항은 꼭 필요한 것만 넣고 [개인정보]에 체크하세요."

  faq:
    - q: 분야에 [미분류]밖에 없습니다.
      a: 목록 화면 오른쪽 위 [분야설정]에서 분야를 먼저 만들어야 합니다.
    - q: 만들다 말고 나중에 이어서 하고 싶습니다.
      a: "[임시저장]을 누르세요. 목록에 남아 있어 다시 열어 이어서 만들 수 있습니다."
    - q: 대상이 몇 명인지 미리 알고 싶습니다.
      a: "[응답 단위]를 고르면 오른쪽 [대상 인원/세대수]에 자동으로 나옵니다."
    - q: 도면을 보여주고 의견을 받고 싶습니다.
      a: "[+참고 정보 추가]로 참고 이미지를 넣고, 그 아래에 질문을 붙이세요."
    - q: 결재를 받아야 하는 설문입니다.
      a: 위쪽 [결재여부]에서 결재선을 고르거나 [결재자 지정]으로 직접 짜세요.

---

- screen_id: cs-survey-detail
  screen_name: 설문 상세·결과
  path: 민원관리 > 설문 관리 > (설문 클릭)
  pattern: C
  permission: 민원관리
  purpose: 설문의 진행 상황과 문항별 응답을 확인하고 기간을 조절한다

  key_concept: >
    설문이 **지금 어디까지 왔는지**와 **무엇이라고 답했는지**를 한 화면에서 본다.
    위쪽은 설문의 조건과 남은 기간, 가운데는 참여율, 아래는 문항별 집계다.
    종료를 기다리지 않고 진행 중에도 결과를 볼 수 있다.

  layout:
    - zone: 설문 정보
      desc: 분야, 설문유형, 제목, 기간, 응답 단위, 결과 공개 정책, 발송 채널, 등록일이 표로 나옵니다.
    - zone: 진행 막대
      desc: >
        시작일과 종료일 사이에 막대가 그려지고 [D-13]처럼 남은 날이 표시됩니다.
        종료일 없이 시작한 설문은 오른쪽에 [수동 종료]로 표시됩니다.
        기간이 얼마나 지났는지 백분율로도 나옵니다.
    - zone: 참여 현황
      desc: >
        참여율과 "1 / 12 세대"가 크게 나옵니다.
        오른쪽에 [연장]과 [종료] 버튼이 있습니다.
    - zone: 설문 내용
      desc: >
        문항이 순서대로 나오고 각 문항 앞에 유형([단일선택] 등)과 [필수] 꼬리표가 붙습니다.
        선택형은 보기별 건수와 비율이, 주관식은 답변이 그대로 쌓입니다.
    - zone: 의견등록
      desc: 맨 아래입니다. 직원끼리 남기는 메모이며 [결재전의견] 탭이 따로 있습니다.

  screen_specific:
    - name: 참여자 알림발송
      desc: >
        오른쪽 위 버튼입니다. 아직 답하지 않은 사람에게 다시 알림을 보냅니다.
        참여율이 낮을 때 씁니다.
    - name: 연장
      desc: 종료일을 뒤로 미룹니다. 참여율이 낮은 채로 종료일이 다가올 때 씁니다.
    - name: 종료
      desc: >
        종료일 전에 설문을 끝냅니다.
        종료일을 비워 두고 시작한 설문은 이 버튼으로만 끝낼 수 있습니다.
    - name: 주관식 답변 표시
      desc: >
        답변 아래에 동·호수와 이름, 답한 시각이 붙습니다.
        등록할 때 [익명 처리]를 켠 설문은 이 부분이 표시되지 않습니다.
    - name: 활용하기
      desc: >
        이 설문을 그대로 복제해 새 등록 화면을 엽니다.
        문항과 참고 자료까지 그대로 들어오므로, 분기마다 같은 설문을 돌릴 때 제목과 기간만 고치면 됩니다.
    - name: 수정 · 삭제
      desc: >
        오른쪽 위에 있습니다.
        이미 응답이 쌓인 설문을 고치면 결과 해석이 어긋날 수 있으니 신중하게 씁니다.
    - name: 엑셀 내려받기
      desc: >
        오른쪽 위 [활용하기] 옆에 있는 초록색 엑셀 아이콘입니다.
        세대별 답변 결과를 엑셀 파일로 내려받습니다. 결과를 따로 정리하거나 보관할 때 씁니다.
    - name: 인쇄
      desc: 맨 오른쪽 프린터 아이콘입니다. 지금 보고 있는 결과를 그대로 출력합니다.

  steps:
    - no: 1
      action: 설문 관리 목록에서 볼 설문의 제목을 클릭합니다.
      target: null
      image: cs-survey-detail-01.png
      note: null
    - no: 2
      action: 가운데 [참여 현황]에서 참여율을 확인합니다.
      target: null
      image: null
      note: 낮으면 오른쪽 위 [참여자 알림발송]을 누릅니다.
    - no: 3
      action: 아래로 내려 문항별 응답을 확인합니다.
      target: null
      image: cs-survey-detail-02.png
      note: 선택형은 보기별 건수와 비율, 주관식은 답변 전체가 나옵니다.
    - no: 4
      action: 기간을 늘리려면 [연장], 지금 끝내려면 [종료]를 클릭합니다.
      target: button:종료
      image: null
      note: 종료한 설문은 다시 진행 상태로 돌릴 수 없습니다.   # 확인필요
    - no: 5
      action: 같은 설문을 다시 돌리려면 오른쪽 위 [활용하기]를 클릭합니다.
      target: button:활용하기
      image: cs-survey-detail-03.png
      note: 문항이 그대로 복제된 등록 화면이 열립니다. 제목과 기간만 고치면 됩니다.

  cautions:
    - "[참여자 알림발송]은 실제로 입주민에게 알림이 갑니다. 확인용으로 누르지 마세요."
    - "[종료]를 누르면 더 이상 응답을 받지 않습니다. 되돌릴 수 없습니다."   # 확인필요
    - "응답이 이미 쌓인 설문을 [수정]하면 앞뒤 결과의 기준이 달라집니다."
    - "[삭제]하면 모아 둔 응답도 함께 사라집니다. 필요한 결과는 먼저 갈무리하세요."
    - "익명 설문이라도 주관식 답변에는 답한 사람을 알 만한 내용이 적혀 있을 수 있습니다. 공유할 때 조심하세요."

  faq:
    - q: 종료일을 안 넣고 시작했습니다. 어떻게 끝내나요?
      a: 상세 화면 [참여 현황] 오른쪽의 [종료]를 누르면 끝납니다.
    - q: 참여율이 낮아 기간을 더 주고 싶습니다.
      a: "[연장]으로 종료일을 미루고, [참여자 알림발송]으로 안 한 사람에게 알립니다."
    - q: 지난 분기와 똑같은 설문을 또 돌려야 합니다.
      a: "[활용하기]를 누르세요. 문항이 그대로 복제되어 제목과 기간만 고치면 됩니다."
    - q: 답한 사람이 누구인지 안 보입니다.
      a: 등록할 때 [익명 처리]를 켠 설문입니다. 정상입니다.
    - q: 결과를 엑셀로 받고 싶습니다.
      a: >
        상세 화면 오른쪽 위 [활용하기] 옆의 초록색 엑셀 아이콘을 누르면
        세대별 답변 결과가 엑셀 파일로 내려받아집니다.

---

- screen_id: cs-stat
  screen_name: 민원통계
  path: 민원관리 > 민원통계
  pattern: D
  inherits: pattern-a
  permission: 민원관리
  purpose: 민원 접수와 처리 현황을 집계해 본다

  not_ready: >
    **2026년 9월 현재 준비 중인 기능이다.**
    화면을 열면 "준비 중입니다"만 나온다.
    통계가 필요하면 [민원평가현황]이나 각 목록 화면의 엑셀 내려받기를 쓴다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [민원통계]를 클릭합니다.
      target: nav:민원관리 > 민원통계
      image: cs-stat-01.png
      note: 아직 준비 중인 화면입니다.

  cautions:
    - "아직 제공되지 않는 기능입니다. 열어도 내용이 없습니다."

  faq:
    - q: 민원통계에 아무것도 안 나옵니다.
      a: 아직 준비 중인 기능입니다. 정상입니다.

---

- screen_id: cs-eval
  screen_name: 민원평가현황
  path: 민원관리 > 민원평가현황
  pattern: D
  inherits: pattern-a
  permission: 민원관리
  purpose: 입주민이 매긴 민원 처리 평가를 담당자별로 본다

  key_concept: >
    민원을 처리한 뒤 입주민이 매긴 평점을 모아 보는 화면이다.
    담당자별로 순위가 매겨지고 **[양호]와 [개선 필요]로 상태가 표시**된다.
    관리사무소의 응대 품질을 숫자로 확인하는 곳이다.

  top_summary:
    - item: 평가 민원 수
      desc: 평가가 매겨진 민원 건수입니다.
    - item: 전체 평균 평점
      desc: 5점 만점 기준 평균입니다.
    - item: 평가 대상 담당자
      desc: 평가를 받은 사람 수입니다.
    - item: 낮은 평가 (1~2점)
      desc: >
        낮은 점수를 받은 건수입니다.
        0이 아니면 어떤 민원이었는지 확인해 볼 필요가 있습니다.

  screen_specific:
    - name: 담당자별 순위 / 변경 이력 탭
      desc: 순위를 보는 탭과 평가가 바뀐 이력을 보는 탭으로 나뉩니다.
    - name: 평점 분포
      desc: 5점부터 1점까지 몇 건씩인지 막대로 보여줍니다.
    - name: 상태
      desc: >
        [양호]와 [개선 필요]로 표시됩니다.
        평균 평점에 따라 자동으로 매겨집니다.
    - name: 담당자 상세 평가
      desc: 왼쪽에서 담당자를 클릭하면 오른쪽에 그 사람의 상세 평가가 나옵니다.
    - name: 공동 처리 안내
      desc: >
        화면 아래에 안내가 있습니다.
        담당자 둘이 함께 처리한 민원은 두 사람 모두에게 같은 평점이 집계되므로,
        담당자별 평가건수를 합치면 전체 평가건수보다 많을 수 있습니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [민원평가현황]을 클릭합니다.
      target: nav:민원관리 > 민원평가현황
      image: cs-eval-01.png
      note: null
    - no: 2
      action: 기간을 정하고 [검색]을 클릭합니다.
      target: null
      image: null
      note: 기본으로 최근 6개월이 잡혀 있습니다.
    - no: 3
      action: 담당자를 클릭하면 오른쪽에 상세 평가가 나옵니다.
      target: null
      image: null
      note: null

  cautions:
    - "담당자 둘이 함께 처리한 민원은 두 사람 모두에게 집계됩니다. 합계가 전체와 다를 수 있습니다."
    - "평가는 사람에 대한 것입니다. 순위를 다룰 때 신중하게 쓰세요."

  faq:
    - q: 담당자별 건수를 더하면 전체보다 많습니다.
      a: >
        둘이 함께 처리한 민원이 두 사람 모두에게 집계되기 때문입니다. 정상입니다.
    - q: 낮은 평가를 받은 민원을 찾고 싶습니다.
      a: 담당자를 클릭하면 오른쪽에 상세 평가가 나옵니다.

