- screen_id: cs-setting
  screen_name: 설정
  path: 민원관리 > 통화매니저 > 설정
  pattern: E
  inherits: pattern-a
  permission: 민원관리
  purpose: 통화매니저의 전화 수신, ARS, 문자 발송, 화면 알림을 설정한다

  key_concept: >
    통화매니저의 모든 동작이 여기서 정해진다.
    탭이 네 개이고 각각 다루는 것이 다르다.
    **[스크린팝]만은 이 브라우저에만 적용된다.** 다른 컴퓨터에서는 따로 설정해야 한다.

  line_status: >
    화면 맨 위에 회선 상태가 나온다.
    대표번호와 연결 여부, ARS 상품 가입 여부, 현재 통화설정 상태, 조회 시각이 보인다.
    통화가 안 걸리거나 이상하면 여기부터 확인한다.

  four_tabs:
    - name: 통화설정
      desc: 전화가 왔을 때 어떻게 받을지, 안내멘트를 어떻게 들려줄지 정합니다.
    - name: ARS 관리
      desc: 자동응답 시나리오와 업무시간을 설정합니다. ARS 상품에 가입해야 씁니다.
    - name: 땡큐문자
      desc: 통화가 끝난 뒤나 부재중일 때 자동으로 보낼 문자를 정합니다.
    - name: 스크린팝
      desc: 전화가 오면 화면에 뜨는 알림창의 모양과 내용을 정합니다.

  tab_call:
    - item: 기본 통화설정
      desc: >
        수신 방식을 [정상연결] [즉시 착신전환] [부재중 안내] 중에 고릅니다.
        무응답이거나 통화중일 때 착신전환할지 각각 정하고, 착신전환번호를 넣습니다.
        착신전환을 쓰려면 번호가 반드시 있어야 합니다.
    - item: 산업안전보건멘트
      desc: 전화받는 사람 보호를 위한 안내멘트를 켜고 끕니다.
    - item: 인사말
      desc: 회선에 따라 지원하지 않을 수 있습니다. 지원 안 되면 회색으로 표시됩니다.
    - item: 시간대별 안내멘트
      desc: >
        시간대를 나눠 다르게 동작시킵니다.
        예를 들어 18:00~09:00에는 부재중 멘트가 나가도록 할 수 있습니다.
    - item: 기간별 안내멘트
      desc: 휴가처럼 특정 기간에만 다른 멘트를 내보낼 때 씁니다.
    - item: 안내멘트
      desc: 1번부터 5번까지 멘트를 미리 만들어 두고 시간대·기간별 설정에서 골라 씁니다.
    - item: 통화차단번호
      desc: 특정 번호나 국번을 막습니다. 차단 횟수와 등록자가 기록됩니다.

  tab_ars:
    - item: ARS 사용
      desc: >
        자동응답을 켜고 끕니다.
        **ARS 상품에 가입한 회선에서만 쓸 수 있습니다.** 미가입이면 설정해도 동작하지 않습니다.
    - item: ARS 시나리오
      desc: 번호를 눌렀을 때 어디로 연결할지 정합니다.
    - item: 업무시간
      desc: >
        업무시간과 요일을 정합니다. 공휴일 처리와 점심시간도 따로 설정할 수 있습니다.

  tab_thanks:
    - item: 자동 발송 · 발송 제한
      desc: 하루에 같은 번호로 보낼 최대 횟수를 정합니다.
    - item: 통화 완료 후
      desc: 통화가 끝난 뒤 자동으로 보낼 문구를 정합니다.
    - item: 부재중일 때
      desc: 전화를 못 받았을 때 자동으로 보낼 문구입니다.

  tab_screenpop:
    - item: 적용 범위
      desc: "**이 설정은 지금 쓰는 브라우저에만 적용됩니다.**"
    - item: 사용 여부 · 알림 · 알림 효과
      desc: 알림창을 띄울지, 소리와 효과를 쓸지 정합니다. [알림 테스트]로 확인합니다.
    - item: 표시 항목
      desc: 민원, 직전 통화, 메모, 문자 내용 중에 무엇을 보여줄지 고릅니다.
    - item: 글자 크기 · 투명도 · 카드 최대 개수 · 자동 정리
      desc: 보기 편하게 조절하고, 몇 분 뒤 자동으로 치울지 정합니다.
    - item: 미리보기
      desc: 설정한 대로 어떻게 보이는지 상황별로 보여줍니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [통화매니저]에서 [설정]을 클릭합니다.
      target: nav:민원관리 > 통화매니저 > 설정
      image: cs-setting-01.png
      note: 처음 열면 [통화설정] 탭이 보입니다.
    - no: 2
      action: 자동응답을 쓰려면 [ARS 관리] 탭을 클릭합니다.
      target: tab:ARS 관리
      image: cs-setting-02.png
      note: ARS 상품에 가입해야 실제로 동작합니다.
    - no: 3
      action: 통화 후 자동 문자를 보내려면 [땡큐문자] 탭을 클릭합니다.
      target: tab:땡큐문자
      image: cs-setting-03.png
      note: 통화 완료 후와 부재중일 때를 각각 설정합니다.
    - no: 4
      action: 화면 알림창을 조절하려면 [스크린팝] 탭을 클릭합니다.
      target: tab:스크린팝
      image: cs-setting-04.png
      note: 이 설정은 지금 쓰는 브라우저에만 적용됩니다.

  cautions:
    - "[스크린팝] 설정은 브라우저마다 따로입니다. 컴퓨터를 바꾸면 다시 설정해야 합니다."
    - "ARS는 상품에 가입해야 동작합니다. 미가입 상태에서 설정만 해두면 아무 일도 일어나지 않습니다."
    - "착신전환을 켰는데 번호를 안 넣으면 전화가 어디로도 가지 않습니다."
    - "땡큐문자는 실제로 발송됩니다. 문구를 확인하고 켜세요."

  faq:
    - q: 전화가 안 걸립니다.
      a: 화면 맨 위 회선 상태에서 대표번호가 [연결됨]인지, 통화설정 상태가 무엇인지 확인하세요.
    - q: 다른 컴퓨터에서는 알림창이 안 뜹니다.
      a: 스크린팝은 브라우저마다 따로 설정합니다. 그 컴퓨터에서 다시 켜 주세요.
    - q: 퇴근 후에는 전화를 안 받고 싶습니다.
      a: "[통화설정] 탭의 [시간대별 안내멘트]에서 시간대를 추가하고 부재중 멘트를 지정하세요."
    - q: ARS 설정이 안 먹습니다.
      a: ARS 상품 가입 여부를 확인하세요. 회선 상태에 [미가입]으로 나오면 동작하지 않습니다.

---

- screen_id: cs-msg-sent
  screen_name: 발송 내역
  path: 민원관리 > 메시지 관리 > 발송 내역
  pattern: A
  inherits: pattern-a
  permission: 민원관리
  purpose: 입주민에게 보낸 메시지가 실제로 갔는지 확인한다

  key_concept: >
    보낸 문자가 **성공했는지 실패했는지** 확인하는 화면이다.
    통화매니저가 자동으로 보낸 땡큐문자도 여기에 남는다.
    보냈다고 생각했는데 안 간 경우를 여기서 잡는다.

  columns: [시각, 구분, 채널, 세대, 이름, 연락처, 발신번호, 내용, 상태]

  screen_specific:
    - name: 실패 버튼
      desc: >
        위쪽 [실패] 버튼에 실패 건수가 표시됩니다.
        0이 아니면 안 간 문자가 있다는 뜻이므로 확인해야 합니다.
    - name: 구분
      desc: 통화매니저가 자동으로 보낸 것인지, 직접 보낸 것인지 표시됩니다.
    - name: 발신번호
      desc: 어느 번호로 나갔는지 보입니다. 보통 단지 대표번호입니다.
    - name: 상태
      desc: 성공 또는 실패로 표시됩니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [메시지 관리]에서 [발송 내역]을 클릭합니다.
      target: nav:민원관리 > 메시지 관리 > 발송 내역
      image: cs-msg-sent-01.png
      note: null
    - no: 2
      action: 위쪽 [실패] 건수를 확인합니다.
      target: null
      image: null
      note: 0이 아니면 안 간 문자가 있습니다.

  cautions:
    - "실패 건수가 있으면 그 입주민은 안내를 못 받은 것입니다. 다시 보내거나 전화로 알리세요."

  faq:
    - q: 문자를 보냈는데 안 갔다고 합니다.
      a: 이 화면에서 그 건의 상태를 확인하세요. [실패]로 나오면 다시 보내야 합니다.

---

- screen_id: cs-survey
  screen_name: 설문 관리
  path: 민원관리 > 설문 관리
  pattern: A
  inherits: pattern-a
  permission: 민원관리
  purpose: 입주민에게 설문이나 투표를 돌리고 응답을 모아 본다

  key_concept: >
    종이로 돌리던 만족도 조사나 찬반 투표를 **앱으로 대신하는 화면**이다.
    관리사무소가 문항을 만들어 올리면 입주민이 앱에서 답하고, 결과가 이 화면에 실시간으로 쌓인다.
    설문 하나가 목록의 한 줄이고, 줄을 누르면 지금까지의 응답 집계를 바로 볼 수 있다.
    설문과 투표는 같은 화면에서 만들며, 등록할 때 [설문유형]으로 구분한다.

  columns:
    - 번호
    - 분야
    - 제목
    - 응답단위
    - 시작일
    - 종료일
    - 참여현황
    - 작성자
    - 기안일시
    - 결재현황
    - 진행상태

  screen_specific:
    - name: 진행상태
      desc: >
        [예정] [진행중] [종료]로 나뉩니다.
        시작일이 아직 안 온 것이 예정, 기간 안이면 진행중, 종료일이 지났으면 종료입니다.
        목록 맨 오른쪽에 색깔 표시로 나옵니다.
    - name: 응답단위
      desc: >
        [입주민별]과 [세대당] 두 가지입니다.
        입주민별은 사람 한 명이 한 번, 세대당은 한 세대가 한 번만 답합니다.
        만족도 조사는 보통 입주민별, 동의 여부를 묻는 투표는 세대당으로 씁니다.
    - name: 참여현황
      desc: >
        "1 / 12 (8.3%)"처럼 나옵니다. 답한 수 / 대상 수 (참여율)입니다.
        참여율이 낮으면 [참여자 알림발송]으로 독려할 수 있습니다.
    - name: 분야
      desc: >
        설문을 묶는 꼬리표입니다. 처음에는 아무것도 없어서 [-]로 표시됩니다.
        [분야설정]에서 먼저 만들어야 등록할 때 고를 수 있습니다.
    - name: 결재현황
      desc: >
        결재선을 걸고 올린 설문만 표시됩니다.
        결재 없이 바로 올린 설문은 비어 있습니다.
    - name: 조회 조건
      desc: >
        진행상태·응답단위·분야로 좁히고, 설문 제목으로도 찾습니다.
        날짜는 [시작일] [종료일] [등록일] 중에 무엇을 기준으로 볼지 먼저 고릅니다.
    - name: 분야설정
      desc: 오른쪽 위 버튼입니다. 설문을 묶을 분야 이름을 만들고 지웁니다.
    - name: 설문 등록
      desc: 오른쪽 위 초록색 버튼입니다. 새 설문 만들기 화면으로 넘어갑니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 왼쪽에서 [설문 관리]를 클릭합니다.
      target: nav:민원관리 > 설문 관리
      image: cs-survey-01.png
      note: 메시지 관리 아래, 민원통계 위에 있습니다.
    - no: 2
      action: 진행상태·응답단위·기간을 정하고 [검색]을 클릭합니다.
      target: null
      image: null
      note: 진행 중인 설문만 보려면 [진행상태]에서 [진행중]을 고릅니다.
    - no: 3
      action: 결과를 보려면 목록에서 설문 제목을 클릭합니다.
      target: null
      image: null
      note: 상세 화면에서 문항별 응답 집계를 봅니다.
    - no: 4
      action: 새 설문을 만들려면 오른쪽 위 [설문 등록]을 클릭합니다.
      target: button:설문 등록
      image: null
      note: null

  cautions:
    - "분야를 쓰려면 [분야설정]에서 먼저 만들어야 합니다. 만들지 않으면 등록할 때 [미분류]밖에 고를 수 없습니다."
    - "응답단위는 등록할 때 정합니다. 시작한 뒤에는 바꾸지 마세요. 이미 받은 응답과 계산 기준이 어긋납니다."   # 확인필요: 진행 중 수정 가능 범위

  faq:
    - q: 설문과 투표는 무엇이 다른가요?
      a: >
        만드는 화면은 같고, 등록할 때 [설문유형]에서 고릅니다.
        여러 문항을 물어보면 설문, 한 가지를 찬반으로 묻는 자리면 투표로 쓰면 됩니다.
    - q: 참여율이 너무 낮습니다.
      a: 상세 화면 오른쪽 위 [참여자 알림발송]을 누르면 아직 안 한 사람에게 알림이 갑니다.
    - q: 분야가 [-]로만 나옵니다.
      a: 분야를 하나도 만들지 않아서입니다. [분야설정]에서 추가하세요.

---

- screen_id: cs-survey-form
  screen_name: 설문 등록
  path: 민원관리 > 설문 관리 > 설문 등록
  pattern: B
  permission: 민원관리
  purpose: 설문이나 투표의 문항을 만들고 대상과 기간을 정해 올린다

  key_concept: >
    화면이 위아래 두 덩어리다.
    **위쪽은 설문의 조건**(결재, 분야, 제목, 기간, 응답 단위, 공개 정책, 발송 채널)이고,
    **아래쪽 [문항 구성]은 실제로 물어볼 내용**이다.
    위를 채우고 아래에 질문을 하나씩 붙인 뒤 오른쪽 위 [등록]을 누르면 입주민에게 나갑니다.

  top_fields:
    - item: 결재여부
      desc: >
        결재를 받고 내보낼 설문이면 결재선을 고릅니다.
        [결재선 사용안함]을 고르면 결재 없이 바로 올라갑니다.
        결재자를 직접 짜려면 [결재자 지정]을 씁니다.
    - item: 분야
      desc: >
        목록에서 설문을 묶는 꼬리표입니다.
        목록 화면의 [분야설정]에서 만들어 둔 것만 나옵니다. 없으면 [미분류]입니다.
    - item: 설문유형
      desc: "[설문]과 [투표] 중에 고릅니다."
    - item: 제목
      desc: 입주민 앱에 그대로 보이는 이름입니다. 기간이 드러나게 적으면 나중에 찾기 쉽습니다.
    - item: 시작일 · 종료일
      desc: >
        시작일이 되면 자동으로 시작합니다.
        **종료일을 비워 두면 자동으로 끝나지 않고 직접 끝내야 합니다.**
    - item: 응답 단위
      desc: >
        [입주민별(개인별 응답)]과 [세대당 1응답] 중에 고릅니다.
        고르는 순간 오른쪽 [대상 인원/세대수]가 자동으로 채워집니다.
    - item: 익명 여부
      desc: >
        체크하면 동·호수와 답변자 이름이 결과에 표시되지 않습니다.
        민감한 내용을 물을 때 켭니다.
    - item: 결과 공개 정책
      desc: >
        입주민에게 결과를 언제 보여줄지 정합니다.
        [진행 중 결과 공개] · [진행 중 참여수만] · [종료 후 공개] 세 가지입니다.
        투표는 보통 [진행 중 참여수만]이나 [종료 후 공개]로 둡니다.
    - item: 발송 채널
      desc: "[선택안함]과 [앱 푸시] 중에 고릅니다. 앱 푸시를 고르면 등록과 동시에 알림이 나갑니다."
    - item: 참고 첨부파일 · 첨부사진
      desc: 설문을 이해하는 데 필요한 자료를 붙입니다. 파일 하나에 100MB까지입니다.
    - item: 본문 입력
      desc: "[+ 본문 입력]을 누르면 설문 취지를 적는 칸이 펼쳐집니다. 안 써도 됩니다."

  question_builder:
    - item: 새 질문 추가
      desc: >
        아래쪽 [+새 질문 추가]를 누를 때마다 질문 카드가 하나씩 늘어납니다.
        위에 [총 N개 문항]으로 개수가 나옵니다.
    - item: 문항 유형
      desc: >
        카드마다 [주관식] [단일선택] [다중선택] 중에 고릅니다.
        선택형을 고르면 보기 입력칸이 나오고, [보기 추가]로 항목을 늘립니다.
    - item: 필수 항목
      desc: 체크하면 답하지 않고는 설문을 제출할 수 없습니다.
    - item: 개인정보
      desc: >
        답변에 개인정보가 들어가는 문항에 체크합니다.
        주관식으로 연락처나 이름을 받을 때 씁니다.
    - item: 순서 바꾸기
      desc: 카드 왼쪽 점 여섯 개(⠿)를 끌어 문항과 보기의 순서를 바꿉니다.
    - item: 참고 정보 추가
      desc: >
        질문이 아니라 **읽어보라고 끼워 넣는 자료**입니다.
        [참고 이미지](JPG·PNG·GIF·WEBP)와 [참고 파일] 두 가지가 있습니다.
        도면이나 견적서를 보여주고 의견을 묻는 투표에 씁니다.

  buttons:
    - item: 목록
      desc: 저장하지 않고 나갑니다. 확인 창이 뜨고, 확인을 누르면 쓰던 내용이 사라집니다.
    - item: 사진함
      desc: 단지 사진함에 있는 사진을 골라 붙입니다.
    - item: 임시저장
      desc: 아직 내보내지 않고 저장만 합니다. 문항을 나눠서 만들 때 씁니다.
    - item: 등록
      desc: >
        **실제로 올라갑니다.**
        결재선을 걸었으면 결재가 올라가고, 안 걸었으면 바로 입주민에게 공개됩니다.
        발송 채널을 [앱 푸시]로 두었으면 이때 알림도 나갑니다.

  steps:
    - no: 1
      action: 설문 관리 목록에서 오른쪽 위 [설문 등록]을 클릭합니다.
      target: button:설문 등록
      image: cs-survey-form-01.png
      note: null
    - no: 2
      action: 결재여부·분야·설문유형·제목을 채웁니다.
      target: null
      image: null
      note: 결재 없이 바로 낼 설문이면 [결재선 사용안함]으로 둡니다.
    - no: 3
      action: 시작일과 종료일을 넣고 [응답 단위]를 고릅니다.
      target: null
      image: null
      note: 응답 단위를 고르면 대상 인원·세대수가 자동으로 채워집니다.
    - no: 4
      action: 익명 여부, 결과 공개 정책, 발송 채널을 정합니다.
      target: null
      image: cs-survey-form-02.png
      note: 앱 푸시를 고르면 등록과 동시에 입주민에게 알림이 갑니다.
    - no: 5
      action: 아래 [문항 구성]에서 [+새 질문 추가]를 클릭하고 질문을 적습니다.
      target: button:새 질문 추가
      image: cs-survey-form-03.png
      note: >
        [주관식] [단일선택] [다중선택] 중에 고릅니다.
        선택형이면 [보기 추가]로 항목을 늘립니다.
    - no: 6
      action: 꼭 답해야 하는 문항은 [필수 항목]에 체크합니다.
      target: null
      image: null
      note: 개인정보를 받는 문항이면 [개인정보]에도 체크합니다.
    - no: 7
      action: 도면이나 안내문을 보여주려면 [+참고 정보 추가]를 클릭합니다.
      target: button:참고 정보 추가
      image: cs-survey-form-04.png
      note: 질문이 아니라 읽을거리로 들어갑니다.
    - no: 8
      action: 다 되었으면 오른쪽 위 [등록]을 클릭합니다.
      target: button:등록
      image: null
      note: 나중에 이어서 만들 것이면 [임시저장]을 누릅니다.

  cautions:
    - "[등록]을 누르면 실제로 입주민에게 나갑니다. 연습으로 누르지 마세요."
    - "발송 채널을 [앱 푸시]로 두면 등록하는 순간 알림이 갑니다. 밤늦게 등록하지 마세요."
    - "종료일을 비워 두면 설문이 자동으로 끝나지 않습니다. 직접 [조기종료]를 눌러야 합니다."
    - "저장하지 않고 [목록]을 누르면 만들던 문항이 모두 사라집니다."
    - "익명 여부는 등록 뒤에 바꾸지 마세요. 익명으로 답한 사람의 신뢰를 깨는 일입니다."
    - "개인정보를 받는 문항은 꼭 필요한 것만 넣고 [개인정보]에 체크하세요."

  faq:
    - q: 분야에 [미분류]밖에 없습니다.
      a: 목록 화면 오른쪽 위 [분야설정]에서 분야를 먼저 만들어야 합니다.
    - q: 만들다 말고 나중에 이어서 하고 싶습니다.
      a: "[임시저장]을 누르세요. 목록에 남아 있어 다시 열어 이어서 만들 수 있습니다."
    - q: 대상이 몇 명인지 미리 알고 싶습니다.
      a: "[응답 단위]를 고르면 오른쪽 [대상 인원/세대수]에 자동으로 나옵니다."
    - q: 도면을 보여주고 의견을 받고 싶습니다.
      a: "[+참고 정보 추가]로 참고 이미지를 넣고, 그 아래에 질문을 붙이세요."
    - q: 결재를 받아야 하는 설문입니다.
      a: 위쪽 [결재여부]에서 결재선을 고르거나 [결재자 지정]으로 직접 짜세요.

---

- screen_id: cs-survey-detail
  screen_name: 설문 상세·결과
  path: 민원관리 > 설문 관리 > (설문 클릭)
  pattern: C
  permission: 민원관리
  purpose: 설문의 진행 상황과 문항별 응답을 확인하고 기간을 조절한다

  key_concept: >
    설문이 **지금 어디까지 왔는지**와 **무엇이라고 답했는지**를 한 화면에서 본다.
    위쪽은 설문의 조건과 남은 기간, 가운데는 참여율, 아래는 문항별 집계다.
    종료를 기다리지 않고 진행 중에도 결과를 볼 수 있다.

  layout:
    - zone: 설문 정보
      desc: 분야, 설문유형, 제목, 기간, 응답 단위, 결과 공개 정책, 발송 채널, 등록일이 표로 나옵니다.
    - zone: 진행 막대
      desc: >
        시작일과 종료일 사이에 막대가 그려지고 [D-13]처럼 남은 날이 표시됩니다.
        기간이 얼마나 지났는지 백분율로도 나옵니다.
    - zone: 참여 현황
      desc: >
        참여율과 "1 / 12 세대"가 크게 나옵니다.
        오른쪽에 [연장]과 [조기종료] 버튼이 있습니다.
    - zone: 설문 내용
      desc: >
        문항이 순서대로 나오고 각 문항 앞에 유형([단일선택] 등)과 [필수] 꼬리표가 붙습니다.
        선택형은 보기별 건수와 비율이, 주관식은 답변이 그대로 쌓입니다.
    - zone: 의견등록
      desc: 맨 아래입니다. 직원끼리 남기는 메모이며 [결재전의견] 탭이 따로 있습니다.

  screen_specific:
    - name: 참여자 알림발송
      desc: >
        오른쪽 위 버튼입니다. 아직 답하지 않은 사람에게 다시 알림을 보냅니다.
        참여율이 낮을 때 씁니다.
    - name: 연장
      desc: 종료일을 뒤로 미룹니다. 참여율이 낮은 채로 종료일이 다가올 때 씁니다.
    - name: 조기종료
      desc: >
        종료일 전에 설문을 끝냅니다.
        종료일을 비워 두고 시작한 설문은 이 버튼으로만 끝낼 수 있습니다.
    - name: 주관식 답변 표시
      desc: >
        답변 아래에 동·호수와 이름, 답한 시각이 붙습니다.
        등록할 때 [익명 처리]를 켠 설문은 이 부분이 표시되지 않습니다.
    - name: 활용하기
      desc: >
        이 설문을 그대로 복제해 새 등록 화면을 엽니다.
        문항과 참고 자료까지 그대로 들어오므로, 분기마다 같은 설문을 돌릴 때 제목과 기간만 고치면 됩니다.
    - name: 수정 · 삭제
      desc: >
        오른쪽 위에 있습니다.
        이미 응답이 쌓인 설문을 고치면 결과 해석이 어긋날 수 있으니 신중하게 씁니다.

  steps:
    - no: 1
      action: 설문 관리 목록에서 볼 설문의 제목을 클릭합니다.
      target: null
      image: cs-survey-detail-01.png
      note: null
    - no: 2
      action: 가운데 [참여 현황]에서 참여율을 확인합니다.
      target: null
      image: null
      note: 낮으면 오른쪽 위 [참여자 알림발송]을 누릅니다.
    - no: 3
      action: 아래로 내려 문항별 응답을 확인합니다.
      target: null
      image: cs-survey-detail-02.png
      note: 선택형은 보기별 건수와 비율, 주관식은 답변 전체가 나옵니다.
    - no: 4
      action: 기간을 늘리려면 [연장], 지금 끝내려면 [조기종료]를 클릭합니다.
      target: button:조기종료
      image: null
      note: 조기종료한 설문은 다시 진행 상태로 돌릴 수 없습니다.   # 확인필요
    - no: 5
      action: 같은 설문을 다시 돌리려면 오른쪽 위 [활용하기]를 클릭합니다.
      target: button:활용하기
      image: cs-survey-detail-03.png
      note: 문항이 그대로 복제된 등록 화면이 열립니다. 제목과 기간만 고치면 됩니다.

  cautions:
    - "[참여자 알림발송]은 실제로 입주민에게 알림이 갑니다. 확인용으로 누르지 마세요."
    - "[조기종료]를 누르면 더 이상 응답을 받지 않습니다. 되돌릴 수 없습니다."   # 확인필요
    - "응답이 이미 쌓인 설문을 [수정]하면 앞뒤 결과의 기준이 달라집니다."
    - "[삭제]하면 모아 둔 응답도 함께 사라집니다. 필요한 결과는 먼저 갈무리하세요."
    - "익명 설문이라도 주관식 답변에는 답한 사람을 알 만한 내용이 적혀 있을 수 있습니다. 공유할 때 조심하세요."

  faq:
    - q: 종료일을 안 넣고 시작했습니다. 어떻게 끝내나요?
      a: 상세 화면 [참여 현황] 오른쪽의 [조기종료]를 누르면 끝납니다.
    - q: 참여율이 낮아 기간을 더 주고 싶습니다.
      a: "[연장]으로 종료일을 미루고, [참여자 알림발송]으로 안 한 사람에게 알립니다."
    - q: 지난 분기와 똑같은 설문을 또 돌려야 합니다.
      a: "[활용하기]를 누르세요. 문항이 그대로 복제되어 제목과 기간만 고치면 됩니다."
    - q: 답한 사람이 누구인지 안 보입니다.
      a: 등록할 때 [익명 처리]를 켠 설문입니다. 정상입니다.
    - q: 결과를 엑셀로 받고 싶습니다.
      a: null   # 확인필요: 상세 화면에 내려받기 버튼이 있는지

---

- screen_id: cs-stat
  screen_name: 민원통계
  path: 민원관리 > 민원통계
  pattern: D
  inherits: pattern-a
  permission: 민원관리
  purpose: 민원 접수와 처리 현황을 집계해 본다

  not_ready: >
    **2026년 9월 현재 준비 중인 기능이다.**
    화면을 열면 "준비 중입니다"만 나온다.
    통계가 필요하면 [민원평가현황]이나 각 목록 화면의 엑셀 내려받기를 쓴다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [민원통계]를 클릭합니다.
      target: nav:민원관리 > 민원통계
      image: cs-stat-01.png
      note: 아직 준비 중인 화면입니다.

  cautions:
    - "아직 제공되지 않는 기능입니다. 열어도 내용이 없습니다."

  faq:
    - q: 민원통계에 아무것도 안 나옵니다.
      a: 아직 준비 중인 기능입니다. 정상입니다.

---

- screen_id: cs-eval
  screen_name: 민원평가현황
  path: 민원관리 > 민원평가현황
  pattern: D
  inherits: pattern-a
  permission: 민원관리
  purpose: 입주민이 매긴 민원 처리 평가를 담당자별로 본다

  key_concept: >
    민원을 처리한 뒤 입주민이 매긴 평점을 모아 보는 화면이다.
    담당자별로 순위가 매겨지고 **[양호]와 [개선 필요]로 상태가 표시**된다.
    관리사무소의 응대 품질을 숫자로 확인하는 곳이다.

  top_summary:
    - item: 평가 민원 수
      desc: 평가가 매겨진 민원 건수입니다.
    - item: 전체 평균 평점
      desc: 5점 만점 기준 평균입니다.
    - item: 평가 대상 담당자
      desc: 평가를 받은 사람 수입니다.
    - item: 낮은 평가 (1~2점)
      desc: >
        낮은 점수를 받은 건수입니다.
        0이 아니면 어떤 민원이었는지 확인해 볼 필요가 있습니다.

  screen_specific:
    - name: 담당자별 순위 / 변경 이력 탭
      desc: 순위를 보는 탭과 평가가 바뀐 이력을 보는 탭으로 나뉩니다.
    - name: 평점 분포
      desc: 5점부터 1점까지 몇 건씩인지 막대로 보여줍니다.
    - name: 상태
      desc: >
        [양호]와 [개선 필요]로 표시됩니다.
        평균 평점에 따라 자동으로 매겨집니다.
    - name: 담당자 상세 평가
      desc: 왼쪽에서 담당자를 클릭하면 오른쪽에 그 사람의 상세 평가가 나옵니다.
    - name: 공동 처리 안내
      desc: >
        화면 아래에 안내가 있습니다.
        담당자 둘이 함께 처리한 민원은 두 사람 모두에게 같은 평점이 집계되므로,
        담당자별 평가건수를 합치면 전체 평가건수보다 많을 수 있습니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 [민원평가현황]을 클릭합니다.
      target: nav:민원관리 > 민원평가현황
      image: cs-eval-01.png
      note: null
    - no: 2
      action: 기간을 정하고 [검색]을 클릭합니다.
      target: null
      image: null
      note: 기본으로 최근 6개월이 잡혀 있습니다.
    - no: 3
      action: 담당자를 클릭하면 오른쪽에 상세 평가가 나옵니다.
      target: null
      image: null
      note: null

  cautions:
    - "담당자 둘이 함께 처리한 민원은 두 사람 모두에게 집계됩니다. 합계가 전체와 다를 수 있습니다."
    - "평가는 사람에 대한 것입니다. 순위를 다룰 때 신중하게 쓰세요."

  faq:
    - q: 담당자별 건수를 더하면 전체보다 많습니다.
      a: >
        둘이 함께 처리한 민원이 두 사람 모두에게 집계되기 때문입니다. 정상입니다.
    - q: 낮은 평가를 받은 민원을 찾고 싶습니다.
      a: 담당자를 클릭하면 오른쪽에 상세 평가가 나옵니다.

