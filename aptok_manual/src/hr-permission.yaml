# 아파트ok 사용자 매뉴얼 원본 — 인사관리 > 권한관리 
# MANUAL-SPEC 1장 데이터 구조를 따름. 이 파일이 원본이며, 웹/PDF/툴팁/자막은 여기서 생성됨. 

- screen_id: hr-permission-role
  screen_name: 권한관리 — 권한별 설정
  path: 인사관리 > 권한관리 > [권한별 설정] 탭
  pattern: E
  permission: [소장]                    # 확인필요: 소장 외 접근 가능 직급
  purpose: >
    직급 단위로 볼 수 있는 메뉴와 할 수 있는 일을 한 번에 정한다.
    직원이 한 명씩 늘어날 때마다 설정하지 않아도 되도록, 직급에 미리 권한을 걸어두는 화면이다.
  legal_basis: null
  deadline: null

  why_first: >
    권한 설정에 따라 직원마다 보이는 메뉴가 달라진다.
    "그 버튼이 저한테는 안 보여요" 문의의 대부분이 여기서 결정되므로,
    다른 화면 매뉴얼을 읽기 전에 이 화면을 먼저 이해해야 한다.

  concepts:
    - term: 권한 그룹
      desc: 직급별로 묶어둔 권한 묶음. 기본으로 관리사무회계직급 / 과장급 / 주임대리급 / 일반직원급이 있다.
    - term: 등록
      desc: 새 항목을 만들 수 있는 권한       # 확인필요: 수정 포함 여부
    - term: 열람
      desc: 화면을 열어 내용을 볼 수 있는 권한
    - term: 관리
      desc: 설정 변경·삭제 등 관리자 동작 권한  # 확인필요: 정확한 범위
    - term: 전체
      desc: 등록·열람·관리를 한 번에 켜고 끄는 칸

  prerequisite:
    - screen: 인사관리 > 직원현황
      desc: >
        직원이 어느 권한 그룹(직책)에 속하는지는 이 화면이 아니라 [직원현황]에서 지정한다.
        따라서 순서는 ①직원현황에서 직원을 그룹에 배정 → ②권한관리에서 그룹에 권한 부여 이다.
        매뉴얼에서도 직원현황 문서를 먼저 읽도록 안내한다.

  steps:
    - no: 1
      action: 상단 메뉴에서 [인사관리]를 클릭한 뒤 왼쪽 목록에서 [권한관리]를 클릭합니다.
      target: nav:인사관리 > side:권한관리
      image: hr-permission-role-01.png
      note: null
    - no: 2
      action: 화면 위쪽 [권한별 설정] 탭이 선택되어 있는지 확인합니다.
      target: tab:권한별 설정
      image: null
      note: 처음 들어오면 이 탭이 기본으로 열립니다.
    - no: 3
      action: 왼쪽 [권한목록]에서 설정할 직책을 클릭합니다.
      target: list:권한목록
      image: hr-permission-role-02.png
      note: >
        선택 전에는 오른쪽에 "좌측 해당 직책/직원을 선택해 주세요"라는 안내만 보입니다.
        직책을 클릭하면 그때 권한설정 표가 나타나고, 선택한 항목은 테두리가 진하게 표시됩니다.
    - no: 4
      action: 오른쪽 [권한설정] 표에서 메뉴별로 [등록] [열람] [관리] 칸을 체크합니다.
      target: table:권한설정
      image: null
      note: >
        메뉴 이름 왼쪽 [+]를 누르면 하위 메뉴가 펼쳐져 더 세밀하게 지정할 수 있습니다.
    - no: 5
      action: 메뉴 하나를 통째로 열어주려면 그 줄의 [전체]를 체크합니다.
      target: checkbox:전체
      image: null
      note: 표 맨 위 [모든 권한]을 체크하면 모든 메뉴가 한 번에 켜집니다.
    - no: 6
      action: 오른쪽 위 [저장]을 클릭합니다.
      target: button:저장
      image: null
      note: 저장을 누르기 전까지는 체크만 바뀐 상태이며 실제로 적용되지 않습니다.

  sub_flows:
    - name: 새 권한 그룹 만들기
      steps:
        - no: 1
          action: 왼쪽 [권한목록] 오른쪽 위 [권한 추가]를 클릭합니다.
          target: button:권한 추가
          image: hr-permission-role-add-01.png
          note: null   # 확인필요: 이름 입력 방식, 삭제 가능 여부

  cautions:
    - "[저장]을 누르지 않고 다른 탭이나 메뉴로 이동하면 체크한 내용이 사라집니다."
    - "권한을 껐다가 켜는 순간 해당 직급 직원들의 화면에서 메뉴가 사라지거나 나타납니다. 업무 시간 중 변경은 피하는 편이 좋습니다."
    - "입주자관리(세대관리·체납세대)와 인사관리(직원현황)는 개인정보를 다루는 화면입니다. 꼭 필요한 직급에만 열어주세요."
    - "[초기화]는 설정을 되돌립니다."   # 확인필요: 화면만 되돌리는지, 저장된 값까지 지우는지

  faq:
    - q: 직원이 메뉴가 안 보인다고 합니다.
      a: >
        먼저 그 직원의 직급을 확인하고, 이 화면에서 해당 직급에 그 메뉴의 [열람]이 켜져 있는지 확인합니다.
        직급 설정이 맞는데도 안 보이면 [개별 설정] 탭에서 그 직원만 따로 막혀 있는지 확인합니다.
    - q: 등록은 되는데 수정이 안 됩니다.
      a: 해당 메뉴의 [관리] 권한이 꺼져 있는지 확인합니다.   # 확인필요
    - q: 새로 들어온 직원을 과장급 권한으로 넣으려면?
      a: 이 화면이 아니라 인사관리 > 직원현황에서 그 직원의 직책을 과장급으로 지정합니다.

  observed_state:      # 캡처 시점의 예시 값 — 문서에는 넣지 않고 참고용
    직책: [관리사무회계직급, 과장급, 주임대리급, 일반직원급]
    권한항목: [단지정보, 관리업무, 법정일정, 전자결재, 자산관리, 입주자관리, 인사관리, 입찰계약, 정보검색]
    비고: >
      권한 항목 9개 중 '단지정보'와 '정보검색'은 상단 메뉴가 아니라 화면 오른쪽 세로 아이콘 막대에 있다.
      단지정보 = 톱니바퀴 아이콘, 정보검색 = 저울 아이콘(법령·판례·서식).
      매뉴얼에서는 "오른쪽 아이콘 막대의 OO 버튼"으로 위치를 안내한다.

---

- screen_id: hr-permission-individual
  screen_name: 권한관리 — 개별 설정
  path: 인사관리 > 권한관리 > [개별 설정] 탭
  pattern: E
  permission: [소장]
  purpose: >
    특정 직원 한 명에게만 다른 권한을 주거나 뺀다.
    같은 직급이라도 담당 업무가 다를 때 사용한다.
  legal_basis: null
  deadline: null

  key_concept: >
    직원의 권한은 그룹권한과 개인권한 중 하나로만 동작한다.
    그룹권한 상태인 직원을 이 화면에서 선택하면
    "그룹권한으로 설정되어 있습니다"라는 안내창이 뜨고 설정이 막힌다.
    개인별로 다르게 주려면 먼저 인사관리 > 직원현황에서 그 직원을 개인권한으로 바꿔야 한다.

  prerequisite:
    - screen: 인사관리 > 직원현황
      desc: >
        대상 직원을 개인권한으로 변경해 둔다.
        그룹권한 상태에서는 이 화면의 권한설정 표가 잠긴다.

  steps:
    - no: 1
      action: 권한관리 화면에서 [개별 설정] 탭을 클릭합니다.
      target: tab:개별 설정
      image: hr-permission-individual-01.png
      note: null
    - no: 2
      action: 왼쪽 [직원목록]에서 대상 직원을 찾습니다. 이름을 입력하고 [검색]을 눌러도 됩니다.
      target: input:검색어 입력 > button:검색
      image: null
      note: 이름 옆에 현재 직급이, 오른쪽에 연락처 뒷자리가 표시됩니다.
    - no: 3
      action: 직원 이름을 클릭해 선택합니다.
      target: list:직원목록
      image: hr-permission-individual-02.png
      note: 선택한 직원만 진하게 표시되고 나머지는 흐려집니다.
    - no: 4
      action: 오른쪽 [권한설정] 표에서 이 직원에게 줄 권한을 체크합니다.
      target: table:권한설정
      image: null
      note: 표 구성은 [권한별 설정] 탭과 같습니다.
    - no: 5
      action: 오른쪽 위 [저장]을 클릭합니다.
      target: button:저장
      image: null
      note: null

  cautions:
    - "직원목록에 표시되는 직급(과장·소장·미설정)은 명목상 직책 표시일 뿐 권한과는 무관합니다. [미설정]은 직책을 아직 정하지 않았다는 뜻이며, 권한이 없다는 뜻이 아닙니다."
    - "그룹권한과 개인권한은 동시에 적용되지 않습니다. 한 직원은 둘 중 하나로만 동작합니다."
    - "직원이 퇴사하면 권한부터 회수해야 합니다. 특히 개인정보 관련 메뉴."

  faq:
    - q: 같은 과장인데 한 명만 전자결재를 쓰게 하려면?
      a: 이 탭에서 그 직원을 선택하고 전자결재 권한만 켜준 뒤 저장합니다.
    - q: 개별로 준 권한을 없애려면?
      a: 같은 방법으로 체크를 풀고 저장합니다.   # 확인필요: 그룹권한으로 되돌리는 방법
    - q: 직원을 클릭했더니 그룹권한으로 설정되어 있다는 창이 뜹니다.
      a: >
        그 직원은 현재 그룹권한을 쓰고 있어 개별 설정이 잠긴 상태입니다.
        인사관리 > 직원현황에서 개인권한으로 바꾼 뒤 다시 시도하세요.
    - q: 직급이 [미설정]인 직원인데 권한을 줘도 되나요?
      a: 됩니다. 직급 표시와 권한은 별개로 동작합니다.

  privacy_note: >
    이 화면에는 직원 이름과 연락처가 표시됩니다. 연락처는 가운데 자리가 가려진 상태로 보입니다.
    화면을 다른 곳에 공유하거나 출력할 때는 이름이 노출되지 않도록 주의하세요.
