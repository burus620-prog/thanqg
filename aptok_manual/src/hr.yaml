- screen_id: hr-edu-ext
  screen_name: 외부교육
  path: 인사관리 > 외부교육
  pattern: A
  inherits: pattern-a
  permission: 인사관리 > 열람
  purpose: 직원이 외부 기관에서 받아야 하는 법정교육(소방안전관리자 실무교육·전기안전 교육·주택관리사 보수교육 등)의 일정과 이수 여부를 연간표로 관리한다

  same_as: >
    이 화면은 [법정일정 > 관리계획 > 외부교육]와 **같은 화면**이다.
    어느 쪽으로 들어가도 같은 자료가 나온다. 두 번 입력할 필요가 없다.

  key_concept: 법정일정의 관리계획과 같은 형식의 연간표다. 항목마다 관련법·벌칙·주기와 담당자가 나와, 무엇을 언제까지 해야 하는지 한 표에서 봅니다.
  columns:
  - 항목
  - 관련법
  - 벌칙
  - 교육대상
  - 주기(교육시간)
  - 1~12월
  screen_specific:
  - name: 연도 이동
    desc: 가운데 ◀ ▶ 로 연도를 바꾸고 [금년]으로 올해로 돌아옵니다.
  - name: 항목 ＋
    desc: 단지에서 따로 챙기는 항목을 추가합니다.
  - name: 월 칸
    desc: 파란 칸은 실시(완료)한 날짜, 분홍 칸은 예정일입니다. 칸을 누르면 그 달 일정을 등록·확인합니다. 빨간 테두리는 이번 달입니다.

  steps:
    - no: 1
      action: 상단 [인사관리]를 클릭한 뒤 왼쪽 목록에서 [외부교육]을 클릭합니다.
      target: nav:인사관리 > side:외부교육
      image: hr-edu-ext-01.png
      note: 올해 교육 일정이 월별 칸에 표시됩니다.
    - no: 2
      action: 검색·기간·내려받기 등 기본 조작은 [목록 화면 공통 사용법]을 따릅니다.
      target: null
      image: null
      note: null

  cautions:
  - 교육을 마치면 그 달 칸에 실시일을 넣어 이수 기록을 남기세요. 감사 때 근거가 됩니다.

  faq: []

