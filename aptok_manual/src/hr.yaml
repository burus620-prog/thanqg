# 아파트ok 사용자 매뉴얼 원본 — 인사관리
# 화면 7개. draft: true 인 항목은 화면 확인 전 뼈대이며,
# 캡처를 본 뒤 purpose·steps·cautions·faq 를 채운다.

- screen_id: hr-staff
  screen_name: 직원현황
  path: 인사관리 > 직원현황
  pattern: A
  inherits: pattern-a
  permission: 인사관리 > 열람
  purpose: 관리사무소와 위탁업체 직원의 인적 정보·직급·권한·전자도장을 관리한다

  key_concept: 직원은 소속(관리사무소·용역업체)과 부서·직급을 가진다. 권한 칸에서 그룹권한(일반직원급·과장급 등)을 고르거나 「개별권한」으로 바꿀 수 있고, 전자도장을 등록해야 결재란에 도장이 찍힌다.
  columns:
  - 이름
  - 부서
  - 직급
  - 권한
  - 휴대전화
  - 입사일
  - 상태
  - 전자도장
  - 소속 확인
  - 첨부
  screen_specific:
  - name: 권한
    desc: 그룹권한을 바로 바꿉니다. 「개별권한」을 고르면 [권한관리 › 개별 설정]에서 메뉴별로 따로 줄 수 있습니다.
  - name: 전자도장
    desc: 「미등록」이면 결재란에 도장 대신 「직인 없음」으로 표시됩니다.
  - name: 검색줄 스위치
    desc: 퇴사자 포함 여부와 소속 승인 상태로 걸러 봅니다.
  - name: 소장 변경신청
    desc: 관리소장이 바뀔 때 신청합니다.

  steps:
    - no: 1
      action: 상단 [인사관리]를 클릭한 뒤 왼쪽 목록에서 [직원현황]을 클릭합니다.
      target: nav:인사관리 > side:직원현황
      image: hr-staff-01.png
      note: 소속·직급으로 걸러 볼 수 있습니다.
    - no: 2
      action: 검색·기간·내려받기 등 기본 조작은 [목록 화면 공통 사용법]을 따릅니다.
      target: null
      image: null
      note: null
    - 'no': 3
      action: '[등록]을 눌러 이름·소속·부서·직급·연락처·입사일을 넣고 저장합니다.'
      target: button:등록
      image: null
      note: null

  cautions:
  - 개인정보가 표시되는 화면입니다.
  - 직원이 퇴사하면 상태를 바꾸고 권한부터 회수하세요.

  faq: []

---

- screen_id: hr-rank
  screen_name: 직급부서
  path: 인사관리 > 직급부서
  pattern: E
  permission: 인사관리 > 열람
  purpose: 직급(소장·과장·주임·기사·반장 등)과 소속·부서 구조를 정한다

  key_concept: 왼쪽은 직급, 오른쪽은 소속/부서다. 소속은 관리사무소와 위탁 용역업체(미화·경비 등)로 나누고, 소속마다 부서를 둔다. 여기서 만든 직급·부서가 직원현황과 결재선에 쓰인다.
  screen_specific:
  - name: 직급 추가
    desc: 직급을 추가하고 손잡이를 끌어 순서를 바꿉니다. 숫자는 그 직급의 직원 수입니다.
  - name: 소속 추가 · 부서추가
    desc: 소속을 만들고 그 아래 [부서추가]로 부서를 둡니다.
  - name: 사용 스위치
    desc: 끄면 선택 목록에서 숨겨집니다.

  steps:
    - no: 1
      action: 상단 [인사관리]를 클릭한 뒤 왼쪽 목록에서 [직급부서]를 클릭합니다.
      target: nav:인사관리 > side:직급부서
      image: hr-rank-01.png
      note: 수정한 뒤 오른쪽 위 [저장]을 눌러야 반영됩니다.

  cautions:
  - '[저장]을 누르지 않고 다른 메뉴로 가면 바꾼 내용이 사라집니다.'

  faq: []

---

- screen_id: hr-duty
  screen_name: 업무분장
  path: 인사관리 > 업무분장
  pattern: E
  permission: 인사관리 > 열람
  purpose: 총괄책임자·안전관리책임자와 안전관리자별 담당 업무를 정해 업무분장표로 남긴다

  key_concept: 위쪽에 총괄책임자(소장)와 안전관리책임자, 아래에 제1~제6 안전관리자와 각자 맡은 법정 업무(점검·신고·교육 등)가 조직도처럼 나온다. 감사나 점검 때 업무분장표로 그대로 출력한다.
  screen_specific:
  - name: 수정
    desc: 담당자를 바꾸거나 업무를 다른 관리자에게 옮깁니다.

  steps:
    - no: 1
      action: 상단 [인사관리]를 클릭한 뒤 왼쪽 목록에서 [업무분장]을 클릭합니다.
      target: nav:인사관리 > side:업무분장
      image: hr-duty-01.png
      note: 법정 업무가 담당자별로 나뉘어 보입니다.

  cautions: []

  faq: []

