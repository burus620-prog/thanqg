- screen_id: hr-appointment
  screen_name: 법정선임
  path: 인사관리 > 법정선임
  pattern: C
  permission: 인사관리 > 열람
  purpose: 법에 따라 선임해야 하는 관리자(관리주체·전기·소방·승강기·놀이시설 등)와 선임 현황을 관리한다
  legal_basis: null               # 확인필요: 근거 조문
  deadline: null                  # 확인필요: 마감일

  key_concept: 항목마다 관련법과 벌칙이 나오고, 선임일과 선임자를 넣어 둔다. 선임자가 퇴사하거나 바뀌면 기한 안에 다시 선임·신고해야 하므로 이 표로 빠진 곳을 확인한다.
  columns:
  - 항목
  - 관련법
  - 벌칙
  - 선임일
  - 선임자

  steps:
    - no: 1
      action: 상단 [인사관리]를 클릭한 뒤 왼쪽 목록에서 [법정선임]을 클릭합니다.
      target: nav:인사관리 > side:법정선임
      image: hr-appointment-01.png
      note: 선임일·선임자 칸이 비어 있는 항목이 아직 선임하지 않은 곳입니다.

