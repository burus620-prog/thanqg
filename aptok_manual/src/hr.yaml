- screen_id: hr-leave
  screen_name: 휴가관리
  path: 인사관리 > 휴가관리
  pattern: A
  inherits: pattern-a
  permission: 인사관리 > 열람
  purpose: 직원 휴가를 신청·결재하고 사용 현황을 본다

  key_concept: 직원이 [휴가 신청]으로 휴가 구분(연차·반차 등)과 기간·사유를 올리면 결재선을 거쳐 승인된다. 승인된 휴가는 휴가 사용 현황에 집계된다.
  columns:
  - 휴가 구분
  - 휴가기간
  - 휴가 일수
  - 사유
  - 등록일시
  - 결재현황
  screen_specific:
  - name: 휴가 사용 현황
    desc: 직원별로 쓴 휴가를 봅니다.
  - name: 조회 기준
    desc: 휴가일 또는 등록일 기준으로 기간을 정해 봅니다.

  steps:
    - no: 1
      action: 상단 [인사관리]를 클릭한 뒤 왼쪽 목록에서 [휴가관리]를 클릭합니다.
      target: nav:인사관리 > side:휴가관리
      image: hr-leave-01.png
      note: null
    - no: 2
      action: 검색·기간·내려받기 등 기본 조작은 [목록 화면 공통 사용법]을 따릅니다.
      target: null
      image: null
      note: null
    - 'no': 3
      action: '[휴가 신청]을 눌러 휴가 구분·기간·사유를 넣고 결재선을 정해 등록합니다.'
      target: button:휴가 신청
      image: null
      note: null

  cautions: []

  faq: []

