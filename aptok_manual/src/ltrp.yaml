- screen_id: ltrp-3yr
  screen_name: 3년 이내 공사
  path: 장기수선계획 > 조정안 작성 > 3년 이내 공사
  pattern: C
  permission: 장기수선계획 › 조정안 작성
  purpose: 조정일이 속한 해부터 3년 동안 해야 하는 공사를 연도별로 확인한다

  key_concept: >
    **보기 전용** 화면이다. 수선 예정 연도(기준년도 + 주기)가 앞으로 3년 안에 드는 항목을 연도별로 모아 보여 준다.
    아직 마감한 조정안이 없으면 개통 때 들여온 기존 계획(의결된 계획)을 보여 주고, 위쪽 [작성 중 조정안]을 누르면 새 조정안 기준으로 본다.
    고칠 때는 검토서에서 한다.

  steps:
    - no: 1
      action: "[조정안 작성 › 3년 이내 공사]를 클릭합니다."
      target: url:/ltrpnew/plan/APGN000006
      image: ltrp-3yr-01.png
      note: 위쪽에 3년 합계와 연도별 금액·건수, 아래에 연도별 공사계획 표(부가세 포함)가 나옵니다.

  cautions:
    - "이 표는 장기수선계획서에 실리고 공개 대상입니다. 검토서에서 예정 연도를 바꾸면 여기 결과도 바뀝니다."

