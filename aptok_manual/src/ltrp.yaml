# 아파트ok 사용자 매뉴얼 원본 — 장기수선계획 (2026-10 신설 대분류)
# 공통 흐름은 _guide-ltrp.yaml (장기수선계획 한눈에 보기).
#
# 실제 주소 (2026-10-17 확인 · 테스트 단지 디엑스삼성아파트, 회차 121)
#   조정 이력            /ltrpnew/mgmt/APGN000001
#   전기 계획 개통        /ltrpnew/mgmt/APGN000018
#   조정 전·후 대비표     /ltrpnew/mgmt/APGN000013
#   단지 기본정보         /ltrpnew/draft/APGN000002
#   총론(긴급·소액지출 등) /ltrpnew/draft/APGN000003
#   검토서               /ltrpnew/draft/APGN000004
#   총괄표(+마감)         /ltrpnew/draft/APGN000005
#   3년 이내 공사         /ltrpnew/plan/APGN000006
#   공사종별 설정         /ltrpnew/facility/APGN000011
#   장기수선계획 시설대장  /ltrpnew/facility/APGN000021
#   세부 시설대장         /ltrpnew/facility/APGN000009
#   적립·사용현황         /ltrpnew/usage/APGN000007
#   시설보수 지출품의     /ltrpnew/usage/APGN000008 (전자결재 메뉴)

# ---------------------------------------------------------------- 파일럿 A2

- screen_id: ltrp-onboard
  screen_name: 전기 계획 개통
  path: 장기수선계획 > 조정 이력 > [전기 계획 개통]
  pattern: B
  permission: 장기수선계획 › 조정 이력 (등록·관리)
  purpose: 지금 쓰는 장기수선계획서를 시스템에 옮겨 담아, 장기수선계획 메뉴를 쓸 수 있게 한다

  why_first: >
    장기수선계획 메뉴의 다른 화면은 **계획 회차가 있어야** 열린다. 개통 전에는 조정안 작성의 2~6단계가 잠겨 있고,
    검토서·총괄표·적립·사용현황이 비어 있다. 단지마다 **처음 한 번** 개통하면 된다.

  before_you_start:
    - item: 장기수선계획서 엑셀(.xlsx · .xls)
      desc: 계획서 안의 「검토서」 시트를 읽습니다. 검토 업체에서 받은 최신 계획서(마지막으로 의결된 것)를 준비하세요. 엑셀이 없으면 항목을 한 줄씩 직접 넣을 수도 있습니다.
    - item: 계획 종류와 조정일자
      desc: "계획서 표지에 적힌 조정일(예: 2025.12.20)과, 그 계획이 정기조정인지 최초수립인지."
    - item: 단지정보 › 기본정보
      desc: 세대수·면적 등 비어 있는 칸은 개통할 때 계획서 값으로 채워집니다. 이미 값이 있는 칸은 바뀌지 않습니다.

  key_concept: >
    개통은 **옮겨 담는 일**이지 고치는 일이 아니다. 계획서에 적힌 값(주기·수선율·금액·기준년도)은 그대로 들어오고,
    시스템은 각 항목을 법정 기준인 **시행규칙[별표1]**의 공사종별과 **짝지어 주기만** 한다.
    이름이 정확히 같은 항목은 바로 짝지어지고, 나머지는 사람이 확인한다. 값을 고치는 것은 개통이 끝난 뒤 **검토서**에서 한다.

  match_groups:
    - group: 자동 연결(정확 일치)
      desc: 이름이 [별표1]과 똑같아 바로 연결된 항목입니다. 할 일이 없습니다.
    - group: 이름은 [별표1]과 맞습니다
      desc: 이름은 맞지만 주기·수선율이 [별표1]과 다르거나 금액에 오류가 있습니다. 차이가 빨간 글씨로 표시됩니다. 계획서 값은 그대로 두고 연결만 합니다.
    - group: 비슷하지만 확실하지 않습니다
      desc: 이름이 일부만 맞아 제안을 미리 채워 두었습니다. 맞으면 [시행규칙[별표1] 항목과 연결]을 눌러 확인합니다.
    - group: 후보가 여럿입니다
      desc: 같은 이름의 [별표1] 항목이 둘 이상입니다. 목록에서 맞는 항목을 고릅니다.
    - group: "[별표1]에서 맞는 항목을 찾지 못했습니다"
      desc: "단지에만 있는 항목(예: 주차차단기, 문주)입니다. [단지 항목으로 등록]을 고르면 이 단지 전용 공사종별로 만들어집니다."

  steps:
    - no: 1
      action: 상단 [장기수선계획]을 클릭하면 [조정 이력]이 열립니다. 위쪽 [전기 계획 개통]을 클릭합니다.
      target: url:/ltrpnew/mgmt/APGN000018
      image: ltrp-onboard-01.png
      note: 개통 전이면 화면 위 안내의 [계획 개통 시작]을 눌러도 됩니다.
    - no: 2
      action: "① 기준 조정본 — 계획 종류(정기조정 / 최초수립)를 고르고, 조정일자에 계획서 표지의 날짜를 여덟 자리로 넣습니다. 예) 20251220"
      target: null
      image: null
      note: 조정일자 순서대로 조정 이력에 들어갑니다.
    - no: 3
      action: "② 수선항목 넣기 — [엑셀로 한 번에]의 [파일 선택]을 눌러 계획서 엑셀을 고릅니다."
      target: null
      image: ltrp-onboard-02.png
      note: 몇 초 뒤 위쪽에 '검토서 전체 항목 · 자동 연결 · 확인 필요 · 오류' 네 숫자가 나옵니다.
    - no: 4
      action: "'계획서의 구분을 어디에 둘까요'가 나오면, 구분마다 [새 구분 「…」 만들기] 또는 [기존 구분으로 보내기]를 고릅니다."
      target: null
      image: null
      note: "계획서에 적힌 구분 이름(예: 승강기, 보도 블럭)을 그대로 쓰려면 [새 구분 만들기]. 이 결정은 기억되어 다음 조정 때 다시 묻지 않습니다."
    - no: 5
      action: "확인 필요 항목을 하나씩 정합니다. [시행규칙[별표1] 항목과 연결]이면 목록에서 맞는 항목을 고르고, 단지에만 있는 항목은 [단지 항목으로 등록]을 누릅니다."
      target: null
      image: ltrp-onboard-03.png
      note: "맨 아래 띠의 숫자(예: 10 / 51)가 확인한 수입니다. [남은 건으로 이동]을 누르면 아직 안 한 줄로 갑니다."
    - no: 6
      action: 모두 확인했으면 맨 아래 [확인한 대로 저장]을 클릭합니다.
      target: null
      image: null
      note: "저장 결과에 계획 회차 번호, 공사종별 수, 함께 가져온 계획 기준값(평형·계획기간·적립 구간), 단지정보에 채운 칸이 나옵니다. (이 단계는 실제로 저장되므로 매뉴얼 캡처가 없습니다)"
    - no: 7
      action: 내용을 확인하고 [✓ 개통 완료]를 클릭합니다.
      target: null
      image: null
      note: 완료하면 지금 내용이 '개통 직후 원본'으로 보관되고, 이후 수정은 [조정안 작성 › 검토서]에서 합니다.

  errors_and_fixes:
    - case: 산출오류(금액 없음)
      desc: 원본 엑셀의 수식이 깨져(#REF! 등) 금액을 못 읽은 줄입니다. 그대로 저장해도 되고, 개통 뒤 [검토서]의 [산출오류만 보기]로 골라 금액을 넣습니다. 금액을 넣어야 총괄표 합계에 들어갑니다.
    - case: 같은 항목이 여러 줄
      desc: 계획서에 같은 공사종별이 두 줄 이상 있으면 묶어서 보여 줍니다. 기본은 [N줄 그대로 등록](권장)이고, [한 줄만 남기기]를 고르면 나머지 줄은 저장되지 않습니다.
    - case: 조정일자 때문에 저장이 안 됨
      desc: 맨 아래 [조정일자 넣기]를 누르면 그 칸으로 이동합니다. 여덟 자리 숫자로 넣으세요.

  cautions:
    - "개통 화면에서는 항목을 뺄 수 없습니다. 빼려면 개통 후 [조정안 작성 › 검토서]에서 [항목 삭제]로 처리하세요."
    - "잘못 개통했으면 [조정 이력]의 그 회차 [회차 삭제]로 되돌립니다. 개통 때 만든 단지 전용 공사종별과 계획 기준값이 함께 지워지고, 확인창에서 고르면 단지정보에 채운 칸도 다시 비웁니다. 마감한 회차는 지울 수 없습니다."
    - "저장은 지금 선택된 단지에 됩니다. 여러 단지를 관리한다면 저장 전에 왼쪽 위 단지명을 꼭 확인하세요."

  faq:
    - q: 엑셀이 없고 종이 계획서만 있습니다.
      a: "[직접 한 줄씩]의 [＋ 항목 추가]로 분야·구분·공사종별·수선방법을 고르고, 계획서에 적힌 수선주기·수선율·수선예정액·수선기준년도를 그대로 넣습니다. 연간적립액과 수선 예정 연도는 자동으로 계산됩니다."
    - q: 엑셀을 올렸는데 '검토서 시트가 맞는지 확인해 주세요'라고 나옵니다.
      a: 시스템은 계획서 안의 「검토서」 시트를 읽습니다. 시트 이름이 다르거나 검토서가 없는 파일이면 읽지 못합니다. 검토 업체에 검토서 시트가 있는 원본 엑셀을 요청하세요.
    - q: 개통하면 단지정보도 바뀌나요?
      a: 비어 있던 칸만 계획서 값으로 채워집니다. 이미 값이 있는 칸은 그대로입니다. 저장 결과 화면에 채운 칸 목록이 나옵니다.
    - q: 예전 조정본도 넣을 수 있나요?
      a: 네. 개통을 여러 번 하면 조정일자 순서대로 조정 이력에 들어갑니다. 더 늦은 계획이 이미 있으면 '지금 계획'은 바뀌지 않습니다.

---

- screen_id: ltrp-history
  screen_name: 조정 이력
  path: 장기수선계획 > 조정 이력
  pattern: A
  permission: 장기수선계획 › 조정 이력
  purpose: 지금 계획의 핵심 숫자와 지금까지의 조정 회차를 한눈에 보고, 개통·조정을 시작한다

  key_concept: >
    장기수선계획 메뉴의 **출발점**이다. 위쪽 네 칸에 지금 계획의 요약이, 아래 표에 정기·수시조정 회차가 시간순으로 나온다.
    새로 무엇을 하든(개통·정기조정·수시조정) 여기 있는 버튼으로 시작한다.

  top_summary:
    - card: 계획기간 총수선금액
      desc: 계획기간(예 2018~2067 · 588개월) 동안의 수선비 총액.
    - card: 연간 적립예정액
      desc: 해마다 적립해야 하는 금액과 월 환산액.
    - card: ㎡당 월 적립금
      desc: 지금 구간 → 다음 구간 적립금. 평형별 세대당 금액도 함께 보입니다.
    - card: 3년 이내 공사
      desc: 조정일이 속한 해부터 3년 동안 수선 예정 연도가 드는 공사의 합계와 연도별 금액.

  main_buttons:
    - button: "[전기 계획 개통]"
      desc: 기존 계획서를 옮겨 담습니다. 처음 한 번. [전기 계획 개통] 안내를 보세요.
    - button: "[조정 전·후 대비표]"
      desc: 조정 전 계획과 조정안을 항목별로 비교한 표. 입주자대표회의 의결 안건 첨부서류로 씁니다.
    - button: "[수시조정 등록]"
      desc: 3년 주기 사이에 특정 항목만 바꿀 때. 전체 입주자 과반수 서면동의가 필요합니다.
    - button: "[정기조정안 작성]"
      desc: 3년마다 하는 정기조정을 시작합니다. 조정안 작성 6단계로 이어집니다.

  columns: [조정일, 구분, 내용, 조정 항목수, 문서, 회차 되돌리기]

  screen_specific:
    - name: 회차 되돌리기 — [검토서 초기화]
      desc: 그 회차의 검토서를 개통 직후 상태로 되돌립니다. 검토서에서 고친 값·검토결과가 모두 지워지고, 단지 기본정보·총론·공사종별 설정은 남습니다.
    - name: 회차 되돌리기 — [회차 삭제]
      desc: 그 회차를 완전히 지웁니다. 개통을 잘못했을 때 씁니다. 마감한 회차와 지출품의·계약이 걸린 회차는 지울 수 없습니다.
    - name: 산출오류 알림
      desc: 금액이 비어 있는 항목이 있으면 빨간 띠로 알려 줍니다. [오류 항목만 보기]를 누르면 검토서에서 그 항목만 걸러 봅니다.

  steps:
    - no: 1
      action: 상단 [장기수선계획]을 클릭합니다. 첫 화면이 [조정 이력]입니다.
      target: nav:장기수선계획 > 조정 이력
      image: ltrp-history-01.png
      note: 위쪽 네 칸에서 지금 계획의 숫자를, 아래 표에서 회차를 봅니다.
    - no: 2
      action: 할 일에 맞는 버튼을 누릅니다. 3년마다 하는 조정이면 [정기조정안 작성], 특정 항목만이면 [수시조정 등록].
      target: null
      image: null
      note: null

  cautions:
    - "[검토서 초기화]·[회차 삭제]는 되돌릴 수 없습니다. 확인창 내용을 꼭 읽고 누르세요."
    - "다음 정기조정은 조정한 달 기준 3년 뒤 같은 달까지입니다(예 2025.12 조정 → 2028.12까지, 2029.01은 늦음)."

  faq:
    - q: 정기조정과 수시조정 중 무엇을 해야 하나요?
      a: 3년 주기 조정이면 정기조정(입주자대표회의 의결), 그 사이에 특정 공사만 당겨야 하면 수시조정(전체 입주자 과반수 서면동의)입니다. 수시조정은 세대 부과액을 바꾸지 않고 돈을 쓸 근거만 남깁니다.

---

- screen_id: ltrp-adhoc
  screen_name: 수시조정 등록
  path: 장기수선계획 > 조정 이력 > [수시조정 등록]
  pattern: B
  permission: 장기수선계획 › 조정 이력 (등록·관리)
  purpose: 3년 주기 사이에 특정 항목만 바꾸고, 그 근거(서면동의)를 남긴다

  key_concept: >
    수시조정은 **검토서를 바꾸지 않는다.** 세대 부과액도 그대로다. 대신 "이 공사를 이 해에 이 금액으로 한다"는 **집행 근거**를 남겨,
    지출품의에서 그 근거로 돈을 쓸 수 있게 한다. 다음 정기조정 때 검토서에 반영한다.

  fields:
    - name: 조정일
      required: true
      desc: 서면동의를 받아 조정한 날짜.
    - name: 조정 성격
      required: true
      desc: 계획 변경 / 항목 신설 / 항목 삭제.
    - name: 시설명(구분) · 공사종별 · 수선방법
