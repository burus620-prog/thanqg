- screen_id: ltrp-rules
  screen_name: 총론(긴급·소액지출 등)
  path: 장기수선계획 > 조정안 작성 > 총론(긴급·소액지출 등)
  pattern: B
  permission: 장기수선계획 › 조정안 작성
  purpose: 수선 예정 연도가 아닐 때도 장기수선충당금을 쓸 수 있는 경우(예외지출)를 단지가 미리 정해 둔다

  why_first: >
    수선 예정 연도를 벗어나 장기수선충당금을 쓰면(앞당기든 늦추든) **1천만원 이하의 과태료** 대상이 될 수 있다(공동주택관리법 제102조 제2항).
    법령에 구체적 기준이 없으므로 **총론에 적어 둔 것만이 집행 근거**가 된다. 여기서 정한 요건이 그대로
    **시설보수 지출품의의 선택지와 자동 검증 규칙**이 된다. 총론이 비어 있으면 지출품의에서 예외지출을 고를 수 없다.

  four_kinds:
    - kind: 1. 긴급공사
      desc: 금액 무관. 미조치 시 생활을 영위할 수 없는 수준(승강기 정지·단수·정전·물탱크 고장 등). 입찰에 부칠 여유가 없을 때.
    - kind: 2. 소액지출
      desc: 긴급하지는 않지만 금액이 작아 수선 예정 연도를 기다리기 어려운 경우의 기준 금액·범위.
    - kind: 3. 부대비용
      desc: 감리비·설계비·장기수선계획 검토조정비처럼 시설 공사가 아닌 비용.
    - kind: 4. 기타
      desc: 단지가 따로 정하는 경우. 권장안이 없으므로 직접 적습니다.

  steps:
    - no: 1
      action: "[조정안 작성 › 총론(긴급·소액지출 등)]을 클릭합니다."
      target: url:/ltrpnew/draft/APGN000003
      image: ltrp-rules-01.png
      note: 처음이면 '아직 총론이 비어 있습니다'가 보입니다.
    - no: 2
      action: "[↧ 실무 가이드라인 권장안 불러오기]를 클릭합니다."
      target: null
      image: null
      note: 권장안 25줄(긴급공사 13 · 소액지출 6 · 부대비용 6)이 한 번에 들어옵니다.
    - no: 3
      action: 불러온 요건을 단지 사정에 맞게 고치고, 안 쓸 줄은 꺼 두고, 필요하면 [＋ 요건 추가]로 더합니다.
      target: null
      image: null
      note: 총론은 입주자대표회의 의결 대상입니다. 의결 전에 내용을 확정하세요.

  cautions:
    - "권장안은 2025 장기수선계획 실무 가이드라인의 예시입니다. 단지 관리규약·의결 내용과 다르면 고쳐 쓰세요."

