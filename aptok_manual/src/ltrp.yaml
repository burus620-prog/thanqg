- screen_id: ltrp-worktype
  screen_name: 공사종별 설정
  path: 장기수선계획 > 시설 관리 > 공사종별 설정
  pattern: E
  permission: 장기수선계획 › 시설 관리
  purpose: 이 단지가 쓰는 공사종별과 기본 수선주기·수선율을 관리한다

  key_concept: >
    공사종별의 값은 **세 단계**로 보인다 — ① 시행규칙[별표1] 기준(수정 불가) ② **이 단지가 쓰는 값**(여기서 편집) ③ 검토서 확정값(입대의 의결, 참조만).
    이 단지가 쓰는 값은 개통과 정기조정 마감 때 확정값으로 갱신된다. 여기서 고쳐도 **이미 확정된 검토서 값은 바뀌지 않는다** —
    반영하려면 검토서에서 조정하고 정기조정으로 확정해야 한다.

  screen_specific:
    - name: 왼쪽 분야 트리
      desc: 7개 분야(건물외부·건물내부·전기·소화·승강기…·피난시설)와 구분. 구분을 고르면 오른쪽에 공사종별이 나옵니다. [추가]로 구분·공사종별을 더합니다.
    - name: "[⭯ 이 항목 시행규칙[별표1] 기본값으로] / [⭯ 전체 초기화]"
      desc: 이 단지 값을 법정 기준으로 되돌립니다.
    - name: 지출품의에서 들어온 항목
      desc: 시설보수 지출품의에서 '＋ 직접 입력'으로 넣은 구분·공사종별은 결재가 끝나면 여기에 자동으로 추가됩니다. 수선주기·수선율이 비어 있으니 채워 주세요.

  steps:
    - no: 1
      action: "[시설 관리 › 공사종별 설정]을 클릭합니다."
      target: url:/ltrpnew/facility/APGN000011
      image: ltrp-worktype-01.png
      note: null
    - no: 2
      action: 왼쪽에서 구분을 고르고 공사종별의 주기·수선율을 확인·수정한 뒤 [저장]을 누릅니다.
      target: null
      image: null
      note: 비어 있는 공사종별이 있으면 그 항목을 지정한 시설에 수선기준이 붙지 않습니다.

