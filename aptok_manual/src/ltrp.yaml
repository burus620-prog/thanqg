- screen_id: ltrp-ledger
  screen_name: 장기수선계획 시설대장
  path: 장기수선계획 > 시설 관리 > 장기수선계획 시설대장
  pattern: A
  permission: 장기수선계획 › 시설 관리
  purpose: 확정된 장기수선계획의 공사종별마다 수선기준과 수선이력을 모아 본다

  key_concept: >
    지금 확정된 계획의 **공사종별 하나당 한 줄**이다. 시설 하나하나는 세부 시설대장에서 보고, 여기서는 공사종별 단위로 모아 본다.
    수선이력에는 결재가 끝난 지출품의(예산과목 무관)와 옛 수선이력 대장이 함께 모인다.
    **확정된(마감한) 회차가 있어야** 줄이 나온다.

  top_summary:
    - card: 공사종별
      desc: 현재 회차 검토서 기준 수. 누르면 전체.
    - card: 수선이력 보유
      desc: 결재가 끝난 지출품의가 있는 공사종별. 누르면 골라 보기.
    - card: 수선예정 2년 이내
      desc: 수선기준년도 + 수선주기 기준.
    - card: 누적 투입비
      desc: 품의 하나가 여러 공사종별에 걸쳐도 한 번만 셉니다.

  columns: [관리번호, 분야 › 구분, 공사종별, 세부시설 수, 수선 예정 연도, 누적 투입비, 최근 이력]

  steps:
    - no: 1
      action: "[시설 관리 › 장기수선계획 시설대장]을 클릭합니다."
      target: url:/ltrpnew/facility/APGN000021
      image: ltrp-ledger-01.png
      note: 줄을 누르면 그 공사종별의 수선기준과 수선이력이 열립니다. 표 머리를 누르면 정렬됩니다.

  faq:
    - q: 표가 비어 있습니다.
      a: 확정(마감)된 장기수선계획 회차가 있어야 나옵니다. 조정안 작성에서 마감하면 공사종별이 나옵니다.

---

- screen_id: ltrp-facility
  screen_name: 세부 시설대장
  path: 장기수선계획 > 시설 관리 > 세부 시설대장
  pattern: A
  permission: 장기수선계획 › 시설 관리
  purpose: 시설 하나하나(예 101동 1호기 승강기)를 등록하고 수선이력을 관리한다

  key_concept: >
    **분야 › 구분 › 시설명**은 꼭 적고, 공사종별은 골라도 되고 안 골라도 된다. 공사종별을 고르면 검토서의 수선기준(주기·수선율·금액)이 시설에 자동으로 붙는다.
    수선이력에는 결재가 끝난 장기수선충당금 지출과 점검·민원 처리 건이 날짜별로 쌓인다. 자산관리와 **같은 대장**을 보므로 두 번 입력할 필요가 없다.

  top_summary:
    - card: 등록 시설
      desc: 등록한 시설 수와 분야 수.
    - card: 수선이력 보유
      desc: 이력이 있는 시설 / 없는 시설.
    - card: 수선예정 2년 이내
      desc: 곧 공사 시기가 되는 시설.
    - card: 수선기준 미연결
      desc: 검토서에 대응 항목이 없는 시설. 공사종별을 지정해 주세요.

  columns: [관리번호, 시설구분, 공사종별, 시설명, 위치, 설치일, 수선이력, 수선 예정 연도]

  sub_flows:
    - name: 시설추가
      steps:
        - no: 1
          action: 오른쪽 위 [시설추가]를 클릭합니다.
          image: ltrp-facility-02.png
        - no: 2
          action: 분야·구분·시설명을 넣습니다. 관리번호는 분야코드 + 일련번호로 자동 채번됩니다.
          note: 동·호기가 여러 개면 아래 '동·호기 일괄 등록'으로 한 번에 만듭니다.
        - no: 3
          action: 공사종별을 고르면 '수선기준 미리보기'에 검토서 값이 보입니다. 위치·설치일·구매가격·보증만료일을 넣고 [✓ 등록]을 누릅니다.
          note: 보증기간 안의 고장은 장기수선충당금이 아니라 하자보수로 처리합니다.
    - name: 시설 상세 · 수선이력
      steps:
        - no: 1
          action: 목록에서 시설 줄을 누릅니다.
          image: ltrp-facility-03.png
          note: 수선기준(검토서 자동 연결), 수선이력(표·타임라인), 누적 투입비, 점검·민원 이력이 나옵니다. 사진을 올리고 대표 사진을 지정할 수 있습니다.
        - no: 2
          action: 옛 공사 기록은 [＋ 이력 직접 등록]으로 넣습니다. 지출품의로 결재된 건은 자동으로 들어옵니다.
          note: 품의서 번호를 누르면 그 지출품의로 갑니다. [🖨 인쇄]로 시설 이력카드를 뽑습니다.

  screen_specific:
    - name: 선택 후 일괄 작업
      desc: 체크한 시설에 [공사종별 지정](더하기 / 바꾸기), [삭제], [⭳ 엑셀].
    - name: 사용 중인 시설 / 삭제한 시설
      desc: 지운 시설은 '삭제한 시설'에서 [되살리기]. [완전 삭제]는 되돌릴 수 없고, 수선이력·계약·자산 기록이 있는 시설은 지워지지 않습니다.

  steps:
    - no: 1
      action: "[시설 관리 › 세부 시설대장]을 클릭합니다."
      target: url:/ltrpnew/facility/APGN000009
      image: ltrp-facility-01.png
      note: null

