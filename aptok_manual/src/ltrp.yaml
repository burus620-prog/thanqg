- screen_id: ltrp-usage
  screen_name: 적립·사용현황
  path: 장기수선계획 > 적립·사용현황
  pattern: C
  permission: 장기수선계획 › 적립·사용현황
  purpose: 공동주택관리규약 준칙 서식(별지 제20호)으로 장기수선충당금 적립·사용 현황을 만들어 게시·보고한다

  key_concept: |
    서식의 노란 칸(① 수선비 총액 · ③ 사용금액 · ③ 사용내역)은 **시스템이 채운다.** ①은 총괄표에서,
    ③은 시설보수 지출품의 중 **장기수선충당금으로 집행되어 결재가 끝난 건**에서 가져온다.
    ② 적립은 실제 부과·징수 금액이라 시스템에 없으므로, 아래 **② 적립내역**에 직접 적는다. **금액을 적는 곳은 여기 한 곳뿐이다.**

  steps:
    - no: 1
      action: "[적립·사용현황]을 클릭하고 위에서 연도(기준일)를 고릅니다."
      target: url:/ltrpnew/usage/APGN000007
      image: ltrp-usage-01.png
      note: null
    - no: 2
      action: 처음이면 '전년도 누계를 확인해 주세요' 안내에서 전년도 적립 누계와 사용 누계를 넣거나, [적립한 적 없음(0원 확인)]을 누릅니다.
      target: null
      image: null
      note: 찾는 곳 — 관리비 회계의 장기수선충당금 계정 누계, 또는 전년도 결산서의 장기수선충당금 명세.
    - no: 3
      action: "② 적립내역에 월별 적립액(이자수입 포함)을 적고 [💾 저장]을 누른 뒤 [🖨 인쇄]합니다."
      target: null
      image: null
      note: ④ 잔액과 ⑤ 적립 필요액이 자동으로 계산됩니다.

  cautions:
    - "전년도 누계를 비워 둔 채 저장하면 ④ 잔액과 ⑤ 적립 필요액이 실제와 달라집니다."
    - "③ 사용내역에는 결재가 끝난 장기수선충당금 지출품의만 들어갑니다. 수선비 등 다른 예산과목은 들어가지 않습니다."

