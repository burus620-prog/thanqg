  key_concept: >
    총괄표는 **검토서와 단지 기본정보로 계산만** 하는 화면이다(따로 저장하지 않는다). 분야별 월간·연간·계획기간 적립예정액과
    **㎡당 월 적립금 산출식**(공동주택관리법 시행령 제31조 제3항)이 나온다. 검토가 끝나지 않았으면 '잠정치'로 표시된다.
    입주자대표회의 의결이 끝나면 이 화면의 **[🔒 마감]**으로 조정안을 확정한다.

  screen_specific:
    - name: 계획서에 실을 구간
      desc: 관리규약의 적립 구간 중 계획서에 인쇄할 구간을 고릅니다. 지금 구간과 다음 구간이 미리 골라져 있습니다. 화면의 표와 합계는 바뀌지 않습니다.
    - name: "[🖨 검토서 인쇄] / [계획서 인쇄]"
      desc: 마감 전에는 의결용 '장기수선계획 조정안 검토서', 마감 후에는 확정 '장기수선계획서'를 표지·단지 기본정보·총괄표·총론·검토서·3년 이내 공사까지 한 부로 묶어 냅니다.
    - name: 마감 전 확인
      desc: 마감 조건을 한 줄씩 점검합니다. ! 표시가 있으면 마감 버튼이 잠깁니다.

  close_flow: >
    **마감할 때 넣는 것** — 조정일(의결일 기준으로 확정), 의결 구분, 의결일, 찬성 수 / 전체 수.
    '공사종별 설정값도 이 계획으로 맞춥니다'에 체크하면 공사종별 설정의 주기·수선율이 확정값으로 갱신된다.
    마감하면 검토서·단지 기본정보가 잠기고 조정 이력에 기록되며, 다음 정기조정 기한(3년 뒤 같은 달)이 정해진다.
    잘못 마감했으면 **관리소장**이 [🔓 마감 해제]로 되돌릴 수 있다(본인 비밀번호 확인, 의결 기록은 남음).

  steps:
    - no: 1
      action: "[조정안 작성 › 총괄표]를 클릭합니다."
      target: url:/ltrpnew/draft/APGN000005
      image: ltrp-summary-01.png
      note: 검토가 덜 끝났으면 위쪽에 '아직 마감할 수 없습니다' 안내와 잠정치 표시가 나옵니다.
    - no: 2
      action: 적립예정액과 ㎡당 월 적립금을 확인하고 [🖨 검토서 인쇄]로 의결 자료를 뽑습니다.
      target: null
      image: null
      note: 조정 전·후 대비표도 함께 첨부하세요.
    - no: 3
      action: 입주자대표회의 의결이 끝나면 [🔒 마감 (정기조정 확정)]을 누르고 의결 내용을 넣은 뒤 [🔒 마감 확정]을 누릅니다.
      target: null
      image: null
      note: (실제 확정이라 매뉴얼 캡처가 없습니다)

  cautions:
    - "마감은 의결이 끝난 뒤에 하세요. 마감하면 검토서·단지 기본정보를 고칠 수 없습니다."
    - "마감 해제는 관리소장만 할 수 있고 본인 비밀번호를 다시 확인합니다."

