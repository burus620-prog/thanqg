- screen_id: ltrp-review
  screen_name: 검토서
  path: 장기수선계획 > 조정안 작성 > 검토서
  pattern: E
  permission: 장기수선계획 › 조정안 작성
  purpose: 수선항목마다 주기·수선율·금액·기준년도를 검토해 이번 조정안의 값을 정한다

  key_concept: >
    조정안의 **핵심 화면**이다. 입력하는 값은 네 가지뿐 — **수선예정액·수선주기·수선율·수선기준년도**.
    연간적립액(= 수선예정액 ÷ 수선주기)과 수선 예정 연도(= 수선기준년도 + 수선주기)는 바로 계산된다.
    고친 줄은 노란색이 되고, 줄을 누르면 **검토창**이 열린다. 검토결과와 검토내역(사유)을 남겨야 그 항목이 '검토 완료'된다.

  top_summary:
    - card: 수선예정액 합계
      desc: 1주기 기준 합계(산출오류 항목 제외).
    - card: 연간적립액 합계
      desc: 총괄표로 넘어가는 값.
    - card: 조정 필요
      desc: 주기·예정 연도·방법·항목을 손봐야 하는 항목 수(오류 포함).
    - card: 산출오류
      desc: 금액이 비어 있는 항목 수. 금액을 넣어야 합계에 들어갑니다.

  screen_specific:
    - name: 걸러 보기
      desc: 분야(1~7), 검토결과(기존유지·수선주기 조정 등 8가지), 검토상태(미검토·보류·검토완료·수정한 항목)로 좁혀 봅니다.
    - name: 수선 예정 연도 막대
      desc: 해마다 공사비가 얼마나 몰리는지 막대로 보입니다. 막대를 누르면 그 해 항목만 봅니다(여러 해 함께 선택 가능).
    - name: "[산출오류만 보기]"
      desc: 금액이 빠진 항목만 모아 봅니다.
    - name: "[선택 항목 기존유지 처리]"
      desc: 체크한 항목을 한 번에 '기존유지'로 검토 완료합니다.
    - name: "[사용기준 일괄 기재]"
      desc: 가이드라인의 장기수선충당금 사용기준을 검토내역에 한 번에 적어 넣습니다.
    - name: "[시행규칙[별표1] 열 표시]"
      desc: 법정 기준 주기·수선율 열을 켜서 계획값과 나란히 봅니다.
    - name: "[＋ 항목 추가] · [⭳ 엑셀]"
      desc: 새 항목을 넣거나 검토서를 엑셀로 내려받습니다.

  review_panel: >
    줄을 누르면 오른쪽에 검토창이 열린다. 위에는 **가이드라인 참조**(시행규칙[별표1] 기준 주기·수선율, 가이드라인 쪽수 [📖 쪽 열기])와
    **장기수선충당금 사용기준**(예 "전면수리의 최소단위: 동별")이 보이고, 아래에서 입력값을 고친다.
    **검토결과**는 여러 개를 고를 수 있다(기존유지 · 수선주기 조정 · 수선 예정 연도 조정 · 수선예정액 조정 · 수선방법·항목 변경 · 항목 추가 · 항목 삭제).
    **검토내역**에 왜 그렇게 정했는지 적고 [검토 완료]를 누른다. 판단이 서지 않으면 [보류]로 남겨 둔다.

  steps:
    - no: 1
      action: "[조정안 작성 › 검토서]를 클릭합니다."
      target: url:/ltrpnew/draft/APGN000004
      image: ltrp-review-01.png
      note: null
    - no: 2
      action: 산출오류가 있으면 먼저 [산출오류만 보기]로 골라 수선예정액을 넣습니다.
      target: null
      image: null
      note: null
    - no: 3
      action: 항목 줄을 누르면 검토창이 열립니다. 값을 고치고 검토결과를 고른 뒤 검토내역을 적고 [검토 완료]를 누릅니다.
      target: null
      image: ltrp-review-02.png
      note: 바꿀 것이 없는 항목은 여러 개 체크한 뒤 [선택 항목 기존유지 처리]로 한 번에 끝낼 수 있습니다.
    - no: 4
      action: 모든 항목이 검토 완료되면 [검토 완료 → 총괄표 산출]로 넘어갑니다.
      target: null
      image: null
      note: 미검토·보류가 남아 있으면 총괄표가 열리지 않습니다.

  cautions:
    - "검토서는 의결 전 조정안입니다. 입주자대표회의 의결 후 총괄표에서 마감해야 확정본이 됩니다."
    - "수선주기·수선율을 시행규칙[별표1]과 다르게 정할 때는 검토내역에 근거를 꼭 적으세요. 대비표의 [사유 미기재만]에 걸립니다."

  faq:
    - q: 기준년도를 바꾸면 무엇이 달라지나요?
      a: 수선 예정 연도(= 기준년도 + 주기)가 바뀝니다. 실제로 교체 공사를 한 해로 기준년도를 옮기면 다음 공사 예정 연도가 그만큼 뒤로 갑니다.

