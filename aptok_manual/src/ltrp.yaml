- screen_id: fac-expense-list
  screen_name: 시설보수 지출품의
  path: 전자결재 > 시설보수 지출품의
  pattern: A
  permission: 전자결재 › 시설보수 지출품의
  purpose: 시설 공사 비용(장기수선충당금·수선비 등)의 지출품의를 올리고 결재 상황을 본다

  key_concept: >
    여기서 올린 품의는 **전자결재 문서**가 된다. 결재선의 마지막 결재자까지 승인되어야 완료되고, 그때
    장기수선충당금이면 **적립·사용현황 ③ 사용내역**에, 모든 예산과목은 **시설 수선이력**에 올라간다.
    결재자 없이 등록하면 바로 완료된다. 한 명이라도 반려하면 집행으로 잡히지 않고, 아무도 결재하기 전에는 작성한 사람이 고칠 수 있다.

  columns: [번호, 예산과목, 제목, 금액, 업체명, 작성자, 기안일, 결재현황, K-apt 등록, 첨부]

  screen_specific:
    - name: 조회 조건
      desc: 상태(작성중·진행중·반려·회수·승인완료), 예산과목(장기수선충당금 외 8종), K-apt 등록 여부, 기간.
    - name: K-apt 등록
      desc: 공동주택관리정보시스템(K-apt)에 등록했는지 표시합니다.
    - name: 반려·회수된 품의
      desc: 작성한 사람만 고쳐서 다시 올릴 수 있습니다. 결재자가 아무도 처리하지 않았으면 같은 품의번호로 수정됩니다.

  steps:
    - no: 1
      action: 상단 [전자결재]를 클릭한 뒤 왼쪽 [시설보수 지출품의]를 클릭합니다.
      target: url:/ltrpnew/usage/APGN000008
      image: fac-expense-list-01.png
      note: 새 품의는 오른쪽 [작성]을 누릅니다. [시설보수 지출품의 작성] 안내를 보세요.

---

- screen_id: fac-expense-form
  screen_name: 시설보수 지출품의 작성
  path: 전자결재 > 시설보수 지출품의 > [작성]
  pattern: B
  permission: 전자결재 › 시설보수 지출품의 (등록)
  purpose: 공사 대상·예산과목·지출 근거·금액을 정해 지출품의를 상신한다

  key_concept: >
    작성 화면은 **다섯 칸**을 위에서 아래로 채운다 — ① 문서 정보 → ② 공사 대상 → ③ 예산과목·근거 → ④ 금액 → ⑤ 품의 내용·상신.
    오른쪽 **'상신 전 확인'**에 빨간 줄이 있으면 상신할 수 없고, 노란 줄은 확인만 하면 된다.
    장기수선충당금이면 반드시 **계획 또는 총론의 근거**를 골라야 한다.

  sections:
    - section: ① 문서 정보
      desc: 전자결재 기안과 같은 항목 — 결재선(결재자 지정·순서), 기안일자, 보존기한(5·10·20년·영구), 제목. 결재자가 없으면 등록 즉시 완료됩니다.
    - section: ② 공사 대상
      desc: "[시설 공사](항목 구분·세부시설 선택) 또는 [부대비용·기타](감리비·설계비·검토조정비 등 시설 공사 없음). 계약이 있으면 [계약현황에서 불러오기](유형 '공사', 재원 '장기수선충당금' 계약만), 없으면 [공사 내용 직접 입력]."
    - section: ③ 예산과목 · 지출 근거
      desc: 장기수선충당금 / 이외 과목(수선비·하자보수보증금·하자보수비·시(군)지원금·한전지원금·판결금·합의(보상)금·기타). 장기수선충당금이면 지출유형을 고릅니다 — 수선 예정 연도가 된 항목은 [계획집행], 그 밖에는 [예외지출](긴급공사·소액지출·부대비용·기타, 총론에 근거가 있어야 고를 수 있음).
    - section: ④ 금액
      desc: 이번 요청액, 공급가액·부가세, 공제(하자보수보증금 유보·지체상금·기타), 지급 예정일·회계월. 실지급액이 자동 계산됩니다.
    - section: ⑤ 품의 내용 · 상신
      desc: 위에서 고른 내용으로 본문 초안이 채워집니다. 첨부 서류(견적서·계약서·세금계산서·입대의 회의록·준공 확인서·긴급공사 사유서 등)와 공사 전·후 사진(사진함)을 붙입니다.

  steps:
    - no: 1
      action: "[시설보수 지출품의] 목록에서 [작성]을 클릭합니다."
      target: url:/ltrpnew/usage/APGN000008?write=1
      image: fac-expense-form-01.png
      note: 위쪽에 다섯 칸 진행 표시, 오른쪽에 집행 귀속·금액 요약·상신 전 확인이 보입니다.
    - no: 2
      action: ① 결재선과 제목을 정하고, ② 공사 대상을 고릅니다.
      target: null
      image: null
      note: 세부시설을 먼저 고르면 항목 구분이 자동으로 채워집니다.
    - no: 3
      action: ③ 예산과목과 지출유형(계획집행 / 예외지출)을 고릅니다.
      target: null
      image: null
      note: "'총론에 근거가 없어 고를 수 없습니다'가 나오면 [장기수선계획 › 총론]에서 근거부터 넣으세요."
    - no: 4
      action: ④ 금액을 넣고, ⑤ 본문을 확인한 뒤 서류와 사진을 붙입니다.
      target: null
      image: fac-expense-form-02.png
      note: 오른쪽 '이 품의에 권장하는 서류'에 빠진 것이 표시됩니다.
    - no: 5
      action: 오른쪽 '상신 전 확인'에 빨간 줄이 없으면 [등록]을 누릅니다. 나중에 이어서 쓰려면 [임시저장].
      target: null
      image: null
      note: (실제 상신이라 매뉴얼 캡처가 없습니다)

  cautions:
    - "결재자를 지정하지 않으면 등록하는 순간 완료되어 적립·사용현황과 수선이력에 바로 반영됩니다."
    - "수선 예정 연도가 아닌데 [계획집행]으로 올리면 안 됩니다. 예외지출로 올리고 총론의 근거를 고르세요."

  faq:
    - q: 계약현황에서 불러올 계약이 없다고 나옵니다.
      a: 계약현황에 유형 '공사', 재원 '장기수선충당금'으로 등록된 계약만 나옵니다. 계약이 없으면 [공사 내용 직접 입력]을 쓰세요.
    - q: 트리에 없는 공사종별이라 고를 수 없습니다.
      a: "'＋ 직접 입력'으로 넣으면 됩니다. 결재가 끝나면 공사종별 설정에 자동으로 추가되니, 그 뒤 수선주기·수선율을 채워 주세요."
