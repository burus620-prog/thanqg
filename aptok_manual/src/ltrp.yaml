- screen_id: ltrp-info
  screen_name: 단지 기본정보
  path: 장기수선계획 > 조정안 작성 > 단지 기본정보
  pattern: B
  permission: 장기수선계획 › 조정안 작성
  purpose: 장기수선계획서에 실릴 단지 개요와 총괄표 계산의 전제값(평형·세대수·계획기간·적립 구간)을 정한다

  key_concept: >
    조정안 작성 **1단계**다. 여기 값은 장기수선계획서 표지·개요에 그대로 실리고, **세대수 및 관리면적**과
    **구간별 적립금**은 총괄표의 ㎡당 적립금 계산에 쓰인다. 값은 단지정보 → 전기 계획서 순으로 가져오고, 빈 칸은 직접 넣는다.
    **여기서 고쳐도 단지정보는 바뀌지 않는다.**

  progress_bar: >
    조정안 작성의 모든 화면 위에 6칸 진행표가 있다 — 01 단지 기본정보 · 02 총론 · 03 검토서 · 04 총괄표 · 05 3년 이내 공사 · 06 마감.
    칸마다 '완료 / 해야 함 / 진행중 / 잠김'과 남은 일(예 "82건 중 82건 미검토")이 보인다. 잠긴 칸은 앞 단계를 끝내야 열린다.

  sections:
    - section: 이번 조정안
      desc: 조정 예정일. 3년 이내 공사의 기준이 되며, 마감할 때 입주자대표회의 의결일로 다시 확정합니다.
    - section: 단지 개요
      desc: 공동주택명·시공사·사용검사일·동수·세대수 등. 칸 옆에 값의 출처(단지정보 / 전기 계획서)가 작게 보입니다. [전부 단지정보 값으로]로 한 번에 맞출 수 있습니다.
    - section: 건축 개요
      desc: 대지면적·연면적·용적률 등. 어느 칸이든 고칠 수 있습니다.
    - section: 세대수 및 관리면적
      desc: 평형(타입)별 공급면적과 세대수. 총 주택공급면적 = Σ(공급면적 × 세대수)가 총괄표 ㎡당 적립금의 분모가 됩니다. [＋ 평형 추가]
    - section: 관리규약에 따른 구간별 적립금
      desc: 관리규약(제66조)에 정한 기간별 적립률. 총괄표의 산출식이 이 구간을 씁니다.

  steps:
    - no: 1
      action: "[조정안 작성 › 단지 기본정보]를 클릭합니다."
      target: url:/ltrpnew/draft/APGN000002
      image: ltrp-info-01.png
      note: 칸을 고치면 '저장됨 ✓'이 바로 표시됩니다.
    - no: 2
      action: 평형이 비어 있으면 [＋ 평형 추가]로 타입·공급면적·세대수를 넣습니다.
      target: null
      image: null
      note: 평형이 없으면 총괄표의 ㎡당 적립금을 낼 수 없습니다.
    - no: 3
      action: "위쪽 [다음: 총론 →]으로 넘어갑니다."
      target: null
      image: null
      note: null

