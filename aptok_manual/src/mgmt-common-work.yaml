# 아파트ok 사용자 매뉴얼 원본 — 관리업무 > 공용업무 
# 패턴 A 표준 예시. 목록 화면 35개가 이 문서의 구조를 복제한다. 

- screen_id: mgmt-common-work-list
  screen_name: 공용업무 — 목록
  path: 민원관리 > 공용업무
  pattern: A
  inherits: pattern-a                 # 공통 사용법은 _pattern-a.yaml 참조
  permission: 관리업무 > 열람
  purpose: >
    단지 전체에 해당하는 업무를 접수하고, 누가 언제 처리했는지 남긴다.
    세대 한 곳의 일은 [세대업무]에, 단지 공용부의 일은 여기에 기록한다.
  legal_basis: null
  deadline: null

  columns:                            # 표에 보이는 항목
    - 접수일시
    - 분류
    - 업무내용
    - 처리내용
    - 접수자
    - 처리일시
    - 담당자
    - 상태
    - 첨부

  screen_specific:                    # 이 화면에만 있는 버튼 (공통 외)
    - name: 공용업무 통계보기
      desc: 접수·처리 건수를 집계해 보여줍니다.
    - name: 분류 설정 / 특별분류 설정
      desc: >
        업무를 나누는 기준을 단지 사정에 맞게 직접 만듭니다.
        처음 도입할 때 이것부터 정해두면 나중에 통계가 의미 있게 나옵니다.
    - name: 일일업무보고
      desc: >
        체크한 민원을 **일일일지 작성 화면으로 그대로 넘깁니다.**
        전자결재 > 일일보고 > 일일일지가 열리면서 고른 민원이 표에 들어가 있습니다.
        자세한 방법은 [민원을 일일일지로 바로 올리기] 문서를 참고하세요.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 왼쪽 목록에서 [공용업무]를 클릭합니다.
      target: nav:민원관리 > side:공용업무
      image: mgmt-common-work-list-01.png
      note: null
    - no: 2
      action: 기본으로 최근 접수 건이 위에 오는 목록이 나옵니다.
      target: table:목록
      image: null
      note: 검색·기간·상태 필터 사용법은 [목록 화면 공통 사용법]을 참고하세요.

  moved_notice: >
    2026년 8월 31일부터 이 화면은 [관리업무]가 아니라 **[민원관리]** 아래로 옮겨졌다.
    기존 자료는 그대로이며 문서번호와 검색 결과도 동일하다.

  faq:
    - q: 세대업무와 뭐가 다른가요?
      a: 단지 공용부에 해당하는 일은 공용업무, 특정 세대의 일은 세대업무에 기록합니다.
    - q: 관리업무에 있던 공용업무가 안 보입니다.
      a: >
        2026년 8월 31일부터 [민원관리] 메뉴로 옮겨졌습니다.
        상단 메뉴 맨 앞에 있습니다. 자료는 그대로입니다.
    - q: 분류를 우리 단지에 맞게 바꾸고 싶습니다.
      a: 툴바의 [분류 설정]에서 항목을 직접 추가합니다.
    - q: 오늘 처리한 업무를 일지에 넣으려면?
      a: >
        목록에서 체크하고 [일일업무보고]를 누르면 일일일지 작성 화면으로 넘어갑니다.
        고른 업무가 이미 들어가 있어 옮겨 적을 필요가 없습니다.

---

- screen_id: mgmt-common-work-form
  screen_name: 공용업무 — 등록 / 처리
  path: 민원관리 > 공용업무 > [등록]
  pattern: B
  permission: 관리업무 > 등록
  purpose: 업무를 새로 접수하거나, 접수된 업무의 처리 결과를 기록한다.

  key_concept: >
    이 화면은 한 장이지만 쓰는 시점이 둘이다.
    ① 접수할 때 — 분류·업무 내용·담당자까지 채운다.
    ② 처리한 뒤 — 같은 건을 다시 열어 처리일시와 처리내용을 채우고 상태를 바꾼다.
    처음 등록할 때 아래쪽 처리 항목을 비워두는 것은 정상이다.

  fields:
    - name: 분류
      type: 드롭다운
      required: true
      desc: 미분류 / 공용 / 세대 / 사건사고 / 외주 등. 툴바의 [분류 설정]에서 항목을 관리합니다.
    - name: 특별분류
      type: 드롭다운
      required: false
      desc: 단지에서 따로 집계하고 싶은 기준이 있을 때 사용합니다.
    - name: 일정 등록
      type: 토글
      required: false
      desc: >
        켜면 이 업무가 관리소 일정과 담당자 일정에 함께 표시됩니다.
        날짜가 정해진 업무라면 켜두는 편이 좋습니다.
    - name: 업무 내용
      type: 여러 줄 입력
      required: true
      desc: 무슨 일인지 적습니다.
    - name: 첨부파일
      type: 파일
      required: false
      desc: >
        [찾아보기]로 파일을 고릅니다. 파일을 더 붙이려면 왼쪽 [+], 빼려면 오른쪽 [-]를 누릅니다.
        한 개당 100MB 이하만 올라갑니다.
    - name: 첨부사진
      type: 사진
      required: false
      desc: 오른쪽 위 [사진함] 버튼으로 사진을 붙입니다.   # 확인필요: 사진함에서 고르는 방식인지, 새로 올리는지
    - name: 접수자
      type: 자동 입력
      required: true
      desc: 로그인한 사람이 자동으로 들어갑니다. 다른 사람 이름으로 남기려면 [접수자 변경]을 누릅니다.
    - name: 접수 일시
      type: 날짜 + 시각
      required: true
      desc: 현재 시각이 자동으로 채워집니다. 나중에 입력하는 경우 실제 접수 시각으로 고쳐 넣습니다.
    - name: 담당자
      type: 검색 선택
      required: false
      desc: >
        돋보기를 눌러 직원을 찾습니다.
        옆의 [담당자 알림발송 여부]를 켜면 지정한 직원에게 알림이 나갑니다.
    - name: 상태
      type: 드롭다운
      required: true
      desc: 접수 / 처리중 / 유보 등. 목록의 상태 필터와 연결됩니다.   # 확인필요: 전체 선택지
    - name: 처리일시
      type: 날짜 + 시각
      required: false
      desc: 처리를 끝낸 뒤 채웁니다.
    - name: 처리내용
      type: 여러 줄 입력
      required: false
      desc: 어떻게 처리했는지 적습니다. 나중에 같은 일이 생겼을 때 참고가 됩니다.

  steps:
    - no: 1
      action: 목록 화면 오른쪽 위 [등록]을 클릭합니다.
      target: button:등록
      image: mgmt-common-work-form-01.png
      note: null
    - no: 2
      action: 분류를 고르고, 업무 내용을 입력합니다.
      target: select:분류 > textarea:업무 내용
      image: null
      note: null
    - no: 3
      action: 필요하면 [찾아보기]로 파일을 붙입니다.
      target: button:찾아보기
      image: null
      note: 파일 한 개당 100MB 이하만 올릴 수 있습니다.
    - no: 4
      action: 돋보기를 눌러 담당자를 지정합니다.
      target: button:담당자 검색
      image: null
      note: 알림을 보내려면 [담당자 알림발송 여부]를 켭니다.
    - no: 5
      action: 날짜가 정해진 업무라면 [일정 등록]을 켭니다.
      target: toggle:일정 등록
      image: null
      note: 켜면 관리소 일정과 담당자 일정에 함께 표시됩니다.
    - no: 6
      action: 오른쪽 위 [등록]을 클릭해 저장합니다.
      target: button:등록(저장)
      image: null
      note: 왼쪽 위 [목록]을 누르면 저장되지 않고 목록으로 돌아갑니다.

  sub_flows:
    - name: 처리 결과 기록하기
      steps:
        - no: 1
          action: 목록에서 해당 건을 클릭해 엽니다.
          target: table:목록 > row
          image: mgmt-common-work-form-done-01.png
        - no: 2
          action: 처리일시와 처리내용을 채웁니다.
          target: input:처리일시 > textarea:처리내용
          image: null
        - no: 3
          action: 상태를 처리 완료에 맞게 바꾸고 [등록]으로 저장합니다.
          target: select:상태 > button:등록
          image: null
          note: 상태를 바꿔야 목록의 [미처리] 건수에서 빠집니다.

  cautions:
    - "[담당자 알림발송 여부]를 켜고 저장하면 실제로 알림이 나갑니다. 연습이나 테스트 중이라면 꺼두세요."
    - "왼쪽 위 [목록]과 오른쪽 위 [등록]은 이름이 비슷하지만, [목록]은 저장하지 않고 나가기입니다."
    - "접수 일시는 자동으로 현재 시각이 들어갑니다. 며칠 지난 일을 뒤늦게 입력할 때는 반드시 고쳐 넣으세요. 통계가 어긋납니다."

  faq:
    - q: 등록했는데 담당자에게 알림이 안 갔습니다.
      a: 저장하기 전에 [담당자 알림발송 여부]가 켜져 있었는지 확인합니다. 끈 상태로 저장하면 알림이 나가지 않습니다.
    - q: 처리내용을 나중에 적어도 되나요?
      a: 됩니다. 목록에서 해당 건을 다시 열어 채우면 됩니다.
    - q: 미처리 건수가 안 줄어듭니다.
      a: 처리내용만 적고 상태를 바꾸지 않으면 미처리로 남습니다. 상태를 함께 변경하세요.
