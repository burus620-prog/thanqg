    - name: 알림발송
      desc: 체크한 건의 차주에게 알림을 보냅니다. 보내기 전에는 「미발송」으로 표시됩니다.
    - name: 엑셀 등록
      desc: 여러 건을 엑셀로 한 번에 올립니다.

  steps:
