- screen_id: mgmt-photos
  screen_name: 사진함
  path: 관리업무 > 사진함
  pattern: A
  inherits: pattern-a
  permission: 관리업무 > 열람
  purpose: 현장 사진을 분류별로 모아 보관하고, 일지·보고서에 다시 꺼내 쓴다

  key_concept: >
    사진마다 **NO · 공종 · 위치 · 내용**을 적고 분류(저장위치)를 골라 올린다.
    [사진 정보 표기]를 켜 두면 이 정보가 사진 귀퉁이에 표처럼 찍혀 저장되므로,
    출력하거나 보고서에 붙여도 어디서 무엇을 찍었는지 알 수 있다.

  screen_specific:
    - name: 분류 목록
      desc: 왼쪽 분류(건물외부·건물내부·전기소방승강기홈넷 설비·조경 등)를 누르면 그 분류 사진만 봅니다. 숫자는 사진 수입니다.
    - name: 분류 설정 · 특별분류 설정
      desc: 분류 이름을 바꾸거나 추가합니다. 특별분류(예를 들어 하자)는 분류와 따로 한 번 더 묶어 볼 때 씁니다.
    - name: 사진 정보 표기
      desc: 켜면 NO·공종·위치·내용이 사진 안에 찍힙니다. 위치는 좌측상단·좌측하단·우측상단·우측하단 중에 고릅니다.
    - name: 리스트 출력
      desc: 고른 사진을 한 장에 여러 장씩 모아 인쇄합니다.

  steps:
    - no: 1
      action: 상단 [관리업무]를 클릭한 뒤 왼쪽 목록에서 [사진함]을 클릭합니다.
      target: nav:관리업무 > side:사진함
      image: mgmt-photos-01.png
      note: 최근에 올린 사진부터 카드로 나옵니다.
    - no: 2
      action: 오른쪽 위 [등록]을 클릭합니다.
      target: button:등록
      image: null
      note: 「사진함 등록하기」 창이 열립니다.
    - no: 3
      action: NO·공종·위치·내용을 적고 분류를 고른 뒤 [찾아보기]로 사진을 고릅니다.
      target: null
      image: null
      note: 아래에 정보가 찍힌 미리보기가 나옵니다.
    - no: 4
      action: '[사진 등록]을 클릭합니다.'
      target: null
      image: null
      note: null

  cautions: []

  faq:
    - q: 일지에 사진을 붙이려면 다시 올려야 하나요?
      a: 아닙니다. 일지·보고서 작성 화면의 [사진함] 버튼으로 여기 올린 사진을 골라 붙입니다.

