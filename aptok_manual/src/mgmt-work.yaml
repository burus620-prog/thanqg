- screen_id: mgmt-board-complex
  screen_name: 단지 서식/양식
  path: 관리업무 > 게시판관리 > 단지 서식/양식
  pattern: E
  permission: 관리업무 > 열람
  purpose: 단지에서 직접 쓰는 신청서·점검표 같은 서식 파일을 분류별로 올려 두고 내려받아 쓴다

  key_concept: >
    [샘플 서식/양식]이 아파트OK가 제공하는 공통 서식이라면, 이곳은 **우리 단지 서식**을 모아 두는 곳이다.
    분류(예: 입주민 신청서 · 관리사무소 서식)를 먼저 만들고 글마다 파일을 붙인다.

  columns: [대분류, 소분류, 제목, 첨부]

  screen_specific:
    - name: 분류 목록
      desc: 왼쪽 분류를 누르면 그 분류 글만 봅니다. 숫자는 글 수입니다.
    - name: 분류설정
      desc: '[1차 분류 추가]로 분류를 만들고 분류 줄의 [＋]로 소분류를 둡니다. [가나다순 정렬]로 이름순 정리도 됩니다.'

  steps:
    - no: 1
      action: 상단 [관리업무]를 클릭한 뒤 왼쪽 목록에서 [게시판관리] › [단지 서식/양식]을 클릭합니다.
      target: nav:관리업무 > side:게시판관리 > side:단지 서식/양식
      image: mgmt-board-complex-01.png
      note: 첨부 칸의 숫자를 누르면 파일을 내려받습니다.
    - no: 2
      action: 새 서식을 올리려면 [등록]을 눌러 제목·분류를 정하고 파일을 붙여 [등록]합니다.
      target: button:등록
      image: null
      note: 본문에 작성 요령을 적어 두면 직원이 쓰기 쉽습니다. 파일 하나당 100MB 이하입니다.

  cautions: []

  faq: []

