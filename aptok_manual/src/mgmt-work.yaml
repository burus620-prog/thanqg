- screen_id: mgmt-fee-stats
  screen_name: 관리비 통계
  path: 관리업무 > 관리비 > 관리비 통계
  pattern: D
  permission: 관리업무 > 열람
  purpose: K-apt(공동주택관리정보시스템)에 신고한 관리비 자료를 불러와 항목별·기간별로 비교한다

  key_concept: 왼쪽에서 단지의 K-apt 계정으로 로그인하고 [정보 불러오기 이용 동의]에 체크하면 관리비 자료를 가져온다. 가운데 발생항목(공용관리비 › 일반관리비 › 인건비 등)을 체크하고 [선택내역 차트보기]로 비교한다.
  screen_specific:
  - name: 년 단위 보기
    desc: 월별이 아니라 연도별 합계로 봅니다.
