      action: 알림이 필요하면 목록에서 체크한 뒤 [알림발송]을 클릭합니다.
      target: button:알림발송
      image: null
      note: null

  cautions:
    - "[알림발송]은 차주에게 실제로 알림이 나갑니다. 차량번호와 내용을 확인한 뒤 누르세요."

  faq: []

