  purpose: 주차 위반 차량을 기록하고, 필요하면 차주에게 알림을 보낸다

  columns: [접수일시, 차량번호, 차종, 연락처, 입주민 여부, 세대정보(동·호), 특기사항, 알림 발송여부, 첨부]

  screen_specific:
    - name: 주차위반 등록
      desc: 차량번호 일부를 넣으면 등록 차량을 찾아 차종·세대가 자동으로 채워집니다. 외부 차량은 직접 적습니다.
    - name: 입주자·외부 차량 스위치
