    desc: 항목을 펼치거나 접습니다.

  steps:
    - no: 1
      action: 상단 [관리업무]를 클릭한 뒤 왼쪽 목록에서 [관리비]를 클릭하고 [관리비 통계]를 클릭합니다.
      target: nav:관리업무 > side:관리비 > side:관리비 통계
      image: mgmt-fee-stats-01.png
      note: K-apt 자료를 아직 불러오지 않았으면 오른쪽이 비어 있습니다.

  cautions:
  - K-apt 계정은 단지(관리주체) 계정입니다. 개인 계정을 쓰지 마세요.

  faq: []

