# 화면 17개. draft: true 인 항목은 화면 확인 전 뼈대이며,
# 캡처를 본 뒤 purpose·steps·cautions·faq 를 채운다.

- screen_id: mgmt-household-work
  screen_name: 세대업무
  path: 민원관리 > 세대업무
  pattern: A
  inherits: pattern-a
  permission: 관리업무 > 열람
  purpose: 세대에서 들어온 민원을 접수하고 담당자 배정부터 처리 완료까지 관리한다

  key_concept: 민원마다 동·호·분류·내용을 접수하고 담당자를 정한다. 상태는 미처리에서 처리중을 거쳐 처리완료로 바뀌고, 유보·관찰도 둘 수 있다. 처리한 민원을 체크해 [일일업무보고]를 누르면 일일일지로 바로 넘어간다.
  columns:
  - 동
  - 호
  - 등록구분
  - 접수일시
  - 분류
  - 연락처
  - 민원내용
  - 처리내용
  - 접수자
  - 처리일시
  - 담당자
  - 상태
  - 첨부
  screen_specific:
  - name: 미처리 · 처리중 · 유보
    desc: 목록 위 단추로 그 상태의 민원만 봅니다. 괄호 숫자는 건수입니다.
  - name: 민원 통계보기
    desc: 기간별·분류별 민원 건수를 봅니다.
  - name: 분류설정 · 특별분류설정
    desc: 민원 분류(관리비·난방·급탕·수도·전기 등)를 정리합니다.
  - name: 일일업무보고
    desc: 체크한 민원으로 일일일지를 만듭니다.

  steps:
    - no: 1
      action: 상단 [민원관리]를 클릭한 뒤 왼쪽 목록에서 [세대업무]를 클릭합니다.
      target: nav:민원관리 > side:세대업무
      image: mgmt-household-work-01.png
      note: 최근 접수한 민원부터 나옵니다.
    - no: 2
      action: 검색·기간·내려받기 등 기본 조작은 [목록 화면 공통 사용법]을 따릅니다.
      target: null
      image: null
      note: null
    - 'no': 3
      action: '[민원등록]을 눌러 동·호·분류·민원내용을 적고 담당자를 정해 저장합니다.'
      target: button:민원등록
      image: null
      note: null
    - 'no': 4
      action: 처리가 끝나면 민원을 열어 처리내용을 적고 상태를 바꿉니다.
      target: null
      image: null
      note: null

  cautions:
  - 개인정보(연락처)가 표시되는 화면입니다.

  faq: []

