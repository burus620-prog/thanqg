- screen_id: mgmt-broadcast-done
  screen_name: 완료방송
  path: 관리업무 > 방송 > 완료방송
  pattern: B
  permission: 관리업무 > 열람
  purpose: 실제로 나간 방송의 기록을 조회한다

  key_concept: >
    안내방송에서 예약한 방송이 **실제로 방송된 뒤** 이곳으로 옮겨진다.
    예약만 해 두고 아직 방송되지 않은 건은 [안내방송]에 남아 있다.

  columns: [방송분류, 예약방송일시, 송출일시, 제목, 작성자, 결재이력, 결과]

  steps:
    - no: 1
      action: 상단 [관리업무]를 클릭한 뒤 왼쪽 목록에서 [방송] › [완료방송]을 클릭합니다.
      target: nav:관리업무 > side:방송 > side:완료방송
      image: mgmt-broadcast-done-01.png
      note: 기본으로 최근 1개월이 나옵니다. 송출한 방송이 없으면 「데이터가 없습니다」로 보입니다.
    - no: 2
      action: 방송을 눌러 내용을 보고, 같은 방송을 다시 내보내려면 [재방송] 또는 [방송 활용하기]를 클릭합니다.
      target: null
      image: null
      note: '[방송 활용하기]는 내용을 복사해 새 방송 등록 화면을 엽니다.'

  cautions:
    - "[재방송]은 그 자리에서 실제 방송이 나갑니다."

  faq: []

