- screen_id: mgmt-broadcast-notice
  screen_name: 안내방송
  path: 관리업무 > 방송 > 안내방송
  pattern: B
  permission: 관리업무 > 열람
  purpose: 단지 안내방송 문안을 등록하고 예약 시각에 음성으로 내보낸다

  key_concept: >
    방송 문안을 적어 **예약**해 두면, 그 시각에 음성(TTS)으로 바뀌어 방송된다.
    화면 위쪽 큰 카드가 **다음 방송**, 오른쪽이 **금주 방송 일정**, 아래가 등록한 방송 목록이다.
    등록만 해서는 바로 방송되지 않는다.

  columns: [방송분류, 방송일시, 제목, 작성자, 등록일시, 결재현황]

  screen_specific:
    - name: 다음 방송 카드
      desc: 가장 가까운 예약 방송입니다. [미리 듣기]로 음성을 들어 보고, [방송 시작]은 즉시 방송합니다.
    - name: 자동 실행
      desc: 켜 두면 예약 시각에 자동으로 방송됩니다. 끄면 사람이 [방송 시작]을 눌러야 합니다.
    - name: 방송등록
      desc: 결재선·예정 방송일시·반복(1~3회)·음성(성별·속도)·제목·내용(600자 이내)을 넣습니다. [방송문 불러오기]로 자주 쓰는 문안을 가져옵니다.

  steps:
    - no: 1
      action: 상단 [관리업무]를 클릭한 뒤 왼쪽 목록에서 [방송] › [안내방송]을 클릭합니다.
      target: nav:관리업무 > side:방송 > side:안내방송
      image: mgmt-broadcast-notice-01.png
      note: 다음 방송과 이번 주 일정이 위에 보입니다.
    - no: 2
      action: '[방송등록]을 클릭해 예정 방송일시와 제목·내용을 넣습니다.'
      target: button:방송등록
      image: null
      note: 지난 시각이나 다른 방송과 겹치는 시각은 등록되지 않습니다.
    - no: 3
      action: '[미리듣기]로 음성을 확인한 뒤 [등록]을 클릭합니다.'
      target: null
      image: null
      note: 등록한 방송은 목록과 [금주 방송 일정]에 나타납니다.

  cautions:
    - "[방송 시작]과 [재방송]은 그 자리에서 실제 방송이 나갑니다."
    - "[자동 실행]을 켜 두면 예약 시각에 사람 확인 없이 방송됩니다."

  faq:
    - q: 등록 버튼을 눌러도 반응이 없습니다.
      a: 예정 방송일시가 비었거나 지난 시각일 때입니다. 달력에서 날짜를 다시 고르고 시각을 넣으세요.

