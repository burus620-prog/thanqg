- screen_id: mgmt-security
  screen_name: 보안
  path: 관리업무 > 보안
  pattern: D
  permission: 관리업무 > 열람
  purpose: 누가 언제 어떤 화면의 엑셀(개인정보 포함)을 왜 내려받았는지 기록을 조회한다

  key_concept: >
    아파트OK에서 엑셀을 내려받으면 **사유 입력 창**이 먼저 뜬다.
    사유 구분(업무 보고/결재 · 민원 처리 · 회계/결산 · 입주민 요청 등)과 상세 사유를 적어야 내려받기가 되고,
    그 기록이 이 화면에 남는다. 개인정보 보호 점검이나 감사 때 근거로 쓴다.

  columns: [No., 다운로드 일시, 요청자, 메뉴, 사유 구분, 상세 사유, 요청 IP, 완료 일시]

  steps:
    - no: 1
      action: 상단 [관리업무]를 클릭한 뒤 왼쪽 목록에서 [보안]을 클릭합니다.
      target: nav:관리업무 > side:보안
      image: mgmt-security-01.png
      note: 기본으로 최근 3개월이 나옵니다. 사유 구분과 요청자 이름으로 걸러 봅니다.

  cautions:
    - "내려받을 때 사유를 구체적으로 적으세요. 이 기록은 개인정보 점검·감사 때 근거가 됩니다."

  faq:
    - q: 엑셀을 내려받으려는데 창이 하나 더 뜹니다.
      a: 사유 입력 창입니다. 사유 구분을 고르고 [다운로드]를 누르면 내려받아지고, 이 화면에 기록됩니다.
