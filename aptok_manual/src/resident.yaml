# 아파트ok 사용자 매뉴얼 원본 — 입주자관리
# 화면 7개. draft: true 인 항목은 화면 확인 전 뼈대이며,
# 캡처를 본 뒤 purpose·steps·cautions·faq 를 채운다.

- screen_id: res-household
  screen_name: 세대관리
  path: 입주자관리 > 세대관리
  pattern: A
  inherits: pattern-a
  permission: 입주자관리 > 열람
  purpose: 동·호별 세대와 입주자(세대주·세대원), 차량 정보를 관리한다

  key_concept: 단지의 모든 세대가 동·호 순으로 나온다. 세대를 누르면 세대원·소유자·차량을 관리한다. 구분은 자가·전세·월세 같은 거주 형태다.
  columns:
  - 동
  - 호
  - 구분
  - 성명
  - 대표전화번호
  - 전입일
  - 인원수
  - 가입수
  - 차량정보
  screen_specific:
  - name: 인원수 총
    desc: 오른쪽 위에 단지 전체 입주자 수가 나옵니다.
  - name: 가입수
    desc: 그 세대에서 입주민 앱에 가입한 사람 수입니다.
  - name: 엑셀 등록
    desc: 세대원 명단을 엑셀로 한 번에 올립니다.

  steps:
    - no: 1
      action: 상단 [입주자관리]를 클릭한 뒤 왼쪽 목록에서 [세대관리]를 클릭합니다.
      target: nav:입주자관리 > side:세대관리
      image: res-household-01.png
      note: 구분(자가·전세·월세)과 성명·휴대폰·차량번호로 찾습니다.
    - no: 2
      action: 검색·기간·내려받기 등 기본 조작은 [목록 화면 공통 사용법]을 따릅니다.
      target: null
      image: null
      note: null
    - 'no': 3
      action: 세대를 눌러 세대원을 추가하거나 전출 처리합니다.
      target: null
      image: null
      note: null

  cautions:
  - 개인정보가 표시되는 화면입니다. 열람 권한을 꼭 필요한 직원에게만 주세요.

  faq: []

