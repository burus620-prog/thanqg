- screen_id: res-council-list
  screen_name: 입주자대표회의 명단
  path: 입주자관리 > 입주자대표회의 > 명단
  pattern: E
  permission: 입주자관리 > 열람
  purpose: 입주자대표회의 구성원(동별 대표자와 회장·감사·이사)의 명단과 임기를 관리한다

  key_concept: 왼쪽에서 기수를 고르면 그 기수 구성원이 나온다. 구성원은 단지 입주민 가운데서 골라 넣고 직책·임기를 정한다. 결재권한을 주면 구성원이 아파트OK에서 결재에 참여할 수 있다.
  columns:
  - 임기
  - 동
  - 호
  - 성명
  - 직책
  - 연락처
  - 상태
  - 전자결재권한
  screen_specific:
  - name: 기수 추가
    desc: 새 임기가 시작되면 기수를 만듭니다.
  - name: 명단 엑셀 등록
    desc: 구성원을 엑셀로 한 번에 올립니다.
  - name: 단체 직책 관리 · 기존 구성원 불러오기
    desc: 직책을 정리하고, 이전 기수 구성원을 그대로 불러옵니다.
  - name: 결재권한 사용 여부
    desc: 켜면 구성원에게 전자결재 권한을 줍니다.

  steps:
    - no: 1
      action: 상단 [입주자관리]를 클릭한 뒤 왼쪽 목록에서 [입주자대표회의]를 클릭하고 [명단]을 클릭합니다.
      target: nav:입주자관리 > side:입주자대표회의 > side:명단
      image: res-council-list-01.png
      note: null
    - 'no': 2
      action: '[구성원 등록]을 눌러 입주민을 검색해 고르고 직책·임기를 넣어 저장합니다.'
      target: button:구성원 등록
      image: null
      note: null

  cautions:
  - 개인정보가 표시되는 화면입니다.

  faq: []

