- screen_id: res-arrears
  screen_name: 체납세대
  path: 입주자관리 > 체납세대
  pattern: D
  permission: 입주자관리 > 열람
  purpose: 관리비 체납 현황을 달별로 등록하고, 체납 세대에 납부 안내 알림을 보낸다

  key_concept: >
    체납은 **달 단위 묶음**으로 관리한다. 한 달 치 체납 세대를 엑셀로 한 번에 올리면
    목록에 그 달이 한 줄로 생기고, 그 줄을 눌러 세대별 체납액과 알림 발송을 관리한다.
    세대를 한 집씩 직접 추가하는 기능은 없고, **엑셀 등록**으로만 넣는다.

  columns: [체납 발생 월, 체납 세대 수, 총 체납액, 체납 율, 총 부과 금액, 등록일, 최종 수정일, 알림 발송일시]

  screen_specific:
    - name: 체납세대 엑셀 등록
      desc: >
        오른쪽 위 버튼입니다. 엑셀 파일을 고르면 오른쪽에 내용이 미리 보이고,
        왼쪽에서 각 항목(체납 발생월·동·호·당월체납액·납부마감일)이 엑셀의 몇 번째 열인지 고릅니다.
        첫 줄이 제목이면 [데이터 시작]을 2로 바꿉니다.
    - name: 체납 율
      desc: 총 체납액 ÷ 총 부과 금액입니다. 엑셀로 올린 직후에는 총 부과 금액이 체납액과 같게 들어가 100%로 보이므로, 상세 화면에서 그 달의 총 부과 금액을 고쳐 저장합니다.
    - name: 알림 발송일시
      desc: 세대에 납부 안내 알림을 보내기 전에는 「미발송」으로 표시됩니다.

  steps:
    - no: 1
      action: 상단 [입주자관리]를 클릭한 뒤 왼쪽 목록에서 [체납세대]를 클릭합니다.
      target: nav:입주자관리 > side:체납세대
      image: res-arrears-01.png
      note: 등록한 달이 최근 달부터 나옵니다. 줄을 누르면 그 달의 세대별 체납액이 열립니다.
    - no: 2
      action: 새 달을 올리려면 [체납세대 엑셀 등록]을 클릭하고 엑셀 파일을 고릅니다.
      target: button:체납세대 엑셀 등록
      image: null
      note: 양식은 체납 발생월 · 동 · 호 · 당월체납액 · 마감일 다섯 열입니다. 한 파일에는 한 달 치만 넣습니다.
    - no: 3
      action: 항목별 열을 확인하고 [엑셀 등록]을 클릭합니다.
      target: null
      image: null
      note: 동·호가 단지에 없는 세대는 등록되지 않습니다.
    - no: 4
      action: 목록에서 방금 올린 달을 눌러 [총 부과금액]을 실제 부과액으로 고치고 [저장]합니다.
      target: null
      image: null
      note: 그래야 체납 율이 올바르게 계산됩니다.

  cautions:
    - "개인정보가 표시되는 화면입니다. 열람 권한을 꼭 필요한 직원에게만 주세요."
    - "한 엑셀 파일에 여러 달을 섞어 올리면 모두 첫 줄의 달로 묶입니다. 달마다 파일을 나눠 올리세요."
    - "같은 달을 두 번 올리면 같은 달이 두 줄 생깁니다. 다시 올리기 전에 기존 줄을 삭제하세요."
    - "[알림발송]을 누르면 세대에 실제로 알림이 나갑니다. 금액을 확인한 뒤 보내세요."

  faq:
    - q: 엑셀 등록을 누르면 「처리중 오류가 발생하였습니다」가 나옵니다.
      a: >
        파일의 동·호와 금액 형식을 확인하고 다시 올려 보세요.
        그래도 같은 안내가 나오면 고객센터(02-858-3001)로 파일을 보내 주시면 대신 등록해 드립니다.
    - q: 체납 율이 100%로 나옵니다.
      a: 엑셀로 올리면 총 부과 금액이 체납액 합계로 들어갑니다. 그 달을 눌러 총 부과금액을 실제 부과액으로 고쳐 저장하세요.

