- screen_id: res-community
  screen_name: 공동체
  path: 입주자관리 > 공동체
  pattern: A
  inherits: pattern-a
  permission: 입주자관리 > 열람
  purpose: 부녀회·노인회·자율방범대 같은 단지 자생단체와 구성원 명단을 관리한다

  key_concept: >
    왼쪽은 **단체 목록**, 오른쪽은 고른 단체의 **구성원 명단**이다.
    단체는 두 단계로 만든다. 1차 분류(예: 부녀회) 아래에 실제 단체(예: 디엑스삼성 부녀회)를 둔다.
    구성원은 단지에 등록된 입주민 가운데서 골라 넣고, 단체마다 직책(회장·총무·회원 등)을 정해 둔다.

  columns: [임기, 동, 호, 성명, 직책, 연락처, 상태]

  screen_specific:
    - name: 단체관리
      desc: >
        단체 목록 위 버튼입니다. [1차 분류 추가]로 분류를 만들고, 분류 줄의 [＋]로 그 아래 단체를 만듭니다.
        스위치로 사용을 끄면 목록에서 숨겨집니다.
    - name: 단체 직책 관리
      desc: 왼쪽에서 단체를 고른 뒤 누릅니다. 직책을 추가하고 손잡이를 끌어 순서를 바꿉니다.
    - name: 기존 구성원 불러오기
      desc: 다른 단체에 있던 사람을 이 단체에 바로 넣습니다.
    - name: 구성원 등록
      desc: 돋보기로 입주민을 검색해 고르고 직책·임기를 넣습니다. [저장 후 추가등록]으로 여러 명을 이어서 넣을 수 있습니다.

  steps:
    - no: 1
      action: 상단 [입주자관리]를 클릭한 뒤 왼쪽 목록에서 [공동체]를 클릭합니다.
      target: nav:입주자관리 > side:공동체
      image: res-community-01.png
      note: 왼쪽에서 단체를 누르면 오른쪽에 구성원이 나옵니다.
    - no: 2
      action: 단체가 없으면 [단체관리]에서 1차 분류와 단체를 만들고 [저장]합니다.
      target: button:단체관리
      image: null
      note: 분류만 있고 단체가 없으면 직책 관리·구성원 등록이 「단체를 먼저 추가해 주세요」로 막힙니다.
    - no: 3
      action: 단체를 고르고 [단체 직책 관리]에서 직책을 만든 뒤 [저장]합니다.
      target: button:단체 직책 관리
      image: null
      note: null
    - no: 4
      action: '[구성원 등록]을 눌러 입주민을 검색해 고르고, 직책과 임기를 넣어 [저장]합니다.'
      target: button:구성원 등록
      image: null
      note: 연락처는 입주민 정보에서 자동으로 채워집니다.

  cautions:
    - "개인정보가 표시되는 화면입니다. 명단을 내려받을 때는 사유를 입력해야 하며, 기록이 [관리업무 › 보안]에 남습니다."

  faq:
    - q: 구성원 이름을 직접 쓸 수 없나요?
      a: 단지에 입주민으로 등록된 사람만 넣을 수 있습니다. 먼저 [세대관리]에 등록하세요.
