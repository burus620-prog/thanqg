# 성공닷컴 캡처 경로 — 거래(전표) 입력
#
# 이 서비스는 화면마다 주소가 있다(.apro). 메뉴 이동이 주소로 되는지 확인되면
# 아래 클릭 단계를 url 단계로 바꾸는 편이 훨씬 안정적이다.
#
#   - url: https://www.xn--ob0bs79awa206c7ov.com/어떤화면.apro
#   - shot: 이름.png

login:
  url: https://www.xn--ob0bs79awa206c7ov.com/login.apro
  env_id: SUCCESS_ID          # 아이디를 담을 환경변수 이름
  env_pw: SUCCESS_PW          # 비밀번호를 담을 환경변수 이름
  id_field: "input[type=text]"
  pw_field: "input[type=password]"
  submit: "로그인"
  ready: 거래          # 로그인 후 화면에 보이는 글자. 띄어쓰기 차이를 피해 짧게 잡는다
  complex: null

# 이 서비스는 자료 조회도 POST 로 한다. 아래 조각이 주소에 들어 있으면 통과시킨다.
# 그래야 화면에 자료가 채워진 상태로 찍힌다. 저장·삭제 계열은 계속 막힌다.
allow_post:
  - /collect        # collectSummary, collectTransPlus, collectTransMinus
  - /search         # searchTransNm
  - /get            # getMethodList, getNoticeAlarm
  - listdata        # norMainListData, crefiaMainListData
  - maindata
  - data.apro       # taxBillHistoryData 등 조회성 요청
  - detail          # serviceInfoDetail 등
  - list            # transQuickListTotal 등
  - /list
  - /view
  - /inquiry

# 통과 목록에 걸리더라도 이 조각이 들어 있으면 무조건 막는다.
deny_post:
  - save
  - insert
  - update
  - delete
  - remove
  - regist
  - send
  - submit

# 자료 가리기. 아래 적은 열만 가리고 나머지는 그대로 둔다.
#   · 제목 줄 이름으로 열을 찾는다. 표의 제목, 입력칸의 항목명·안내문구·라벨 모두 본다
#   · 앞 세 글자만 남기고 ● 로 바꾼다  (주식회사 가나다상사 → 주식회●●●●●●●)
#   · 날짜와 세 글자 이하 값은 그대로 둔다
#   · "조회된 자료가 없습니다" 같은 안내 줄과 빈 표는 건드리지 않는다
# 흐림이 아니라 글자를 바꾸는 방식이라 확대해도 복원되지 않는다.
mask_data: true

# 열 이름 뒤에 :숫자 를 붙이면 그 열만 남길 글자 수를 따로 정한다.
# 안 붙이면 아래 mask_keep_chars 를 쓴다.
mask_columns:
  - 구분
  - 거래처
  - 거래처명
  - 통장:2
  - 적요:2
  # 급여관리 화면
  - 성명:1
  - 이름:1
  - 사원명:1
  - 주민등록번호:0
  - 계좌:2
  - 계좌번호:2

mask_keep_chars: 3        # 기본으로 남길 글자 수

# 사업자등록번호·카드번호는 어느 열에 있든 가린다. 필요 없으면 false.
mask_id_numbers: true

# 특정 영역을 더 가리고 싶으면 CSS 선택자를 적는다. 브라우저 F12 로 확인한다.
mask_global: []

