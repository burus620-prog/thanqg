# 성공닷컴 사용자 매뉴얼 원본 — 전체 흐름
# 어느 화면 설명보다 먼저 읽어야 하는 문서.

- doc_id: flow-overview
  doc_name: 자료가 장부에 들어가기까지
  applies_count: null
  purpose: >
    성공닷컴에서 거래 하나가 장부에 들어가기까지는 네 단계를 거친다.
    화면 하나하나를 익히기 전에 이 순서를 알아야 지금 어디에 있는지 알 수 있다.

  layout:
    - zone: ① 가져오기
      desc: "[거래(전표) 입력]에서 국세청·카드사·은행 자료를 자동수집하거나 엑셀로 올린다."
    - zone: ② 거래명 정하기
      desc: 가져온 전표마다 거래명을 고른다. 거래명을 고르면 계정과목이 자동으로 정해진다.
    - zone: ③ 장부입력
      desc: 장부에 넣을 전표를 고르고 [장부입력]을 누른다. 이때 전표가 장부로 넘어간다.
    - zone: ④ 확인·관리
      desc: "[매출 / 매입]에서 장부에 들어간 거래를 확인하고 관리한다."

  money_flow: >
    위 네 단계는 "거래"의 흐름이다. 여기에 "돈"의 흐름이 하나 더 붙는다.
    거래를 장부에 넣었다고 돈이 오간 것은 아니기 때문이다.
    ⑤ [금융(입출금)]에서 실제로 들어오고 나간 돈을 장부의 거래와 맞춘다.
    이것을 해야 못 받은 돈과 안 준 돈이 정확해진다.

  inventory_note: >
    물건을 다루는 업종이라면 갈래가 하나 더 있다.
    [영업(재고) 관리]에서 거래명세서를 쓰고 [장부입력]을 누르면
    전표 등록과 재고 반영이 한꺼번에 일어난다.
    별도의 흐름이 아니라 ①~③을 거래명세서로 대신하는 것이다.

  common_actions:
    - id: where
      name: 지금 내 전표가 어디 있는지 알아보는 법
      steps:
        - "[거래(전표) 입력]에 보이면 아직 장부에 안 들어간 것입니다."
        - "[매출 / 매입]에 보이면 장부에 들어간 것입니다."
      note: >
        같은 전표가 두 곳에 동시에 있지 않습니다.
        [장부입력]을 누르는 순간 앞 화면에서 사라지고 뒤 화면에 나타납니다.

  common_cautions:
    - "매출·매입을 잡는 것과 돈이 오간 것은 다릅니다. 외상 거래는 [금융(입출금)]에서 수납·지급 확인을 따로 해야 합니다."
    - "가져오기만 하고 [장부입력]을 안 하면 장부는 비어 있습니다. 신고 때 자료가 없다고 놀라는 일이 여기서 생깁니다."
    - "자동수집 자료는 금액과 거래처를 고칠 수 없습니다. 가져온 곳의 자료를 그대로 담기 때문입니다. 고를 수 있는 것은 거래명입니다."

  common_faq:
    - q: 자동수집을 했는데 재무제표에 아무것도 안 나옵니다.
      a: "[장부입력]을 눌렀는지 확인하세요. 누르기 전에는 장부에 들어가지 않습니다."
    - q: 거래명을 잘못 골랐습니다.
      a: "[매출 / 매입]에서 그 거래의 거래명을 다시 고르면 계정과목도 함께 바뀝니다."
