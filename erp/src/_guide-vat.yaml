# 성공닷컴 사용자 매뉴얼 원본 — 안내 문서
# 부가세 신고 화면이 참조한다.
# 세법 기준은 2026년 8월 시점. 실제 신고 전에는 국세청 기준을 다시 확인한다.

- doc_id: guide-vat
  doc_name: 부가가치세 신고 이해하기
  applies_count: null
  purpose: >
    부가가치세는 물건이나 서비스를 팔 때 손님에게서 받아 둔 세금이다.
    내 돈이 아니라 **잠시 맡아 둔 돈**이고, 정해진 때에 나라에 낸다.
    낼 때는 내가 물건을 사면서 낸 부가세를 빼고 차액만 낸다.

  key_concept: >
    **낼 세금 = 매출세액 − 매입세액**
    받아 둔 세금에서 내가 낸 세금을 뺀 것이다.
    그래서 매입 자료를 빠짐없이 챙기는 것이 곧 세금을 줄이는 일이다.
    빠뜨린 매입 자료만큼 세금을 더 내게 된다.

  business_types:
    - name: 일반과세자
      desc: >
        세금계산서를 발급하고 매입세액을 온전히 공제받는다.
        연 매출이 일정 기준을 넘거나 간이과세를 적용받을 수 없는 업종이 해당한다.
    - name: 간이과세자
      desc: >
        규모가 작은 사업자에게 적용되는 간편한 방식이다.
        세율이 낮은 대신 매입세액 공제도 제한된다. 신고는 연 1회다.
    - name: 면세사업자
      desc: >
        부가세를 받지 않는 업종이다. 부가세 신고 대신 [사업장현황 신고]를 한다.

  set_your_type: >
    내 사업장이 어느 유형인지는 왼쪽 메뉴 [사업장 정보 관리] > [신고 정보]의
    **과세형태**에서 정한다. 일반과세·간이과세·면세 셋 다 지원한다.
    이 설정이 신고서에 그대로 반영되므로 사업자등록증과 대조해 정확히 넣는다.

  when_to_file:
    - who: 법인 (일반과세자)
      when: 1년에 네 번. 예정 4월 25일 · 확정 7월 25일 · 예정 10월 25일 · 확정 다음 해 1월 25일
    - who: 개인 (일반과세자)
      when: >
        확정신고는 1년에 두 번. 7월 25일과 다음 해 1월 25일.
        4월과 10월에는 직전 기간 세액의 절반을 고지받아 납부한다(예정고지).
    - who: 간이과세자
      when: 1년에 한 번. 다음 해 1월 25일

  what_counts_as_deduction: >
    매입세액을 공제받으려면 증빙이 있어야 한다. 아무 영수증이나 되는 것이 아니다.
    · 세금계산서를 받은 매입
    · 사업용으로 등록한 신용카드로 결제한 매입
    · 사업자 지출증빙용으로 발급받은 현금영수증
    개인 카드로 결제하고 지출증빙 처리를 안 했다면 공제받지 못한다.

  not_deductible:
    - item: 접대비
      desc: 거래처 접대에 쓴 돈은 세금계산서를 받았어도 공제되지 않는다.
    - item: 비영업용 소형승용차
      desc: 업무용이라도 승용차 구입비와 유지비는 대체로 공제 대상이 아니다.
    - item: 사업과 관련 없는 지출
      desc: 개인적으로 쓴 것은 공제되지 않는다.
    - item: 면세 사업에 쓴 매입
      desc: 부가세를 받지 않는 사업에 쓴 것은 공제받을 수 없다.
    - item: 증빙이 없거나 잘못된 매입
      desc: 세금계산서를 못 받았거나 내용이 사실과 다르면 공제되지 않는다.

  five_steps:
    - step: Ⓐ 미포함 계산서
      desc: 손으로 넣은 세금계산서를 신고서에 포함시킨다.
    - step: Ⓑ 포함 (세금)계산서
      desc: 신고서에 들어간 세금계산서를 확인한다.
    - step: Ⓒ 신고 자료 검증
      desc: 국세청 자료와 장부를 맞춰 빠진 것을 찾는다. 증빙 네 종류를 모두 확인한다.
    - step: Ⓓ 신고서 작성
      desc: 신고서를 만들고 마감해 전자파일을 뽑는다.
    - step: Ⓔ 신고서 목록
      desc: 마감한 신고를 확인하고, 납부 후 거래반영으로 장부에 기록한다.

  before_you_file: >
    신고 전에 그 기간의 거래가 장부에 다 들어가 있어야 한다.
    ① [거래(전표) 입력]에 처리하지 않은 전표가 남아 있지 않은지 본다.
    ② [매출 / 매입]에서 그 기간을 조회해 빠진 거래가 없는지 확인한다.
    ③ 매입 자료가 특히 중요하다. 빠뜨린 만큼 세금을 더 낸다.

  common_mistakes:
    - case: 매입 자료를 덜 넣고 신고했다
      desc: 낼 세금이 늘어난다. 신고 전에 매입부터 확인한다.
    - case: 개인 카드로 사고 공제받으려 했다
      desc: 사업용으로 등록한 카드가 아니면 공제 대상이 아니다.
    - case: 접대비를 매입세액에 넣었다
      desc: 세금계산서를 받았어도 공제되지 않는다.
    - case: 예정고지를 신고로 착각했다
      desc: >
        개인 일반과세자는 4월과 10월에 고지서를 받아 내기만 하면 된다.
        그 달에 신고까지 해야 하는 것으로 오해하는 경우가 있다.
    - case: 신고 후에 장부를 고쳤다
      desc: 신고 내용과 어긋난다. 고쳐야 한다면 수정신고를 해야 한다.

  common_faq:
    - q: 부가세는 왜 내야 하나요?
      a: >
        물건을 팔 때 손님에게서 받아 둔 세금이기 때문입니다.
        내 매출이 아니라 잠시 맡아 둔 돈이라고 생각하면 이해가 쉽습니다.
    - q: 세금이 생각보다 많이 나옵니다.
      a: >
        매입 자료가 덜 들어갔을 가능성이 큽니다.
        그 기간의 매입이 장부에 다 있는지, 사업용 카드로 결제했는지 확인하세요.
    - q: 4월에 고지서가 왔는데 신고도 해야 하나요?
      a: >
        개인 일반과세자라면 예정고지분을 납부만 하면 됩니다.
        신고는 7월과 다음 해 1월에 합니다.
    - q: 간이과세자인데 신고를 언제 하나요?
      a: 1년에 한 번, 다음 해 1월 25일까지 합니다.
    - q: 면세사업자입니다.
      a: 부가세 신고 대신 [사업장현황 신고]를 합니다.

  sources: >
    국세청 부가가치세 안내 기준. 2026년 8월 시점.
    과세유형과 업종에 따라 예외가 있으므로 실제 신고 전에는 국세청 기준이나 세무 대리인에게 확인한다.
