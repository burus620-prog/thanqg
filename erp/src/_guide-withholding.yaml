# 성공닷컴 사용자 매뉴얼 원본 — 안내 문서
# 원천세 신고와 급여관리가 함께 참조한다.
# 세법 기준은 2026년 8월 시점. 제출 주기는 개정이 잦으니 국세청 기준으로 확인한다.

- doc_id: guide-withholding
  doc_name: 인건비 종류와 원천세 제출 서류
  applies_count: null
  purpose: >
    사람에게 돈을 주면 세금을 미리 떼어 두었다가 나라에 대신 내야 한다. 이것이 원천징수다.
    그런데 같은 인건비라도 어떤 소득으로 보느냐에 따라 세율도, 내야 할 서류도, 기한도 달라진다.
    이 문서는 그 갈래를 정리한 것이다. 원천세 신고 화면을 보기 전에 읽으면 훨씬 수월하다.

  key_concept: >
    원천세 업무는 **두 가지 일이 겹쳐 있다.**
    ① 뗀 세금을 신고하고 내는 일 — 원천징수이행상황신고서
    ② 누구에게 얼마를 줬는지 알리는 일 — 지급명세서와 간이지급명세서
    ①만 하고 ②를 빠뜨려 가산세를 무는 경우가 매우 흔하다. 둘은 별개의 의무다.

  income_types:
    - name: 근로소득 (상용)
      desc: >
        정규직, 계약직처럼 계속 고용된 사람에게 주는 급여.
        근로소득 간이세액표에 따라 매월 떼고, 다음 해에 연말정산으로 정산한다.
    - name: 일용근로소득
      desc: >
        하루 단위로 고용해 일당을 주는 경우.
        일당에서 15만원을 뺀 금액에 6%를 매기고 세액공제 55%를 적용하므로 실제 부담은 낮다.
        연말정산 대상이 아니다.
    - name: 사업소득 (프리랜서)
      desc: >
        고용 관계 없이 계속·반복적으로 용역을 제공하는 사람. 흔히 말하는 3.3%다.
        소득세 3% + 지방소득세 0.3%를 뗀다. 받는 사람이 종합소득세로 직접 신고한다.
    - name: 기타소득 (일시적 인적용역)
      desc: >
        강연료, 자문료처럼 일시적으로 제공한 용역의 대가.
        필요경비를 인정받는 경우 실질 세율은 8.8% 수준이다.

  which_type: >
    같은 사람에게 준 돈이라도 어느 소득으로 보느냐가 첫 갈림길이다.
    계약서에 뭐라고 썼는지보다 **실제로 어떻게 일했는지**로 판단한다.
    3.3%로 처리했는데 실질이 근로자였다면 나중에 근로소득으로 다시 잡히면서
    세금과 4대보험을 소급해 물게 될 수 있다.

  how_to_judge:
    - point: 지시와 감독을 받는가
      desc: 업무 내용과 방식을 회사가 정하면 근로소득에 가깝다.
    - point: 시간과 장소가 정해져 있는가
      desc: 출퇴근 시간과 근무 장소가 묶여 있으면 근로소득 쪽이다.
    - point: 계속 반복되는가
      desc: 한 번으로 끝나면 기타소득, 계속 이어지면 사업소득이나 근로소득이다.
    - point: 도구와 비용을 누가 대는가
      desc: 회사가 장비와 비용을 대면 근로소득, 본인이 부담하면 사업소득 쪽이다.
    - point: 실패의 위험을 누가 지는가
      desc: 결과가 나빠도 정해진 돈을 받으면 근로소득, 본인이 손실을 지면 사업소득이다.

  half_year_special: >
    상시 고용인원이 20명 이하이면 **반기납부 특례**를 신청할 수 있다.
    승인받으면 매월 하던 원천징수이행상황신고와 납부를 1월 10일·7월 10일에 반년치씩 몰아서 한다.
    관할 세무서에 신청해 승인을 받아야 하고, 저절로 적용되지는 않는다.
    주의할 것은 **명세서 제출 주기는 그대로**라는 점이다.
    반기납부 승인을 받아도 사업소득 간이지급명세서는 여전히 매월 내야 한다.
    이 서비스는 반기납부 신고를 지원한다.

  deemed_payment: >
    급여를 늦게 주면 세금 신고 시기가 꼬인다. 그래서 법이 시기를 정해 둔다.
    · 1~11월분 급여를 그해 12월 31일까지 안 줬다면 12월 31일에 준 것으로 본다.
    · 12월분 급여를 다음 해 2월 말일까지 안 줬다면 2월 말일에 준 것으로 본다.
    실제로 돈이 안 나갔어도 그 시점에 준 것으로 보고 원천징수하고 신고해야 한다.
    연말에 자금이 빠듯해 급여를 미루는 경우 여기서 걸린다.

  small_biz_credit: >
    상시 고용인원 20명 이하인 사업자가 명세서를 제때 내면 세액공제를 받는다.
    소득자 인원수 × 200원이며, 연 300만원 한도다(세무·회계법인은 600만원, 최소 1만원).
    법인세나 소득세에서 공제받는다.
    작은 금액이지만 어차피 내야 하는 서류를 제때 내면 받는 것이니 챙길 만하다.

  yearend_link: >
    연말정산은 [급여관리] > [연말정산]에서 한다.
    보통 다음 해 2월분 급여를 줄 때 정산하고, 그 결과가 3월 10일까지 하는
    원천세 신고에 반영된다. 근로소득 지급명세서도 같은 날까지 낸다.
    정산 결과 더 낼 세금이 있으면 그때 내고, 돌려받을 것이 있으면 급여에 더해 돌려준다.

  three_filings:
    - name: ① 원천징수이행상황신고서
      desc: >
        뗀 세금을 신고하고 납부하는 서류. 지급한 달의 **다음 달 10일까지**.
        상시 고용인원 20명 이하로 승인받으면 반기납부 특례로 1월 10일·7월 10일에 한다.
    - name: ② 간이지급명세서
      desc: >
        누구에게 얼마 줬는지 자주 알리는 자료. 근로장려금 심사와 고용보험 관리에 쓰인다.
        소득 종류마다 주기가 다르다. 아래 표 참고.
    - name: ③ 지급명세서
      desc: 한 해 동안 준 금액을 소득별로 집계해 내는 서류. 대체로 다음 해 초에 낸다.

  submit_cycle:
    - type: 사업소득 (3.3%)
      form: 간이지급명세서
      when: 매월. 지급일이 속하는 달의 다음 달 말일까지
    - type: 기타소득 (인적용역)
      form: 간이지급명세서
      when: 매월. 지급일이 속하는 달의 다음 달 말일까지
    - type: 근로소득 (상용)
      form: 간이지급명세서
      when: >
        반기. 상반기 지급분은 7월 말일, 하반기 지급분은 다음 해 1월 말일까지.
        2027년 1월 지급분부터 매월 제출로 바뀐다.
    - type: 일용근로소득
      form: 일용근로소득 지급명세서
      when: 매월. 지급일이 속하는 달의 다음 달 말일까지 (간이지급명세서가 아니다)
    - type: 근로소득 · 퇴직소득 · 사업소득
      form: 지급명세서 (연간)
      when: 다음 해 3월 10일까지
    - type: 기타소득
      form: 지급명세서 (연간)
      when: 다음 해 2월 말일까지

  not_supported: >
    **이 서비스에서 만들 수 없는 서류가 있다.** 아래 세 가지는 홈택스에서 직접 신고해야 한다.
    메뉴에 없다고 안 내도 되는 것이 아니다. 안 내면 똑같이 가산세가 붙는다.
    해당하는 경우라면 달력에 따로 표시해 두는 편이 안전하다.

  file_at_hometax:
    - name: 근로소득 지급명세서 (연간)
      when: 다음 해 3월 10일까지
      who: 정규직·계약직 등 상용근로자에게 급여를 준 사업장
      note: >
        연말정산을 마친 뒤 내는 서류다. [급여관리] > [연말정산]에서도 나오지 않는다.
        홈택스에서 직접 제출한다.
    - name: 퇴직소득 지급명세서
      when: 다음 해 3월 10일까지
      who: 그해에 퇴직금을 지급한 사업장
      note: "[급여관리] > [퇴직지급]에서 계산과 지급은 하지만, 명세서는 나오지 않는다."
    - name: 간이 지급명세서 (기타소득)
      when: 지급일이 속하는 달의 다음 달 말일까지 (매월)
      who: 강연료·자문료 등 인적용역 기타소득을 준 사업장
      note: >
        2024년부터 매월 제출 대상이 됐지만 이 서비스는 지원하지 않는다.
        기타소득을 주는 일이 있다면 매월 홈택스에서 직접 낸다.

  which_menu:
    - paid: 정규직·계약직에게 급여를 줬다
      do: >
        매월 [원천징수 이행상황신고서].
        반기마다 [간이 지급명세서(근로)] — 상반기는 7월 말, 하반기는 다음 해 1월 말.
        연말정산 후 근로소득 지급명세서 — 다음 해 3월 10일. **홈택스에서 직접 제출.**
    - paid: 일용직에게 일당을 줬다
      do: >
        매월 [원천징수 이행상황신고서].
        매월 [일용근로소득 지급명세서] — 다음 달 말일.
    - paid: 프리랜서에게 3.3% 떼고 줬다
      do: >
        매월 [원천징수 이행상황신고서].
        매월 [간이 지급명세서(사업)] — 다음 달 말일.
        연 1회 [사업소득 지급명세서] — 다음 해 3월 10일.
    - paid: 강연료·자문료를 줬다
      do: >
        매월 [원천징수 이행상황신고서].
        연 1회 [기타소득 지급명세서] — 다음 해 2월 말일.
        인적용역 기타소득이면 간이지급명세서도 매월 대상이다. **홈택스에서 직접 제출.**
    - paid: 직원이 퇴사해 퇴직금을 줬다
      do: 퇴직소득 지급명세서 — 다음 해 3월 10일. **홈택스에서 직접 제출.**

  submit_method: >
    지급명세서 화면에는 **[홈택스 신고]** 버튼이 있어 바로 제출할 수 있다.
    파일을 받아 직접 올리려면 [신고파일 받기]를 쓴다.
    다만 [원천징수 이행상황신고서]는 파일을 받아 홈택스에 올리는 방식이다.
    같은 원천세 안에서도 서류마다 제출 방법이 다르니 화면의 버튼을 확인한다.

  after_payment: >
    신고하고 납부한 뒤가 남아 있다.
    부가세는 [부가세신고 목록]에서 거래반영을 누르면 장부에 자동으로 들어가지만,
    **원천세에는 그 기능이 없다.**
    납부한 세금을 [금융(입출금)] > [출금내역] > [4대보험/세금 납부확인]에서 직접 기록해야
    통장에서 나간 돈과 장부가 맞아떨어진다. 이걸 빠뜨리면 잔액이 계속 어긋난다.

  penalty: >
    기한을 넘기면 가산세가 붙는다. 지급명세서는 지급액의 1%,
    일용근로소득 지급명세서와 간이지급명세서는 0.25%다.
    늦더라도 빨리 내면 감면이 있다. 지급명세서는 3개월 이내 제출 시 절반,
    일용·간이지급명세서(사업소득·기타소득)는 1개월 이내 제출 시 절반이다.
    기한이 지났다고 미루면 감면 기회까지 놓친다.

  common_mistakes:
    - case: 세금은 냈는데 명세서를 안 냈다
      desc: 가장 흔하다. 원천징수이행상황신고서와 지급명세서류는 별개 의무다.
    - case: 3.3% 떼고 줬으니 끝인 줄 알았다
      desc: 사업소득은 간이지급명세서를 **매월** 내야 한다. 연 1회가 아니다.
    - case: 일용직도 간이지급명세서를 냈다
      desc: 일용직은 간이지급명세서가 아니라 일용근로소득 지급명세서다. 서식이 다르다.
    - case: 반기납부 승인을 받았으니 명세서도 반기로 내면 된다
      desc: 반기납부는 세금 납부에만 적용된다. 명세서 제출 주기는 그대로다.
    - case: 12월 급여를 1월에 줘서 1월에 넣었다
      desc: >
        귀속 시기와 지급 시기가 다르면 **귀속된 달** 기준으로 적는다.
        12월 근무분이면 12월로 잡는다.
    - case: 자금이 없어 급여를 미뤘으니 신고도 미뤘다
      desc: >
        지급 시기 의제가 적용되면 실제로 안 줬어도 준 것으로 본다.
        1~11월분은 12월 31일, 12월분은 다음 해 2월 말일이 기준이다.
    - case: 메뉴에 없으니 낼 서류가 없다고 생각했다
      desc: >
        근로소득 지급명세서, 퇴직소득 지급명세서, 간이지급명세서(기타소득)는
        이 서비스에서 만들 수 없다. 해당하면 홈택스에서 직접 내야 한다.
    - case: 계약서에 프리랜서라고 썼으니 3.3%면 된다고 생각했다
      desc: >
        계약서 문구가 아니라 실제 일한 방식으로 판단한다.
        실질이 근로자면 나중에 세금과 4대보험을 소급해 물 수 있다.

  relation_to_others: >
    같은 인건비인데 신고하는 곳이 둘이다.
    세금은 국세청(원천세·지급명세서), 보험은 공단(4대보험)이다.
    한쪽만 하고 끝냈다고 생각하지 않도록 주의한다.
    연말정산은 [급여관리] > [연말정산]에서 하고, 그 결과가 원천세 신고로 이어진다.

  common_faq:
    - q: 지급명세서와 간이지급명세서는 뭐가 다른가요?
      a: >
        지급명세서는 한 해치를 모아 내는 것이고, 간이지급명세서는 그보다 자주 내는 약식 자료입니다.
        둘은 별개라서 하나를 냈다고 다른 하나를 안 내도 되는 것이 아닙니다.
    - q: 프리랜서에게 3.3% 떼고 줬는데 뭘 더 내야 하나요?
      a: >
        다음 달 말일까지 간이지급명세서를 내야 합니다. 매월입니다.
        연말에 지급명세서도 따로 냅니다.
    - q: 일용직을 썼습니다.
      a: >
        일용근로소득 지급명세서를 매월 냅니다. 간이지급명세서가 아니라 별도 서식입니다.
    - q: 반기납부 승인을 받았습니다. 명세서도 반기로 내면 되나요?
      a: >
        아닙니다. 반기납부는 세금을 내는 주기에만 적용됩니다.
        사업소득 간이지급명세서는 그대로 매월 내야 합니다.
    - q: 연말정산을 마쳤는데 근로소득 지급명세서는 어디서 내나요?
      a: >
        이 서비스에서는 만들 수 없습니다. 홈택스에서 직접 제출하세요. 기한은 다음 해 3월 10일입니다.
    - q: 퇴직금을 줬는데 퇴직소득 지급명세서가 안 보입니다.
      a: >
        퇴직지급 화면에서는 계산과 지급만 합니다. 명세서는 홈택스에서 직접 냅니다. 기한은 3월 10일입니다.
    - q: 강연료를 줬는데 간이지급명세서 메뉴가 없습니다.
      a: >
        기타소득 간이지급명세서는 지원하지 않습니다. 매월 홈택스에서 직접 내야 합니다.
    - q: 기한을 놓쳤습니다.
      a: >
        바로 내는 것이 좋습니다. 지급명세서는 3개월, 일용·간이지급명세서(사업소득·기타소득)는
        1개월 안에 내면 가산세가 절반으로 줄어듭니다.

  sources: >
    국세청 원천세 안내 및 지급명세서 제출 안내 기준. 2026년 8월 확인.
    간이지급명세서(근로소득) 매월 제출은 시행이 유예되어 2027년 1월 지급분부터 적용된다.
    세법은 자주 바뀌므로 실제 신고 전에는 국세청 기준을 다시 확인한다.
