# 성공닷컴 사용자 매뉴얼 원본 — 공통 문서
# 자동수집 입력 6개 화면이 이 문서를 상속한다.

- doc_id: pattern-auto
  doc_name: 자동수집 입력 공통 사용법
  applies_to_pattern: 자동수집
  applies_count: 6
  purpose: >
    자동수집은 국세청·카드사·은행에 있는 자료를 직접 입력하지 않고 그대로 가져오는 기능이다.
    매출(전자세금계산서), 매출(카드), 매입(현금영수증) 등 여섯 화면이 모두 같은 방식으로 동작한다.
    무엇을 가져오느냐만 다르고, 쓰는 법은 같다.

  key_concept: >
    가져오기만 해서는 끝이 아니다. 이 화면은 **거쳐 가는 곳**이다.
    가져온 전표에 거래명을 정하고 [장부입력]을 눌러야 장부에 들어간다.
    장부에 들어간 전표는 이 화면에서 사라지고 [매출 / 매입]에서 보인다.
    그래서 이 화면에 남아 있는 것은 "아직 처리하지 않은 전표"라는 뜻이다.

  before_you_start: >
    자동수집은 등록된 통장과 카드에서 자료를 가져온다.
    왼쪽 메뉴의 [사업장 정보 관리] > [통장/카드 관리]에 먼저 등록해야 한다.
    등록이 안 되어 있으면 자료가 없는 것이 아니라 가져올 곳이 없는 것이다.

  layout:
    - zone: 왼쪽 — 수집된 자료
      desc: >
        국세청 홈택스나 카드사에서 가져온 자료가 나온다.
        거래일자, 거래처, 공급가액, 부가세, 합계, 품명, 거래명 선택, 메모 순으로 보인다.
        여기서 거래명을 정하고 [장부입력]을 누른다.
    - zone: 오른쪽 — 수취가 미확인된 목록
      desc: >
        아직 수취확인을 하지 않은 건이다.
        장부에 넣은 뒤 [수취확인]으로 처리한다.
    - zone: 왼쪽 메뉴의 숫자
      desc: >
        메뉴 이름 옆 붉은 숫자가 아직 처리하지 않은 건수다.
        이 숫자가 0이 되면 그 종류는 다 처리한 것이다.

  buttons:
    - name: 금융정보 자동수집
      desc: 가져오기를 실행합니다. 홈택스와 카드사에서 자료를 끌어옵니다.
    - name: 자동 분류
      desc: >
        같은 거래처(사업자등록번호가 같은 곳)에 예전에 쓴 거래명을 찾아 그대로 연결합니다.
        한 번 정해 둔 거래처는 다음부터 저절로 잡힙니다.
    - name: 일괄 분류
      desc: 고른 건들에 같은 거래명을 한꺼번에 지정합니다.
    - name: 장부입력
      desc: 고른 건을 장부에 넣습니다. 이때 이 목록에서 사라집니다.
    - name: 삭제 / 복구
      desc: 필요 없는 건을 지우거나 되살립니다.
    - name: 수취확인
      desc: 오른쪽 목록에서, 장부에 넣은 건을 확인 처리합니다.

  common_actions:
    - id: period
      name: 기간 정하기
      steps:
        - 가져올 기간을 고릅니다.
      note: 업체명이나 사업자번호로도 좁혀 볼 수 있습니다.

    - id: collect
      name: 자료 가져오기
      steps:
        - 오른쪽 위 [금융정보 자동수집]을 클릭합니다.
        - 가져오기가 끝나면 왼쪽 목록에 자료가 나타납니다.
      note: >
        수집이 안 되면 왼쪽 메뉴 [통장/카드 관리]에 등록이 되어 있는지,
        화면 위 [금융정보 자동조회] 설정이 켜져 있는지 확인합니다.

    - id: check
      name: 가져온 자료 확인하기
      steps:
        - 결과 목록에서 건별로 내용을 확인합니다.
      note: 가져온 자료가 곧바로 장부가 되지는 않습니다. 아래 세 단계를 마쳐야 합니다.

    - id: dealname
      name: 거래명 정하기
      steps:
        - 목록의 [거래명 선택]에서 그 거래에 맞는 거래명을 고릅니다.
        - 여러 건에 같은 거래명을 줄 때는 골라서 [일괄 분류]를 누릅니다.
        - "[자동 분류]를 누르면 시스템이 알아서 정해 줍니다."
      note: >
        거래명을 고르면 계정과목이 자동으로 정해집니다.
        그래서 거래명 선택이 곧 그 거래를 어떤 항목으로 볼지 정하는 일입니다.
        같은 거래처를 계속 거래한다면 처음 한 번만 정해 두면 됩니다.
        그다음부터는 [자동 분류]가 알아서 잡습니다.

    - id: receipt
      name: 수취확인 처리하기
      steps:
        - 오른쪽 목록에서 장부에 넣은 건을 고릅니다.
        - "[수취확인]을 클릭합니다."
      note: >
        장부입력을 먼저 하고 수취확인을 하는 것이 정상 순서입니다.
        화면 안내에도 "장부 입력 후 처리(수취확인) 바랍니다"라고 적혀 있습니다.

    - id: select
      name: 장부에 넣을 전표 고르기
      steps:
        - 왼쪽 선택칸에 표시해 장부에 넣을 전표를 고릅니다.
      note: 여러 건을 한꺼번에 고를 수 있습니다.

    - id: post
      name: 장부입력
      steps:
        - "[장부입력]을 클릭합니다."
      note: >
        누르는 순간 고른 전표가 이 화면에서 사라지고 [매출 / 매입]으로 넘어갑니다.
        사라졌다고 없어진 것이 아니라 장부로 들어간 것입니다.

    - id: delete
      name: 필요 없는 건 지우기
      steps:
        - 지울 건을 고르고 [삭제]를 누릅니다.
        - 잘못 지웠으면 [복구]로 되살립니다.
      note: 지운 것을 되살릴 수 있으니 크게 걱정할 일은 아닙니다.

  common_cautions:
    - "자동수집으로 들어온 자료는 내용을 고칠 수 없습니다. 고를 수 있는 것은 거래명뿐입니다."
    - "[장부입력]을 누르기 전에 거래명을 확인하세요. 거래명이 계정과목을 정하므로, 잘못 고르면 장부가 어긋납니다."
    - "가져오기만 하고 [장부입력]을 안 하면 장부에는 아무것도 안 들어갑니다. 이 화면에 남아 있는 전표는 아직 처리 전입니다."
    - "수집 결과가 비어 있다면 자료가 없는 것이 아니라 연결이 안 된 것일 수 있습니다. 먼저 연결 상태를 확인하세요."

  common_faq:
    - q: 자동수집을 눌렀는데 아무것도 안 나옵니다.
      a: >
        그 기간에 자료가 없거나, 가져올 곳과 연결이 안 되어 있는 경우입니다.
        [사업장 정보 관리]에서 등록 상태를 먼저 확인하세요.
    - q: 가져온 자료가 장부에 안 보입니다.
      a: >
        거래명을 고르고 전표를 선택한 뒤 [장부입력]을 눌러야 장부에 들어갑니다.
        누르기 전에는 이 화면에만 남아 있습니다.
    - q: 자동수집한 전표가 갑자기 목록에서 사라졌습니다.
      a: >
        [장부입력]을 눌러 장부로 넘어간 것입니다. [매출 / 매입]에서 확인하세요.
    - q: 가져온 금액이나 거래처가 틀렸는데 고칠 수 없습니다.
      a: >
        자동수집 자료는 가져온 곳의 내용을 그대로 보여주는 것이라 고칠 수 없습니다.
        고를 수 있는 것은 거래명뿐입니다.
    - q: 같은 자료가 두 번 들어갔습니다.
      a: 목록에서 그 건을 골라 [삭제]하면 됩니다. 잘못 지웠으면 [복구]로 되살립니다.
    - q: 왼쪽 메뉴 옆 숫자는 뭔가요?
      a: 아직 장부에 넣지 않은 건수입니다. 0이 되면 그 종류는 다 처리한 것입니다.
    - q: 거래명을 하나씩 고르기 번거롭습니다.
      a: >
        같은 거래처라면 [자동 분류]가 예전에 쓰던 거래명을 그대로 붙여 줍니다.
        여러 건에 같은 거래명을 줄 때는 골라서 [일괄 분류]를 쓰세요.
