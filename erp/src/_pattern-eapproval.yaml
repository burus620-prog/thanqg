# 성공닷컴 사용자 매뉴얼 원본 — 공통 문서
# 전자결재 9개 화면이 이 문서를 상속한다.

- doc_id: pattern-eapproval
  doc_name: 전자결재 공통 사용법
  applies_to_pattern: 결재
  applies_count: 9
  purpose: >
    전자결재는 종이로 돌리던 결재를 화면에서 처리하는 기능이다.
    문서를 올리면 정해진 사람들을 순서대로 거쳐 승인되거나 되돌아온다.

  key_concept: >
    **문서함이 여러 개인 이유는 문서가 여러 개여서가 아니다.**
    문서 하나가 처리 상태에 따라 이 함에서 저 함으로 옮겨 다니는 것이다.
    지금 내 문서가 어느 함에 있는지가 곧 그 문서의 상태다.

  flow:
    - step: ① 기안
      desc: 문서를 작성해 올린다. 올린 문서는 [기안문서]에 남는다.
    - step: ② 결재 대기
      desc: 결재할 차례가 된 사람의 [결재 대기문서]에 들어간다.
    - step: ③-1 완료
      desc: 모든 결재자가 승인하면 [결재 완료문서]로 간다.
    - step: ③-2 반려
      desc: 결재자가 되돌리면 기안자의 [반려문서]로 돌아온다. 고쳐서 다시 올린다.

  where_is_my_doc:
    - question: 내가 올린 문서를 보고 싶다
      answer: "[기안문서]"
    - question: 내가 결재해야 할 문서가 있는지 보고 싶다
      answer: "[결재 대기문서]. 여기 쌓이면 결재가 밀리는 중이다."
    - question: 결재가 끝난 문서를 찾고 싶다
      answer: "[결재 완료문서] 또는 [전자문서 보관함]"
    - question: 되돌아온 문서를 고치고 싶다
      answer: "[반려문서]에서 사유를 확인하고 다시 올린다."
    - question: 결재는 필요 없고 알리기만 한 문서
      answer: "[수신/회람]"
    - question: 잘못 지웠다
      answer: "[휴지통]에서 되살린다."

  before_you_start: >
    처음 쓸 때는 [관리설정]부터 한다.
    ① [결재라인 관리]에서 결재선을 만든다. 결재자·회람·수신을 지정한다.
    ② [문서양식 관리]에서 자주 쓰는 서식을 등록한다.
    **결재선이 없으면 문서를 올릴 수 없다.**

  common_actions:
    - id: find
      name: 문서 찾기
      steps:
        - 유형·상태·기간·제목으로 조회합니다.
      note: >
        어느 함에 있는지 모르겠으면 [전자문서 보관함]에서 찾습니다.
        결재 문서만 보려면 [수신/회람문서 제외]를 체크합니다.

    - id: write
      name: 새 문서 올리기
      steps:
        - "[전자문서 보관함]에서 오른쪽 위 [새 결재 작성]을 클릭합니다."
        - 문서양식을 고르고 내용을 씁니다.
        - 결재선을 고르고 올립니다.
      note: 결재선과 문서양식이 미리 만들어져 있어야 합니다.

    - id: approve
      name: 결재하기
      steps:
        - "[결재 대기문서]에서 문서를 엽니다."
        - 내용을 확인하고 승인하거나 반려합니다.
      note: 반려할 때는 사유를 적습니다. 기안자가 그것을 보고 고칩니다.   # 확인필요: 사유 입력 필수 여부

    - id: rewrite
      name: 반려된 문서 다시 올리기
      steps:
        - "[반려문서]에서 문서를 엽니다."
        - 반려 사유를 확인하고 내용을 고쳐 다시 올립니다.
      note: null   # 확인필요: 새로 쓰는지, 기존 문서를 고쳐 올리는지

  common_cautions:
    - "결재가 끝난 문서는 고칠 수 없습니다. 잘못됐다면 새로 올려야 합니다."
    - "결재라인을 바꿔도 이미 진행 중인 문서에는 반영되지 않을 수 있습니다."   # 확인필요
    - "수신/회람은 결재가 아닙니다. 승인이 필요한 일이면 기안으로 올려야 합니다."

  common_faq:
    - q: 문서를 올렸는데 결재가 안 됩니다.
      a: >
        결재자의 [결재 대기문서]에 들어가 있습니다. 그 사람이 처리해야 넘어갑니다.
        결재라인이 잘못 지정되지 않았는지도 확인하세요.
    - q: 반려됐습니다.
      a: "[반려문서]에서 사유를 확인하고 고쳐서 다시 올리면 됩니다. 문서가 사라진 것이 아닙니다."
    - q: 결재 완료문서와 전자문서 보관함은 뭐가 다른가요?
      a: null   # 확인필요: 두 화면의 실제 차이
    - q: 회람으로 돌렸는데 승인이 안 됩니다.
      a: 회람은 알리는 것이라 승인 절차가 없습니다. 승인이 필요하면 기안으로 올리세요.
