# 성공닷컴 사용자 매뉴얼 원본 — 공통 문서
# 엑셀 입력 6개 화면이 이 문서를 상속한다.

- doc_id: pattern-excel
  doc_name: 엑셀(전표) 입력 공통 사용법
  applies_to_pattern: 엑셀
  applies_count: 6
  purpose: >
    엑셀(전표) 입력은 자동수집으로 안 들어오는 자료를 파일로 한꺼번에 올리는 곳이다.
    전자(세금)계산서, 카드지출, 카드 매출, 매출·매입 현금영수증, 통장입출금 여섯 화면이
    모두 같은 방식으로 동작한다.

  key_concept: >
    올린 자료가 곧바로 장부가 되지는 않는다.
    **자동수집과 똑같은 흐름을 탄다.**
    파일을 올려 목록에 채우고 → 거래명을 정하고 → [장부입력]을 눌러야 장부에 들어간다.
    그래서 이 화면은 "자료를 넣는 방법만 다른 자동수집"이라고 보면 된다.

  when_to_use: >
    자동수집이 되는 자료는 자동수집을 쓰는 편이 낫다. 손이 덜 가고 틀릴 일도 적다.
    엑셀 입력은 자동수집 범위 밖의 자료나, 이미 엑셀로 정리해 둔 자료를 넣을 때 쓴다.

  layout:
    - zone: 조회 조건
      desc: 구분, 처리 상태(미처리 등), 기간으로 목록을 좁힌다. [상세검색]으로 더 세밀하게 볼 수 있다.
    - zone: 목록
      desc: >
        구분, 거래일, 거래처명, 공급가액, 부가세, 합계, 공제여부, 거래명 선택, 비고 순으로 나온다.
        건수는 오른쪽 위에 "선택 N건 / 전체 N건"으로 표시된다.
    - zone: 왼쪽 메뉴의 숫자
      desc: 메뉴 이름 옆 붉은 숫자가 아직 장부에 넣지 않은 건수다.

  buttons:
    - name: 엑셀 가져오기
      desc: >
        정리해 둔 엑셀 파일을 올립니다.
        일자, 거래처명, 사업자등록번호, 공급가액, 부가세, 합계금액을 읽어 전표로 만듭니다.
    - name: 과세유형
      desc: >
        고른 전표의 거래처가 어떤 사업자인지 홈택스에서 조회해 자동으로 넣습니다.
        간이사업자·과세사업자·면세사업자를 가려 저장합니다.
    - name: 자동 분류
      desc: >
        같은 거래처(사업자등록번호가 같은 곳)에 예전에 쓴 거래명을 찾아 그대로 연결합니다.
        한 번 정해 둔 거래처는 다음부터 저절로 잡힙니다.
    - name: 일괄 분류
      desc: 고른 건들에 같은 거래명을 한꺼번에 지정합니다.
    - name: 장부입력
      desc: 고른 건을 장부에 넣습니다. 이때 목록에서 사라집니다.
    - name: 삭제
      desc: 필요 없는 건을 지웁니다.

  common_actions:
    - id: upload
      name: 엑셀 파일 올리기
      steps:
        - 오른쪽 위 [엑셀 가져오기]를 클릭합니다.
        - 정리해 둔 엑셀 파일을 골라 올립니다.
      note: >
        전표를 만드는 데 필요한 항목은 여섯 가지입니다.
        일자, 거래처명, 사업자등록번호, 공급가액, 부가세, 합계금액.
        **사업자등록번호가 특히 중요합니다.** 이 번호로 과세유형을 조회하고,
        예전에 쓰던 거래명도 이 번호로 찾아 연결합니다.

    - id: taxtype
      name: 과세유형 조회하기
      steps:
        - 전표를 고르고 [과세유형]을 클릭합니다.
      note: >
        거래처가 간이·과세·면세 중 어디에 해당하는지 홈택스에서 조회해 자동으로 넣습니다.
        직접 판단할 필요가 없습니다.

    - id: check
      name: 올린 내용 확인하기
      steps:
        - 목록에서 거래일, 거래처, 금액이 맞는지 확인합니다.
      note: 처리 상태를 [미처리]로 걸러 보면 아직 장부에 안 넣은 것만 나옵니다.

    - id: dealname
      name: 거래명 정하기
      steps:
        - "[거래명 선택]에서 그 전표에 맞는 거래명을 고릅니다."
        - 여러 건에 같은 거래명을 줄 때는 골라서 [일괄 분류]를 누릅니다.
        - "[자동 분류]를 누르면 예전에 같은 거래처에 쓰던 거래명이 그대로 붙습니다."
      note: >
        거래명이 곧 계정과목입니다. 여기서 고른 값이 재무제표와 신고까지 이어집니다.
        같은 거래처를 계속 거래한다면 처음 한 번만 제대로 정해 두면 됩니다.
        그다음부터는 [자동 분류]가 알아서 잡습니다.

    - id: deduction
      name: 공제 여부 확인하기
      steps:
        - "[과세유형]을 조회하면 공제여부가 함께 정해집니다."
      note: >
        과세사업자에게 받은 것은 공제, 간이사업자나 면세사업자에게 받은 것은 불공제로 잡힙니다.
        거래처가 어떤 사업자인지에 따라 자동으로 갈리므로 직접 고를 일은 많지 않습니다.

    - id: post
      name: 장부입력
      steps:
        - 장부에 넣을 건을 고릅니다.
        - "[장부입력]을 클릭합니다."
      note: 누르면 이 목록에서 사라지고 [매출 / 매입]으로 넘어갑니다.

  common_cautions:
    - "올리기만 하고 [장부입력]을 안 하면 장부에는 아무것도 안 들어갑니다."
    - "엑셀에 사업자등록번호가 없으면 과세유형 조회도 자동 분류도 안 됩니다. 이 열은 꼭 채우세요."
    - "과세유형이 정해지면 공제여부가 따라 정해집니다. 임의로 바꾸기 전에 거래처가 어떤 사업자인지 확인하세요."
    - "같은 파일을 두 번 올리면 같은 자료가 두 번 들어갈 수 있습니다. 목록에서 확인하고 [삭제]로 지웁니다."

  common_faq:
    - q: 자동수집과 엑셀 입력 중 뭘 써야 하나요?
      a: >
        자동수집이 되는 자료는 자동수집을 쓰세요. 엑셀 입력은 그 범위 밖의 자료를 넣을 때 씁니다.
    - q: 파일을 올렸는데 장부에 안 보입니다.
      a: 올리는 것과 장부에 넣는 것은 다른 단계입니다. 거래명을 정하고 [장부입력]을 누르세요.
    - q: 잘못 올린 자료를 지우려면?
      a: 목록에서 그 건을 골라 [삭제]를 누릅니다.
    - q: 공제여부는 뭘 고르나요?
      a: >
        직접 고르지 않아도 됩니다. [과세유형]을 조회하면 자동으로 정해집니다.
        과세사업자면 공제, 간이나 면세사업자면 불공제입니다.
    - q: 거래명을 매번 고르기 번거롭습니다.
      a: >
        같은 거래처라면 [자동 분류]가 예전에 쓰던 거래명을 그대로 붙여 줍니다.
        처음 한 번만 제대로 정해 두면 됩니다.
    - q: 엑셀에 어떤 항목이 있어야 하나요?
      a: >
        일자, 거래처명, 사업자등록번호, 공급가액, 부가세, 합계금액이 필요합니다.
        사업자등록번호가 빠지면 과세유형 조회와 자동 분류가 되지 않습니다.
