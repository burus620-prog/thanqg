# 성공닷컴 사용자 매뉴얼 원본 — 공통 문서
# 기타금융자산 5개 화면이 이 문서를 상속한다.

- doc_id: pattern-finasset
  doc_name: 기타금융자산 공통 사용법
  applies_to_pattern: 대장
  applies_count: 4
  purpose: >
    대출금, 대여금, 현금출납장, 어음대장은 매출·매입에 잡히지 않는
    돈의 움직임을 따로 관리하는 화면이다.
    물건을 팔고 사는 거래가 아니어서 [매출 / 매입]에 안 들어오지만,
    재무상태표에는 반드시 나와야 하는 것들이다.

  key_concept: >
    다섯 화면은 다루는 대상이 다르지만 쓰는 방식이 같다.
    ① 대상을 등록한다 (예금 계좌, 대출 건, 어음 한 장)
    ② 움직임을 기록한다 (이자 입금, 원금 상환, 어음 결제)
    ③ 현재 잔액이나 남은 금액을 확인한다

  what_goes_where:
    - item: 대출금(차입금)
      desc: 은행이나 남에게 빌린 돈. 갚을 때마다 원금과 이자를 나눠 기록한다.
    - item: 대여금
      desc: 남에게 빌려준 돈. 돌려받을 때마다 기록한다.
    - item: 현금출납장
      desc: 통장을 거치지 않고 현금으로 오간 돈.
    - item: 어음대장
      desc: 받은 어음과 발행한 어음. 만기와 결제 여부를 관리한다.

  common_actions:
    - id: register
      name: 새로 등록하기
      steps:
        - 등록 화면에서 기본 정보를 입력합니다.
      note: null   # 확인필요: 필수 입력 항목

    - id: record
      name: 움직임 기록하기
      steps:
        - 등록한 건을 열어 입금·출금·상환 내역을 기록합니다.
      note: null   # 확인필요: 통장 입출금과 자동으로 연결되는지

    - id: balance
      name: 잔액 확인하기
      steps:
        - 목록에서 현재 잔액과 남은 금액을 확인합니다.
      note: 여기 잔액이 재무상태표로 이어집니다.

  common_cautions:
    - "여기 등록하지 않으면 재무상태표에서 빠집니다. 대출이 있는데 재무상태표에 안 나오면 그 이유입니다."
    - "대출금 상환은 원금과 이자를 나눠 기록해야 합니다. 한꺼번에 넣으면 이자비용이 잡히지 않습니다."   # 확인필요
    - "현금출납장은 통장 자료가 자동으로 안 들어옵니다. 현금 거래는 직접 기록해야 합니다."   # 확인필요

  common_faq:
    - q: 대출을 받았는데 어디에 넣나요?
      a: "[기타(금융) 자산] > [대출금(차입금,빌린돈)]에 등록합니다. 매입이 아니므로 매출/매입에는 넣지 않습니다."
    - q: 등록하지 않으면 어떻게 되나요?
      a: 재무상태표에 그 금액이 빠집니다. 자산과 부채가 실제와 달라집니다.
    - q: 이자는 어디에 기록하나요?
      a: null   # 확인필요: 이자 처리 위치
