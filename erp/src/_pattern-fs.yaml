# 성공닷컴 사용자 매뉴얼 원본 — 공통 문서
# 재무제표 7개 화면이 이 문서를 상속한다.

- doc_id: pattern-fs
  doc_name: 재무제표 공통 사용법
  applies_to_pattern: 재무제표
  applies_count: 7
  purpose: >
    재무제표는 지금까지 넣은 거래를 회계 서식에 맞춰 보여주는 곳이다.
    기간이나 시점을 정해 조회하고, 필요하면 출력하거나 내려받는다.

  key_concept: >
    **여기서 숫자를 고칠 수는 없다.** 앞 단계에서 넣은 거래가 그대로 모여 나온 결과다.
    숫자가 이상하면 재무제표가 아니라 거래를 봐야 한다.
    어디를 봐야 하는지는 [보고서 공통 사용법]의 증상별 표를 참고한다.

  what_each_shows:
    - name: 재무상태표
      desc: >
        **어느 시점에** 무엇을 가지고 있고(자산) 얼마를 갚아야 하는지(부채) 보여준다.
        사진 한 장처럼 특정 날짜의 상태다.
    - name: 손익계산서
      desc: >
        **일정 기간 동안** 얼마를 벌고 얼마를 썼는지 보여준다.
        영상처럼 기간의 움직임이다.
    - name: 합계잔액시산표
      desc: 모든 계정과목의 합계와 잔액을 한 표에 모은 것. 장부가 맞게 짜였는지 확인할 때 본다.
    - name: 제조원가명세서
      desc: 제조업에서 제품을 만드는 데 들어간 원가를 정리한 것.
    - name: 공사원가명세서
      desc: 건설업에서 공사에 들어간 원가를 정리한 것.
    - name: 부속명세서
      desc: 재무제표의 항목을 뒷받침하는 세부 내역.
    - name: 전기 재무상태표 등록
      desc: 조회 화면이 아니라 입력 화면. 지난해 말 잔액을 넣어 올해의 출발점을 만든다.

  before_you_start: >
    서비스를 처음 쓴다면 [전기 재무상태표 등록]을 먼저 해야 한다.
    지난해 말 잔액이 없으면 올해 재무상태표의 이월 금액이 비고, 전년도와 비교할 수도 없다.

  common_actions:
    - id: period
      name: 기간이나 시점 정하기
      steps:
        - 네 가지 방식 중 하나로 조회 범위를 정합니다.
        - "[보고서보기]를 클릭합니다."
      note: >
        · **기수 지정** — 제25기처럼 사업연도 단위로 봅니다. 기본값입니다.
        · **일자 지정** — 특정 날짜까지로 봅니다.
        · **분기 지정** — 연도와 분기를 골라 봅니다.
        · **월 지정** — 연도와 월을 골라 봅니다.

    - id: prev
      name: 전기분 반영 여부 정하기
      steps:
        - "[전기분 반영] 또는 [전기분 미반영]을 고릅니다."
      note: >
        전기분을 반영하면 지난해 숫자와 나란히 볼 수 있습니다.
        비교하려면 [전기 재무상태표 등록]에 지난해 잔액이 들어가 있어야 합니다.

    - id: export
      name: 출력하거나 내려받기
      steps:
        - 화면의 출력 또는 엑셀 내려받기를 사용합니다.
      note: 대출 심사나 입찰에 낼 때는 어느 시점 기준인지 함께 확인합니다.

  common_cautions:
    - "월 중에 본 숫자는 아직 미완입니다. 그 달의 거래가 다 들어간 뒤에 봐야 맞습니다."
    - "제조원가명세서와 공사원가명세서는 업종에 따라 쓰는 서식입니다. 해당하지 않으면 비어 있는 것이 정상입니다."
    - "전기 재무상태표를 등록하지 않으면 이월 잔액이 잡히지 않습니다. 처음 도입할 때 반드시 확인하세요."

  common_faq:
    - q: 재무상태표와 손익계산서는 뭐가 다른가요?
      a: >
        재무상태표는 어느 시점의 상태를 보여주고, 손익계산서는 일정 기간의 결과를 보여줍니다.
        전자는 사진, 후자는 영상이라고 생각하면 쉽습니다.
    - q: 제조원가명세서가 비어 있습니다.
      a: 제조업이 아니면 비어 있는 것이 정상입니다.
    - q: 작년 숫자가 안 나옵니다.
      a: "[전기 재무상태표 등록]에 지난해 말 잔액을 넣었는지 확인하세요."
    - q: 재무제표를 은행에 내야 합니다.
      a: >
        [보고서보기]로 조회한 뒤 출력하거나 엑셀로 내려받습니다.
        어느 시점 기준인지 함께 확인하세요.
    - q: 분기별로 손익을 보고 싶습니다.
      a: 조회 방식에서 [분기 지정 방식]을 고르고 연도와 분기를 정하세요.
