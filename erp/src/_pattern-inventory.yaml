# 성공닷컴 사용자 매뉴얼 원본 — 공통 문서
# 영업(재고) 관리 5개 화면이 이 문서를 상속한다.

- doc_id: pattern-inventory
  doc_name: 영업(재고) 관리 공통 사용법
  applies_to_pattern: 재고
  applies_count: 5
  purpose: >
    물건을 사서 팔거나 만들어 파는 사업에서, 무엇이 얼마나 들어오고 나갔으며
    지금 얼마나 남았는지를 관리하는 곳이다.

  screens_at_a_glance:
    - name: 거래명세서 입력 / 관리
      desc: 명세서를 쓰고 [장부입력]으로 전표와 재고에 함께 반영한다.
    - name: 영업일보
      desc: 재고가 아니라 거래처 영업 활동을 기록하는 곳이다.
    - name: 입고 / 출고 현황
      desc: 거래에서 자동으로 만들어진 입출고 내역을 조회한다.
    - name: 상품 등록 / 관리
      desc: 취급 품목을 등록하고 재고 수량을 확인한다.
    - name: 상품별 매입매출 관리
      desc: 상품마다 얼마나 사고 팔았는지 집계해 본다.

  who_needs_this: >
    **도소매업과 제조업처럼 물건을 다루는 업종에서 쓴다.**
    서비스업이나 프리랜서처럼 재고가 없는 사업이라면 이 메뉴는 보지 않아도 된다.
    쓰지 않는다고 다른 기능에 문제가 생기지는 않는다.

  where_is_the_menu: >
    **이 메뉴는 처음에는 상단 메뉴에 없다.**
    화면 오른쪽 위 아이콘 중 [성공 앱]을 열고 [영업(재고)관리]를 클릭하면
    상단 메뉴 줄에 나타난다. 한 번 켜 두면 이후에는 계속 보인다.
    재고 관리 기능을 찾지 못했다면 대개 이걸 안 켠 것이다.

  key_concept: >
    **재고를 따로 맞추지 않는다.**
    거래를 등록하면 재고가 자동으로 따라 움직인다.
    매입을 넣으면 입고, 매출을 넣으면 출고로 잡힌다.
    그래서 이 메뉴에서 하는 일은 재고를 손으로 세는 것이 아니라,
    거래를 제대로 넣고 그 결과를 확인하는 것이다.

  how_it_connects:
    - path: 거래명세서로 넣기
      desc: >
        [거래명세서 입력]에서 품목과 수량을 적고 [장부입력]을 누르면
        전표가 등록되면서 재고도 함께 반영된다.
    - path: 전표로 넣기
      desc: "[매출 / 매입]에서 전표를 등록해도 같은 방식으로 재고에 반영된다."
    - path: 재무제표로 이어짐
      desc: >
        재고 금액은 재무제표에 반영된다.
        남은 재고는 자산으로 잡히고, 팔린 만큼은 원가로 넘어간다.
        재고가 틀리면 손익도 틀어진다.

  setup_first: >
    시작하기 전에 [상품 등록 / 관리]에 취급 품목을 등록한다.
    등록해 두면 거래명세서를 쓸 때 검색으로 불러올 수 있고,
    상품별로 매입매출과 재고가 집계된다.
    등록하지 않으면 매번 새로 적어야 하고 상품별 집계도 되지 않는다.

  common_actions:
    - id: search
      name: 기간으로 조회하기
      steps:
        - 기간을 정하고 조회합니다.
      note: null

    - id: export
      name: 출력하거나 내려받기
      steps:
        - 화면의 출력 또는 내려받기를 사용합니다.
      note: 거래명세서는 거래처에 주는 서류이므로 출력할 일이 많습니다.

  common_cautions:
    - "재고를 이 메뉴에서 직접 고치는 것이 아니라, 거래를 바로잡아야 재고가 맞습니다."
    - "재고 금액이 재무제표에 들어갑니다. 재고가 실제와 다르면 손익과 자산이 함께 틀어집니다."
    - "거래명세서를 작성만 하고 [장부입력]을 안 하면 장부에도 재고에도 반영되지 않습니다."

  common_faq:
    - q: 상단 메뉴에 영업(재고) 관리가 없습니다.
      a: >
        오른쪽 위 [성공 앱]을 열고 [영업(재고)관리]를 클릭하면 상단 메뉴에 나타납니다.
        한 번 켜 두면 계속 보입니다.
    - q: 우리는 물건을 안 파는데 이 메뉴를 써야 하나요?
      a: >
        쓰지 않아도 됩니다. 도소매업과 제조업처럼 재고가 있는 업종을 위한 기능입니다.
    - q: 재고 수량이 실제와 다릅니다.
      a: >
        재고를 직접 고치는 것이 아니라 거래를 확인해야 합니다.
        빠뜨린 매입이나 매출이 있는지, 장부입력을 안 한 거래명세서가 있는지 보세요.
    - q: 거래명세서를 쓰면 매출도 잡히나요?
      a: >
        네. [장부입력]을 누르면 전표로 등록되면서 매출과 재고가 함께 반영됩니다.
    - q: 상품을 등록하지 않고 거래명세서를 쓸 수 있나요?
      a: null   # 확인필요: 신규 표시로 바로 등록되는지
