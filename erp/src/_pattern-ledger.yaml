# 성공닷컴 사용자 매뉴얼 원본 — 공통 문서
# 매출관리 4개 + 매입관리 4개 화면이 이 문서를 상속한다.

- doc_id: pattern-ledger
  doc_name: 매출·매입 관리 공통 사용법
  applies_to_pattern: 장부
  applies_count: 12
  purpose: >
    매출·매입 관리는 장부에 들어온 거래를 확인하고 손보는 곳이다.
    매출 네 화면과 매입 네 화면이 모두 같은 방식으로 동작하며,
    무엇을 다루느냐만 다르고 쓰는 법은 같다.

  relation: >
    거래(전표)입력과 헷갈리기 쉬운데 역할이 다르다.
    [거래(전표) 입력]은 자료를 **가져오는** 곳이고,
    [매출 / 매입]은 가져온 자료를 **확인하고 고치고 관리하는** 곳이다.
    자동수집한 전표는 [장부입력]을 누른 뒤에야 여기로 넘어온다.
    거래(전표)입력 화면에서 사라졌다면 이곳에 들어온 것이다.

  layout:
    - zone: 조회 조건
      desc: >
        기간으로 찾고, [하위거래] [예상거래] [미발행 / 미수취] [차액조회]로 좁힌다.
        [미발행 / 미수취]는 매출과 매입에서 뜻이 다르다.
        매출은 세금계산서를 아직 발행하지 않은 건, 매입은 아직 받지 못한 건이다.
    - zone: 요약 줄
      desc: >
        **매출(미수·입금·총합계)과 매입(미지급·지급·총합계)이 나란히 나온다.**
        지금 못 받은 돈과 안 준 돈이 얼마인지 한눈에 보인다.
    - zone: 목록
      desc: >
        확정 여부, 구분, 날짜, 거래처, 공급가액, 부가세, 합계, 잔액(외상),
        적요, 결제수단, 등록일시, 등록자가 나온다.

  common_actions:
    - id: period
      name: 기간으로 조회하기
      steps:
        - 조회할 기간을 정하고 조회합니다.
      note: >
        달력에서 날짜를 직접 고를 수도 있고, 월·분기·반기 버튼으로 한 번에 맞출 수도 있습니다.
        부가세 신고 단위에 맞춰 보는 일이 많습니다.
        분기나 반기로 맞춰 두면 신고할 때 그대로 씁니다.

    - id: check
      name: 거래 내용 확인하기
      steps:
        - 목록에서 건별로 거래일, 거래처, 금액을 확인합니다.
      note: >
        자동수집으로 들어온 자료도 확인이 필요합니다.
        가져왔다는 것과 내용이 맞다는 것은 다릅니다.

    - id: classify
      name: 거래명 지정하기
      steps:
        - 목록에서 거래명을 고릅니다.
      note: >
        거래명을 고르면 계정과목이 자동으로 정해집니다.
        따로 계정과목을 고를 필요가 없고, 거래명만 제대로 고르면 됩니다.
        여기서 정해진 계정과목이 재무제표와 세무신고까지 이어집니다.

    - id: edit
      name: 거래 고치기
      steps:
        - 고칠 건을 선택해 내용을 수정합니다.
      note: >
        자동수집으로 들어온 거래는 금액이나 거래처를 고칠 수 없습니다.
        가져온 곳의 자료를 그대로 담고 있기 때문입니다. 고칠 수 있는 것은 거래명입니다.
        직접 등록한 거래는 내용을 수정할 수 있습니다.

    - id: add
      name: 거래 직접 넣기
      steps:
        - 자동으로 안 들어오는 거래는 직접 등록합니다.
      note: 기타영수증 화면이 주로 이 용도입니다.

    - id: issue
      name: 세금계산서 발행하기
      steps:
        - 발행할 전표를 고릅니다.
        - "[매출 세금계산서 발행]을 클릭합니다."
      note: null   # 확인필요: 발행 후 처리 방식

    - id: settle
      name: 외상 갚기·받기
      steps:
        - 처리할 건을 고르고 [갚기/받기]를 클릭합니다.
      note: >
        [금융(입출금)]의 수납·지급 확인과 **같은 일**입니다.
        화면 구성만 다를 뿐이니 편한 쪽에서 하시면 됩니다.

    - id: bulk
      name: 여러 건 한꺼번에 바꾸기
      steps:
        - 대상을 고르고 [일괄변경]을 클릭합니다.
      note: 거래명이나 항목을 여러 건에 한꺼번에 적용할 때 씁니다.

    - id: excel
      name: 엑셀로 내려받기
      steps:
        - 조회된 목록을 엑셀로 저장합니다.
      note: 조회 조건이 걸린 상태로 저장되므로, 범위를 먼저 좁힙니다.

  common_cautions:
    - "여기서 고친 내용은 재무제표와 세무신고에 그대로 반영됩니다. 신고 후에 고치면 신고 내용과 어긋납니다."
    - "거래명을 비워 두면 그 거래가 어느 항목으로 잡히는지 알 수 없습니다."   # 확인필요: 미지정 시 처리
    - "같은 거래가 두 번 보이면 자동수집과 직접 입력이 겹친 경우입니다."   # 확인필요: 지우는 방법

  common_faq:
    - q: 거래(전표)입력과 매출/매입은 뭐가 다른가요?
      a: >
        거래(전표)입력은 자료를 가져오는 곳이고, 매출/매입은 가져온 자료를 확인하고 관리하는 곳입니다.
        가져오기를 마쳤으면 이 화면에서 내용을 확인하세요.
    - q: 자동수집으로 넣은 거래가 여기 안 보입니다.
      a: >
        [거래(전표) 입력]에서 [장부입력]을 눌렀는지 확인하세요.
        누르기 전에는 그 화면에만 남아 있고 이곳으로 넘어오지 않습니다.
    - q: 거래명은 꼭 지정해야 하나요?
      a: >
        지정하는 편이 좋습니다. 거래명에 따라 그 거래가 어떤 항목으로 집계되고,
        보고서와 세무신고에 어떻게 반영될지가 달라집니다.
    - q: 카드로 산 물건인데 매출에 잡혀 있습니다.
      a: >
        [거래전표 관리]에서 그 건을 찾아 수정하거나, 여러 건이면 [일괄변경]을 쓰세요.
    - q: "[미발행]과 [미수취]가 무슨 뜻인가요?"
      a: >
        매출 미발행은 전표는 있는데 세금계산서를 아직 발행하지 않은 것이고,
        매입 미수취는 전표는 있는데 세금계산서를 아직 받지 못한 것입니다.
        매입을 못 받으면 매입세액 공제를 받지 못하니 거래처에 확인하세요.
    - q: 못 받은 돈이 얼마인지 보고 싶습니다.
      a: >
        [거래전표 관리] 위쪽 요약 줄에 매출 미수 금액이 나옵니다.
        거래처별로 보려면 [보고서] > [채권채무 보고서]를 봅니다.
