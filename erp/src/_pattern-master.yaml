# 성공닷컴 사용자 매뉴얼 원본 — 공통 문서
# 왼쪽 메뉴 기준정보 10개 화면이 이 문서를 상속한다.

- doc_id: pattern-master
  doc_name: 기준정보 설정 공통 사용법
  applies_to_pattern: 기준정보
  applies_count: 10
  purpose: >
    왼쪽 메뉴에 모인 화면들은 **다른 메뉴가 돌아가기 위한 사전 준비**다.
    거래를 입력하고 신고를 하는 곳이 아니라, 그 일이 제대로 되도록 미리 정해 두는 곳이다.

  key_concept: >
    여기가 비어 있으면 뒤가 안 돌아간다.
    통장이 등록되어 있지 않으면 자동수집이 아무것도 못 가져오고,
    거래명이 없으면 거래를 입력해도 어느 항목으로 잡을지 정할 수 없다.
    **처음 도입할 때 여기부터 채우는 것이 순서다.**

  setup_order:
    - step: ① 사업장 정보
      desc: 사업자등록증의 내용을 등록한다. 모든 서식과 신고에 쓰인다.
    - step: ② 신고 정보
      desc: >
        과세형태(일반·간이·면세), 부가세신고방법, 의제매입 공제율 등을 정한다.
        부가세 신고서가 이 설정을 그대로 가져다 쓴다.
    - step: ③ 통장/카드 관리
      desc: 자동수집에 쓸 통장과 카드를 등록한다. 이것이 없으면 자동수집이 비어 있다.
    - step: ④ 거래명 만들기
      desc: 우리 사업에 맞는 거래명을 만든다. 거래명이 계정과목을 정한다.
    - step: ⑤ 거래처 등록
      desc: 자주 거래하는 상대방을 등록한다. 채권채무 관리의 기준이 된다.
    - step: ⑥ 사용자 관리
      desc: 이 서비스를 쓸 사람과 권한을 정한다.
    - step: ⑦ 그 밖에
      desc: 자산, 사업/프로젝트, 부동산 임대는 해당하는 경우에만 등록한다.

  what_breaks_without_it:
    - missing: 통장/카드가 등록되지 않았다
      result: 자동수집을 눌러도 자료가 안 들어온다. 자료가 없는 것이 아니라 가져올 곳이 없는 것이다.
    - missing: 거래명이 없거나 부실하다
      result: 거래를 입력해도 계정과목이 안 정해지고, 비용 현황을 봐도 무슨 돈인지 알 수 없다.
    - missing: 거래처가 등록되지 않았다
      result: 채권채무 보고서와 수납·지급 확인에서 거래처별로 묶이지 않는다.
    - missing: 자산이 등록되지 않았다
      result: 감가상각비가 잡히지 않아 손익이 실제와 달라진다.
    - missing: 전기 재무상태표를 등록하지 않았다
      result: >
        올해 장부에 이월 잔액이 없다. 이건 [세무 · 회계] > [전기 재무상태표 등록]에서 한다.

  common_actions:
    - id: add
      name: 새로 등록하기
      steps:
        - 오른쪽 위 [등록]을 클릭해 내용을 넣고 저장합니다.
      note: >
        별표(＊)가 붙은 항목은 반드시 채워야 합니다.
        사업장 정보와 신고 정보에 특히 많습니다.

    - id: bulk
      name: 한꺼번에 넣기
      steps:
        - 거래처는 [홈택스 거래처 가져오기]나 [엑셀일괄등록]을 쓸 수 있습니다.
      note: 처음 시작할 때 하나씩 넣지 말고 이 방법을 먼저 써 보세요.

    - id: edit
      name: 고치기
      steps:
        - 목록에서 대상을 골라 내용을 수정합니다.
      note: >
        이미 쌓인 거래에 어떻게 반영되는지는 항목마다 다릅니다.
        자산이나 임대차처럼 이력이 중요한 것은 삭제하지 말고
        [폐기/처분]이나 [연장/변경]으로 처리합니다.

  common_cautions:
    - "여기서 정한 것이 다른 모든 메뉴의 기준이 됩니다. 나중에 바꾸면 이미 쌓인 자료와 어긋날 수 있습니다."
    - "사업장 정보와 신고 정보가 틀리면 신고 서류가 통째로 틀립니다. 등록할 때 사업자등록증과 대조하세요."
    - "사용자 관리에서 권한을 넓게 열면 급여와 개인정보가 함께 노출됩니다. 꼭 필요한 사람에게만 주세요."

  common_faq:
    - q: 처음 시작하는데 어디부터 해야 하나요?
      a: >
        사업장 정보 → 신고 정보 → 통장/카드 → 거래명 → 거래처 순서로 채우세요.
        그 뒤에 [거래(전표) 입력]으로 넘어가면 됩니다.
    - q: 자동수집이 아무것도 안 가져옵니다.
      a: "[통장/카드 관리]에 통장과 카드가 등록되어 있는지 먼저 확인하세요."
    - q: 거래명을 나중에 바꿔도 되나요?
      a: >
        바꿀 수는 있지만, 그 거래명을 이미 쓴 거래들이 함께 영향을 받습니다.
        회계 항목이 달라지면 지난 장부까지 바뀔 수 있으니 신중하게 하세요.
    - q: 처음 등록할 것이 너무 많습니다.
      a: >
        거래처는 [홈택스 거래처 가져오기]로 한꺼번에 불러올 수 있습니다.
        나머지는 사업장 정보 → 신고 정보 → 통장/카드 순으로만 먼저 채워도 거래 입력을 시작할 수 있습니다.
