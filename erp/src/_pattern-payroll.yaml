# 성공닷컴 사용자 매뉴얼 원본 — 공통 문서
# 급여관리 8개 화면이 이 문서를 상속한다.

- doc_id: pattern-payroll
  doc_name: 급여관리 공통 사용법
  applies_to_pattern: 급여
  applies_count: 10
  purpose: >
    급여관리는 화면 하나만 알아서는 안 되는 영역이다.
    직원을 등록하고, 근태를 기록하고, 급여를 지급하고, 세금과 보험을 신고하는 순서가 이어진다.
    앞 단계를 건너뛰면 뒤 단계에서 숫자가 안 맞거나 신고를 못 한다.

  key_concept: >
    급여를 준다는 것은 돈을 보내는 일만이 아니다.
    직원에게 줄 돈에서 세금과 보험료를 미리 떼어 두었다가, 정해진 날에 나라에 대신 내야 한다.
    그래서 급여지급 한 번에 세 가지 일이 따라붙는다.
    ① 직원에게 실지급액 송금
    ② 뗀 세금(원천세)을 신고하고 납부
    ③ 4대보험료를 신고하고 납부

  cycle:
    - step: 매달 하는 일
      desc: >
        급여지급 → 급여대장 확인 → 원천세 신고 → 4대보험 신고.
        근태 기록은 별도로 관리하며 이 흐름에는 들어가지 않는다.
        급여를 준 달의 다음 달에 신고와 납부가 이어진다.
    - step: 사람이 들고 날 때
      desc: >
        입사하면 직원관리에 등록하고 4대보험 취득 신고, 퇴사하면 상실 신고와 퇴직금 지급.
        취득 신고는 건강보험 기한인 **입사 후 14일**을 기준으로 잡는다.
    - step: 한 해에 한 번
      desc: 연말정산. 한 해 동안 뗀 세금과 실제로 낼 세금의 차이를 맞춘다.

  order:
    - "① [직원관리] — 사람을 등록한다. 정규직·일용직·사업소득자 구분을 제대로 잡는다"
    - "② [근태관리대장] — 그 달의 근무 상황을 기록한다"
    - "③ [급여지급] — 급여를 계산하고 지급을 확정한다"
    - "④ [급여대장] — 결과를 확인하고 보관한다"
    - "⑤ [임금명세서(정규직)] — 정규직에게 교부할 명세서를 만든다"
    - "⑥ [4대보험 신고] — 변동 사항의 신고 자료를 만든다. 실제 신고는 정보연계센터나 공단에서 따로 마친다"
    - "원천세 신고는 왼쪽 [원천세 신고 바로가기]로 넘어가 처리한다"
    - "소득 종류별 세율과 제출 서류는 [인건비 종류와 원천세 제출 서류] 문서에 정리되어 있다"

  three_worker_types: >
    직원관리에서 사람을 **정규직 · 일용직 · 사업소득자**로 나눠 등록한다.
    이 구분이 세금 계산과 제출 서류를 결정한다.
    · 정규직 — 간이세액표로 원천징수, 연말정산 대상, 임금명세서 교부 대상
    · 일용직 — 일당 기준으로 계산, 연말정산 없음, 일용근로소득 지급명세서 매월 제출
    · 사업소득자 — 3.3% 원천징수, 간이지급명세서 매월 제출
    잘못 잡으면 나중에 소급해서 세금과 보험료를 물 수 있다.

  common_actions:
    - id: period
      name: 급여 귀속 월 고르기
      steps:
        - 처리할 급여의 귀속 월을 고릅니다.
      note: >
        지급한 날이 아니라 어느 달치 급여인지가 기준입니다.
        1월분 급여를 2월에 줬다면 귀속은 1월입니다.

    - id: staff
      name: 직원 고르기
      steps:
        - 처리할 직원을 고릅니다. 여러 명을 함께 고를 수 있습니다.
      note: 퇴사한 직원은 목록에 안 나올 수 있습니다.   # 확인필요

    - id: print
      name: 대장 출력하기
      steps:
        - 조회한 내용을 출력하거나 엑셀로 내려받습니다.
      note: 급여대장은 보관 의무가 있는 서류입니다.   # 확인필요: 보관 기간

  payslip_duty: >
    근로기준법에 따라 임금명세서를 교부해야 한다.
    [임금명세서(정규직)] 화면에서 만든다.

  common_cautions:
    - "급여 화면에는 성명, 주민등록번호, 계좌번호, 급여액이 함께 표시됩니다. 열람 권한을 꼭 필요한 사람에게만 주세요."
    - "지급을 확정하기 전에 금액을 확인하세요. 확정 후에 고치면 이미 나간 신고와 어긋납니다."
    - "직원관리에 4대보험 가입 정보가 잘못 들어가 있으면 급여 계산부터 틀어집니다. 등록할 때 확인하세요."
    - "기한을 넘겼을 때의 불이익은 신고 종류에 따라 다릅니다. 원천세는 가산세, 4대보험은 과태료 문제입니다."
    - "4대보험 취득신고는 건강보험이 14일로 가장 짧습니다. 입사 후 14일을 기준으로 잡으면 나머지도 함께 지킬 수 있습니다."

  common_faq:
    - q: 급여를 줬는데 원천세 신고를 안 하면 어떻게 되나요?
      a: >
        떼어 둔 세금을 나라에 안 낸 것이 되어 가산세가 붙습니다.
        급여지급과 원천세 신고는 짝으로 움직인다고 생각하세요.
    - q: 급여지급과 급여대장은 뭐가 다른가요?
      a: >
        급여지급은 계산하고 확정하는 화면이고, 급여대장은 확정된 결과를 보고 출력하는 화면입니다.
    - q: 직원이 중간에 입사했습니다.
      a: >
        직원관리에 등록하고 4대보험 취득 신고를 합니다.
        일할 계산은 자동으로 되지 않습니다. 급여지급 화면에서 근무일수에 맞춰 금액을 직접 입력하세요.
    - q: 퇴직금은 어디서 처리하나요?
      a: "[퇴직지급]에서 계산하고 지급 처리한 뒤 [퇴직금 지급대장]에서 확인합니다."
    - q: 4대보험 신고를 이 화면에서 하면 공단에도 접수되나요?
      a: >
        접수되지 않습니다. 이 서비스는 신고에 쓸 자료를 만들어 줄 뿐입니다.
        4대사회보험 정보연계센터에서 온라인으로 신고하는 것이 가장 편하고,
        서면으로 작성해 관할 건강보험공단에 팩스로 보낼 수도 있습니다.
