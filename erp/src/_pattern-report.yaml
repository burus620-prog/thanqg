# 성공닷컴 사용자 매뉴얼 원본 — 공통 문서
# 보고서 7개 화면이 이 문서를 상속한다.

- doc_id: pattern-report
  doc_name: 보고서 공통 사용법
  applies_to_pattern: 보고서
  applies_count: 18
  purpose: >
    보고서는 지금까지 넣은 자료를 모아 보여주는 곳이다.
    기간을 고르고 조회한 뒤 필요하면 출력하거나 내려받는다.
    화면이 많지만 쓰는 방법은 같고, 무엇을 보여주느냐만 다르다.

  seven_groups:
    - name: 금융보고서
      desc: 하루 기준 자금일보. 통장·카드·여신 매출을 한 화면에서 봅니다.
    - name: 세무요약 보고서
      desc: 신고에 쓰이는 숫자를 요약해 봅니다.
    - name: 매출매입 보고서
      desc: 월간/연간 요약과 매출 매입 관리로 나뉩니다.
    - name: 채권채무 보고서
      desc: 못 받은 돈과 안 준 돈을 거래처별로 봅니다.
    - name: 월간경영 보고서
      desc: 월간 실적·재무상태 현황과 경영·재무 통계를 봅니다.
    - name: 경영보고서
      desc: >
        경영자가 판단에 쓰는 화면입니다.
        경영비교, 자금, 비용(지출), 급여, 한도관리 다섯 가지입니다.
    - name: 경영 관리
      desc: >
        회계 원장 계열입니다.
        관항목(거래명) 원장, 수익 비용 비교, 총계정원장, 분개장 네 가지입니다.

  key_concept: >
    **보고서는 앞 단계의 결과물이다.**
    여기서 숫자를 고칠 수는 없다. 숫자가 이상하면 보고서가 아니라 앞 단계를 봐야 한다.
    이 원칙 하나만 알아도 대부분의 의문이 풀린다.

  where_numbers_come_from:
    - symptom: 매출이 빠져 있다
      check: "[거래(전표) 입력]에서 [장부입력]을 눌렀는지 확인한다. 누르기 전에는 장부에 안 들어간다."
    - symptom: 거래는 있는데 항목이 이상하다
      check: "[매출 / 매입]에서 그 거래의 거래명을 확인한다. 거래명이 계정과목을 정한다."
    - symptom: 미수금·미지급금이 실제보다 많다
      check: "[금융(입출금)]에서 수납·지급 확인을 안 한 건이 남아 있다."
    - symptom: 통장 잔액이 안 맞는다
      check: "[금융(입출금)] > [장부vs은행 비교]에서 차이가 어디서 나는지 본다."
    - symptom: 인건비가 안 잡힌다
      check: "[급여관리]에서 급여지급을 확정했는지 확인한다."
    - symptom: 대출이 재무상태표에 없다
      check: "[금융(입출금)] > [기타금융자산]에 등록하지 않았다."

  common_actions:
    - id: period
      name: 기간 정하기
      steps:
        - 조회할 기간을 고르고 조회합니다.
      note: >
        달력에서 날짜를 직접 고를 수도 있고, 월·분기·연 버튼으로 한 번에 맞출 수도 있습니다.
        비교 보고서는 비교 대상 기간도 함께 정합니다.

    - id: read
      name: 결과 보기
      steps:
        - 표나 그래프로 결과가 나옵니다.
      note: null   # 확인필요: 항목을 눌러 상세로 들어갈 수 있는지

    - id: export
      name: 출력하거나 내려받기
      steps:
        - 화면의 출력 또는 엑셀 내려받기를 사용합니다.
      note: 조회 조건이 걸린 상태로 저장되므로 범위를 먼저 정합니다.

  common_cautions:
    - "보고서 숫자는 앞 단계 작업이 끝난 만큼만 나옵니다. 장부입력이나 수납확인이 밀려 있으면 실제와 다릅니다."
    - "세무 신고에 쓸 숫자는 신고 화면에서 다시 확인하세요. 보고서는 참고용입니다."   # 확인필요: 신고 자료와 일치 여부
    - "월이 끝나기 전에 본 숫자는 아직 미완입니다. 마감 후 다시 확인하는 편이 안전합니다."

  common_faq:
    - q: 보고서 숫자가 실제와 다릅니다.
      a: >
        보고서에서 고칠 수 있는 것은 없습니다. 어느 단계가 빠졌는지 거슬러 올라가 확인하세요.
        가장 흔한 원인은 장부입력을 안 했거나 수납·지급 확인이 밀린 경우입니다.
    - q: 지난달 보고서를 다시 볼 수 있나요?
      a: 기간을 지난달로 바꿔 조회하면 됩니다.
    - q: 매출매입 보고서와 부가세 신고 숫자가 다릅니다.
      a: null   # 확인필요: 집계 기준 차이
