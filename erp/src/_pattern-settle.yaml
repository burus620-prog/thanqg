# 성공닷컴 사용자 매뉴얼 원본 — 공통 문서
# 입금내역 4개 + 출금내역 5개 화면이 이 문서를 상속한다.

- doc_id: pattern-settle
  doc_name: 수납·지급 확인 공통 사용법
  applies_to_pattern: 확인
  applies_count: 13
  purpose: >
    수납확인과 지급확인은 **장부에 적힌 것과 실제로 오간 돈을 맞춰 보는** 화면이다.
    매출을 잡았다고 돈이 들어온 것은 아니고, 매입을 잡았다고 돈이 나간 것도 아니다.
    이 화면에서 둘을 이어 주어야 "아직 못 받은 돈"과 "아직 안 준 돈"이 정확해진다.

  key_concept: >
    거래에는 두 시점이 있다.
    ① 거래가 생긴 때 — 물건을 팔거나 산 시점. [매출 / 매입]에 기록된다.
    ② 돈이 오간 때 — 통장에 들어오거나 빠져나간 시점. 이 화면에서 다룬다.
    두 시점이 같은 날이면 신경 쓸 일이 없지만, 외상 거래는 몇 주씩 벌어진다.
    그 벌어진 구간을 관리하는 것이 수납·지급 확인이다.

  why_it_matters: >
    이 작업을 건너뛰면 채권채무 보고서가 부정확해진다.
    이미 받은 돈이 계속 미수금으로 남고, 이미 준 돈이 계속 미지급금으로 남는다.
    거래처와 잔액을 맞출 때 이 차이 때문에 다툼이 생긴다.

  before_you_start: >
    통장 자료가 먼저 들어와 있어야 맞출 대상이 생긴다.
    [통장/카드 관리]에 계좌가 등록되어 있으면 은행에서 자동으로 가져온다.
    가져온 자료는 [입출금 내역 조회]에서 확인할 수 있다.

  layout:
    - zone: 왼쪽 — 장부에 남은 금액
      desc: >
        거래처(또는 카드사)별로 아직 안 받았거나 안 준 금액이 나온다.
        맞출 대상을 여기서 고른다. 여러 건을 한꺼번에 고를 수 있다.
    - zone: 오른쪽 — 은행 거래내역
      desc: 통장에 실제로 들어오거나 나간 내역. 왼쪽과 짝을 맞춘다.
    - zone: 아래 — 차액 맞추기
      desc: >
        고른 금액과 실제 오간 금액의 차이를 수수료·할인으로 메우는 칸.
        여기가 맞아야 [정산 확인]이 된다.

  common_actions:
    - id: find
      name: 확인할 건 찾기
      steps:
        - 기간이나 거래처로 조회합니다.
      note: 기간과 계좌, 구분으로 좁혀 볼 수 있습니다.

    - id: match
      name: 실제 입출금과 맞추기
      steps:
        - 왼쪽에서 맞출 건을 고릅니다. 여러 건을 함께 골라도 됩니다.
        - 오른쪽에서 그에 해당하는 은행 거래내역을 고릅니다.
        - 아래에서 금액이 맞는지 확인하고 [정산 확인]을 클릭합니다.
      note: >
        한 번 입금·출금에 여러 건이 묶여 있는 경우가 흔합니다.
        그럴 때는 왼쪽에서 해당하는 건을 모두 골라 한꺼번에 맞춥니다.

    - id: gap
      name: 금액이 안 맞을 때 메우기
      steps:
        - 아래 [수수료(연체 등)] 칸에 떼인 금액을 넣습니다.
        - 깎인 금액이 있으면 [할인(잡이익)] 칸에 넣습니다.
        - "[실 지급액]이 실제로 오간 금액과 같아지면 [정산 확인]을 클릭합니다."
      note: >
        정산 금액이 딱 떨어지는 경우는 드뭅니다.
        카드 정산은 수수료를 떼고, 연체가 있으면 더 나가고, 할인을 받으면 덜 나갑니다.
        그 차이를 이 칸에서 처리해야 장부와 통장이 맞아떨어집니다.

    - id: cancel
      name: 잘못 확인한 것 되돌리기
      steps:
        - 확인 처리를 취소합니다.
      note: 처리 전에 금액과 거래처를 확인하는 편이 낫습니다.   # 확인필요: 취소 방법

  common_cautions:
    - "확인 처리를 하지 않으면 이미 받은 돈이 계속 미수금으로 남습니다. 보고서 숫자가 실제와 달라집니다."
    - "차액을 억지로 맞추려고 수수료 칸에 아무 숫자나 넣지 마세요. 그 금액이 그대로 비용으로 잡힙니다."
    - "[정산 확인]은 장부를 바꾸는 동작입니다. 거래처와 금액을 확인하고 누르세요."

  common_faq:
    - q: 매출을 잡았는데 왜 또 수납확인을 해야 하나요?
      a: >
        매출을 잡는 것은 "팔았다"는 기록이고, 수납확인은 "돈을 받았다"는 기록입니다.
        외상으로 팔면 두 시점이 다릅니다. 둘을 이어 주어야 못 받은 돈이 정확해집니다.
    - q: 입금액이 매출액보다 적습니다.
      a: >
        수수료가 빠진 경우입니다. 오픈마켓·PG·카드 정산은 수수료를 떼고 들어오는 것이 보통입니다.
        차액을 [수수료(연체 등)] 칸에 넣으면 맞아떨어집니다.
    - q: 여러 건이 한 번에 입금됐습니다.
      a: >
        왼쪽에서 해당하는 건을 모두 고르고 오른쪽에서 그 입금 내역 하나를 고른 뒤
        [정산 확인]을 누르면 한꺼번에 처리됩니다.
    - q: 카드대금이 미지급금 합계보다 적게 나갔습니다.
      a: >
        할인을 받았거나 일부만 결제된 경우입니다.
        아래 [할인(잡이익)] 칸에 차액을 넣어 [실 지급액]을 실제 출금액과 맞추세요.
    - q: 연체이자가 붙어서 더 나갔습니다.
      a: 아래 [수수료(연체 등)] 칸에 그 금액을 넣으면 [실 지급액]이 맞아집니다.
    - q: 수납확인을 안 하면 어떻게 되나요?
      a: 채권채무 보고서에 미수금으로 계속 남고, 거래처 잔액이 실제와 달라집니다.
