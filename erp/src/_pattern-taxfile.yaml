# 성공닷컴 사용자 매뉴얼 원본 — 공통 문서
# 세무신고 3개 화면이 이 문서를 상속한다.

- doc_id: pattern-taxfile
  doc_name: 세무신고 공통 사용법
  applies_to_pattern: 신고
  applies_count: 3
  purpose: >
    세무신고는 장부에 쌓인 자료를 신고에 쓸 형태로 정리하는 곳이다.
    부가세, 원천세, 사업장현황 신고 세 가지가 있고 각각 대상과 기한이 다르다.

  key_concept: >
    **이 서비스는 홈택스에 대신 신고해 주지 않는다.**
    여기서 하는 일은 신고서를 만들고 전자파일을 뽑는 것까지다.
    그 파일을 홈택스에 올려야 신고가 접수된다.
    마감했다고 신고가 끝났다고 생각하면 그대로 무신고가 된다.

  what_each_is:
    - name: 부가세 신고
      desc: >
        받은 매출세액에서 낸 매입세액을 빼고 차액을 신고·납부한다.
        일반과세자와 간이과세자의 주기가 다르다.
        이 서비스는 일반과세·간이과세·면세를 모두 지원한다.
    - name: 원천세 신고
      desc: >
        급여 등을 줄 때 떼어 둔 세금을 나라에 대신 내는 신고다.
        급여관리에서 급여를 지급했다면 이 신고가 따라붙는다.
    - name: 사업장현황 신고
      desc: >
        부가세를 내지 않는 면세사업자가 한 해 수입금액을 신고하는 것이다.
        부가세 신고 대상이면 이 신고는 하지 않는다.

  before_you_start: >
    신고 전에 그 기간의 거래가 장부에 다 들어가 있어야 한다.
    [거래(전표) 입력]에 처리하지 않은 전표가 남아 있으면 신고 금액이 빠진다.
    [매출 / 매입]에서 기간을 조회해 빠진 것이 없는지 먼저 확인한다.

  common_actions:
    - id: period
      name: 신고 기간 고르기
      steps:
        - 신고할 과세기간을 고릅니다.
      note: null   # 확인필요: 기간 선택 방식

    - id: check
      name: 신고 내용 확인하기
      steps:
        - 집계된 금액이 맞는지 확인합니다.
      note: >
        금액이 예상과 다르면 신고 화면이 아니라 장부를 확인합니다.
        빠진 거래가 있거나 거래명이 잘못 지정된 경우가 대부분입니다.

    - id: after_pay
      name: 납부한 뒤 장부에 기록하기
      steps:
        - 부가세는 [부가세신고 목록]의 [거래반영]에서 처리합니다.
        - 원천세는 자동 반영이 없으므로 [금융(입출금)] > [출금내역] > [4대보험/세금 납부확인]에서 직접 기록합니다.
      note: >
        이 처리를 안 하면 통장에서 나간 세금이 장부에 없어 잔액이 맞지 않습니다.

    - id: late
      name: 기한이 지난 뒤 신고하기
      steps:
        - 기한이 지나도 같은 화면에서 신고할 수 있습니다.
      note: 가산세는 늦을수록 늘어납니다. 미루지 말고 바로 냅니다.

    - id: submit
      name: 신고 마무리하기
      steps:
        - 신고서를 마감하고 전자파일을 내려받습니다.
        - 홈택스에 접속해 회계프로그램 신고(전자신고)로 그 파일을 올립니다.
        - 신고 후 세금을 납부합니다.
      note: >
        마지막까지 가야 신고가 끝납니다.
        납부한 뒤에는 신고 목록에서 거래반영을 해 장부에 기록합니다.

  common_cautions:
    - "기한을 넘기면 가산세가 붙습니다. 신고 기한은 해마다 바뀔 수 있으니 국세청 기준으로 확인하세요."   # 확인필요: 각 신고 기한
    - "신고를 마친 뒤에 장부를 고치면 신고 내용과 어긋납니다. 고쳐야 한다면 수정신고를 해야 합니다."
    - "마감은 신고가 아닙니다. 전자파일을 홈택스에 올려야 접수됩니다."
    - "부가세는 신고 목록에서 거래반영으로 장부에 넣지만, 원천세는 그 기능이 없어 직접 기록해야 합니다."

  common_faq:
    - q: 여기서 신고하면 홈택스에 접수되나요?
      a: >
        접수되지 않습니다. 신고서를 만들고 전자파일을 뽑는 것까지가 이 서비스의 일입니다.
        그 파일을 홈택스에 올려야 신고가 접수됩니다.
    - q: 신고 금액이 생각과 다릅니다.
      a: >
        그 기간의 거래가 장부에 다 들어갔는지 확인하세요.
        [거래(전표) 입력]에 처리하지 않은 전표가 남아 있으면 그만큼 빠집니다.
    - q: 부가세 신고와 사업장현황 신고를 둘 다 해야 하나요?
      a: >
        아닙니다. 부가세를 내는 사업자는 부가세 신고를, 면세사업자는 사업장현황 신고를 합니다.
    - q: 급여를 줬는데 원천세 신고를 안 했습니다.
      a: >
        떼어 둔 세금을 안 낸 것이 되어 가산세가 붙습니다.
        급여지급과 원천세 신고는 짝으로 움직인다고 생각하세요.
