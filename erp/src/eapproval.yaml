- screen_id: eapp-line
  screen_name: 결재라인 관리
  path: 전자결재 > 관리설정 > 결재라인 관리
  pattern: E
  inherits: pattern-eapproval
  permission: 전자결재
  purpose: 문서가 누구를 거쳐 결재될지 미리 정해 둔다

  key_concept: >
    문서를 올리기 전에 결재선이 있어야 한다.
    자주 쓰는 경로를 이름 붙여 만들어 두고, 문서를 올릴 때 그 결재선을 고른다.
    **결재선 하나에 세 가지를 지정한다.** 결재자, 회람, 수신이다.

  three_roles:
    - name: 결재자
      desc: 순서대로 승인해야 하는 사람입니다. 이 사람들이 결재를 마쳐야 문서가 완료됩니다.
    - name: 회람
      desc: 승인은 필요 없고 내용만 알려 줄 사람입니다.
    - name: 수신
      desc: 문서를 받아 볼 사람입니다.   # 확인필요: 회람과의 정확한 차이

  screen_specific:
    - name: 결재선 추가
      desc: 오른쪽 위 버튼으로 새 결재선을 만듭니다.
    - name: 결재선 이름
      desc: >
        각 결재선에 이름을 붙입니다. "대표 결재"처럼 용도를 알아볼 수 있게 짓습니다.
    - name: 수정 / 삭제
      desc: 결재선마다 오른쪽 위에 수정과 삭제 버튼이 있습니다.

  steps:
    - no: 1
      action: 상단 [전자결재]를 클릭한 뒤 왼쪽 [관리설정]에서 [결재라인 관리]를 클릭합니다.
      target: nav:전자결재 > side:관리설정 > 결재라인 관리
      image: eapp-line-01.png
      note: null
    - no: 2
      action: 오른쪽 위 [결재선 추가]를 클릭해 새 결재선을 만듭니다.
      target: null
      image: null
      note: null
    - no: 3
      action: 결재자를 순서대로 지정하고, 필요하면 회람과 수신도 넣습니다.
      target: null
      image: null
      note: 결재자는 순서가 중요합니다. 앞사람이 승인해야 다음으로 넘어갑니다.
    - no: 4
      action: 만든 결재선은 [수정]으로 고치고, 필요 없으면 [삭제]합니다.
      target: null
      image: null
      note: null

  cautions:
    - "결재선이 없으면 문서를 올릴 수 없습니다. 전자결재를 처음 쓸 때 여기부터 만드세요."
    - "결재자 순서가 곧 결재 순서입니다. 순서를 잘못 넣으면 엉뚱한 사람에게 먼저 갑니다."
    - "결재선을 바꿔도 이미 진행 중인 문서에는 반영되지 않을 수 있습니다."   # 확인필요

  faq:
    - q: 결재선을 여러 개 만들 수 있나요?
      a: >
        네. 용도별로 만들어 두고 문서를 올릴 때 고르면 됩니다.
        예를 들어 소액 지출용과 고액 지출용을 따로 만들 수 있습니다.
    - q: 회람과 수신은 뭐가 다른가요?
      a: null   # 확인필요
    - q: 결재자를 중간에 바꾸고 싶습니다.
      a: 결재선을 [수정]하면 다음에 올리는 문서부터 적용됩니다.

