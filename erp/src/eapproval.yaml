# 성공닷컴 사용자 매뉴얼 원본 — 전자결재
# 전자문서함 7개 + 관리설정 2개. 모두 공통 문서를 상속한다.

- screen_id: eapp-archive
  screen_name: 전자문서 보관함
  path: 전자결재 > 전자문서함 > 전자문서 보관함
  pattern: A
  inherits: pattern-eapproval
  permission: 전자결재
  purpose: 모든 전자문서를 한곳에서 찾아본다

  key_concept: >
    문서함 중 가장 넓은 곳이다.
    어느 함에 있는지 모를 때 여기서 찾으면 된다.

  screen_specific:
    - name: 조회 조건
      desc: >
        유형과 상태, 기간, 제목으로 찾습니다.
        [수신/회람문서 제외]를 체크하면 결재 문서만 봅니다.
        더 세밀하게 찾으려면 [상세검색]을 씁니다.
    - name: 새 결재 작성
      desc: 오른쪽 위 버튼으로 새 문서를 올립니다.
    - name: 표 항목
      desc: 문서번호, 유형, 제목, 작성자, 결재상태, 작성일

  steps:
    - no: 1
      action: 상단 [전자결재]를 클릭합니다.
      target: nav:전자결재
      image: eapp-archive-01.png
      note: 처음 열면 [전자문서 보관함]이 보입니다.
    - no: 2
      action: 유형·상태·기간·제목으로 문서를 찾습니다.
      target: null
      image: null
      note: 결재 문서만 보려면 [수신/회람문서 제외]를 체크합니다.
    - no: 3
      action: 새 문서를 올리려면 오른쪽 위 [새 결재 작성]을 클릭합니다.
      target: null
      image: null
      note: 결재선과 문서양식이 미리 만들어져 있어야 합니다.

  cautions:
    - "문서를 올리기 전에 [관리설정]에서 결재라인과 문서양식을 먼저 만들어야 합니다."

  faq:
    - q: 문서가 어디 있는지 모르겠습니다.
      a: 여기서 제목이나 기간으로 찾으세요. 모든 문서가 모이는 곳입니다.
    - q: 새 문서는 어디서 올리나요?
      a: 오른쪽 위 [새 결재 작성]을 클릭합니다.

