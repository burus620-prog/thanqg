      desc: 정산을 처리하는 [지급처리]와, 카드로 쓴 내역을 보는 [카드사용내역]으로 나뉩니다.
    - name: 카드사별 미지급금
      desc: >
        왼쪽에 카드사별로 아직 결제되지 않은 금액이 나옵니다.
        맨 아래 합계가 지금 갚아야 할 카드 대금 전체입니다.
    - name: 상세
      desc: 카드사별로 어떤 거래가 미지급으로 남아 있는지 봅니다.
    - name: 은행거래 출금내역
      desc: 오른쪽에 통장에서 나간 내역이 나옵니다. 기간과 적요로 찾습니다.

  steps:
    - no: 1
