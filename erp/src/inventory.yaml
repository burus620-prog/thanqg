# 성공닷컴 사용자 매뉴얼 원본 — 영업(재고) 관리
# 화면 5개. 도소매업과 제조업 등 재고를 다루는 업종에서 쓴다.

- screen_id: inv-statement
  screen_name: 거래명세서 입력 / 관리
  path: 영업(재고) 관리 > 거래명세서 입력 / 관리
  pattern: A
  inherits: pattern-inventory
  permission: 영업(재고) 관리
  draft: true                       # 화면 확인 전 뼈대
  purpose: 거래명세서를 작성하고 장부에 넣는다
  key_concept: >
    거래명세서를 쓰면서 품목과 수량을 넣고 [장부입력]을 누르면
    **전표 등록과 재고 반영이 한꺼번에 일어난다.**
    따로 재고를 맞추는 작업이 필요 없다.
    [매출 / 매입]에서 전표를 등록해도 마찬가지로 재고에 반영된다.

  screen_specific:
    - name: 거래명세서 입력 탭
      desc: 명세서를 새로 작성하는 곳입니다.
    - name: 거래명세서 출력관리 탭
      desc: 작성한 명세서를 찾아보고 출력하는 곳입니다.
    - name: 매출 / 매입 선택
      desc: 파는 것인지 사는 것인지 먼저 고릅니다. 입고와 출고가 이걸로 갈립니다.
    - name: 거래명 고정
      desc: 같은 거래명을 계속 쓸 때 고정해 두면 매번 고르지 않아도 됩니다.
    - name: 신규 표시
      desc: >
        거래처나 상품이 등록되어 있지 않으면 [신규]로 표시됩니다.
        거래처는 이 화면에서 바로 등록할 수 있습니다.
        상품은 [상품 등록 / 관리]에서 먼저 등록해야 여기서 불러올 수 있습니다.
    - name: 장부입력
      desc: 명세서를 전표로 등록합니다. 이때 재고도 함께 반영됩니다.

  prerequisite:
    - screen: 성공 앱에서 메뉴 켜기
      desc: >
        상단 메뉴에 [영업(재고) 관리]가 없으면, 오른쪽 위 [성공 앱]을 열고
        [영업(재고)관리]를 클릭해 켠다. 한 번 켜면 계속 보인다.

  steps:
    - no: 1
      action: 상단 [영업(재고) 관리]를 클릭한 뒤 왼쪽에서 [거래명세서 입력 / 관리]를 클릭합니다.
      target: nav:영업(재고) 관리 > side:거래명세서 입력 / 관리
      image: inv-statement-01.png
      note: 처음 열면 [거래명세서 입력] 탭이 보입니다.
    - no: 2
      action: 매출인지 매입인지 고르고, 거래처와 품목·수량을 입력합니다.
      target: null
      image: null
      note: 등록되지 않은 거래처나 상품에는 [신규] 표시가 붙습니다.
    - no: 3
      action: "[장부입력]을 클릭합니다."
      target: null
      image: null
      note: 전표가 등록되면서 재고에도 함께 반영됩니다.
    - no: 4
      action: 작성한 명세서를 찾아보려면 [거래명세서 출력관리] 탭을 클릭합니다.
      target: tab:거래명세서 출력관리
      image: inv-statement-02.png
      note: null

  cautions:
    []   # 확인필요: 이 화면만의 주의사항

  faq: []

---

- screen_id: inv-daily
  screen_name: 영업일보
  path: 영업(재고) 관리 > 영업일보
  pattern: A
  inherits: pattern-inventory
  permission: 영업(재고) 관리
  purpose: 거래처별로 영업 활동과 업무 내용을 기록하고 이력을 남긴다

  key_concept: >
    이름과 달리 재고를 다루는 화면이 아니다.
    **거래처를 상대로 한 영업 활동을 기록하는 곳**이다.
    누구와 언제 무슨 이야기를 했고 어떻게 처리했는지가 쌓인다.
    담당자가 바뀌어도 이력이 남아 인수인계에 쓸 수 있다.

  layout:
    - zone: 왼쪽 — 거래처 목록
      desc: >
        거래처가 나온다. 별표로 자주 보는 곳을 표시할 수 있고,
        괄호 안 숫자는 그 거래처에 쌓인 건수다.
        거래처관리에서 지정한 거래처만 여기에 나온다.
    - zone: 오른쪽 — 업무일지
      desc: >
        탭이 셋이다. [전체 업무일지] [내 업무일지] [거래내역].
        업무 내용과 처리 여부, 작성자, 결재(승인), 마감일이 보인다.

  screen_specific:
    - name: 전체 업무일지 / 내 업무일지
      desc: 전체는 모든 사람이 쓴 것, 내 것만 보려면 [내 업무일지]를 봅니다.
    - name: 거래내역
      desc: 그 거래처와 실제로 오간 거래를 봅니다.
    - name: 자물쇠 표시
      desc: null   # 확인필요: 비공개 일지를 뜻하는지
    - name: 마감일
      desc: 기한이 지난 건은 붉게 표시됩니다.
    - name: 등록
      desc: 새 업무일지를 씁니다.

  steps:
    - no: 1
      action: 상단 [영업(재고) 관리]를 클릭한 뒤 왼쪽에서 [영업일보]를 클릭합니다.
      target: nav:영업(재고) 관리 > side:영업일보
      image: inv-daily-01.png
      note: null
    - no: 2
      action: 왼쪽에서 거래처를 고르고, 오른쪽에서 그 거래처의 업무일지를 봅니다.
      target: null
      image: null
      note: null
    - no: 3
      action: 새로 쓰려면 오른쪽 위 [등록]을 클릭합니다.
      target: null
      image: null
      note: null

  cautions:
    - "거래처관리에서 지정한 거래처만 왼쪽 목록에 나옵니다. 안 보이면 거래처 설정을 확인하세요."
    - "마감일이 지난 건은 붉게 표시됩니다. 처리 여부를 함께 확인하세요."

  faq:
    - q: 영업일보에 거래처가 안 보입니다.
      a: 거래처관리에서 영업일보에 노출하도록 지정해야 나옵니다.

---

- screen_id: inv-stock
  screen_name: 입고 / 출고 현황
  path: 영업(재고) 관리 > 입고 / 출고 현황
  pattern: D
  inherits: pattern-inventory
  permission: 영업(재고) 관리
  purpose: 물건이 들어오고 나간 내역과 남은 수량을 조회한다

  key_concept: >
    입고와 출고는 직접 입력하는 것이 아니라 **거래에서 자동으로 만들어진다.**
    매입 전표나 매입 거래명세서를 넣으면 입고, 매출이면 출고로 잡힌다.
    그래서 이 화면은 기록하는 곳이 아니라 결과를 확인하는 곳이다.

  screen_specific:
    - name: 입/출고 · 구분 · 상품명 조회
      desc: 입고만 볼지 출고만 볼지 고르고, 상품명으로 좁힐 수 있습니다.
    - name: 재고관리 상품
      desc: 재고를 관리하는 상품만 골라 봅니다.   # 확인필요: 상품 등록 시 지정하는 값인지
    - name: 거래명세서 발행
      desc: 조회된 내역으로 거래명세서를 만듭니다.   # 확인필요: 정확한 동작
    - name: 표 항목
      desc: 거래일자, 입/출고일, 구분, 거래처, 현재일, 상품명, 상품코드, 규격, 단위, 단가, 입고수량, 출고수량, 공급가액, 등록자

  steps:
    - no: 1
      action: 상단 [영업(재고) 관리]를 클릭한 뒤 왼쪽에서 [입고 / 출고 현황]을 클릭합니다.
      target: nav:영업(재고) 관리 > side:입고 / 출고 현황
      image: inv-stock-01.png
      note: null
    - no: 2
      action: 기간과 조건을 정하고 [검색]을 클릭합니다.
      target: null
      image: null
      note: 기본 기간이 최근 한 달로 잡혀 있습니다. 더 오래된 내역은 기간을 넓히세요.

  cautions:
    - "여기서 수량을 직접 고칠 수 없습니다. 거래를 바로잡아야 재고가 맞습니다."
    - "내역이 비어 있다면 조회 기간이 짧거나, 그 기간의 거래가 장부에 안 들어간 것입니다."

  faq:
    - q: 입/출고 내역이 없다고 나옵니다.
      a: >
        조회 기간을 넓혀 보세요. 그래도 없으면 그 기간에 재고가 움직인 거래가
        장부에 들어가지 않은 것입니다.

---

- screen_id: inv-product
  screen_name: 상품 등록 / 관리
  path: 영업(재고) 관리 > 상품 등록 / 관리
  pattern: A
  inherits: pattern-inventory
  permission: 영업(재고) 관리
  purpose: 취급하는 상품을 등록하고 재고 현황을 관리한다

  key_concept: >
    거래명세서와 전표에서 고를 상품을 미리 등록해 두는 곳이다.
    등록해 두면 명세서를 쓸 때 검색으로 불러올 수 있고,
    상품별로 매입매출과 재고가 집계된다.

  screen_specific:
    - name: 초기재고 · 현재고 · 연관재고
      desc: >
        처음 등록할 때 넣은 수량, 지금 남은 수량, 연결된 재고 수량입니다.
        현재고가 음수로 붉게 나오면 출고가 입고보다 많다는 뜻입니다.
    - name: 상품분류
      desc: 매출용인지 매입용인지, 둘 다인지 표시됩니다.   # 확인필요: 지정 방식
    - name: 썸네일 · 상품이미지 노출
      desc: 상품 사진을 등록하고, 목록에 보일지 켜고 끕니다.
    - name: 일괄등록
      desc: 여러 상품을 한꺼번에 등록합니다.   # 확인필요: 엑셀 양식 여부
    - name: 분류관리
      desc: 상품을 묶을 분류를 관리합니다.
    - name: 현황조회
      desc: 그 상품의 입출고 내역을 봅니다.

  steps:
    - no: 1
      action: 상단 [영업(재고) 관리]를 클릭한 뒤 왼쪽에서 [상품 등록 / 관리]를 클릭합니다.
      target: nav:영업(재고) 관리 > side:상품 등록 / 관리
      image: inv-product-01.png
      note: null
    - no: 2
      action: 오른쪽 위 [등록]을 클릭해 상품을 추가합니다.
      target: null
      image: null
      note: 여러 개를 한꺼번에 넣으려면 [일괄등록]을 사용합니다.

  cautions:
    - "현재고가 음수로 나오면 출고가 입고보다 많은 것입니다. 빠뜨린 매입이 있는지 확인하세요."
    - "상품을 지우면 그 상품이 들어간 과거 거래에 영향이 갈 수 있습니다."   # 확인필요

  faq:
    - q: 현재고가 마이너스로 나옵니다.
      a: >
        판 수량이 산 수량보다 많다는 뜻입니다.
        매입 거래가 빠졌거나 초기재고를 넣지 않은 경우가 대부분입니다.

