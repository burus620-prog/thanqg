- screen_id: base-project-input
  screen_name: 사업/프로젝트 입력
  path: 왼쪽 메뉴 > 사업/프로젝트 관리 > 사업/프로젝트 입력
  pattern: B
  inherits: pattern-master
  permission: 왼쪽 메뉴
  purpose: 부문별로 손익을 볼 단위를 만들고 관리한다

  key_concept: >
    매장이 여럿이거나 현장이 나뉘어 있을 때, 어디서 얼마를 벌고 썼는지 따로 보려면
    여기에 단위를 만들어 둔다. 거래를 입력할 때 이 단위를 지정하면 부문별로 집계된다.
    결과는 [사업/프로젝트 현황]에서 본다.

  layout:
    - zone: 왼쪽 — 프로젝트 리스트
      desc: 등록된 사업·프로젝트가 나온다. 이름 옆에 (진행중) 같은 상태가 붙는다.
    - zone: 오른쪽 — 상세정보
      desc: 고른 프로젝트의 내용이 나온다. [프로젝트 상세정보]와 [프로젝트 메모] 탭으로 나뉜다.

  what_you_enter:
    - name: 프로젝트명
      desc: 부문을 알아볼 수 있는 이름을 적습니다.
    - name: 기간
      desc: 시작일과 종료일을 정합니다.
    - name: 조직/부서 · 담당자(PM)
      desc: 어느 부서가 맡고 누가 책임지는지 적습니다.
    - name: 금액 · 상태
      desc: 규모와 진행 상태를 적습니다.
    - name: 사용등록여부
      desc: null   # 확인필요: 거래 입력 화면에 노출할지 정하는 값인지

  steps:
    - no: 1
      action: 왼쪽 메뉴에서 [사업/프로젝트 관리]를 펼쳐 [사업/프로젝트 입력]을 클릭합니다.
      target: side:사업/프로젝트 관리 > 사업/프로젝트 입력
      image: base-project-input-01.png
      note: null
    - no: 2
      action: 오른쪽 위 [등록]을 클릭해 새 사업이나 프로젝트를 만듭니다.
      target: null
      image: null
      note: null
    - no: 3
      action: 왼쪽 목록에서 하나를 고르면 오른쪽에 내용이 나옵니다. 고치려면 [수정]을 클릭합니다.
      target: null
      image: null
      note: "[프로젝트 메모] 탭에 진행 상황을 적어 둘 수 있습니다."

  cautions:
    - "여기에 만들어 두지 않으면 거래를 입력할 때 부문을 지정할 수 없습니다."
    - "프로젝트를 지우면 그 프로젝트로 집계되던 거래의 부문 정보가 사라질 수 있습니다."   # 확인필요

  faq:
    - q: 매장이 두 곳인데 따로 손익을 보고 싶습니다.
      a: >
        매장마다 프로젝트를 만들고, 거래를 입력할 때 해당 매장을 지정하세요.
        [사업/프로젝트 현황]에서 나눠 볼 수 있습니다.
    - q: 프로젝트를 만들었는데 거래 입력에서 안 보입니다.
      a: null   # 확인필요: 사용등록여부 설정과의 관계

