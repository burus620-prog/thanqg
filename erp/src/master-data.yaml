- screen_id: base-dealname
  screen_name: 거래명 만들기
  path: 왼쪽 메뉴 > 거래명 만들기
  pattern: E
  inherits: pattern-master
  permission: 왼쪽 메뉴
  purpose: 거래에 붙일 이름을 만들고, 그 이름이 어떤 회계 항목으로 잡힐지 정한다

  key_concept: >
    **거래명이 계정과목을 정한다.** 거래를 입력할 때 고르는 그 값이 여기서 만들어진다.
    거래명 하나에 회계 항목과 차변·대변까지 미리 붙여 두기 때문에,
    사용자는 회계를 몰라도 거래명만 고르면 장부가 맞게 짜인다.

  structure: >
    거래명은 **거래분류 아래에 묶인다.**
    은행관련, IT 서비스 거래, 용역관련, 시설관리 비용, 운영관리 비용,
    세금 및 4대 보험료, 인허가 및 수수료, 기타거래처럼 큰 갈래를 두고
    그 아래에 실제 거래명을 만든다.

  columns:
    - 상태
    - 출력순서
    - 중분류(항)
    - 거래명
    - 설명
    - 항목(공급가액)[차/대]
    - 결제방법
    - 처리(수정·삭제)

  screen_specific:
    - name: 항목(공급가액)[차/대]
      desc: >
        그 거래명이 어떤 회계 항목으로 잡히는지와 차변인지 대변인지를 보여줍니다.
        예를 들어 "은행 예금 이자 수익"은 이자수익[대], "소득세 납부(국세청)"은 예수금[차]입니다.
    - name: 출력순서
      desc: >
        거래명을 고를 때 나오는 순서입니다. 번호가 작을수록 먼저 나옵니다.
        자주 쓰는 것을 앞으로 당겨 두면 편합니다.
        순서를 바꾼 뒤 [출력순서반영]을 눌러야 적용됩니다.
    - name: 자동거래 분류관리
      desc: 거래처별로 어떤 거래명을 자동으로 붙일지 관리합니다.   # 확인필요: 정확한 동작
    - name: 거래분류관리
      desc: 거래명을 묶는 큰 갈래를 만들고 관리합니다.
    - name: 등록
      desc: 새 거래명을 만듭니다.

  steps:
    - no: 1
      action: 왼쪽 메뉴에서 [거래명 만들기]를 클릭합니다.
      target: side:거래명 만들기
      image: base-dealname-01.png
      note: null
    - no: 2
      action: 위쪽에서 [거래분류]를 골라 그 갈래의 거래명만 봅니다.
      target: null
      image: null
      note: 거래명으로 직접 검색할 수도 있습니다.
    - no: 3
      action: 오른쪽 위 [등록]을 클릭해 새 거래명을 만듭니다.
      target: null
      image: null
      note: 만들 때 어떤 회계 항목으로 잡을지 함께 정합니다.
    - no: 4
      action: 자주 쓰는 거래명을 앞으로 당기려면 출력순서를 바꾸고 [출력순서반영]을 클릭합니다.
      target: null
      image: null
      note: 반영 버튼을 누르지 않으면 순서가 바뀌지 않습니다.

  why_it_matters: >
    거래명을 대충 만들어 두면 나중에 비용 현황을 봐도 무슨 돈인지 알 수 없다.
    [보고서] > [경영관리] > [비용(지출)]이 거래명 단위로 집계되므로,
    여기서 어떻게 만들었느냐가 곧 경영 정보의 품질이 된다.

  cautions:
    - "거래명에 붙은 회계 항목이 잘못되면 그 거래명을 쓴 모든 거래가 함께 틀어집니다."
    - "출력순서를 바꾼 뒤 [출력순서반영]을 누르지 않으면 적용되지 않습니다."
    - "이미 쓰고 있는 거래명을 지우거나 고치면 과거 거래에 영향이 갈 수 있습니다."   # 확인필요

  faq:
    - q: 거래명과 계정과목은 뭐가 다른가요?
      a: >
        거래명은 사람이 알아보기 쉬운 이름이고, 계정과목은 회계 장부에 쓰는 이름입니다.
        거래명 하나에 계정과목이 붙어 있어서, 거래명만 고르면 계정과목이 따라옵니다.
    - q: 우리 사업에 맞는 거래명이 없습니다.
      a: "[등록]으로 직접 만들면 됩니다. 어떤 회계 항목으로 잡을지 함께 정합니다."
    - q: 거래명이 너무 많아 고르기 힘듭니다.
      a: >
        자주 쓰는 것의 출력순서를 앞으로 당기고 [출력순서반영]을 누르세요.
        거래분류로 갈래를 나눠 두는 것도 방법입니다.
---

- screen_id: base-asset
  screen_name: 자산 관리
  path: 왼쪽 메뉴 > 자산 관리
  pattern: A
  inherits: pattern-master
  permission: 왼쪽 메뉴
  purpose: 오래 쓰는 자산을 등록하고 감가상각과 현재 가치를 관리한다

  key_concept: >
    기계, 차량, 건물, 소프트웨어처럼 오래 쓰는 것은 산 해에 전부 비용으로 잡지 않는다.
    쓰는 기간에 걸쳐 나눠서 비용으로 넘기는데, 이것이 감가상각이다.
    여기에 등록해 두면 **상각 계산과 현재 자산가치가 자동으로 잡힌다.**
    등록하지 않으면 감가상각비가 아예 안 잡혀 손익이 실제와 달라진다.

  columns:
    - 순서
    - 항목
    - 자산명
    - 취득일자
    - 취득가액
    - 상각법
    - 내용연수
    - 현재자산가치
    - 처분(폐기)일자
    - 처분(폐기)금액

  what_you_enter:
    - name: 항목
      desc: 자산의 종류입니다. 소프트웨어, 비품, 건물, 토지, 차량운반구 등으로 나뉩니다.
    - name: 취득일자 · 취득가액
      desc: 언제 얼마에 샀는지 적습니다. 상각 계산의 출발점입니다.
    - name: 상각법
      desc: >
        정액법과 정률법이 있습니다.
        정액법은 매년 같은 금액씩, 정률법은 남은 가치에 비율을 곱해 줄여 나갑니다.
    - name: 내용연수
      desc: >
        몇 년에 걸쳐 나눠 비용으로 넘길지입니다.
        소프트웨어나 비품은 5년, 건물은 40년처럼 자산 종류에 따라 다릅니다.
        토지는 상각하지 않으므로 0입니다.
    - name: 현재자산가치
      desc: 취득가액에서 지금까지 상각한 만큼을 뺀 값입니다. 자동으로 계산됩니다.

  screen_specific:
    - name: 폐기/처분
      desc: >
        자산을 팔거나 버렸을 때 처리합니다. 처분일자와 금액이 기록됩니다.
    - name: 등록
      desc: 새 자산을 등록합니다.
    - name: 엑셀 · 인쇄
      desc: 목록을 내려받거나 출력합니다.

  steps:
    - no: 1
      action: 왼쪽 메뉴에서 [자산 관리]를 클릭합니다.
      target: side:자산 관리
      image: base-asset-01.png
      note: null
    - no: 2
      action: 오른쪽 위 [등록]을 클릭해 자산을 추가합니다.
      target: null
      image: null
      note: 항목, 취득일자, 취득가액, 상각법, 내용연수를 넣으면 상각이 자동으로 계산됩니다.
    - no: 3
      action: 자산을 팔거나 버렸으면 그 줄의 [폐기/처분]을 클릭합니다.
      target: null
      image: null
      note: null

  cautions:
    - "여기 등록하지 않으면 감가상각비가 잡히지 않습니다. 손익과 재무상태표가 실제와 달라집니다."
    - "토지는 감가상각을 하지 않습니다. 내용연수를 0으로 둡니다."
    - "상각법과 내용연수는 세법 기준을 따라야 합니다. 임의로 정하면 신고 때 문제가 됩니다."
    - "자산을 삭제하면 그 자산이 들어간 거래에 영향이 갑니다. 판 것이라면 삭제가 아니라 [폐기/처분]으로 처리하세요."

  faq:
    - q: 컴퓨터를 샀는데 어디에 넣나요?
      a: >
        금액이 크고 오래 쓸 것이라면 이 화면에 자산으로 등록합니다.
        소모품 수준이면 그냥 비용으로 처리해도 됩니다.
        서비스가 정해 둔 기준 금액은 없습니다. 어느 쪽으로 할지는 사용자가 정합니다.
    - q: 감가상각비를 직접 계산해야 하나요?
      a: 아닙니다. 취득가액, 상각법, 내용연수를 넣으면 자동으로 계산됩니다.
    - q: 자산을 팔았습니다.
      a: 삭제하지 말고 [폐기/처분]으로 처리하세요. 처분일자와 금액이 기록됩니다.
    - q: 현재자산가치가 마이너스로 나옵니다.
      a: null   # 확인필요: 상각이 끝난 뒤의 표시 방식

