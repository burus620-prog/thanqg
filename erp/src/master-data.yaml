- screen_id: base-project-status
  screen_name: 사업/프로젝트 현황
  path: 왼쪽 메뉴 > 사업/프로젝트 관리 > 사업/프로젝트 현황
  pattern: D
  inherits: pattern-master
  permission: 왼쪽 메뉴
  purpose: 사업·프로젝트별로 수익과 비용을 월별로 집계해 본다

  key_concept: >
    [사업/프로젝트 입력]에서 만든 단위별로 실적을 보는 화면이다.
    거래를 입력할 때 그 단위를 지정해야 여기에 집계된다.
    지정하지 않은 거래는 어디에도 잡히지 않는다.

  screen_specific:
    - name: 사업/프로젝트 탭 · 조직/부서 탭
      desc: 프로젝트 단위로 볼지, 조직·부서 단위로 볼지 고릅니다.
    - name: 기간선택
      desc: 연도를 고릅니다. 결과가 1월부터 12월까지 월별로 나옵니다.
    - name: 검색조건
      desc: 수익+비용 등 무엇을 볼지 고릅니다.   # 확인필요: 선택지 목록
    - name: 표 항목
      desc: 사업/프로젝트, 구분, 조직(부서), 거래명, 합계(당기누적), 1~12월, 합계

  steps:
    - no: 1
      action: 왼쪽 메뉴에서 [사업/프로젝트 관리]를 펼쳐 [사업/프로젝트 현황]을 클릭합니다.
      target: side:사업/프로젝트 관리 > 사업/프로젝트 현황
      image: base-project-status-01.png
      note: null
    - no: 2
      action: 연도와 검색조건을 정하고 [검색]을 클릭합니다.
      target: null
      image: null
      note: 월별로 나뉘어 나오므로 어느 달에 몰렸는지 볼 수 있습니다.

  cautions:
    - "거래를 입력할 때 사업·프로젝트를 지정하지 않으면 여기 안 잡힙니다."
    - "데이터가 없다고 나오면 프로젝트를 지정한 거래가 없다는 뜻입니다."

  faq:
    - q: 데이터가 없다고 나옵니다.
      a: >
        프로젝트를 지정한 거래가 없는 것입니다.
        거래를 입력하거나 수정할 때 사업·프로젝트를 골라야 여기에 집계됩니다.
    - q: 부서별로도 볼 수 있나요?
      a: 위쪽 [조직/부서] 탭에서 볼 수 있습니다.
