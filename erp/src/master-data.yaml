- screen_id: base-user
  screen_name: 사용자 관리
  path: 왼쪽 메뉴 > 사용자 관리
  pattern: E
  inherits: pattern-master
  permission: 왼쪽 메뉴
  purpose: 이 서비스를 쓸 사람을 등록하고 메뉴별 접근 권한을 준다

  key_concept: >
    화면 안내에 이렇게 적혀 있다.
    "사용자구분 및 아이디 별로 메뉴에 대한 접근 권한을 부여 할 수 있습니다."
    구분으로 큰 틀을 정하고, 아이디마다 볼 수 있는 메뉴를 따로 지정하는 방식이다.

  user_types:
    - name: 부운영자
      desc: 부여받은 메뉴에서 등록·수정·삭제까지 할 수 있습니다.
    - name: 열람자
      desc: >
        **보기만 됩니다.** 부여된 메뉴에 들어갈 수는 있지만
        등록·수정·삭제는 할 수 없습니다.
    - name: 세무담당자
      desc: 세무 대리인에게 주는 구분입니다.   # 확인필요: 접근 범위

  multi_business: >
    사업장이 여러 개일 때는 순서가 있다.
    ① 이 화면에서 아이디를 만든다.
    ② 등록할 사업장으로 접속한다.
    ③ 그 사업장의 [다중사업장 관리]에서 [기존사업장 연결]을 누른다.
    ④ 앞서 만든 아이디와 비밀번호를 넣는다.
    예를 들어 A업체에서 만든 아이디를 B업체에서 쓰려면, B업체에 접속해 연결해 준다.

  columns:
    - 구분
    - 이름
    - 아이디
    - 접속아이피
    - 메모

  screen_specific:
    - name: 접속아이피
      desc: >
        마지막으로 접속한 아이피와 시각이 남습니다.
        누가 언제 들어왔는지 확인할 수 있습니다.
    - name: 등록 / 삭제
      desc: 사용자를 추가하거나 지웁니다.

  steps:
    - no: 1
      action: 왼쪽 메뉴에서 [사용자 관리]를 클릭합니다.
      target: side:사용자 관리
      image: base-user-01.png
      note: null
    - no: 2
      action: 오른쪽 위 [등록]을 클릭해 사용자를 추가합니다.
      target: null
      image: null
      note: 구분을 정하고, 그 사람이 볼 메뉴를 지정합니다.
    - no: 3
      action: 그만둔 사람은 골라서 [삭제]합니다.
      target: null
      image: null
      note: null

  cautions:
    - "급여와 세무 자료를 볼 수 있는 사람을 정하는 화면입니다. 권한을 넓게 열면 급여액과 개인정보가 함께 노출됩니다."
    - "보기만 시키려면 구분을 [열람자]로 하세요. 부운영자는 자료를 고치고 지울 수 있습니다."
    - "그만둔 사람의 아이디는 바로 지우세요. 접속아이피 기록으로 마지막 접속을 확인할 수 있습니다."

  faq:
    - q: 직원에게 보기만 시키고 싶습니다.
      a: 구분을 [열람자]로 등록하세요. 메뉴에 들어갈 수는 있지만 등록·수정·삭제는 안 됩니다.
    - q: 사업장이 여러 개인데 같은 아이디를 쓰고 싶습니다.
      a: >
        한 사업장에서 아이디를 만든 뒤, 다른 사업장에 접속해
        [다중사업장 관리] > [기존사업장 연결]에서 그 아이디와 비밀번호를 등록합니다.
    - q: 세무사에게 자료를 보여주려면?
      a: 구분을 [세무담당자]로 등록합니다.

