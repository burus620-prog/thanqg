# 성공닷컴 사용자 매뉴얼 원본 — 왼쪽 메뉴 (기준정보)
# 화면 10개. 다른 메뉴가 돌아가기 위한 사전 준비에 해당한다.

- screen_id: base-biz
  screen_name: 사업장 정보
  path: 왼쪽 메뉴 > 사업장 정보 관리 > 사업장 정보
  pattern: A
  inherits: pattern-master
  permission: 왼쪽 메뉴
  purpose: 사업자등록증의 내용과 담당자 정보를 등록한다

  key_concept: >
    모든 서식과 신고에 찍히는 기본 정보다. 서비스를 처음 쓸 때 가장 먼저 채우는 화면이다.
    별표(＊)가 붙은 항목은 반드시 넣어야 한다.

  what_you_enter:
    - name: 사업자유형 (필수)
      desc: 법인 · 개인사업자 · 개인 중에 고릅니다.
    - name: 회사명 · 대표자명 (필수)
      desc: 사업자등록증에 있는 그대로 적습니다.
    - name: 사업자등록번호 (필수)
      desc: 신고와 자동수집에 쓰이는 핵심 번호입니다.
    - name: 법인등록번호
      desc: 법인이면 적습니다.
    - name: 공동사업자 여부 (필수)
      desc: 공동으로 하는 사업인지 표시합니다.
    - name: 사업연차 · 개업일/폐업일 (필수)
      desc: 개업일은 신고 기간 계산에 쓰입니다.
    - name: 관할 세무서
      desc: "[세무서찾기]로 고릅니다."
    - name: 업종코드
      desc: "[업종코드 찾기]나 [국세청조회]로 찾습니다. 세무 신고에 쓰입니다."
    - name: 업태 · 종목
      desc: 사업자등록증에 적힌 대로 넣습니다.
    - name: 주소
      desc: "[우편번호]나 [주소찾기]로 넣습니다."
    - name: 장부 시작연도
      desc: 이 서비스로 장부를 시작한 해입니다.

  screen_specific:
    - name: 담당자 정보
      desc: >
        담당자명, 휴대폰, 이메일을 넣습니다.
        각각 "SMS를 수신하지 않으려면 체크하세요", "이메일을 수신하지 않으려면 체크하세요"
        옵션이 있습니다.
    - name: 도장등록
      desc: >
        [도장등록]으로 회사 도장 이미지를 올립니다.
        계산서나 거래명세서를 출력할 때 쓰입니다.
    - name: 구글 드라이브 연동
      desc: >
        구글 계정을 연결해 저장 공간으로 씁니다. 연결하면 사용 현황이 표시됩니다.
        구글아이디가 없으면 구글가입 뒤에 연동합니다.

  steps:
    - no: 1
      action: 왼쪽 메뉴에서 [사업장 정보 관리]를 펼쳐 [사업장 정보]를 클릭합니다.
      target: side:사업장 정보 관리 > 사업장 정보
      image: base-biz-01.png
      note: null
    - no: 2
      action: 별표(＊)가 붙은 항목을 사업자등록증과 대조해 채웁니다.
      target: null
      image: null
      note: 업종코드는 [업종코드 찾기] 또는 [국세청조회]로 확인합니다.
    - no: 3
      action: 도장을 쓰려면 [도장등록]으로 이미지를 올립니다.
      target: null
      image: null
      note: null
    - no: 4
      action: 오른쪽 위 [저장]을 클릭합니다.
      target: null
      image: null
      note: null

  cautions:
    - "여기 정보가 모든 서식과 신고에 찍힙니다. 사업자등록증과 다르면 서류가 통째로 틀립니다."
    - "사업자등록번호는 자동수집과 신고의 기준입니다. 오타가 나면 자료를 못 가져옵니다."
    - "개업일은 신고 기간 계산에 쓰입니다. 정확히 넣으세요."

  faq:
    - q: 업종코드를 모르겠습니다.
      a: "[업종코드 찾기]나 [국세청조회]로 찾을 수 있습니다. 사업자등록증에도 적혀 있습니다."
    - q: 도장은 왜 등록하나요?
      a: 계산서나 거래명세서를 출력할 때 찍히도록 하기 위해서입니다.
    - q: 사업장을 옮겼습니다.
      a: 이 화면에서 주소와 관할 세무서를 고치고 저장하세요.

---

- screen_id: base-filing
  screen_name: 신고 정보
  path: 왼쪽 메뉴 > 사업장 정보 관리 > 신고 정보
  pattern: A
  inherits: pattern-master
  permission: 왼쪽 메뉴
  purpose: 부가세 신고에 쓰이는 사업장 설정을 등록한다

  key_concept: >
    **부가세 신고서가 이 설정을 그대로 가져다 쓴다.**
    화면에도 "(＊)표시가 있는 항목은 부가세 신고시 필수입력사항입니다"라고 적혀 있다.
    여기가 비어 있거나 틀리면 신고서가 통째로 틀어진다.
    서비스를 처음 쓸 때 사업자등록증을 옆에 놓고 채우는 화면이다.

  required_fields:
    - name: 과세형태 (필수)
      desc: >
        일반과세 · 간이과세 · 면세 중 하나를 고릅니다.
        신고 주기와 방식이 여기서 갈립니다.
    - name: 과세면세 여부
      desc: 과세 · 면세 · 과세+면세 중에 고릅니다.
    - name: 홈택스ID
      desc: 홈택스 연결에 쓰입니다.
    - name: 부가세신고방법
      desc: >
        사업장이 여럿일 때 어떻게 신고할지 정합니다.
        일반 사업자 / 총괄납부 주사업자 / 총괄납부 종사업자 / 사업자단위과세적용사업자.
    - name: 의제매입 공제율
      desc: >
        음식점업이나 제조업에서 면세 농산물 등을 사면 매입세액을 일부 인정받습니다.
        업종에 따라 4/104, 6/106, 8/108, 9/109, 2/102 중에 고릅니다.
        해당하지 않으면 [해당없음]으로 둡니다.
    - name: 현금매출사업자구분
      desc: >
        변호사, 세무사, 예식장업, 부동산중개업처럼 현금영수증 의무발행 업종인지 고릅니다.
        해당하지 않으면 [해당없음]입니다.
    - name: 지방소득세 구분
      desc: 개인인지 법인인지, 법인이면 어떤 형태인지 고릅니다. 원천세 신고에 쓰입니다.
    - name: 산재보험 요율
      desc: 업종별 요율입니다. [요율 찾기]로 확인합니다.
    - name: 봉사료 여부
      desc: 봉사료를 따로 받는 업종인지 표시합니다.

  other_sections:
    - name: 사업장 시설 현황
      desc: >
        사업장 소유 형태, 대지·바닥·연면적, 층수, 차량 수, 객실·탁자·의자 수,
        주차장 유무, 보증금과 월세를 적습니다.
        업종에 따라 세무 신고에 쓰이는 항목입니다.
    - name: 직원현황
      desc: 임원, 정직원, 일급/시급, 사업소득자 인원을 적습니다.

  steps:
    - no: 1
      action: 왼쪽 메뉴에서 [사업장 정보 관리]를 펼쳐 [신고 정보]를 클릭합니다.
      target: side:사업장 정보 관리 > 신고 정보
      image: base-filing-01.png
      note: null
    - no: 2
      action: 별표(＊)가 붙은 항목을 먼저 채웁니다.
      target: null
      image: null
      note: 부가세 신고에 반드시 필요한 항목입니다.
    - no: 3
      action: 업종에 해당하는 항목을 고릅니다.
      target: null
      image: null
      note: 의제매입 공제율과 현금매출사업자구분은 해당 업종만 고릅니다.
    - no: 4
      action: 오른쪽 위 [저장]을 클릭합니다.
      target: null
      image: null
      note: null

  cautions:
    - "여기 설정이 부가세 신고서에 그대로 반영됩니다. 사업자등록증과 대조해 정확히 넣으세요."
    - "과세형태를 잘못 고르면 신고 주기부터 달라집니다."
    - "의제매입 공제율은 업종에 맞는 것을 골라야 합니다. 잘못 고르면 공제 금액이 틀어집니다."

  faq:
    - q: 별표(＊)가 붙은 항목은 뭔가요?
      a: 부가세 신고에 반드시 필요한 항목입니다. 비어 있으면 신고서가 제대로 만들어지지 않습니다.
    - q: 의제매입 공제율이 뭔가요?
      a: >
        음식점업이나 제조업에서 면세 농산물 등을 살 때 매입세액을 일부 인정해 주는 제도입니다.
        해당 업종이 아니면 [해당없음]으로 두면 됩니다.
    - q: 사업장이 여러 곳입니다.
      a: "[부가세신고방법]에서 총괄납부인지 사업자단위과세인지 고릅니다."

---

- screen_id: base-bank-card
  screen_name: 통장/카드 관리
  path: 왼쪽 메뉴 > 사업장 정보 관리 > 통장/카드 관리
  pattern: A
  inherits: pattern-master
  permission: 왼쪽 메뉴
  purpose: 자동수집에 쓸 통장, 카드, 홈택스, 카드매출 정보를 등록하고 수집 예약을 관리한다

  key_concept: >
    **자동수집의 출발점**이다. 여기에 등록된 곳에서만 자료를 가져온다.
    자동수집 결과가 비어 있다면 대개 여기가 비어 있거나 인증이 풀린 것이다.

  what_you_register:
    - name: 은행계좌
      desc: 통장 입출금 자료를 가져올 계좌. 계좌명과 계좌번호로 관리한다.
    - name: 신용카드 (비용)
      desc: 카드 지출 자료를 가져올 카드.
    - name: 국세청 홈택스
      desc: 세금계산서와 현금영수증을 가져오기 위한 홈택스 연결.
    - name: 여신금융협회 / 결제승인대행사 / VAN
      desc: 카드 매출 자료를 가져오기 위한 연결. 제로페이 등도 여기에 들어간다.

  auth_methods: >
    등록할 때 인증수단을 고른다. 세 가지가 쓰인다.
    · **공인인증서** — 인증서로 연결한다
    · **빠른계좌** — 계좌 확인만으로 간편하게 연결한다
    · **아이디** — 해당 기관 아이디와 비밀번호로 연결한다
    화면에 "자동수집예약은 아이디/비밀번호 또는 빠른계좌로 인증된 경우만 이용 가능합니다"라고
    적혀 있다. **공인인증서로 등록하면 자동수집 예약을 쓸 수 없다.**

  screen_specific:
    - name: 자동수집 예약
      desc: >
        정해진 때에 저절로 자료를 가져오게 해 두는 기능입니다. [사용] / [미사용]으로 켜고 끕니다.
        아이디 방식이나 빠른계좌로 등록한 것만 예약할 수 있습니다.
    - name: 전표수집
      desc: 등록된 곳에서 지금 바로 자료를 가져옵니다.
    - name: 등록
      desc: 새 통장이나 카드를 등록합니다.
    - name: 건수 표시
      desc: 위쪽에 "통장 N건 / 카드 N건"으로 등록된 개수가 보입니다.

  steps:
    - no: 1
      action: 왼쪽 메뉴에서 [사업장 정보 관리]를 펼쳐 [통장/카드 관리]를 클릭합니다.
      target: side:사업장 정보 관리 > 통장/카드 관리
      image: base-bank-card-01.png
      note: null
    - no: 2
      action: 오른쪽 위 [등록]을 클릭해 통장이나 카드를 추가합니다.
      target: null
      image: null
      note: 인증수단을 고를 때 예약을 쓸 계획이면 빠른계좌나 아이디 방식을 고릅니다.
    - no: 3
      action: 자동으로 가져오게 하려면 [자동수집 예약]을 [사용]으로 둡니다.
      target: null
      image: null
      note: null

  cautions:
    - "공인인증서로 등록하면 자동수집 예약을 쓸 수 없습니다. 매번 직접 가져와야 합니다."
    - "인증서가 만료되거나 비밀번호가 바뀌면 수집이 멈춥니다. 자동수집 결과가 비면 여기부터 확인하세요."
    - "계좌번호와 카드번호가 표시되는 화면입니다. 열람 권한을 꼭 필요한 사람에게만 주세요."

  faq:
    - q: 자동수집이 아무것도 안 가져옵니다.
      a: >
        이 화면에 통장과 카드가 등록되어 있는지, 인증이 풀리지 않았는지 확인하세요.
        등록이 없으면 자료가 없는 것이 아니라 가져올 곳이 없는 것입니다.
    - q: 자동수집 예약이 안 켜집니다.
      a: >
        공인인증서로 등록한 것은 예약을 쓸 수 없습니다.
        빠른계좌나 아이디 방식으로 다시 등록해야 합니다.
    - q: 홈택스 자료는 어디서 연결하나요?
      a: 이 화면 아래쪽 [국세청 홈택스] 항목에서 세금계산서와 현금영수증을 각각 연결합니다.

---

- screen_id: base-partner
  screen_name: 거래처 등록/관리
  path: 왼쪽 메뉴 > 거래처 등록/관리
  pattern: A
  inherits: pattern-master
  permission: 왼쪽 메뉴
  purpose: 거래하는 상대방을 등록하고 관리한다

  key_concept: >
    거래처가 등록되어 있어야 매출·매입을 거래처별로 묶어 볼 수 있다.
    채권채무 보고서와 수납·지급 확인도 거래처를 기준으로 움직인다.

  how_to_fill: >
    하나씩 손으로 넣지 않아도 된다.
    **[홈택스 거래처 가져오기]**로 세금계산서를 주고받은 곳을 한꺼번에 불러올 수 있고,
    **[엑셀일괄등록]**으로 정리해 둔 목록을 올릴 수도 있다.
    처음 시작할 때는 이 두 가지를 먼저 써 보는 편이 빠르다.

  layout:
    - zone: 왼쪽 — 거래처 목록
      desc: 거래처명과 사업자등록번호가 나온다. 별표로 자주 쓰는 곳을 표시할 수 있다.
    - zone: 오른쪽 — 상세 정보
      desc: 고른 거래처의 내용이 나온다. 기본 정보와 추가정보로 나뉜다.

  what_you_enter:
    - name: 기본 정보
      desc: 업체코드, 업체구분, 거래처명, 대표자, 사업자유형, 과세형태, 사업자번호, 법인번호, 주소
    - name: 추가정보
      desc: >
        업종, 업태, 이메일, 팩스, 영업사원, 등록일시, 초기미수, 현재미수, 여신한도,
        담당자와 연락처, 특이사항

  screen_specific:
    - name: 홈택스 거래처 가져오기
      desc: 홈택스에서 거래한 곳을 한꺼번에 불러옵니다.
    - name: 엑셀일괄등록
      desc: 엑셀로 정리한 거래처를 한꺼번에 올립니다.
    - name: 여신한도 · 초기미수 · 현재미수
      desc: >
        그 거래처에 얼마까지 외상을 줄지, 지금 못 받은 돈이 얼마인지 관리합니다.
        한도를 넘으면 경고가 표시됩니다.

  steps:
    - no: 1
      action: 왼쪽 메뉴에서 [거래처 등록/관리]를 클릭합니다.
      target: side:거래처 등록/관리
      image: base-partner-01.png
      note: null
    - no: 2
      action: 처음이라면 [홈택스 거래처 가져오기]로 한꺼번에 불러옵니다.
      target: null
      image: null
      note: 엑셀로 정리해 둔 것이 있으면 [엑셀일괄등록]을 씁니다.
    - no: 3
      action: 하나씩 넣으려면 [등록]을, 고치려면 대상을 고르고 [수정]을 클릭합니다.
      target: null
      image: null
      note: null

  cautions:
    - "사업자등록번호가 정확해야 합니다. 자동 분류가 이 번호로 예전 거래명을 찾습니다."
    - "같은 거래처를 두 번 등록하면 집계가 나뉩니다. 등록 전에 검색해 보세요."

  faq:
    - q: 거래처를 하나씩 다 넣어야 하나요?
      a: >
        아닙니다. [홈택스 거래처 가져오기]로 한꺼번에 불러오거나
        [엑셀일괄등록]으로 올릴 수 있습니다.
    - q: 거래처명이 영업일보에 안 보입니다.
      a: null   # 확인필요: 영업일보 노출 지정 위치

