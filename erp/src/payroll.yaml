# 성공닷컴 사용자 매뉴얼 원본 — 급여관리
# 실제 왼쪽 메뉴 구성에 맞춰 작성. 화면 10개.
#   직원관리 / 급여지급 5 / 퇴직지급 2 / 4대보험 신고 / 원천세 신고 바로가기

- screen_id: pay-employee
  screen_name: 직원관리
  path: 급여관리 > 직원관리
  pattern: A
  inherits: pattern-payroll
  permission: 급여관리
  purpose: 급여를 줄 사람을 등록하고 근로 조건과 4대보험 정보를 관리한다
  key_concept: >
    급여를 주는 모든 사람을 등록하는 곳이다.
    **정규직만이 아니라 일용직과 사업소득자도 여기서 관리한다.**
    소득 종류에 따라 세금 계산과 제출 서류가 달라지므로, 등록할 때 구분을 제대로 잡아야 한다.

  screen_specific:
    - name: 구분 탭
      desc: >
        [전체] [정규직] [일용직] [사업소득자]로 나뉘어 있고 괄호 안에 인원수가 나옵니다.
        목록의 구분 열에도 정·일·사 표시가 붙습니다.
    - name: 사원번호
      desc: 등록일 기준으로 자동으로 매겨집니다.
    - name: 근로정보 일괄설정
      desc: 여러 사람의 근로 조건을 한꺼번에 바꿉니다.
    - name: 근태정보 일괄설정
      desc: 여러 사람의 근태 조건을 한꺼번에 바꿉니다.

  cautions_extra: >
    소득 구분을 잘못 잡으면 세금 계산부터 제출 서류까지 전부 틀어진다.
    정규직인지 일용직인지 사업소득자인지는 실제로 일한 방식으로 판단한다.
    자세한 기준은 [인건비 종류와 원천세 제출 서류] 문서를 참고한다.

  steps:
    - no: 1
      action: 상단 [급여관리]를 클릭한 뒤 왼쪽에서 [직원관리]을 클릭합니다.
      target: nav:급여관리 > side:직원관리
      image: pay-employee-01.png
      note: null

  cautions:
    - "직원 개인정보와 급여액이 표시됩니다. 화면을 열어 둔 채 자리를 비우지 마세요."

  faq: []

