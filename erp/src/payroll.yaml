- screen_id: pay-insurance
  screen_name: 4대보험 신고
  path: 급여관리 > 4대보험 신고
  pattern: C
  inherits: pattern-payroll
  permission: 급여관리
  purpose: 입사·퇴사·급여 변동에 따른 4대보험 신고 자료를 만든다

  key_concept: >
    **이 화면에서 처리해도 공단에 접수되지 않는다.**
    여기서 만드는 것은 신고에 쓸 자료이고, 실제 신고는 따로 해야 한다.
    이 사실을 모르면 신고를 마쳤다고 생각하고 넘어가 기한을 놓치게 된다.

  deadline: >
    취득신고 기한은 보험마다 다르다. 건강보험이 가장 짧다.
    · 건강보험 — 취득일로부터 14일 이내
    · 국민연금 · 고용보험 · 산재보험 — 취득일이 속한 달의 다음 달 15일까지
    한꺼번에 신고하더라도 건강보험에 맞춰 **입사 후 14일 이내**에 하는 것이 안전하다.

  deadline_example: >
    8월 1일 입사인 경우
    · 건강보험 → 8월 14일까지
    · 국민연금 · 고용보험 · 산재보험 → 9월 15일까지

  how_to_submit:
    - name: 4대사회보험 정보연계센터 (권장)
      desc: >
        온라인으로 신고하고 처리 결과까지 확인할 수 있습니다.
        네 가지 보험을 한 곳에서 처리할 수 있어 가장 편합니다.
    - name: 팩스 제출
      desc: >
        서면으로 신고서를 작성한 뒤, 관할 건강보험공단에 전화해 접수 팩스번호를 확인하고 보냅니다.
        팩스번호는 지사마다 다르므로 반드시 전화로 확인한 뒤 보냅니다.

  steps:
    - no: 1
      action: 상단 [급여관리]를 클릭한 뒤 왼쪽에서 [4대보험 신고]를 클릭합니다.
      target: nav:급여관리 > side:4대보험 신고
      image: pay-insurance-01.png
      note: null
    - no: 2
      action: 신고할 내용을 확인하고 자료를 만듭니다.
      target: null
      image: null
      note: null
    - no: 3
      action: 정보연계센터에서 온라인으로 신고하거나, 서면으로 공단에 팩스로 보냅니다.
      target: null
      image: null
      note: 이 단계까지 해야 신고가 끝납니다.

  cautions:
    - "이 화면에서 처리했다고 신고가 끝난 것이 아닙니다. 정보연계센터에서 온라인으로 신고하거나 공단에 팩스로 보내야 마무리됩니다."
    - "팩스번호는 지사마다 다릅니다. 인터넷에서 찾은 번호로 보내지 말고 관할 공단에 전화해 확인하세요."
    - "취득일은 실제 입사일로 신고합니다. 기한이 지났다고 신고일로 바꾸면 안 됩니다."
    - "기한이 지났더라도 미루지 말고 바로 신고하세요. 늦출수록 소급 보험료가 쌓입니다."
    - "직원 개인정보와 급여액이 표시됩니다. 화면을 열어 둔 채 자리를 비우지 마세요."

  faq:
    - q: 여기서 신고하면 공단에 접수되나요?
      a: >
        접수되지 않습니다. 이 화면은 신고에 쓸 자료를 만드는 곳입니다.
        자료를 만든 뒤 4대사회보험 정보연계센터에서 온라인으로 신고하거나,
        서면으로 작성해 관할 건강보험공단에 팩스로 보내야 마무리됩니다.
    - q: 온라인과 팩스 중 어느 쪽이 나은가요?
      a: >
        정보연계센터가 편합니다. 네 가지 보험을 한 곳에서 처리하고 결과도 확인할 수 있습니다.
        팩스로 보낼 때는 관할 건강보험공단에 전화해 접수 팩스번호를 먼저 확인하세요.
    - q: 신고 기한이 언제인가요?
      a: >
        건강보험은 취득일로부터 14일 이내, 국민연금·고용보험·산재보험은
        취득일이 속한 달의 다음 달 15일까지입니다.
        건강보험이 가장 짧으므로 입사 후 14일 이내에 함께 신고하는 것이 안전합니다.
    - q: 기한을 넘기면 어떻게 되나요?
      a: >
        세금처럼 가산세가 붙는 것이 아니라 신고의무 위반에 따른 과태료 문제입니다.
        다만 실무에서 더 부담이 되는 것은 과태료보다 소급 보험료입니다.
        신고가 늦어도 자격 취득일은 실제 입사일이므로, 그때부터 보험료가 한꺼번에 부과됩니다.

