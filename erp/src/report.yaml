# 성공닷컴 사용자 매뉴얼 원본 — 보고서
# 실제 왼쪽 메뉴 구성에 맞춰 작성. 화면 18개.
#   금융보고서 / 세무요약 보고서 / 매출매입 보고서 2 / 채권채무 보고서
#   월간경영 보고서 4 / 경영보고서 5 / 경영 관리 4

- screen_id: rpt-financial
  screen_name: 금융보고서
  path: 보고서 > 금융보고서
  pattern: D
  inherits: pattern-report
  permission: 보고서
  purpose: 통장·카드·여신을 아우른 자금 흐름을 하루 단위로 본다
  key_concept: >
    하루 기준으로 자금이 어떻게 움직였는지 보여주는 **자금일보**다.
    통장별 잔액, 카드 지출별 이용대금, 여신금융협회 매출, 현금영수증까지 한 화면에 모인다.
    오늘 쓸 수 있는 돈이 얼마인지 확인할 때 쓴다.

  screen_specific:
    - name: 자동수집 / 장부 탭
      desc: >
        자동수집으로 가져온 자료로 볼지, 장부에 들어간 자료로 볼지 고릅니다.
        두 숫자가 다르면 장부에 아직 안 넣은 자료가 있다는 뜻입니다.
    - name: 날짜 이동
      desc: 화살표로 하루씩 앞뒤로 옮겨 봅니다.
    - name: 통장별 구분
      desc: >
        전일 잔액 → 당일 입금 소계 → 총액 → 출금 소계 → 당일 잔액 순으로
        통장마다 나뉘어 나옵니다.
    - name: 카드 지출별 구분
      desc: 전월 이용대금, 지출 소계, 당월 이용대금(예정)이 카드별로 나옵니다.
    - name: 여신금융협회 (매출)
      desc: D-2부터 D+2까지 카드 매출 정산 예정이 날짜별로 나옵니다.
    - name: 현금영수증 (지출 / 매출)
      desc: 현금영수증 내역이 지출과 매출로 나뉘어 나옵니다.

  steps:
    - no: 1
      action: 상단 [보고서]를 클릭한 뒤 왼쪽에서 [금융보고서]를 클릭합니다.
      target: nav:보고서 > side:금융보고서
      image: rpt-financial-01.png
      note: null

  cautions:
    []

  faq: []

