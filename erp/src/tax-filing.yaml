- screen_id: acct-vat-verify
  screen_name: 증빙별 자료 검증
  path: 세무 · 회계 > 부가세 신고 > 증빙별 자료 검증
  pattern: D
  inherits: pattern-taxfile
  permission: 세무 · 회계
  purpose: 국세청 자료와 내 장부를 맞춰 보고 빠진 것을 찾는다

  key_concept: >
    **국세청에 있는 것과 내 장부에 있는 것을 나란히 놓고 차액을 본다.**
    화면에 "국세청 = 장부 (금액과 건수가 일치해야 합니다)"라고 적혀 있다.
    차액이 0이 아니면 장부에 빠진 자료가 있다는 뜻이다.
    매입이 빠지면 그만큼 세금을 더 내므로 신고 전에 반드시 거친다.

  where_in_flow: >
    화면 맨 위에 A부터 E까지 진행 표시가 있다.
    Ⓐ 미포함 계산서 → Ⓑ 포함 (세금)계산서 → **Ⓒ 신고 자료 검증** →
    Ⓓ 신고서 작성 → Ⓔ 신고서 목록.
    지금 어느 단계인지 이 표시로 알 수 있다.

  screen_specific:
    - name: 증빙 종류 탭
      desc: >
        [전자(세금)계산서] [카드] [현금영수증] [기타(정규영수증외)] 네 가지로 나뉩니다.
        증빙 종류마다 따로 검증합니다.
    - name: 매출 / 매입 선택
      desc: 매출을 볼지 매입을 볼지 고릅니다.
    - name: 분기 버튼
      desc: 1분기부터 4분기까지 버튼으로 기간을 빠르게 고릅니다.
    - name: 요약 줄
      desc: >
        국세청 금액·건수와 장부 금액·건수, 그리고 차액이 한 줄로 나옵니다.
        일치하면 [일치] 표시가 붙습니다.
    - name: 상세보기
      desc: 그 날짜의 자료를 자세히 봅니다.

  steps:
    - no: 1
      action: 상단 [세무 · 회계]를 클릭한 뒤 왼쪽 [부가세 신고]에서 [증빙별 자료 검증]을 클릭합니다.
      target: nav:세무 · 회계 > side:부가세 신고 > 증빙별 자료 검증
      image: acct-vat-verify-01.png
      note: null
    - no: 2
      action: 증빙 종류 탭을 고르고, 매출인지 매입인지 정한 뒤 분기를 고릅니다.
      target: null
      image: null
      note: 증빙 종류마다 따로 확인해야 합니다. 네 탭을 모두 보세요.
    - no: 3
      action: "[검색]을 클릭해 국세청과 장부를 비교합니다."
      target: null
      image: null
      note: 차액이 0이면 맞는 것입니다.
    - no: 4
      action: 차액이 있으면 [상세보기]로 어느 건이 빠졌는지 확인하고 장부에 넣습니다.
      target: null
      image: null
      note: null   # 확인필요: 이 화면에서 바로 넣을 수 있는지

  cautions:
    - "차액이 있으면 신고서를 만들기 전에 해결하세요. 신고 후에는 수정신고를 해야 합니다."
    - "증빙 종류가 네 가지입니다. 하나만 보고 넘어가면 다른 종류에서 빠진 것을 놓칩니다."
    - "매출과 매입을 각각 확인해야 합니다."

  faq:
    - q: 차액이 나옵니다.
      a: >
        국세청에는 있는데 장부에 없는 자료가 있다는 뜻입니다.
        [거래(전표) 입력]에서 장부입력을 안 했을 가능성이 큽니다.
    - q: 어떤 순서로 하나요?
      a: >
        화면 위 진행 표시를 따르세요.
        미포함 계산서 정리 → 포함 확인 → 자료 검증 → 신고서 작성 → 신고서 목록 순입니다.

---

- screen_id: acct-vat-form
  screen_name: 부가세 신고서 작성
  path: 세무 · 회계 > 부가세 신고 > 부가세 신고서 작성
  pattern: C
  inherits: pattern-taxfile
  permission: 세무 · 회계
  purpose: 장부 자료로 신고서와 부속서류를 만들고 홈택스에 올릴 전자파일을 뽑는다

  where_in_flow: 진행 표시에서 **Ⓓ 신고서 작성** 단계다.

  key_concept: >
    포함 세금계산서와 장부의 관련 전표를 자동으로 불러와 신고서를 채운다.
    감면과 공제도 확인해 반영한다.
    마감하면 **전자파일**이 만들어지는데, 이 파일을 홈택스에 올려야 신고가 끝난다.

  before_you_start: >
    화면을 열면 안내창이 뜬다. 두 가지가 필수다.
    ① 신고기간의 거래가 모두 등록되어 있어야 한다.
    ② 홈택스 회원아이디가 있어야 한다.
    그리고 "잘못 등록된 거래로 인해 발생하는 문제는 책임지지 않습니다"라고 적혀 있다.
    앞 단계인 [증빙별 자료 검증]을 건너뛰지 말아야 하는 이유다.

  three_steps: >
    안내창이 알려주는 큰 흐름은 셋이다.
    **신고서 작성 → 변환하기(국세청 홈택스 접속) → 전송하기**
    이 서비스가 하는 일은 작성과 변환까지이고, 전송은 홈택스에서 한다.

  layout:
    - zone: 왼쪽 — 신고기간과 서식 목록
      desc: >
        신고기간을 정하고, 신고서와 부속서류가 목록으로 나온다.
        각 서식 옆에 [저장] 또는 [미작성] 상태가 표시된다.
    - zone: 오른쪽 — 신고서 본문
      desc: >
        실제 부가가치세 신고서 서식이 그대로 나온다.
        과세표준 및 매출세액, 매입세액, 경감·공제 세액, 납부할 세액 순으로 채워진다.

  attached_forms: >
    부속서류가 16종이다. 해당하는 것만 작성하면 되고, 나머지는 [미작성]으로 둔다.
    계산서합계표 · 세금계산서합계표 · 신용카드매출전표등수령금액합계표 ·
    신용카드매출전표등발행금액집계표 · 영세율매출명세서 · 의제매입세액공제신고서 ·
    부동산임대공급가액명세서 · 수출실적명세서 · 사업장현황명세서 · 현금매출명세서 ·
    건물등감가상각자산취득명세서 · 사업장별부가가치세과세표준및납부세액 ·
    공제받지 못할 매입세액명세서 · 소규모개인사업자부가가치세감면신청서 ·
    전자세금계산서 발급세액공제신고서

  buttons:
    - name: 자료 검증
      desc: 신고서를 만들기 전에 자료가 맞는지 다시 확인합니다.
    - name: 마감취소
      desc: 이미 마감한 신고를 되돌립니다. 고칠 것이 있으면 마감을 취소하고 다시 작성합니다.
    - name: 신고파일 받기
      desc: 홈택스에 올릴 전자파일을 내려받습니다.
    - name: 도움말 보기
      desc: 작성 방법 안내를 봅니다.
    - name: 변경
      desc: 신고기간을 바꿉니다.

  screen_specific:
    - name: 예정 / 확정 / 기한후과세표준
      desc: 어떤 신고인지 고릅니다.
    - name: 환급구분선택
      desc: >
        돌려받을 세액이 있을 때 어떤 환급인지 고릅니다.
        일반환급, 영세율등조기환급, 시설투자환급, 총괄납부주사업자 관련 환급이 있습니다.
    - name: 국세환급금계좌신고
      desc: 환급받을 계좌를 적습니다. 은행을 고르고 계좌번호를 넣습니다.
    - name: 폐업신고
      desc: 폐업하는 경우 폐업일자와 사유를 적습니다.
    - name: 과세표준명세
      desc: 업태·종목·업종코드별로 금액을 나눠 적습니다.
    - name: 저장 이력
      desc: 위쪽에 마지막으로 저장한 사람과 시각이 표시됩니다.

  steps:
    - no: 1
      action: 왼쪽 [부가세 신고]에서 [부가세 신고서 작성]을 클릭합니다.
      target: nav:세무 · 회계 > side:부가세 신고 > 부가세 신고서 작성
      image: acct-vat-form-01.png
      note: 안내창이 뜨면 내용을 읽고 [확인]을 누릅니다.
    - no: 2
      action: 왼쪽에서 신고기간을 확인하고, 필요하면 [변경]으로 바꿉니다.
      target: null
      image: null
      note: null
    - no: 3
      action: 예정인지 확정인지 고르고, 신고서 내용을 확인합니다.
      target: null
      image: null
      note: 장부에서 자동으로 불러온 숫자입니다. 직접 채우는 것이 아닙니다.
    - no: 4
      action: 해당하는 부속서류를 작성합니다.
      target: null
      image: null
      note: 16종 중 해당하는 것만 하면 됩니다. 나머지는 [미작성]으로 둡니다.
    - no: 5
      action: 돌려받을 세액이 있으면 환급구분과 국세환급금계좌를 적습니다.
      target: null
      image: null
      note: null
    - no: 6
      action: 마감하고 [신고파일 받기]로 전자파일을 내려받습니다.
      target: null
      image: null
      note: 고칠 것이 생기면 [마감취소]로 되돌릴 수 있습니다.
    - no: 7
      action: 홈택스에 접속해 회계프로그램 신고로 그 파일을 올립니다.
      target: null
      image: null
      note: 이 단계까지 해야 신고가 접수됩니다.

  how_to_submit: >
    이 화면에서 신고서를 작성하고 마감해 전자파일을 뽑은 뒤,
    홈택스의 회계프로그램 신고에 그 파일을 올린다.
    이 서비스가 홈택스에 대신 신고해 주지는 않는다.

  deadline: >
    확정신고는 7월 25일과 다음 해 1월 25일.
    법인은 4월 25일과 10월 25일에 예정신고를 더 한다.
    개인 일반과세자는 그 시기에 예정고지를 받아 납부만 한다.

  cautions:
    - "마감했다고 신고가 끝난 것이 아닙니다. 전자파일을 홈택스에 올려야 접수됩니다."
    - "작성 전에 [미포함 세금계산서]를 비우고 [증빙별 자료 검증]을 마치세요. 잘못 등록된 거래로 생긴 문제는 서비스가 책임지지 않습니다."
    - "부속서류를 빠뜨리면 신고가 불완전해집니다. 우리 사업에 해당하는 것이 무엇인지 확인하세요."
    - "마감한 뒤에도 [마감취소]로 되돌릴 수 있지만, 이미 홈택스에 신고했다면 수정신고를 해야 합니다."

  faq:
    - q: 마감했는데 홈택스에 안 보입니다.
      a: >
        전자파일을 내려받아 홈택스에 올려야 접수됩니다.
        이 서비스가 홈택스에 대신 신고해 주지는 않습니다.
    - q: 부속서류를 다 작성해야 하나요?
      a: >
        아닙니다. 16종 중 우리 사업에 해당하는 것만 하면 됩니다.
        해당 없는 것은 [미작성]으로 두면 됩니다.
    - q: 신고서 숫자를 직접 고칠 수 있나요?
      a: >
        장부에서 자동으로 불러온 숫자입니다.
        숫자가 이상하면 신고서가 아니라 장부를 확인하세요.
    - q: 마감을 잘못했습니다.
      a: "[마감취소]로 되돌릴 수 있습니다. 다만 이미 홈택스에 신고했다면 수정신고를 해야 합니다."

---

- screen_id: acct-vat-list
  screen_name: 부가세신고 목록
  path: 세무 · 회계 > 세무신고 > 부가세 신고 > 부가세신고 목록
  pattern: A
  inherits: pattern-taxfile
  permission: 세무 · 회계
  purpose: 작성하고 마감한 신고 내역을 확인하고, 납부한 내용을 장부에 반영한다

  key_concept: >
    마감한 신고들이 여기에 쌓인다.
    홈택스에 신고하고 세금을 납부한 뒤에는 [거래반영] 열에서 처리하면
    **납부한 세금이 회계에 자동으로 반영된다.**
    이 처리를 해야 통장에서 나간 돈과 장부가 맞아떨어진다.

  steps:
    - no: 1
      action: "[부가세 신고]에서 [부가세신고 목록]을 클릭합니다."
      target: nav:세무 · 회계 > 부가세 신고 > 부가세신고 목록
      image: acct-vat-list-01.png
      note: null
    - no: 2
      action: 홈택스 신고와 납부를 마친 건의 [거래반영] 열에서 처리합니다.
      target: null
      image: null
      note: 납부한 세금이 장부에 자동으로 들어갑니다.

  cautions:
    - "납부하기 전에 거래반영을 하면 실제와 어긋납니다. 납부를 마친 뒤에 처리하세요."
    - "거래반영을 안 하면 통장에서 나간 세금이 장부에 없어 잔액이 안 맞습니다."

  faq:
    - q: 거래반영이 뭔가요?
      a: >
        납부한 부가세를 장부에 기록하는 기능입니다.
        이걸 해야 통장에서 나간 돈과 장부가 맞습니다.
    - q: 납부는 어디서 하나요?
      a: 홈택스에서 신고한 뒤 그곳에서 납부합니다. 이 서비스에서 납부하지는 않습니다.

