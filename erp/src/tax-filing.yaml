# 성공닷컴 사용자 매뉴얼 원본 — 세무 · 회계 > 세무신고
# 부가세 신고 5개 + 원천세 신고 6개 + 사업장현황 신고 1개.
# 재무제표 화면은 accounting.yaml 에 있다.

- screen_id: acct-vat-unincluded
  screen_name: 미포함 세금계산서
  path: 세무 · 회계 > 세무신고 > 부가세 신고 > 미포함 세금계산서
  pattern: A
  inherits: pattern-taxfile
  permission: 세무 · 회계
  purpose: 신고서에 아직 반영되지 않은 세금계산서를 찾아 포함으로 바꾼다

  where_in_flow: >
    화면 맨 위 진행 표시에서 **Ⓐ 미포함 계산서** 단계다.
    부가세 신고는 Ⓐ→Ⓑ→Ⓒ→Ⓓ→Ⓔ 순서로 진행한다.

  key_concept: >
    종이 세금계산서처럼 손으로 입력한 것은 **자동으로 신고서에 들어가지 않는다.**
    이 화면에 모여 있는 것이 그런 전표들이다.
    여기서 포함으로 바꿔야 부가세 신고서에 반영된다.
    신고 전에 이 화면이 비어 있는지 확인하는 것이 첫 단추다.

  steps:
    - no: 1
      action: 상단 [세무 · 회계] > [부가세 신고]에서 [미포함 세금계산서]를 클릭합니다.
      target: nav:세무 · 회계 > 부가세 신고 > 미포함 세금계산서
      image: acct-vat-unincluded-01.png
      note: null
    - no: 2
      action: 신고에 넣을 세금계산서를 골라 포함으로 바꿉니다.
      target: null
      image: null
      note: null   # 확인필요: 버튼 이름

  cautions:
    - "이 화면에 남아 있는 세금계산서는 신고서에 안 들어갑니다. 신고 전에 반드시 비웁니다."
    - "포함으로 바꾸기 전에 내용이 맞는지 확인하세요. 신고서에 그대로 반영됩니다."

  faq:
    - q: 종이 세금계산서를 입력했는데 신고서에 안 나옵니다.
      a: 이 화면에서 포함으로 바꿔야 신고서에 들어갑니다.

---

- screen_id: acct-vat-included
  screen_name: 포함 세금계산서
  path: 세무 · 회계 > 세무신고 > 부가세 신고 > 포함 세금계산서
  pattern: A
  inherits: pattern-taxfile
  permission: 세무 · 회계
  purpose: 신고서에 반영된 세금계산서 목록을 확인한다

  key_concept: >
    [미포함 세금계산서]에서 포함으로 바꾼 것들이 여기로 온다.
    신고서에 실제로 들어간 세금계산서가 무엇인지 이 화면에서 확인한다.

  steps:
    - no: 1
      action: "[부가세 신고]에서 [포함 세금계산서]를 클릭합니다."
      target: nav:세무 · 회계 > 부가세 신고 > 포함 세금계산서
      image: acct-vat-included-01.png
      note: null

  cautions:
    []   # 확인필요: 여기서 다시 제외할 수 있는지

  faq:
    - q: 잘못 포함한 것을 빼려면?
      a: null   # 확인필요

