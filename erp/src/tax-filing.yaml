- screen_id: acct-wht-form
  screen_name: 원천징수 이행상황신고서
  path: 세무 · 회계 > 원천세 신고 > 원천징수 이행상황신고서
  pattern: C
  inherits: pattern-taxfile
  permission: 세무 · 회계
  purpose: 그 달에 뗀 세금을 신고하고 낼 금액을 확정한다

  key_concept: >
    **세금을 신고하고 내는 서류**다. 지급명세서와는 목적이 다르다.
    이것만 내고 지급명세서를 빠뜨리면 가산세가 붙는다.
    소득 종류별로 몇 명에게 얼마를 주고 얼마를 뗐는지가 한 장에 모인다.

  layout:
    - zone: 왼쪽 — 신고기간과 서식
      desc: >
        귀속연도와 신고기간이 표시된다. [변경]으로 기간을 바꾼다.
        아래에 [원천세이행상황신고서]와 [기왕소득세특별징수계산서명세서]가
        각각 [미작성] / [작성] 상태로 나온다.
    - zone: 오른쪽 — 신고서 본문
      desc: 원천징수이행상황신고서 서식이 그대로 나온다.

  income_codes: >
    소득 종류마다 코드가 붙어 있어 어디에 무엇이 잡히는지 알 수 있다.
    · 근로소득 — 간이세액 A01, 중도퇴사 A02, 일용근로 A03, 합계 A04,
      연말정산 분납신청 A05, 납부금액 A06, 가감계 A10
    · 퇴직소득 — 연금계좌 A21, 그외 A22, 가감계 A20
    · 사업소득 — 매월징수 A25, 연말정산 A26, 가감계 A30
    · 기타소득 — 연금계좌 A41, 그외 A42, 가감계 A40
    · 연금소득 — 연금계좌 A48, 공적연금(매월) A45, 연말정산 A46, 가감계 A47
    · 이자소득 A50, 배당소득 A60, 저축해지추징세액 A69, 비거주자양도소득 A70

  screen_specific:
    - name: 신고구분 (매월 / 반기 / 수정 / 연말 / 소득처분 / 환급신청)
      desc: >
        어떤 성격의 신고인지 고릅니다.
        반기납부 승인을 받았으면 [반기]를 씁니다.
    - name: 원천징수이행상황신고서 / 원천징수세액환급신청서
      desc: 세금을 낼 때와 돌려받을 때 서식이 다릅니다.
    - name: 신고유형 (정기신고 / 기한후신고)
      desc: 기한이 지난 뒤에도 [기한후신고]로 낼 수 있습니다.
    - name: 일괄납부여부 · 사업자단위과세 여부
      desc: 사업장이 여럿일 때 어떻게 낼지 정합니다.
    - name: 신고서 작성 / 신고서 내역 탭
      desc: 새로 만들 때와 지난 신고를 볼 때 탭이 나뉩니다.
    - name: 마감처리 · 신고파일 받기 · 갱신 · 저장
      desc: >
        [갱신]으로 장부에서 최신 자료를 다시 불러오고, [저장] 후 [마감처리]를 합니다.
        마감하면 [신고파일 받기]로 전자파일을 내려받습니다.

  deadline: >
    지급한 달의 다음 달 10일까지.
    반기납부 특례를 승인받았으면 1월 10일과 7월 10일에 반년치씩 한다.

  before_you_start: >
    그 달의 급여지급이 확정되어 있어야 한다.
    프리랜서나 일용직에게 준 돈도 장부에 들어가 있어야 금액이 맞는다.

  steps:
    - no: 1
      action: 왼쪽 [원천세 신고]에서 [원천징수 이행상황신고서]를 클릭합니다.
      target: nav:세무 · 회계 > side:원천세 신고 > 원천징수 이행상황신고서
      image: acct-wht-form-01.png
      note: null
    - no: 2
      action: 귀속연도와 신고기간을 확인하고, 필요하면 [변경]으로 바꿉니다.
      target: null
      image: null
      note: 반기납부 승인을 받았으면 신고구분에서 [반기]를 고릅니다.
    - no: 3
      action: 소득 종류별 인원과 금액이 맞는지 확인합니다.
      target: null
      image: null
      note: 근로·퇴직·사업·기타·연금소득이 코드별로 나뉘어 집계됩니다.
    - no: 4
      action: 숫자가 안 맞으면 [갱신]으로 장부에서 다시 불러옵니다.
      target: null
      image: null
      note: null
    - no: 5
      action: "[저장] 후 [마감처리]하고 [신고파일 받기]로 전자파일을 내려받습니다."
      target: null
      image: null
      note: null
    - no: 6
      action: 홈택스에 접속해 회계프로그램 신고로 그 파일을 올립니다.
      target: null
      image: null
      note: 이 단계까지 해야 신고가 접수됩니다.
    - no: 7
      action: 세금을 납부한 뒤, 나간 돈을 장부에 직접 기록합니다.
      target: null
      image: null
      note: >
        부가세와 달리 원천세에는 납부 내역을 장부에 자동 반영하는 기능이 없습니다.
        [금융(입출금)] > [출금 내역] > [4대보험/세금 납부확인]에서 처리합니다.

  how_to_submit: >
    부가세와 같은 방식이다. 마감해 전자파일을 뽑은 뒤
    홈택스의 회계프로그램 신고에 그 파일을 올린다.

  late_filing: >
    기한이 지난 뒤에도 신고할 수 있다.
    화면 위 [신고유형]에서 [기한후신고]를 고른다.
    가산세가 붙으므로 늦었더라도 빨리 내는 편이 낫다.

  cautions:
    - "이 신고서만으로는 끝나지 않습니다. 소득 종류별 지급명세서를 따로 내야 합니다."
    - "반기납부는 이 신고서에만 적용됩니다. 명세서 제출 주기는 그대로입니다."
    - "마감은 신고가 아닙니다. 전자파일을 홈택스에 올려야 접수됩니다."
    - "납부한 원천세는 장부에 자동으로 들어가지 않습니다. 직접 기록해야 통장 잔액과 맞습니다."

  faq:
    - q: 이것만 내면 되나요?
      a: >
        아닙니다. 세금 신고는 이 서류로 하고, 누구에게 얼마 줬는지는 지급명세서로 따로 알립니다.
        둘은 별개 의무입니다.
    - q: 원천세를 냈는데 장부에 안 보입니다.
      a: >
        부가세와 달리 원천세는 납부 내역이 자동으로 반영되지 않습니다.
        [금융(입출금)] > [출금 내역] > [4대보험/세금 납부확인]에서 직접 처리하세요.
    - q: 기한이 지났는데 신고할 수 있나요?
      a: "[신고유형]에서 [기한후신고]를 고르면 됩니다. 가산세가 붙지만 빨리 낼수록 적습니다."
    - q: 반기납부 승인을 받았습니다.
      a: 신고구분에서 [반기]를 고릅니다. 1월 10일과 7월 10일에 반년치씩 신고합니다.
    - q: 숫자가 장부와 다릅니다.
      a: "[갱신]을 눌러 장부에서 최신 자료를 다시 불러오세요."

